name: orbweaver
description: "Clinical protocol renderer for mobile."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  yaml: ^3.1.2

dev_dependencies:
  # One 1024x1024 PNG at assets/icon/orbweaver.png generates every Android
  # density and every iOS entry. Run: dart run flutter_launcher_icons
  # Both platforms still ship the stock Flutter logo until that file exists.
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  # Each book is a self-contained bundle folder under assets/books/<id>/
  # (book.yaml + cover + topics/ + images/). Flutter asset globs are
  # non-recursive, so each bundle subdir that holds files is listed.
  assets:
    - assets/credits.yaml
    - assets/books/
    - assets/books/protocolbook/
    - assets/books/protocolbook/topics/
    - assets/books/protocolbook/images/
    - assets/books/wvems/
    - assets/books/wvems/topics/
    - assets/books/wvems/images/
    - assets/books/who_imci/
    - assets/books/who_imci/topics/
    - assets/books/who_imci/images/
    - assets/books/calculators/
    - assets/books/calculators/topics/

  # Roboto Condensed, Apache 2.0 (licence bundled beside the files). Flutter
  # keeps these in its material_fonts cache but bundles NO Roboto into a built
  # app — the FontManifest of a release APK holds only MaterialIcons — so the
  # family has to ship as an asset or it silently falls back to the default.
  # WVEMS asks for it by `font_family:`; the other books do not.
  fonts:
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed-Light.ttf
          weight: 300
        - asset: assets/fonts/RobotoCondensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/RobotoCondensed-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/RobotoCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/RobotoCondensed-BoldItalic.ttf
          weight: 700
          style: italic

# Launcher icons. Drop a square 1024x1024 PNG at the path below, then run
#   dart run flutter_launcher_icons
# It writes the five Android mipmap densities and the sixteen iOS entries.
# `remove_alpha_ios` is required: the App Store rejects an icon with an alpha
# channel, and a PNG exported from most tools has one.
flutter_launcher_icons:
  image_path: "assets/icon/orbweaver.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
