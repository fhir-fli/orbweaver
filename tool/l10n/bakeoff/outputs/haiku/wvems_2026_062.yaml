    - type: "prose"

      critical_care_link:
        text: "[Presión intracraneal elevada](topic:wvems-2026-086)"
      title: "Imperativos en traumatismo craneal"
      highlight: true
      markdown: |
        - Trasladar de urgencia si hay cambios súbitos en el nivel de conciencia.
        - **Hipoxia** e **hipotensión** se asocian con malos resultados.
          - Investigar y tratar agresivamente la [hipoxia](topic:wvems-2026-006) y la [hipotensión](topic:wvems-2026-008).
        - Los fármacos [anticoagulantes](topic:wvems-2026-076) (**diluyentes de la sangre**) aumentan el riesgo de HIC.
        - Las **laceraciones** se benefician de la reparación en las primeras pocas horas.
        - El **mecanismo** de lesión predice la gravedad.

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considerar [presión intracraneal elevada](topic:wvems-2026-086) si está indicado y acreditado para cuidados críticos.

    - type: "prose"
      title: "Alerta de TRAUMA"
      callout: true
      dashed: true
      call_er: true
      markdown: |
        - Si requiere una intervención mayor
        - O un mecanismo mayor
        - Active una alerta de **TRAUMA**

    - type: "prose"
      title: "Notas"
      markdown: |
        - **Fx. craneal**: Puede causar equimosis detrás de las orejas o alrededor de ambos ojos.
        - **Cuero cabelludo**: Presión directa para sangrado abundante (excepto si hay crepitación craneal o fractura).
        - **Cuello**: Todas las penetraciones deben tener un sello torácico.
        - **Ojo**: Use abundante solución salina o agua para irrigar cualquier contaminación.
          - {E} **[Tetracaína](topic:wvems-2026-drug-reference#tetracaine)** (oftálmica al 0.5%): 1–2 gotas antes de irrigar.
          - No irrigar lesiones penetrantes. Colocar **protector ocular** sobre ambos ojos.
        - **Boca**: Puede retirar **objetos empalados** que comprometan la [vía aérea](topic:wvems-2026-004).
        - **Oído**: Verifique cualquier secreción en busca de LCR dejándola caer sobre papel blanco.
          - Un halo amarillo o claro sugiere fuga de LCR por fractura de cráneo.
        - **Nariz**: No intente reducir. Trate la [epistaxis](topic:wvems-2026-076).
        - **Dientes**: Traslade los dientes avulsionados en solución de Hank o SS.
          - Intente el reimplante solo en lesiones no complicadas y aisladas.
        - **Conmoción cerebral**: Generalmente no requiere intervención de EMS.

    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - No intente el reimplante de dientes primarios (de leche).
        - Use la [Referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para la dosificación pediátrica.

