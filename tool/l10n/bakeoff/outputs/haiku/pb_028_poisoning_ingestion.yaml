topic:
  id: "pb-poisoning-ingestion"
  title: "Intoxicación / Ingestión — Paciente con sospecha de intoxicación aguda"
  list_subtitle: "p.28 · algoritmo inicial"
  last_reviewed: "pocketbook v1.7"
  tags: ["intoxicación", "ingestión", "toxicología", "toxídrome", "antídoto"]
  category: "medical"
  page_number: 28

  blocks:

  - type: "prose"
    title: "Manejo inicial"
    markdown: |
      - Si hay **CUALQUIER** sospecha de residuos en la piel o la ropa — use equipo de protección personal (guantes, batas, mascarillas); retire / embolse / deseche la ropa; lave al paciente y la zona a fondo con agua y jabón (la ropa y el EPP son residuos peligrosos — deséchelos correctamente)
      - Monitorice y mantenga ABCD
      - Revise los signos vitales (TA, FC, FR, SpO2, Temp)
      - Si la SpO2 < 90% o hay **CUALQUIER** sospecha de compromiso respiratorio, inicie O2 al 100% con mascarilla facial
      - Glucemia capilar (RBS) en cabecera y trate la hipoglucemia
      - Coloque una vía IV de gran calibre
      - Realice una historia clínica y un examen físico breves y dirigidos; preste atención al estado mental
        - Qué se ingirió, hace cuánto, cantidad / cuánto, efectos inmediatos
      - Tenga presente el trauma oculto
      - Solicite laboratorio: hemograma (CBC), funciones renales, electrolitos, funciones hepáticas
      - ECG de 12 derivaciones
      - Las convulsiones son una emergencia neurológica y deben tratarse de inmediato con diazepam
      - Lavado gástrico: **NUNCA ESTÁ INDICADO**, casi siempre
      - Considere **carbón activado en dosis única de 1 g/kg VO/SNG dentro de la primera hora** de la ingestión, para sustancias que se sabe son adsorbidas. No lo administre a un paciente que no esté completamente despierto, y nunca intube únicamente para administrarlo

  - type: "prose"
    title: "Indicaciones para ingreso a UCI"
    markdown: |
      - Necesidad de TET y ventilación mecánica
      - GCS < 12 / AVPU = U / estado epiléptico
      - Toxinas con potencial de depresión respiratoria (p. ej., intoxicación por amitraz)
      - Desequilibrio ácido-base
      - Curso clínico incierto / impredecible de la intoxicación (es decir, poco estudiado)

  - type: "prose"
    title: "Toxídromes comunes y antídotos"
    markdown: |
      - Vea el protocolo específico para: Organofosforados / Carbamatos / Colinérgicos, Hidrocarburos / Parafina / Queroseno, Benzodiacepinas / Opiáceos, Paracetamol, Etanol
      - **Adrenérgicos / Simpaticomiméticos**
        - Cocaína, anfetaminas (metanfetamina en cristal, Adderall), pseudoefedrina
        - Presentación: HTA, taquicardia, midriasis, ansiedad, delirio, ideas delirantes
        - Tratamiento: de soporte — **benzodiacepinas primero** (habitualmente controlan por sí solas la hipertensión y la taquicardia), más líquidos IV; antihipertensivos solo si todavía son necesarios
      - **Anticolinérgicos / Antidepresivos tricíclicos (ADT) / antihistamínicos**
        - Presentación: hiperpirexia, vasodilatación cutánea (rubor), disminución de la saliva, midriasis, retención urinaria, disritmias
        - Tratamiento:
          - Fisostigmina — evitar en ADT; solo si hay taquiarritmias persistentes o convulsiones. Llame al anestesiólogo antes de administrarla.
          - NaHCO3 para ADT
      - **Metanol**
        - Presentación: delirio, pérdida de la visión
        - Tratamiento: por vía oral mediante SNG — 1.8 ml/kg de etanol al 43% (aproximadamente **tres tragos de 40 ml, ≈126 ml**, en un adulto de 70 kg); mantenimiento de 0.2–0.4 ml/kg/hora de etanol al 43%
        - **Además, ácido fólico 1 mg/kg (o 50 mg) IV cada 4–6 horas** — acelera la conversión de ácido fórmico a CO₂ y agua, y es barato y está disponible
        - **Derive urgentemente para hemodiálisis si está disponible:** pH ≤ 7.15, síntomas visuales, convulsiones, coma o deterioro a pesar del antídoto. La diálisis elimina tanto el metanol como el formato y es el tratamiento definitivo
