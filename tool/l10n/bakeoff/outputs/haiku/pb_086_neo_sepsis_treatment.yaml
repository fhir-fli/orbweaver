# ============================================================
# ProtocolBook pp.86–87 — Neonatal Sepsis (< 28 days): Treatment +
# Duration of treatment. Fourth leaf of the Neonatal Protocols section.
#
# Two-page topic (`pages:`): p.86 = the treatment flowchart (one real
# decision — clinical signs of sepsis? — branching into a sepsis-
# management pathway and a localized-infection pathway) + antibiotic
# regimens; p.87 = the duration-of-treatment table.
#
# Faithful-rendering calls:
#   - The single top decision (signs of sepsis? Yes/No) → a small
#     `algorithm` (Yes → treat as sepsis; No → assess for localized
#     infection); each arm's detail (multi-step management + a/b/c
#     antibiotic dosing, which the algorithm boxes can't hold) →
#     titled prose below, in printed order. Same split as p.73/p.75.
#   - Antibiotic regimens a/b/c → bold-lead prose with dose bullets.
#   - Duration (p.87) → a two-column `table` (standard layout so the
#     long cells wrap).
#   - Cefotaxime "may substitute ceftriaxone (but risk of jaundice)"
#     kept as printed.
#   - Citation superscripts dropped; "No`" arrow typo (stray backtick)
#     silently corrected.
#
# CONTENT FLAGS for the later OE / content pass (rendered faithfully):
#   - Ampicillin + gentamicin is the WHO first-line neonatal empiric
#     regimen; cloxacillin for soft-tissue, ampicillin + cefotaxime for
#     meningitis. Gentamicin 3 mg/kg OD if <2 kg / 1st week / asphyxia
#     is the reduced-clearance adjustment. Ceftriaxone-jaundice caution
#     (bilirubin displacement) is correct. Vitamin K + tetracycline eye
#     ointment for home births = standard newborn prophylaxis.
# Cross-book pass 2026-08-28: neonatal meningitis ampicillin brought down from
#   100 mg/kg q8h (200->300 mg/kg/day) to 50 mg/kg q8h then q6h (150->200),
#   the settled term-neonate dose, with the preterm <=34 wk week-1 band named.
#   300 mg/kg/day is the OLDER-CHILD dose and was carried into the neonate.
#   The neonatal ceiling is set by immature renal clearance and seizure risk.
# ============================================================

topic:
  id: "pb-neo-sepsis-treatment"
  title: "Sepsis neonatal — Tratamiento"
  list_subtitle: "pp.86–87 · < 28 días · antibióticos · duración"
  last_reviewed: "pocketbook v1.7"
  tags: ["neonatal", "sepsis", "recién nacido", "tratamiento", "ampicilina", "gentamicina", "cloxacilina", "cefotaxima", "ceftriaxona", "meningitis", "antibióticos", "duración", "infección localizada"]
  category: "medical"

  pages:

    # ═══════════════════════ PAGE 86 ═══════════════════════
  - page_number: 86
    blocks:

    - type: "flowchart"
      variant: "algorithm"
      entry:
        text: "Neonato — evalúe si hay sepsis"
        shape: "stadium"
      stages:
      - decision: "¿Signos clínicos de sepsis?"
        criteria:
        - "Letargia"
        - "Fontanela abombada"
        - "Antecedente de convulsiones"
        - "Dificultad para alimentarse"
        - "Temperatura > 38 o < 35.5°C"
        - "Frecuencia respiratoria > 60/min"
        - "Tiraje torácico severo, gruñido, apnea o cianosis"
        - "RPM > 18 h (si tiene < 7 días)"
        outcomes:
        - label: "Sí"
          box:
            title: "Tratar como sepsis neonatal (ver abajo)"
            severity: "priority"
        - label: "No"
          box:
            title: "Evaluar infección localizada (ver abajo)"

    - type: "prose"
      title: "Si hay signos de sepsis — manejo inicial"
      markdown: |
        - Hemocultivos
        - Realice una punción lumbar (PL) si se sospecha meningitis
        - Busque hipoglucemia; trate si no puede medir la glucosa
        - Administre oxígeno si hay cianosis o frecuencia respiratoria > 60/min
        - Administre vitamina K y pomada oftálmica de tetraciclina (TEO) si nació en casa o no recibió en maternidad
        - Mantenga abrigado
        - Mantenga la alimentación por vía oral o SNG; use líquidos IV solo si hay dificultad respiratoria o distensión abdominal severa

    - type: "prose"
      title: "Tratamiento antibiótico"
      markdown: |
        - **Primera línea:** ampicilina 50 mg/kg cada 8 h (cada 12 h si está en la 1.ª semana) MÁS gentamicina 5 mg/kg una vez al día (3 mg/kg una vez al día si < 2 kg en la 1.ª semana, o asfixia al nacer)
        - **Si se sospecha infección de partes blandas:** cloxacilina MÁS gentamicina (misma dosis que arriba)
        - **Si se sospecha meningitis:** ampicilina **50 mg/kg cada 8 h en la semana 1 (150 mg/kg/día), luego cada 6 h en las semanas 2–4 (200 mg/kg/día)** MÁS cefotaxima 50 mg/kg cada 8 h (cada 12 h si está en la 1.ª semana)
        - ⚠️ **Un recién nacido muy prematuro (≤ 34 semanas) en la semana 1 recibe la dosis más baja — 50 mg/kg cada 12 h (100 mg/kg/día).** La ampicilina se elimina por vía renal y el aclaramiento depende de la edad posmenstrual; la acumulación aumenta el riesgo de excitación del SNC y convulsiones
        - 🛑 **No use en un neonato la dosis de 300 mg/kg/día del niño mayor.** 300 mg/kg/día es correcta **después de las 4 semanas** y está por encima del límite neonatal
        - 🛑 **Prefiera cefotaxima a ceftriaxona en un neonato.** La ceftriaxona desplaza la bilirrubina de la albúmina y empeora la ictericia, y está **absolutamente contraindicada en cualquier neonato que reciba líquidos IV con calcio** — ambos forman precipitados fatales en los pulmones y los riñones

    - type: "prose"
      title: "Si no hay signos de sepsis — evalúe infección localizada"
      markdown: |
        ¿Hay:
        - Secreción purulenta por el ojo
        - Secreción purulenta por el oído
        - Pus en el ombligo y enrojecimiento de la piel abdominal; o
        - Pocas ampollas grandes llenas de pus / pústulas sépticas

    - type: "prose"
      title: "Decida — ¿el bebé necesita líquidos, alimentación o sangre?"
      markdown: |
        Luego verifique si hay alguno de los siguientes síntomas:
        - Ictericia
        - Llenado capilar (retardado)
        - Palidez severa
        - Infección localizada grave — articulaciones, distensión abdominal
        - Pérdida de peso

    - type: "prose"
      title: "Cuando corresponda"
      markdown: |
        - Trate como oftalmia neonatal
        - Trate con un antibiótico oral que cubra Staph aureus si hay pústulas sépticas grandes llenas de pus
        - Oriente a la madre y programe control

    # ═══════════════════════ PAGE 87 ═══════════════════════
  - page_number: 87
    blocks:

    - type: "table"
      title: "Duración del tratamiento de la sepsis neonatal"
      zebra: true
      columns: ["Problema", "Días de tratamiento"]
      column_flex: [5, 8]
      column_align: ["left", "left"]
      rows:
      - cells: ["Signos de sepsis neonatal grave", "Debe realizarse hemocultivo. Antibióticos IV/IM por un mínimo de 7 días, o hasta estar completamente bien si la PL es normal."]
      - cells: ["Signos leves de infección neonatal, o descartar sepsis en un niño con factores de riesgo — SOLO si se realizó hemocultivo", "Los antibióticos podrían suspenderse después de 48 horas si todos los signos de posible sepsis han desaparecido, el niño se alimenta bien y la PL (si se realizó) es negativa. Hemocultivo negativo."]
      - cells: ["Meningitis neonatal, o sepsis neonatal grave con PL", "Debe realizarse hemocultivo si no es posible hacer PL. Antibióticos IV/IM por un mínimo de 14 días; un mínimo de 3 semanas si se sospecha meningitis por gramnegativos."]
      - cells: ["Neumonía clínica o radiológica", "Antibióticos IV/IM por un mínimo de 5 días, o hasta estar completamente bien durante 24 h. Para una PL positiva, ver meningitis."]
      - cells: ["Infección de piel con signos de enfermedad generalizada, como alimentación deficiente", "Los antibióticos IV/IM podrían suspenderse después de 72 horas si el niño se alimenta bien sin fiebre y no tiene otro problema, y la PL (si se realizó) es normal. Hemocultivo negativo. Antibióticos orales por 5 días adicionales."]
