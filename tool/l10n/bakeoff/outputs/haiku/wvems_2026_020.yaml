    - type: "prose"
      title: "Indicaciones clave para el dolor"
      highlight: true
      markdown: |
        - El control del dolor prehospitalario está indicado para **lesión reciente** o **dolor súbito** como:
          - [Trauma mayor](topic:wvems-2026-056), [fracturas](topic:wvems-2026-066) evidentes, [dolor abdominal](topic:wvems-2026-034) agudo o [dolor torácico](topic:wvems-2026-028)
        - Los analgésicos (incluso VO) son **beneficiosos aunque los tiempos de traslado sean cortos**.
        - Use [dosificación pediátrica basada en el peso](topic:wvems-2026-144) para adultos pequeños de menos de 110 lbs (50 kg).

    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Tylenol®](topic:wvems-2026-drug-reference#tylenol)** (paracetamol): evitar si hay enfermedad hepática terminal.
          - {E} solo puede administrarse VO; use tabletas, cápsulas, polvo o líquido de venta libre (OTC).
          - {A} puede administrarse VO o IV/IO; para IV/IO, administre lentamente durante 10 min.
        - **[Ibuprofeno](topic:wvems-2026-drug-reference#ibuprofen)** (Advil®, Motrin®): evitar si hay sangrado GI activo.
        - **[Toradol®](topic:wvems-2026-drug-reference#toradol)** (ketorolaco): evitar si hay sangrado GI activo.
        - **[Fentanilo](topic:wvems-2026-drug-reference#fentanyl)** (Sublimaze®): use criterio clínico, dosis objetivo **0.5–1 mcg/kg**.
          - Comience con dosis más bajas (50 mcg) en pacientes no expuestos a opioides y/o de menor tamaño.
        - **[Ketamina](topic:wvems-2026-drug-reference#ketamine)** (Ketalar®):
          - Uso IM/IN: administre como bolo sin diluir.
          - Uso IV/IO: diluya en SF y administre lentamente durante 10 min.
        - Puede administrar gotas oftálmicas para abrasiones o quemadura por soldadura (queratitis por UV):
          - {E} **[Tetracaína](topic:wvems-2026-drug-reference#tetracaine)** (0.5 % oftálmico) — 1–2 gotas en el ojo afectado.

    - type: "prose"
      title: "Notas"
      markdown: |
        - Tylenol e ibuprofeno son útiles para **dolor subagudo** como:
          - Dolor de muela, cefalea (migraña), ciática, fibromialgia, etc.
          - Evitar **fentanilo** y **ketamina** para el dolor subagudo.
        - El dolor es subjetivo. Puede probar otro medicamento si el dolor persiste.
          - **No** use Toradol con ibuprofeno (elija uno u otro).
        - Dosis máxima diaria: **[Tylenol](topic:wvems-2026-drug-reference#tylenol) 3,000 mg** · **ibuprofeno 2,400 mg**.

    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        Use [Referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para la dosificación pediátrica.

