topic:
  id: "pb-poisoning-ingestion"
  title: "Intoxicación / Ingesta: paciente con sospecha de intoxicación aguda"
  list_subtitle: "p.28 · algoritmo inicial"
  last_reviewed: "pocketbook v1.7"
  tags: ["intoxicación", "ingesta", "toxicología", "toxídromo", "antídoto"]
  category: "medical"
  page_number: 28

  blocks:

    - type: "prose"
      title: "Manejo inicial"
      markdown: |
        - Si hay **CUALQUIER** sospecha de residuos en la piel o la ropa: use equipo de protección personal (guantes, batas, mascarillas); retire / embolse / deseche la ropa; lave al paciente y el área a fondo con agua y jabón (la ropa y el EPP son residuos peligrosos: deséchelos correctamente)
        - Monitoree y dé soporte a la ABCD
        - Verifique los signos vitales (PA, FC, FR, spO2, temperatura)
        - Si spO2 < 90% o hay **CUALQUIER** sospecha de compromiso respiratorio, inicie O2 al 100% por mascarilla facial
        - Glucemia capilar en la cabecera y trate la hipoglucemia
        - Coloque una vía IV de gran calibre
        - Realice una historia clínica y un examen físico breves y dirigidos; preste atención al estado mental
          - Qué se ingirió, hace cuánto, volumen / cuánta cantidad, efectos inmediatos
        - Tenga presente el trauma oculto
        - Solicite laboratorios: hemograma completo, funciones renales, electrolitos, funciones hepáticas
        - ECG de 12 derivaciones
        - Las convulsiones son una emergencia neurológica y deben tratarse de inmediato con diazepam
        - Lavado gástrico: casi **NUNCA ESTÁ INDICADO**
        - Considere **carbón activado en dosis única de 1 g/kg VO/SNG dentro de 1 hora** de la ingesta, para sustancias conocidas por ser adsorbidas. No lo administre a un paciente que no esté completamente despierto, y nunca intube únicamente para administrarlo

    - type: "prose"
      title: "Indicaciones de ingreso a UCI"
      markdown: |
        - Necesidad de TET y ventilación mecánica
        - ECG de Glasgow < 12 / AVPU = U / estado epiléptico
        - Toxinas con potencial de depresión respiratoria (p. ej., intoxicación por amitraz)
        - Trastornos ácido-base
        - Evolución clínica incierta / impredecible de la intoxicación (es decir, poco estudiada)

    - type: "prose"
      title: "Toxídromes y antídotos frecuentes"
      markdown: |
        - Consulte el protocolo específico para: Organofosforados / Carbamatos / Colinérgicos, Hidrocarburos / Parafina / Queroseno, Benzodiazepinas / Opiáceos, Paracetamol, Etanol
        - **Adrenérgicos / simpaticomiméticos**
          - Cocaína, anfetaminas (metanfetamina en cristal, Adderall), pseudoefedrina
          - Presentación: HTA, taquicardia, midriasis, ansiedad, delirio, ideas delirantes
          - Tratamiento: de soporte — **primero benzodiazepinas** (suelen controlar por sí solas la hipertensión y la taquicardia), más líquidos IV; antihipertensivos solo si aún son necesarios
        - **Anticolinérgicos / antidepresivos tricíclicos (TCA) / antihistamínicos**
          - Presentación: hiperpirexia, vasodilatación cutánea (rubor), disminución de la saliva, midriasis, retención urinaria, disritmias
          - Tratamiento:
            - Fisostigmina — evitar en TCA; solo si hay taquiarritmias persistentes o convulsiones. Llame al anestesiólogo antes de administrarla.
            - NaHCO3 para TCA
        - **Metanol**
          - Presentación: delirio, pérdida de la visión
          - Tratamiento: vía oral por SNG — 1.8 ml/kg de etanol al 43% (aproximadamente **tres tragos de 40 ml, ≈126 ml**, en un adulto de 70 kg); mantenimiento 0.2–0.4 ml/kg/hora de etanol al 43%
          - **Además, ácido fólico 1 mg/kg (o 50 mg) IV cada 4–6 horas** — acelera la conversión del ácido fórmico a CO₂ y agua, y es económico y está disponible
          - **Refiera urgentemente a hemodiálisis si está disponible:** pH ≤ 7.15, síntomas visuales, convulsiones, coma, o deterioro a pesar del antídoto. La diálisis elimina tanto el metanol como el formiato y es el tratamiento definitivo
