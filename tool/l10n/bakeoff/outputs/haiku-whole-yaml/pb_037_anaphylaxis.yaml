# translated-from-sha256: 0c0a12a16a28af499e18fc233131fd2ee5e081ce2e80b2056d6c08fc8b4cf151
topic:
  id: "pb-anaphylaxis"
  title: "Anafilaxia"
  list_subtitle: "p.37 · criterios + epinefrina"
  last_reviewed: "pocketbook v1.7"
  tags: ["anafilaxia", "alergia", "reacción alérgica", "epinefrina", "adrenalina", "angioedema", "urticaria", "hipotensión"]
  category: "medical"
  page_number: 37

  blocks:

    - type: "prose"
      title: "Síntomas frecuentes"
      markdown: |
        - **Mucocutáneos:** angioedema, urticaria, prurito, rubor
        - **Respiratorios:** disnea, sibilancias, estridor, hipoxia
        - **GI:** náusea/vómito/diarrea/cólicos abdominales
        - **Disfunción de órganos blanco:** síncope, hipotonía

    - type: "prose"
      title: "Criterios diagnósticos — cualquiera de los 3 → epinefrina"
      markdown: |
        - **Criterio 1:** Signos agudos de piel/mucosas + 1 de los siguientes: Compromiso respiratorio, Hipotensión, O Signos de disfunción de órganos blanco
        - **Criterio 2:** Inicio rápido tras probable exposición a antígeno de 2 de los siguientes: Signos mucocutáneos, Síntomas respiratorios, Hipotensión, O Síntomas GI
        - **Criterio 3:** Hipotensión tras exposición a alérgeno conocido
          - Adultos PAS <90
          - Niños de 11–17 años: PAS <90
          - Niños de 1–10 años: PAS <(70 + [edad x 2])
          - Niños de 1 mes a 1 año: PAS <70
          - Recién nacido a término: PAS <60

    - type: "prose"
      callout: true
      palette:
        alert: "0xFFD32F2F"
        alert_fill: "0xFFFDECEA"
        alert_text: "0xFFB71C1C"
      title: "Epinefrina 1 mg/mL (1:1,000)"
      markdown: |
        - 0.01mL/kg — máximo 0.3mL (niño), hasta 0.5mL (adolescente / adulto)
        - IM en cara anterolateral del muslo
        - Repetir cada 5–15 minutos si no hay mejoría
        - 🛑 **Use 1 mg/mL (1:1,000) solo para inyección IM. NO la administre IV** — tiene **10× la concentración IV** y puede causar arritmia fatal. Para uso IV (solo en paro cardíaco), diluya a **0.1 mg/mL (1:10,000)**

    - type: "prose"
      title: "Manejo inicial"
      markdown: |
        - Monitorizar, sostener ABC
        - Verificar signos vitales (PA, FC, FR, SpO2, Temp, Peso)
        - Evaluar GCS, estado de hidratación
        - Colocar 2 vías IV, iniciar oxígeno si SpO2 <90%
        - Solicitar hemograma, malaria y glucemia

    - type: "flowchart"
      variant: "algorithm"
      stages:
        - decision: "¿Sibilancias y/o disnea?"
          outcomes:
            - label: "Sí"
              box:
                title: "Tratar como exacerbación de asma"
              continue: true
            - label: "No"
              continue: true
        - decision: "¿Hipotensión?"
          outcomes:
            - label: "Sí"
              box:
                title: "Líquidos IV — SF o LR"
                bullets:
                  - "Niños: 30mL/kg en la primera hora"
                  - "Adultos: 1–2L, 5–10mL/kg en los primeros 5 min"
                  - "Se puede intentar posición en decúbito o vasopresores si es necesario"
                severity: "priority"
              continue: true
            - label: "No"
              continue: true
      terminal:
        title: "Tratamiento adyuvante"
        bullets:
          - "Estos NO tratan la vía aérea, la respiración ni la circulación. Nunca deben retrasar ni reemplazar la epinefrina"
          - "Antagonista H1: difenhidramina 1mg/kg IV o VO, dosis máxima 50mg"
          - "Esteroides: hidrocortisona 2–4mg/kg IM/IV lenta (máximo 100mg en niño, 200mg en adulto). Coadyuvante de beneficio no demostrado — no trata la vía aérea, la respiración ni la circulación y nunca debe retrasar la epinefrina"

    - type: "prose"
      title: "Observación antes del alta"
      markdown: |
        - **Observar al menos 6 horas** después de que todos los síntomas hayan cedido — para todo paciente que necesitó epinefrina
        - **Mantener hospitalizado (mínimo 12 horas, ingresar) si hay alguno de:** se necesitó más de una dosis de epinefrina · cualquier hipotensión o colapso · estridor, sibilancias u otro problema respiratorio grave · asma grave conocida · reacción bifásica previa · llega de noche · vive lejos o el transporte de regreso es difícil · no hay un adulto en casa que lo vigile
        - **Ingresar a todo niño menor de 16 años.** No dé de alta el mismo día a un niño con anafilaxia verdadera
        - Antes del alta, siente o ponga de pie al paciente y verifique si hay mareo
        - **Advierta a todo paciente y cuidador que los síntomas pueden reaparecer** horas después de ceder — una segunda reacción (bifásica) ocurre en aproximadamente 5–20% de los casos, generalmente dentro de 4–12 horas. Indíqueles que regresen de inmediato
