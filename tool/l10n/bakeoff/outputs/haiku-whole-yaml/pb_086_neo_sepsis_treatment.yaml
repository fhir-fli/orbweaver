  tags: ["neonatal", "sepsis", "recién nacido", "tratamiento", "ampicilina", "gentamicina", "cloxacilina", "cefotaxima", "ceftriaxona", "meningitis", "antibióticos", "duración", "infección localizada"]
  category: "medical"

  pages:

    - page_number: 86
      blocks:

        - type: "flowchart"
          variant: "algorithm"
          entry:
            text: "Neonato — evaluar sepsis"
            shape: "stadium"
          stages:
            - decision: "¿Signos clínicos de sepsis?"
              criteria:
                - "Letargo"
                - "Fontanela abombada"
                - "Antecedente de convulsiones"
                - "Dificultad para alimentarse"
                - "Temperatura > 38 o < 35.5°C"
                - "Frecuencia respiratoria > 60/min"
                - "Tiraje intercostal severo, quejido, apnea o cianosis"
                - "RPM > 18 h (si tiene < 7 días)"
              outcomes:
                - label: "Sí"
                  box:
                    title: "Tratar como sepsis neonatal (ver abajo)"
                    severity: "priority"
                - label: "No"
                  box:
                    title: "Evaluar infección localizada (ver abajo)"

        - type: "prose"
          title: "Si hay signos de sepsis — manejo inicial"
          markdown: |
            - Hemocultivos
            - Realizar PL si se sospecha meningitis
            - Verificar hipoglucemia; tratar si no es posible medir la glucosa
            - Administrar oxígeno si hay cianosis o frecuencia respiratoria > 60/min
            - Administrar vitamina K y pomada oftálmica de tetraciclina (POT) si nació en casa o no se le administró en la maternidad
            - Mantener abrigado
            - Mantener la alimentación por vía oral o sonda nasogástrica; usar líquidos IV solo si hay dificultad respiratoria o distensión abdominal severa

        - type: "prose"
          title: "Tratamiento antibiótico"
          markdown: |
            - **Primera línea:** ampicilina 50 mg/kg cada 8 h (cada 12 h si está en la 1.ª semana) MÁS gentamicina 5 mg/kg una vez al día (3 mg/kg una vez al día si < 2 kg en la 1.ª semana, o asfixia al nacer)
            - **Si hay sospecha de infección de tejidos blandos:** cloxacilina MÁS gentamicina (misma dosis que arriba)
            - **Si hay sospecha de meningitis:** ampicilina **50 mg/kg cada 8 h en la semana 1 (150 mg/kg/día), luego cada 6 h en las semanas 2–4 (200 mg/kg/día)** MÁS cefotaxima 50 mg/kg cada 8 h (cada 12 h si está en la 1.ª semana)
            - ⚠️ **Un recién nacido muy prematuro (≤ 34 semanas) en la semana 1 recibe la dosis más baja: 50 mg/kg cada 12 h (100 mg/kg/día).** La ampicilina se elimina por vía renal y su eliminación depende de la edad posmenstrual; la acumulación aumenta el riesgo de excitación del sistema nervioso central y de convulsiones
            - 🛑 **No administre a un recién nacido los 300 mg/kg/día que se usan en el niño mayor.** 300 mg/kg/día es correcto **después de las 4 semanas** y está por encima del límite neonatal
            - 🛑 **Prefiera cefotaxima a ceftriaxona en un recién nacido.** La ceftriaxona desplaza la bilirrubina de la albúmina y empeora la ictericia, y está **absolutamente contraindicada en cualquier recién nacido que reciba líquidos IV con calcio**: ambos forman precipitados fatales en los pulmones y los riñones

        - type: "prose"
          title: "Si no hay signos de sepsis — evaluar infección localizada"
          markdown: |
            ¿Hay:
            - Pus en el ojo
            - Pus en el oído
            - Pus en el ombligo y enrojecimiento de la piel abdominal; o
            - Unas pocas ampollas grandes llenas de pus / manchas sépticas

        - type: "prose"
          title: "Decidir — ¿el bebé necesita líquidos, alimentación o sangre?"
          markdown: |
            Luego verifique si hay alguno de los siguientes síntomas:
            - Ictericia
            - Llenado capilar (retrasado)
            - Palidez intensa
            - Infección localizada grave — articulaciones, distensión abdominal
            - Pérdida de peso

        - type: "prose"
          title: "Cuando corresponda"
          markdown: |
            - Tratar por oftalmia neonatal
            - Tratar con un antibiótico oral que cubra Staph aureus si hay ampollas grandes llenas de pus / manchas sépticas
            - Orientar a la madre y programar un control

    - page_number: 87
      blocks:

        - type: "table"
          title: "Duración del tratamiento de la sepsis neonatal"
          zebra: true
          columns: ["Problema", "Días de tratamiento"]
          column_flex: [5, 8]
          column_align: ["left", "left"]
          rows:
            - cells: ["Signos de sepsis neonatal grave", "Debe realizarse hemocultivo. Antibióticos IV/IM durante un mínimo de 7 días, o hasta que esté completamente bien si la PL es normal."]
            - cells: ["Signos leves de infección neonatal, o descartar sepsis en un neonato con factores de riesgo — SOLO si se realizó hemocultivo", "Los antibióticos podrían suspenderse después de 48 horas si todos los signos de posible sepsis han desaparecido, el neonato se alimenta bien y la PL (si se realizó) es negativa. Hemocultivo negativo."]
            - cells: ["Meningitis neonatal, o sepsis neonatal grave con PL", "Debe realizarse hemocultivo si no es posible hacer la PL. Antibióticos IV/IM durante un mínimo de 14 días; un mínimo de 3 semanas si se sospecha meningitis por bacterias gramnegativas."]
            - cells: ["Neumonía clínica o radiológica", "Antibióticos IV/IM durante un mínimo de 5 días, o hasta estar completamente bien durante 24 h. Para una PL positiva, ver meningitis."]
            - cells: ["Infección de piel con signos de enfermedad generalizada, como alimentación deficiente", "Los antibióticos IV/IM podrían suspenderse después de 72 horas si el neonato se alimenta bien, sin fiebre y sin otros problemas, y la PL (si se realizó) es normal. Hemocultivo negativo. Antibióticos orales durante 5 días más."]
