  - page_number: 21
    blocks:

    - type: "prose"
      title: "Imperativos del dolor"
      highlight: true
      markdown: |
        - El control del dolor en EMS está indicado para **lesión reciente** o **dolor súbito**, como:
          - [Trauma mayor](topic:wvems-2026-056), [fracturas](topic:wvems-2026-066) evidentes, [dolor abdominal](topic:wvems-2026-034) agudo o [dolor torácico](topic:wvems-2026-028)
        - Los analgésicos (incluso por VO) son **beneficiosos aunque el tiempo de traslado sea corto**.
        - Utilice [dosificación pediátrica basada en el peso](topic:wvems-2026-144) para adultos de menor tamaño con menos de 110 lbs (50 kg).

    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Tylenol®](topic:wvems-2026-drug-reference#tylenol)** (Paracetamol): evite si hay enfermedad hepática terminal.
          - {E} solo puede administrar por VO; use tabletas, cápsulas, polvo o líquido de venta libre.
          - {A} puede administrar por VO o IV/IO; para IV/IO, administre lentamente durante 10 min.
        - **[Ibuprofen](topic:wvems-2026-drug-reference#ibuprofen)** (Advil®, Motrin®): evite si hay hemorragia digestiva activa.
        - **[Toradol®](topic:wvems-2026-drug-reference#toradol)** (Ketorolaco): evite si hay hemorragia digestiva activa.
        - **[Fentanyl](topic:wvems-2026-drug-reference#fentanyl)** (Sublimaze®): use criterio clínico, con un objetivo de **0.5–1 mcg/kg**.
          - Comience con una dosis menor (50 mcg) en pacientes no expuestos a narcóticos y/o de menor tamaño.
        - **[Ketamine](topic:wvems-2026-drug-reference#ketamine)** (Ketalar®):
          - Uso IM/IN: administre en bolo sin diluir.
          - Uso IV/IO: diluya en NS y administre lentamente durante 10 min.
        - Puede administrar gotas oftálmicas para abrasiones o para el destello del soldador (queratitis UV):
          - {E} **[Tetracaine](topic:wvems-2026-drug-reference#tetracaine)** (Tetracaína 0.5 % oftálmica) — 1–2 gotas en el ojo afectado.

    - type: "prose"
      title: "Notas"
      markdown: |
        - Tylenol e ibuprofeno son útiles para **dolor subagudo**, como:
          - Dolor de muela, cefalea (migraña), ciática, fibromialgia, etc.
          - Evite **fentanilo** y **ketamina** para el dolor subagudo.
        - El dolor es subjetivo. Puede probar otro medicamento si el dolor continúa.
          - **No** use Toradol junto con ibuprofeno (elija uno u otro).
        - Dosis diaria máxima: **[Tylenol](topic:wvems-2026-drug-reference#tylenol) 3,000 mg** · **Ibuprofeno 2,400 mg**.

    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        Utilice la [Referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para la dosificación pediátrica.

