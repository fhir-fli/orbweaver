topic:
  id: "who-imci-chart9-diazepam"
  title: "Anticonvulsivante (convulsiones)"
  list_subtitle: "AIEPI Gráfico 9 · midazolam / diazepam rectal · escalera del estado epiléptico"
  last_reviewed: "OpenEvidence-reviewed 2026-07 · Kertam 2026 / ESETT / EcLiPSE / WHO"
  tags: ["convulsión", "crisis", "diazepam", "rectal", "estado epiléptico", "fenobarbital", "imci", "pediátrico"]
  aliases:
