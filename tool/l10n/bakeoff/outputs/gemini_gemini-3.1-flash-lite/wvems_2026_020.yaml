    - type: "prose"
      title: "Imperativos del dolor"
      highlight: true
      markdown: |
        - El control del dolor por parte de los SEM está indicado para **lesiones recientes** o **dolor súbito** como:
          - [Traumatismo mayor](topic:wvems-2026-056), [fracturas](topic:wvems-2026-066) evidentes, [dolor abdominal](topic:wvems-2026-034) o [dolor torácico](topic:wvems-2026-028) agudo.
        - Los analgésicos (incluso VO) son **beneficiosos a pesar de los tiempos de transporte cortos**.
        - Utilice la [dosificación pediátrica según peso](topic:wvems-2026-144) para adultos pequeños de menos de 110 lbs (50 kg).

    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Paracetamol®](topic:wvems-2026-drug-reference#tylenol)** (Acetaminofén): evitar si hay enfermedad hepática terminal.
          - {E} solo puede administrar VO: utilice tabletas, cápsulas, polvo o líquido de venta libre.
          - {A} puede administrar VO o IV/IO: para IV/IO, administre lentamente durante 10 min.
        - **[Ibuprofeno](topic:wvems-2026-drug-reference#ibuprofen)** (Advil®, Motrin®): evitar si hay sangrado gastrointestinal activo.
        - **[Ketorolaco®](topic:wvems-2026-drug-reference#toradol)** (Ketorolaco): evitar si hay sangrado gastrointestinal activo.
        - **[Fentanilo](topic:wvems-2026-drug-reference#fentanyl)** (Sublimaze®): utilice su criterio, objetivo **0.5–1 mcg/kg**.
          - Comience con una dosis menor (50 mcg) para pacientes sin experiencia previa con narcóticos y/o pacientes más pequeños.
        - **[Ketamina](topic:wvems-2026-drug-reference#ketamine)** (Ketalar®):
          - Uso IM/IN: administrar como bolo sin diluir.
          - Uso IV/IO: diluir en solución salina normal (SSN) y administrar lentamente durante 10 min.
        - Puede administrar gotas oftálmicas para abrasiones o queratitis por radiación UV (ojo de soldador):
          - {E} **[Tetracaina](topic:wvems-2026-drug-reference#tetracaine)** (0.5 % oftálmica) — 1–2 gotas en el ojo afectado.

    - type: "prose"
      title: "Notas"
      markdown: |
        - El paracetamol y el ibuprofeno son buenos para el **dolor subagudo** como:
          - Dolor dental, cefalea (migraña), ciática, fibromialgia, etc.
          - Evite el **fentanilo** y la **ketamina** para el dolor subagudo.
        - El dolor es subjetivo. Puede intentar con otro medicamento si el dolor persiste.
          - **No** utilice ketorolaco con ibuprofeno (elija uno u otro).
        - Dosis diaria máxima: **[Paracetamol](topic:wvems-2026-drug-reference#tylenol) 3,000 mg** · **Ibuprofeno 2,400 mg**.

    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        Utilice la [Referencia Pediátrica](topic:wvems-2026-144) u otra fuente aprobada para la dosificación pediátrica.

