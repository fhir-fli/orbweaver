    - type: "prose"

      critical_care_link:
        text: "[PIC elevada](topic:wvems-2026-086)"
      title: "Imperativos del traumatismo craneoencefálico"
      highlight: true
      markdown: |
        - Transporte de emergencia si hay cambios súbitos en el nivel de consciencia.
        - La **hipoxia** y la **hipotensión** están asociadas con resultados desfavorables.
          - Investigue y trate la [Hipoxia](topic:wvems-2026-006) y la [Hipotensión](topic:wvems-2026-008) de forma agresiva.
        - Los medicamentos [Anticoagulantes](topic:wvems-2026-076) (**diluyentes sanguíneos**) aumentan el riesgo de hemorragia intracraneal (HIC).
        - Las **laceraciones** se benefician de una reparación en las primeras horas.
        - El **mecanismo** predice la gravedad.

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considere [PIC elevada](topic:wvems-2026-086) si está indicado y cuenta con la acreditación para cuidados críticos.

    - type: "prose"
      title: "Alerta de TRAUMATISMO"
      callout: true
      dashed: true
      call_er: true
      markdown: |
        - Si requiere intervención mayor
        - O mecanismo mayor
        - Active una alerta de **TRAUMATISMO**

    - type: "prose"
      title: "Notas"
      markdown: |
        - **Fx de cráneo**: Puede causar hematomas detrás de las orejas o alrededor de ambos ojos.
        - **Cuero cabelludo**: Presión directa para hemorragia profusa (a menos que haya crepitación/fx de cráneo).
        - **Cuello**: Todas las penetraciones deben cubrirse con un sello torácico.
        - **Ojo**: Use solución salina o agua abundante para irrigar cualquier contaminación.
          - {E} **[Tetracaína](topic:wvems-2026-drug-reference#tetracaine)** (0.5% oftálmica): 1–2 gtt antes de la irrigación.
          - No irrigue si hay lesión penetrante. Coloque un **protector ocular** sobre ambos ojos.
        - **Boca**: Puede extraer **objetos incrustados** que comprometan la [Vía aérea](topic:wvems-2026-004).
        - **Oído**: Revise cualquier secreción en busca de LCR dejándola caer sobre papel blanco.
          - Un halo amarillo / transparente sugiere fuga de LCR por fractura de cráneo.
        - **Nariz**: No intente reducir. Trate la [Epistaxis](topic:wvems-2026-076).
        - **Dientes**: Transporte los dientes avulsionados en solución de Hank o SSN.
          - Intente la reimplantación solo en lesiones no complicadas y aisladas.
        - **Conmoción**: Por lo general no requiere intervención de los servicios de emergencia.

    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - No intente reimplantar dientes primarios (de leche).
        - Utilice la [Referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para la dosificación pediátrica.

