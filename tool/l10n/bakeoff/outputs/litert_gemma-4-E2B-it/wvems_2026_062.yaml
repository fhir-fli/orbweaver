    - type: "prose"

      critical_care_link:
        text: "[ICP elevado](topic:wvems-2026-086)"
      title: "Instrucciones para Lesión Craneal"
      highlight: true
      markdown: |
        - Transporte de emergencia si hay cambios repentinos en la LOC.
        - La **hipoxia** y la **hipotensión** están asociadas con peores resultados.
          - Investigue y trate agresivamente la [Hipoxia](topic:wvems-2026-006) y la [Hipotensión](topic:wvems-2026-008).
        - Los medicamentos de [Anticoagulación](topic:wvems-2026-076) (**empaquetadores de sangre**) aumentan el riesgo de HCE.
        - Las [Laceraciones](topic:wvems-2026-056) se benefician de la reparación dentro de las primeras horas.
        - El [Mecanismo](topic:wvems-2026-056) predice la gravedad.

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considere [ICP elevado](topic:wvems-2026-086) si está indicado y está acreditado para Cuidados Intensivos.

    - type: "prose"
      title: "Alerta de TRAUMA"
      callout: true
      dashed: true
      call_er: true
      markdown: |
        - Si es una Intervención Mayor
        - O Mecanismo Mayor
        - Llame a una Alerta **TRAUMA**

    - type: "prose"
      title: "Notas"
      markdown: |-
        - **Fractura del cráneo**: Puede causar moretones detrás de las orejas o alrededor de ambos ojos.
        - **Cuero del cráneo (Scalp)**: Presión directa para una hemorragia rápida (a menos que haya crepitación/fractura del cráneo).
        - **Cuello**: Todas las penetraciones deben tener un sello del pecho.
        - **Ojo**: Use solución salina o agua copiosas para enjuagar cualquier contaminación.
          - {E} **[Tetracaina](topic:wvems-2026-drug-reference#tetracaine)** (0.5% Oftálmica): 1–2 gotas antes de enjuagar.
          - No vacíe una lesión penetrante. Coloque el **escudo ocular** sobre ambos ojos.
        - **Boca**: Puede eliminar **objetos impalidados** que comprometan la [Vía aérea](topic:wvems-2026-004).
        - **Oído**: Verifique cualquier secreción para LCR cayendo sobre papel blanco.
          - Un halo amarillo/claro sugiere fuga de LCR desde una fractura del cráneo.
        - **Nariz**: No intente reducir. Trate para [Epistaxis](topic:wvems-2026-076).
        - **Dientes**: Transporte los dientes avulsos en solución de Hank o NS.
          - Intente la reinsertación solo en lesión no complicada e aislada.
        - **Conmoción**: Generalmente no requiere intervención de EMS.

    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |-
        - No intente la reinsertación para dientes primarios (bebé).
        - Use [Referencia de Pediatría](topic:wvems-2026-144) o otra fuente aprobada para la dosificación pediátrica.

