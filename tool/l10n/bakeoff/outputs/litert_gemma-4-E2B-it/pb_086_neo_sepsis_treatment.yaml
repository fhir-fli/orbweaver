# ============================================================
# ProtocolBook pp.86–87 — Neonatal Sepsis (< 28 days): Treatment +
# Duration of treatment. Fourth leaf of the Neonatal Protocols section.
#
# Two-page topic (`pages:`): p.86 = the treatment flowchart (one real
# decision — clinical signs of sepsis? — branching into a sepsis-
# management pathway and a localized-infection pathway) + antibiotic
# regimens; p.87 = the duration-of-treatment table.
#
# Faithful-rendering calls:
#   - The single top decision (signs of sepsis? Yes/No) → a small
#     `algorithm` (Yes → treat as sepsis; No → assess for localized
#     infection); each arm's detail (multi-step management + a/b/c
#     antibiotic dosing, which the algorithm boxes can't hold) →
#     titled prose below, in printed order. Same split as p.73/p.75.
#   - Antibiotic regimens a/b/c → bold-lead prose with dose bullets.
#   - Duration (p.87) → a two-column `table` (standard layout so the
#     long cells wrap).
#   - Cefotaxime "may substitute ceftriaxone (but risk of jaundice)"
#     kept as printed.
#   - Citation superscripts dropped; "No`" arrow typo (stray backtick)
#     silently corrected.
#
# CONTENT FLAGS for the later OE / content pass (rendered faithfully):
#   - Ampicillin + gentamicin is the WHO first-line neonatal empiric
#     regimen; cloxacillin for soft-tissue, ampicillin + cefotaxime for
#     meningitis. Gentamicin 3 mg/kg OD if <2 kg / 1st week / asphyxia
#     is the reduced-clearance adjustment. Ceftriaxone-jaundice caution
#     (bilirubin displacement) is correct. Vitamin K + tetracycline eye
#     ointment for home births = standard newborn prophylaxis.
# Cross-book pass 2026-08-28: neonatal meningitis ampicillin brought down from
#   100 mg/kg q8h (200->300 mg/kg/day) to 50 mg/kg q8h then q6h (150->200),
#   the settled term-neonate dose, with the preterm <=34 wk week-1 band named.
#   300 mg/kg/day is the OLDER-CHILD dose and was carried into the neonate.
#   The neonatal ceiling is set by immature renal clearance and seizure risk.
# ============================================================

topic:
  id: "pb-neo-sepsis-treatment"
  title: "Sepsis neonatal — Tratamiento"
  list_subtitle: "pp.86–87 · < 28 días · antibióticos · duración"
  last_reviewed: "pocketbook v1.7"
  tags: ["neonatal", "sepsis", "recién nacido", "tratamiento", "ampicilina", "gentamicina", "cloxacilina", "cefotaxima", "ceftriaxona", "meningitis", "antibióticos", "duración", "infección localizada"]
  category: "medical"

  pages:

    # ═══════════════════════ PAGE 86 ═══════════════════════
  - page_number: 86
    blocks:

    - type: "flowchart"
      variant: "algorithm"
      entry:
        text: "Neonato — evaluar por sepsis"
        shape: "stadium"
      stages:
      - decision: "¿Síntomas clínicos de sepsis?"
        criteria:
        - "Letargo"
        - "Fontanela hinchada"
        - "Antecedentes de convulsiones"
        - "Dificultad para alimentarse"
        - "Temperatura > 38 o < 35.5°C"
        - "Frecuencia respiratoria > 60/min"
        - "Dificultad respiratoria severa en la pared torácica, jadeo, apnea o cianosis"
        - "PROM > 18 h (si tiene < 7 días de edad)"
        outcomes:
        - label: "Sí"
          box:
            title: "Tratar como sepsis neonatal (ver abajo)"
            severity: "priority"
        - label: "No"
          box:
            title: "Evaluar por infección localizada (ver abajo)"

    - type: "prose"
      title: "Si hay signos de sepsis — manejo inicial"
      markdown: |-
        - Cultivos sanguíneos
        - Realizar un punción lumbar si se sospecha meningitis
        - Chequear hipoglucemia; tratar si es imposible medir la glucosa
        - Administrar oxígeno si está cianótico o la frecuencia respiratoria es > 60/min
        - Administrar vitamina K y pomada ocular de tetraciclina (TEO) si nació en casa o no se administró en el parto
        - Mantener abrigado
        - Mantener la alimentación por vía oral o vía nasal; usar líquidos IV solo si hay dificultad respiratoria o distensión abdominal severa

    - type: "prose"
      title: "Tratamiento antibiótico"
      markdown: |
        - **Primera línea:** ampicilina 50 mg/kg q8h (q12h si está en la primera semana) PLUS gentamicina 5 mg/kg OD (3 mg/kg OD si tiene < 2 kg en la primera semana, o asfixia al nacer)
        - **Si hay preocupación por infección del tejido blando:** cloxacilina PLUS gentamicina (dosis igual a la anterior)
        - **Si hay preocupación por meningitis:** ampicilina **50 mg/kg q8h en la semana 1 (150 mg/kg/día), luego q6h en las semanas 2–4 (200 mg/kg/día)** PLUS cefotaxima 50 mg/kg q8h (q12h si está en la primera semana)
        - ⚠️ **Un recién nacido muy prematuro (≤ 34 semanas) en la semana 1 toma la franja inferior — 50 mg/kg q12h (100 mg/kg/día).** La ampicilina se elimina por riñón y la eliminación se sigue según la edad postmenstrual; el riesgo de acumulación es la excitación del sistema nervioso central y las convulsiones
        - 🛑 **No transfiera la dosis anterior del niño de 300 mg/kg/día al neonato.** 300 mg/kg/día es correcto **más allá de las 4 semanas** y está por encima del límite neonatal
        - 🛑 **Prefiera cefotaxima a ceftriaxona en un neonato.** La ceftriaxona desplaza la bilirrubina de la albúmina y empeora la ictericia, y está **absolutamente contraindicada en cualquier neonato que reciba fluidos IV que contengan calcio** — los dos forman precipitados fatales en los pulmones y riñones

    - type: "prose"
      title: "Si no hay signos de sepsis — evaluar por infección localizada"
      markdown: |-
        ¿Hay:
        - Pus de los ojos
        - Pus de la oreja
        - Pus del umbigo y enrojecimiento de la piel abdominal; o
        - Unos cuantos ampollas grandes llenas de pus / puntos sépticos

    - type: "prose"
      title: "Decidir — ¿necesita el bebé fluidos, alimentación o sangre?"
      markdown: |-
        Entonces evaluar cualquier síntoma de los siguientes:
        - Ictericia
        - Reflujo capilar (retrasado)
        - Palidez severa
        - Infección localizada severa — articulaciones, distensión abdominal
        - Pérdida de peso

    - type: "prose"
      title: "Donde corresponda"
      markdown: |-
        - Tratar para oftalmia neonatal
        - Tratar con un antibiótico oral — uno que cubra a *Staph aureus* si hay puntos sépticos grandes y llenos de pus
        - Dar consejo a la madre y organizar revisión

    # ═══════════════════════ PAGE 87 ═══════════════════════
  - page_number: 87
    blocks:

    - type: "table"
      title: "Duración del tratamiento para sepsis neonatal"
      zebra: true
      columns: ["Problema", "Días de tratamiento"]
      column_flex: [5, 8]
      column_align: ["left", "left"]
      rows:
      - cells: ["Signos de sepsis neonatal severa", "Se debe realizar un cultivo de sangre. Antibióticos IV/IM por un mínimo de 7 días, o hasta estar completamente bien si la punción lumbar está clara."]
      - cells: ["Signos leves de infección neonatal, o buscar sepsis en un niño con factores de riesgo — SOLO si se ha realizado el cultivo de sangre", "Los antibióticos pueden interrumpirse después de 48 horas si se resuelven todos los signos de posible sepsis, el niño está alimentándose bien y la punción lumbar (si se realizó) es negativa. Cultivo de sangre negativo."]
      - cells: ["Meningitis neonatal, o sepsis neonatal severa con punción lumbar", "Se debe realizar un cultivo de sangre si no es posible hacer la punción lumbar. Antibióticos IV/IM por un mínimo de 14 días; un mínimo de 3 semanas si se sospecha meningitis de bacterias gramnegativas"]
      - cells: ["Neumonía clínica o radiológica", "Antibióticos IV/IM por un mínimo de 5 días, o hasta estar completamente bien durante 24 h. Para una punción lumbar positiva, ver meningitis"]
      - cells: ["Infección de la piel con signos de enfermedad generalizada como mala alimentación", "Los antibióticos IV/IM pueden interrumpirse después de 72 horas si el niño se está alimentando bien sin fiebre y no tiene otro problema, y la punción lumbar (si se realizó) es normal. Cultivo de sangre negativo. Antibióticos orales por otros 5 días."]
