    - type: "prose"

      critical_care_link:
        text: "[ICP Elevado](topic:wvems-2026-086)"
      title: "Imperativos de Lesión de Cabeza"
      highlight: true
      markdown: |
        - Transportar de emergencia si hay cambios repentinos en la LOC.
        - La **hipoxia** y la **hipotensión** se asocian con peores resultados.
          - Investigar y tratar la [Hipoxia](topic:wvems-2026-006) y la [Hipotensión](topic:wvems-2026-008) de forma agresiva.
        - Los medicamentos [Anticoagulantes](topic:wvems-2026-076) (**anticoagulantes**) aumentan el riesgo de HIC.
        - Las **laceraciones** se benefician de su reparación dentro de las primeras horas.
        - El **mecanismo** predice la severidad.

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considerar [ICP Elevado](topic:wvems-2026-086) si está indicado y cuenta con credenciales para Cuidados Críticos.

    - type: "prose"
      title: "Alerta de TRAUMA"
      callout: true
      dashed: true
      call_er: true
      markdown: |
        - Si Hay Intervención Mayor
        - O Mecanismo Mayor
        - Llamar a una Alerta de **TRAUMA**

    - type: "prose"
      title: "Notas"
      markdown: |
        - **Fractura de cráneo**: Puede causar hematomas detrás de las orejas o alrededor de ambos ojos.
        - **Cuero cabelludo**: Presión directa para el sangrado abundante (a menos que haya crepitación/fractura de cráneo).
        - **Cuello**: Todas las penetraciones deben tener un sellado de tórax.
        - **Ojo**: Usar solución salina abundante o agua para lavar cualquier contaminación.
          - {E} **[Tetracaina](topic:wvems-2026-drug-reference#tetracaine)** (0.5% Oftálmica): 1–2 gotas antes del lavado.
          - No lavar lesión penetrante. Colocar **protector ocular** sobre ambos ojos.
        - **Boca**: Se pueden retirar **objetos incrustados** que comprometan la [Vía aérea](topic:wvems-2026-004).
        - **Oído**: Comprobar cualquier secreción para LCR al gotearla sobre papel blanco.
          - Un halo amarillo / claro sugiere fuga de LCR por fractura de cráneo.
        - **Nariz**: No intentar reducir. Tratar por [Epistaxis](topic:wvems-2026-076).
        - **Dientes**: Transportar dientes avulsos en solución de Hank o SSN.
          - Intentar reimplante solo en lesión aislada y sin complicaciones.
        - **Concusión**: Usualmente no requiere intervención de EMS.

    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - No intentar reimplante de dientes primarios (de bebé).
        - Utilizar [Referencia Pediátrica](topic:wvems-2026-144) u otra fuente aprobada para dosificación pediátrica.

