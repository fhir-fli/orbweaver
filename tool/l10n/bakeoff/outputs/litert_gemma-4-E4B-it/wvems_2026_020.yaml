    - type: "prose"
      title: "Imperativos del Dolor"
      highlight: true
      markdown: |
        - El control del dolor por [EMS](topic:wvems-2026-056) está indicado para **lesión reciente** o **dolor repentino** como:
          - [Traumatismo mayor](topic:wvems-2026-056), [fracturas](topic:wvems-2026-066) obvias, [dolor abdominal](topic:wvems-2026-034) o [dolor torácico](topic:wvems-2026-028) agudo
        - Los medicamentos para el dolor (incluso por VO) son **beneficiosos a pesar de los cortos tiempos de transporte**.
        - Utilice la [dosificación pediátrica basada en el peso](topic:wvems-2026-144) para adultos pequeños menores de 110 lbs (50 kg).

    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Tylenol®](topic:wvems-2026-drug-reference#tylenol)** (Acetaminofén): evitar si hay enfermedad hepática en etapa terminal.
          - {E} solo puede administrarse por VO — utilice tabletas, cápsulas, polvo o líquido de venta libre.
          - {A} puede administrarse por VO o IV/IO — para IV/IO, administre lentamente durante 10 min.
        - **[Ibuprofeno](topic:wvems-2026-drug-reference#ibuprofen)** (Advil®, Motrin®): evitar si hay sangrado gastrointestinal activo.
        - **[Toradol®](topic:wvems-2026-drug-reference#toradol)** (Ketorolaco): evitar si hay sangrado gastrointestinal activo.
        - **[Fentanilo](topic:wvems-2026-drug-reference#fentanyl)** (Sublimaze®): use juicio, objetivo **0.5–1 mcg/kg**.
          - Comience con una dosis menor (50 mcg) para pacientes náuicos a narcóticos y/o más pequeños.
        - **[Ketamina](topic:wvems-2026-drug-reference#ketamine)** (Ketalar®):
          - Uso IM/IN: administre como bolo sin diluir.
          - Uso IV/IO: diluir en Solución Salina y administrar lentamente durante 10 min.
        - Se pueden administrar gotas para los ojos por abrasiones o flash de soldador (queratitis por luz UV):
          - {E} **[Tetracaina](topic:wvems-2026-drug-reference#tetracaine)** (0.5 % Oftálmica) — 1–2 gtt en el ojo afectado.

    - type: "prose"
      title: "Notas"
      markdown: |
        - El Tylenol y el Ibuprofeno son buenos para **dolor subagudo** como:
          - Dolor de muela, cefalea (migraña), ciática, fibromialgia, etc.
          - Evite el **Fentanilo** y la **Ketamina** para dolor subagudo.
        - El dolor es subjetivo. Se puede intentar otro medicamento si el dolor persiste.
          - No use Toradol con Ibuprofeno (elija uno u otro).
        - Dosis máxima diaria: **[Tylenol](topic:wvems-2026-drug-reference#tylenol) 3,000 mg** · **Ibuprofeno 2,400 mg**.

