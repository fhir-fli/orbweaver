  blocks:

  - type: "prose"
    title: "Manejo inicial"
    markdown: |
      - Si existe **CUALQUIER** preocupación por residuos en la piel o ropa — use equipo de protección personal (guantes, batas, mascarillas); retire / bag / deseche la ropa; lave al paciente y la zona minuciosamente con agua y jabón (la ropa y el EPP son residuos peligrosos — deseche correctamente)
      - Monitoree y apoye la ABC
      - Compruebe los signos vitales (TA, FC, FR, SatO2, Temp)
      - Si SatO2 < 90% o existe **CUALQUIER** preocupación por la respiración, inicie O2 al 100% vía mascarilla facial
      - Glucosa en sangre rápida (GCS) al pie de cama y trate la hipoglucemia
      - Coloque una vía IV de calibre grueso
      - Realice una anamnesis y examen físico breve y enfocado; preste atención al estado mental
        - Qué se tomó, hace cuánto, volumen / cuánto, efectos inmediatos
      - Desconfíe de traumas ocultos
      - Obtenga laboratorios: hemograma, funciones renales, electrolitos, funciones hepáticas
      - ECG de 12 derivaciones
      - Las convulsiones son una emergencia neurológica y deben tratarse prontamente con diazepam
      - Lavado gástrico: casi **NUNCA INDICADO**
      - Considere **carbón activado en dosis única de 1 g/kg por VO/SNG dentro de 1 hora** de la ingestión, para sustancias conocidas que se adsorben. No se lo dé a un paciente que no esté completamente despierto, y nunca intube solo para dárselo

  - type: "prose"
    title: "Indicaciones para ingreso a la UCI"
    markdown: |
      - Necesidad de ETT y ventilación mecánica
      - GCS < 12 / AVPU = U / estado epiléptico
      - Tóxicos con potencial de depresión respiratoria (p. ej., envenenamiento por amitraz)
      - Desequilibrios ácido-base
      - Curso clínico de envenenamiento no claro / impredecible (es decir, poco estudiado)

  - type: "prose"
    title: "Toxidromos comunes y antídotos"
    markdown: |
      - Consulte el protocolo específico para: Organofosforados / Carbamatos / Colinérgicos, Hidrocarburos / Parafina / Queroseno, Benzodiacepinas / Opiáceos, Paracetamol, Etanol
      - **Adrenérgicos / Simpaticomiméticos**
        - Cocaína, anfetaminas (metanfetamina cristal, Adderall), pseudoefedrina
        - Presentación: HAS, taquicardia, midriasis, ansiedad, delirio, delirios
        - Td: de apoyo — **benzodiacepinas primero** (normalmente estabilizan la hipertensión y la taquicardia por sí solas), más líquidos IV; antihipertensivos solo si sigue siendo necesario
      - **Anticolinérgicos / Antidepresivos tricíclicos (ATC) / antihistamínicos**
        - Presentación: hiperpirexia, vasodilatación cutánea (enrojecimiento), disminución de la salivación, midriasis, retención urinaria, arritmias
        - Td:
          - Fisiostigmina — evite en ATC; solo si hay taquiarritmias persistentes o convulsiones. Llame al anestesiólogo antes de administrarlo.
          - NaHCO3 para ATC
      - **Metanol**
        - Presentación: delirio, pérdida de visión
        - Td: por vía oral por SNG — 1.8 ml/kg de etanol al 43% (aproximadamente **tres dosis de 40 ml, ≈126 ml**, en un adulto de 70 kg); mantenimiento de 0.2–0.4 ml/kg/hora de etanol al 43%
        - **Además de ácido fólico 1 mg/kg (o 50 mg) IV cada 4–6 horas** — acelera la conversión de ácido fórmico a CO₂ y agua, y es barato y disponible
        - **Derive urgentemente a hemodiálisis si está disponible:** pH ≤ 7.15, síntomas visuales, convulsiones, coma, o deterioro a pesar del antídoto. La diálisis elimina tanto el metanol como el formato y es el tratamiento definitivo
