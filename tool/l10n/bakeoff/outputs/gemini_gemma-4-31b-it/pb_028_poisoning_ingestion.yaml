topic:
  id: "pb-poisoning-ingestion"
  title: "Intoxicación / Ingesta — Sospecha de paciente intoxicado agudamente"
  list_subtitle: "p.28 · algoritmo inicial"
  last_reviewed: "pocketbook v1.7"
  tags: ["intoxicación", "ingesta", "toxicología", "toxidromo", "antídoto"]
  category: "medical"
  page_number: 28

  blocks:

  - type: "prose"
    title: "Manejo inicial"
    markdown: |
      - Si hay **CUALQUIER** preocupación por residuos en la piel o la ropa — use equipo de protección personal (guantes, batas, mascarillas); retire / embolse / deseche la ropa; lave minuciosamente al paciente y el área con agua y jabón (la ropa y el EPP son residuos peligrosos — deséchelos adecuadamente)
      - Monitorice y brinde soporte ABCD
      - Verifique los signos vitales (PA, FC, FR, spO2, Temp)
      - Si la spO2 < 90% o hay **CUALQUIER** preocupación por la respiración, inicie O2 al 100% mediante mascarilla facial
      - Glucemia capilar (RBS) al lado de la cama y trate la hipoglucemia
      - Coloque una vía IV de grueso calibre
      - Realice una historia clínica y un examen físico breves y dirigidos; preste atención al estado mental
        - Qué tomó, hace cuánto tiempo, volumen / cuánto, efectos inmediatos
      - Tenga cuidado con el trauma oculto
      - Obtenga laboratorios: hemograma (CBC), funciones renales, electrolitos, funciones hepáticas
      - ECG de 12 derivaciones
      - Las convulsiones son una emergencia neurológica y deben tratarse rápidamente con diazepam
      - Lavado gástrico: casi **NUNCA INDICADO**
      - Considere **carbón activado en dosis única 1 g/kg VO/SNG dentro de 1 hora** de la ingesta, para sustancias que se sabe que son adsorbidas. No lo administre a un paciente que no esté completamente despierto, y nunca intube únicamente para administrarlo

  - type: "prose"
    title: "Indicaciones para ingreso a UCI"
    markdown: |
      - Necesidad de tubo endotraqueal (ETT) y ventilación mecánica
      - GCS < 12 / AVPU = U / estado epiléptico
      - Toxinas con potencial de depresión respiratoria (p. ej., intoxicación por amitraz)
      - Desequilibrios ácido-base
      - Curso clínico de la intoxicación incierto / impredecible (es decir, poco estudiado)

  - type: "prose"
    title: "Toxídromos y antídotos comunes"
    markdown: |
      - Consulte el protocolo específico para: organofosforados / carbamatos / colinérgicos, hidrocarburos / parafina / queroseno, benzodiazepinas / opiáceos, paracetamol, etanol
      - **Adrenérgicos / Simpaticomiméticos**
        - Cocaína, anfetaminas (metanfetamina, Adderall), pseudoefedrina
        - Presentación: HTA, taquicardia, midriasis, ansiedad, delirio, delirios
        - Rx: de soporte — **benzodiazepinas primero** (generalmente controlan la hipertensión y la taquicardia por sí solas), más líquidos IV; antihipertensivos solo si aún son necesarios
      - **Anticolinérgicos / Antidepresivos tricíclicos (ATC) / antihistamínicos**
        - Presentación: hiperpirexia, vasodilatación cutánea (rubor), disminución de la saliva, midriasis, retención urinaria, disritmias
        - Rx:
          - Fisostigmina — evite en ATC; solo si hay taquiarritmias persistentes o convulsiones. Llame al anestesiólogo antes de administrarla.
          - NaHCO3 para ATC
      - **Metanol**
        - Presentación: delirio, pérdida de la visión
        - Rx: oral por SNG — 1.8 ml/kg de etanol al 43% (aproximadamente **tres dosis de 40 ml, ≈126 ml**, en un adulto de 70 kg); mantenimiento 0.2–0.4 ml/kg/hora de etanol al 43%
        - **Más ácido fólico 1 mg/kg (o 50 mg) IV cada 4–6 horas** — acelera la conversión del ácido fórmico en CO₂ y agua, y es económico y accesible
        - **Remita urgentemente para hemodiálisis si está disponible:** pH ≤ 7.15, síntomas visuales, convulsiones, coma o deterioro a pesar del antídoto. La diálisis elimina tanto el metanol como el formiato y es el tratamiento definitivo
