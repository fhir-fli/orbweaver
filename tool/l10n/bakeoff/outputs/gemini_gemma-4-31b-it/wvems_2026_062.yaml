    - type: "prose"

      critical_care_link:
        text: "[PIC elevada](topic:wvems-2026-086)"
      title: "Imperativos del traumatismo craneoencefálico"
      highlight: true
      markdown: |
        - Transporte de urgencia si hay cambios súbitos en el estado de conciencia.
        - La **hipoxia** y la **hipotensión** se asocian con malos resultados.
          - Investigue y trate la [hipoxia](topic:wvems-2026-006) y la [hipotensión](topic:wvems-2026-008) de forma agresiva.
        - Los medicamentos para la [anticoagulación](topic:wvems-2026-076) (**anticoagulantes**) aumentan el riesgo de HCI.
        - Las **laceraciones** se benefician de la reparación dentro de las primeras horas.
        - El **mecanismo** predice la gravedad.

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considere [PIC elevada](topic:wvems-2026-086) si está indicado y cuenta con la certificación para cuidados críticos.

    - type: "prose"
      title: "Alerta de TRAUMATISMO"
      callout: true
      dashed: true
      call_er: true
      markdown: |
        - Si hay intervención mayor
        - O mecanismo mayor
        - Llame a una alerta de **TRAUMATISMO**

    - type: "prose"
      title: "Notas"
      markdown: |
        - **Fx de cráneo**: Puede causar equimosis detrás de los oídos o alrededor de ambos ojos.
        - **Cuero cabelludo**: Presión directa para hemorragias abundantes (a menos que haya crepitación craneal/fx).
        - **Cuello**: Todas las penetraciones deben llevar un sello torácico.
        - **Ojo**: Use abundante solución salina o agua para irrigar cualquier contaminación.
          - {E} **[Tetracaína](topic:wvems-2026-drug-reference#tetracaine)** (0.5% oftálmica): 1–2 gtt antes de la irrigación.
          - No irrigue en caso de lesión penetrante. Coloque un **protector ocular** sobre ambos ojos.
        - **Boca**: Se pueden retirar **objetos empalados** que comprometan la [vía aérea](topic:wvems-2026-004).
        - **Oído**: Verifique si cualquier secreción es LCR dejándola caer sobre papel blanco.
          - Un halo amarillo/claro sugiere fuga de LCR por fractura de cráneo.
        - **Nariz**: No intente reducir. Trate la [epistaxis](topic:wvems-2026-076).
        - **Dientes**: Transporte los dientes avulsionados en solución de Hank o NS.
          - Intente el reimplante solo en lesiones aisladas y no complicadas.
        - **Conmoción**: Por lo general, no requiere intervención del SEM.

    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - No intente el reimplante de dientes primarios (de leche).
        - Use la [Referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para la dosificación pediátrica.

