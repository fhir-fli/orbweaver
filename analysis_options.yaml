include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # flutter gen-l10n output (l10n.yaml). Flutter 3.50's template still
    # lists flutter_localizations' delegates, deprecated in 3.50 (CI run
    # 45772042433: 2 infos); the app installs material_ui's (lib/l10n/l10n.dart).
    - lib/l10n/gen/**

linter:
  rules:
    public_member_api_docs: false
    sort_constructors_first: false
    always_put_required_named_parameters_first: false
    lines_longer_than_80_chars: false
