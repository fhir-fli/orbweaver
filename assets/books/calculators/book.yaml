book:
  id: "calculators"
  title: "Calculators"
  subtitle: "Bedside clinical calculators"
  cover: "cover.png"      # "Calculators" cover; title renders below on the shelf
  spine_color: "0xFF00695C"
  # Calculators: evidence-vetted bedside clinical calculators. Three kinds:
  #   - conversion  (equivalence/tiers dose converters — opioid/benzo/statin/steroid)
  #   - formula     (numbers in → number out — CrCl, MAP, corrected Na, …)
  #   - score       (criteria → summed points → risk band — CHA₂DS₂-VASc, Wells, …)
  # Every calculator is guideline-backed; formula math lives in a unit-tested
  # Dart registry (formula_registry.dart) and score sums in score_engine.dart.
  # Book-level palette: a teal "tools" accent inherited by all calculators.
  palette:
    accent: "0xFF00695C"
  contents:
    - title: "Dose Conversions"
      children:
        - topic: "topics/conv_opioids.yaml"
        - topic: "topics/conv_benzodiazepines.yaml"
        - topic: "topics/conv_steroids.yaml"
        - topic: "topics/conv_statins.yaml"
    - title: "Renal & Fluids"
      children:
        - topic: "topics/calc_creatinine_clearance.yaml"
        - topic: "topics/calc_holliday_segar.yaml"
        - topic: "topics/calc_parkland.yaml"
    - title: "Electrolytes & Acid–Base"
      children:
        - topic: "topics/calc_corrected_sodium.yaml"
        - topic: "topics/calc_free_water_deficit.yaml"
        - topic: "topics/calc_anion_gap.yaml"
        - topic: "topics/calc_osmolal_gap.yaml"
        - topic: "topics/calc_winters.yaml"
        - topic: "topics/calc_aa_gradient.yaml"
    - title: "Cardiac & Body Size"
      children:
        - topic: "topics/calc_map.yaml"
        - topic: "topics/calc_qtc.yaml"
        - topic: "topics/calc_ideal_body_weight.yaml"
        - topic: "topics/calc_anthropometrics.yaml"
    - title: "Hepatology"
      children:
        - topic: "topics/calc_meld.yaml"
        - topic: "topics/calc_child_pugh.yaml"
    - title: "Risk & Severity Scores"
      children:
        - topic: "topics/calc_cha2ds2_vasc.yaml"
        - topic: "topics/calc_hasbled.yaml"
        - topic: "topics/calc_heart.yaml"
        - topic: "topics/calc_wells_dvt.yaml"
        - topic: "topics/calc_wells_pe.yaml"
        - topic: "topics/calc_perc.yaml"
        - topic: "topics/calc_curb65.yaml"
        - topic: "topics/calc_qsofa.yaml"
        - topic: "topics/calc_centor.yaml"
        - topic: "topics/calc_4ts.yaml"
        - topic: "topics/calc_gcs.yaml"
        - topic: "topics/calc_canadian_ct_head.yaml"
    - title: "Withdrawal Scales"
      children:
        - topic: "topics/calc_ciwa_ar.yaml"
        - topic: "topics/calc_cows.yaml"
