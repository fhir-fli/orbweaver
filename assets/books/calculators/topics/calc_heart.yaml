# ============================================================
# HEART score — chest pain risk in the ED.
# Evidence review 2026-07-19: validated (Backus 2013; HEART Pathway RCT
# Mahler 2015 — 0% MACE in low-risk early-discharge), endorsed within
# chest-pain pathways (2021 AHA/ACC). Requires troponin (the "T"); the
# HEAR subscore is a troponin-free fallback for low-resource settings.
# Total 0–10. History/ECG components are interobserver-variable.
# ============================================================

topic:
  id: "calc-heart"
  title: "HEART Score"
  list_subtitle: "chest pain risk (ED)"
  last_reviewed: "Evidence review 2026-07-19 · Backus 2013 · Mahler 2015"
  tags: ["heart score", "chest pain", "acs", "troponin", "mace", "risk", "ed", "cardiac"]
  aliases:
    - "HEART"
    - "HEART score"
    - "Chest pain score"
  category: "medical"

  blocks:

    - type: "prose"
      markdown: |
        Risk-stratifies undifferentiated chest pain in the ED for 6-week
        major adverse cardiac events. Requires a troponin value.

    - type: "score"
      title: "HEART score"
      source: "Six et al. 2008; Backus 2013; HEART Pathway RCT (Mahler 2015)"
      items:
        - key: "history"
          label: "History"
          type: "choice"
          default: "h0"
          options:
            - { value: "h0", label: "Slightly suspicious", points: 0 }
            - { value: "h1", label: "Moderately suspicious", points: 1 }
            - { value: "h2", label: "Highly suspicious", points: 2 }
        - key: "ecg"
          label: "ECG"
          type: "choice"
          default: "ec0"
          options:
            - { value: "ec0", label: "Normal", points: 0 }
            - { value: "ec1", label: "Non-specific repolarization", points: 1 }
            - { value: "ec2", label: "Significant ST deviation", points: 2 }
        - key: "age"
          label: "Age"
          type: "choice"
          default: "ag0"
          options:
            - { value: "ag0", label: "< 45", points: 0 }
            - { value: "ag1", label: "45–64", points: 1 }
            - { value: "ag2", label: "≥ 65", points: 2 }
        - key: "risk"
          label: "Risk factors"
          type: "choice"
          default: "r0"
          options:
            - { value: "r0", label: "None", points: 0 }
            - { value: "r1", label: "1–2 factors", points: 1 }
            - { value: "r2", label: "≥ 3, or known atherosclerotic disease", points: 2 }
        - key: "troponin"
          label: "Troponin"
          type: "choice"
          default: "t0"
          options:
            - { value: "t0", label: "≤ normal limit", points: 0 }
            - { value: "t1", label: "1–3× normal", points: 1 }
            - { value: "t2", label: "> 3× normal", points: 2 }
      bands:
        - { min: 0, max: 3, label: "Low risk — early discharge reasonable", detail: "~1.7% 6-wk MACE.", severity: "none" }
        - { min: 4, max: 6, label: "Moderate — observe / admit", severity: "warn" }
        - { min: 7, max: 10, label: "High risk — early invasive workup", severity: "alert" }
      caveats:
        - "Requires troponin. Without an assay, the HEAR subscore (History/ECG/Age/Risk) cannot exclude MI — treat as lower-certainty and observe."
