# ============================================================
# Lille model — corticosteroid response in alcohol-associated hepatitis.
# Evidence review 2026-07-19: AASLD 2020 uses the day-7 Lille score to
# identify steroid non-responders (≥ 0.45 → stop steroids). Louvet 2007;
# coefficients here converted to conventional US units (albumin g/dL,
# bilirubin mg/dL). Renal insufficiency is BINARY (creatinine > 1.3 mg/dL),
# per the original model / MDCalc.
# ============================================================

topic:
  id: "calc-lille"
  title: "Lille Model"
  list_subtitle: "steroid response in alcoholic hepatitis"
  last_reviewed: "Evidence review 2026-07-19 · Louvet 2007 · AASLD 2020"
  tags: ["lille", "alcoholic hepatitis", "steroid", "corticosteroid", "response", "liver", "hepatology"]
  aliases:
    - "Lille model"
    - "Lille score"
  category: "medical"

  blocks:

    - type: "prose"
      markdown: |
        After ~7 days of corticosteroids for severe alcohol-associated
        hepatitis, the Lille score identifies non-responders who should stop
        steroids. Use baseline (day-0) values for everything except the day-7
        bilirubin.

    - type: "formula"
      kind: "lille"
      title: "Lille score"
      source: "Louvet et al., Hepatology 2007"
      inputs:
        - { key: "age", label: "Age", unit: "yr", type: "number" }
        - { key: "albumin", label: "Albumin (day 0)", unit: "g/dL", type: "number" }
        - { key: "bilirubin_day0", label: "Bilirubin (day 0)", unit: "mg/dL", type: "number" }
        - { key: "bilirubin_day7", label: "Bilirubin (day 7)", unit: "mg/dL", type: "number" }
        - { key: "creatinine", label: "Creatinine (day 0)", unit: "mg/dL", type: "number", help: "> 1.3 counts as renal insufficiency" }
        - { key: "pt", label: "Prothrombin time", unit: "sec", type: "number" }
      notes:
        - "Score ranges 0–1; ≥ 0.45 = non-responder (poor 6-month survival). Assessed at day 7 of steroids (day 4 is an acceptable early read)."
      caveats:
        - "Only meaningful in a patient already on corticosteroids for severe alcohol-associated hepatitis (e.g. Maddrey ≥ 32 or MELD > 20)."
