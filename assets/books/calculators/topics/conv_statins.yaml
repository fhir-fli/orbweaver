# ============================================================
# Statin intensity equivalence (tiers mode)
# Per 2018 ACC/AHA Cholesterol Guideline Table 3. OpenEvidence
# review applied 2026-06-18: Pitavastatin 1 mg Low → Moderate (1–4 mg
# = moderate); added Fluvastatin + Lovastatin 80 mg; simva-80 caveat.
# ============================================================

topic:
  id: "conv-statins"
  title: "Statin Intensity"
  list_subtitle: "low / moderate / high intensity"
  last_reviewed: "OpenEvidence review 2026-06-18 · 2018 ACC/AHA Table 3"
  tags: ["statin", "conversion", "intensity", "atorvastatin", "rosuvastatin", "ldl"]
  aliases:
    - "Statin Equivalence"
    - "LDL Intensity"
  category: "medical"

  blocks:

    - type: "prose"
      markdown: |
        Statins come in fixed strengths, so this compares by **LDL-lowering
        intensity tier** rather than an exact dose. **Tap a strength** to
        highlight its tier — the equivalents across the other agents.

    - type: "conversion"
      mode: "tiers"
      title: "Statin intensity"
      tiers: ["Low", "Moderate", "High"]
      tier_note: "LDL-C lowering intensity (2018 ACC/AHA)."
      source: "2018 ACC/AHA Cholesterol Guideline, Table 3"
      agents:
        - name: "Atorvastatin"
          doses:
            - { dose: "10 mg", tier: "Moderate" }
            - { dose: "20 mg", tier: "Moderate" }
            - { dose: "40 mg", tier: "High" }
            - { dose: "80 mg", tier: "High" }
        - name: "Rosuvastatin"
          doses:
            - { dose: "5 mg",  tier: "Moderate" }
            - { dose: "10 mg", tier: "Moderate" }
            - { dose: "20 mg", tier: "High" }
            - { dose: "40 mg", tier: "High" }
        - name: "Simvastatin"
          doses:
            - { dose: "10 mg", tier: "Low" }
            - { dose: "20 mg", tier: "Moderate" }
            - { dose: "40 mg", tier: "Moderate" }
        - name: "Pravastatin"
          doses:
            - { dose: "10 mg", tier: "Low" }
            - { dose: "20 mg", tier: "Low" }
            - { dose: "40 mg", tier: "Moderate" }
            - { dose: "80 mg", tier: "Moderate" }
        - name: "Lovastatin"
          doses:
            - { dose: "20 mg", tier: "Low" }
            - { dose: "40 mg", tier: "Moderate" }
            - { dose: "80 mg", tier: "Moderate" }
        - name: "Fluvastatin"
          doses:
            - { dose: "20 mg", tier: "Low" }
            - { dose: "40 mg", tier: "Low" }
            - { dose: "80 mg XL", tier: "Moderate" }
        - name: "Pitavastatin"
          doses:
            - { dose: "1 mg", tier: "Moderate" }
            - { dose: "2 mg", tier: "Moderate" }
            - { dose: "4 mg", tier: "Moderate" }
      caveats:
        - "Intensity equivalence ≠ interchangeable — weigh drug interactions, myopathy risk, and renal/hepatic dosing."
        - "Simvastatin 80 mg is omitted — the FDA advises against it (myopathy/rhabdomyolysis risk)."
