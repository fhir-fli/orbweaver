# ============================================================
# NEXUS Low-Risk Criteria — cervical-spine imaging after blunt trauma.
# Evidence review 2026-09-07 (abstracts read whole via PubMed):
#   Hoffman et al., NEJM 2000 (PMID 10891516): 34,069 blunt-trauma patients
#   imaged at 21 US centres; the instrument missed 8/818 cervical-spine
#   injuries (sensitivity 99.0%, NPV 99.8%, specificity 12.9%) and 2/578
#   clinically significant injuries (sensitivity 99.6%, NPV 99.9%). No age
#   bound — MDCalc's evidence page for the same cohort gives ages 1–101.
#   Viccellio et al., Pediatrics 2001 (PMID 11483830): the < 18 y subgroup,
#   3,065 children, 30 injuries, sensitivity 100% (95% CI 87.8–100); only 88
#   were < 2 y and none of them injured, so the authors advise caution < 2 y.
#   Stiell et al., NEJM 2003 (PMID 14695411): prospective head-to-head in
#   8,283 alert stable adults — the Canadian C-Spine Rule was more sensitive
#   (99.4% vs 90.7%) and more specific (45.1% vs 36.8%) than NEXUS.
#   OpenEvidence 2026-09-07 (verified against the abstracts): Ala et al., PLoS
#   One 2018 (PMID 30388133) 90% sensitivity for both, specificity NEXUS
#   54.7% vs CCR 44.2%; Lee et al., JAMA Netw Open 2025 (PMID 41632125), 22,430
#   children, sensitivity PECARN CSI 93.3%, NEXUS 85.7%, CCR 90.8%; guideline
#   split and the CT-unavailable pathway per the OE ruling (Gesu 2021, ACR
#   2019, Spinal Cord Society 2020).
# All five criteria must be met to forgo imaging; any one present → image.
# Criterion labels are the five named in the NEJM abstract; no verbatim
# sub-definitions are reproduced here because the full text was not read.
# ============================================================

topic:
  id: "calc-nexus-cspine"
  title: "NEXUS C-Spine Criteria"
  list_subtitle: "cervical-spine imaging after blunt trauma"
  last_reviewed: "Evidence review 2026-09-07 · Hoffman 2000 · Viccellio 2001 · Stiell 2003"
  tags: ["nexus", "c-spine", "cervical spine", "neck", "trauma", "imaging", "x-ray", "ct", "decision rule", "clearance"]
  aliases:
    - "NEXUS criteria"
    - "NEXUS low-risk criteria"
    - "C-spine clearance"
    - "Cervical spine rule"
  category: "trauma"

  blocks:

    - type: "prose"
      markdown: |
        Identifies blunt-trauma patients whose cervical spine can be cleared
        clinically. All five must be absent to skip imaging — tap any that is
        present; a single one means imaging is indicated. Companion rule for
        alert, stable adults: the [Canadian C-Spine Rule](topic:calc-canadian-cspine),
        which also carries the pathway for when CT is unavailable. Children:
        [PECARN cervical spine](topic:calc-pecarn-cspine).

    - type: "score"
      title: "NEXUS low-risk criteria"
      unit: "present"
      source: "Hoffman et al., NEJM 2000; Viccellio et al., Pediatrics 2001 (children)"
      items:
        - { key: "tenderness", label: "Midline cervical tenderness", type: "toggle", points: 1 }
        - { key: "neuro", label: "Focal neurologic deficit", type: "toggle", points: 1 }
        - { key: "alertness", label: "Altered alertness", type: "toggle", points: 1, help: "not normally alert" }
        - { key: "intoxication", label: "Intoxication", type: "toggle", points: 1 }
        - { key: "distracting", label: "Painful distracting injury", type: "toggle", points: 1 }
      bands:
        - { min: 0, max: 0, label: "Low risk — no cervical-spine imaging required by NEXUS", detail: "NPV 99.8% for any injury, 99.9% for clinically significant injury.", severity: "none" }
        - { min: 1, label: "Imaging indicated — NEXUS cannot clear the spine", severity: "warn" }
      notes:
        - "Guidelines split: EAST and AANS/CNS use NEXUS; NICE uses the Canadian C-Spine Rule; the ACR accepts either. In the developers' head-to-head (Stiell 2003) the Canadian rule was more sensitive (99.4% vs 90.7%) and more specific (45.1% vs 36.8%); an independent comparison (Ala 2018, 200 patients) found 90% sensitivity for both and NEXUS more specific (54.7% vs 44.2%)."
        - "Rule negative: remove the collar, no imaging. Rule positive with CT unavailable: plain films, minimum 3 views, preferably 5 — and normal films do not fully clear the patient (see the Canadian C-Spine Rule page)."
      caveats:
        - "Over 65: NEXUS sensitivity is lower in older patients; the Canadian rule sends every patient ≥ 65 to imaging. Consider imaging on mechanism or examination even when NEXUS is negative."
        - "Children: NEXUS and the Canadian rule are adult-derived and not validated under about 8 years; the paediatric subgroup (Viccellio 2001) had only 88 children under 2, none injured. In 22,430 children (Lee 2025) sensitivity was NEXUS 85.7%, Canadian rule 90.8%, PECARN cervical-spine rule 93.3% — use the PECARN cervical-spine rule for children."
