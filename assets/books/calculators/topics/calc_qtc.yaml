# ============================================================
# Corrected QT interval (QTc).
# Evidence review 2026-07-19: default to FRIDERICIA (FDA moved off Bazett
# ~2017; AHA/ACC/HRS prefer rate-linear corrections). Bazett overcorrects
# at high HR / undercorrects at low HR. Show all four for comparison.
#   Fridericia QTc = QT / RR^(1/3);  Bazett = QT / √RR;
#   Framingham = QT + 154×(1−RR);    Hodges = QT + 1.75×(HR−60).  RR = 60/HR s.
# ============================================================

topic:
  id: "calc-qtc"
  title: "Corrected QT (QTc)"
  list_subtitle: "Fridericia (Bazett / Framingham / Hodges)"
  last_reviewed: "Evidence review 2026-07-19"
  tags: ["qtc", "qt", "corrected qt", "fridericia", "bazett", "ecg", "torsades", "prolongation"]
  aliases:
    - "QTc"
    - "Corrected QT"
    - "Fridericia"
    - "Bazett"
  category: "medical"

  blocks:

    - type: "prose"
      markdown: |
        Heart-rate-corrected QT interval. **Fridericia** is the preferred
        correction; Bazett (the ECG-machine default) is shown but overestimates
        QTc in tachycardia and underestimates in bradycardia.

    - type: "formula"
      kind: "qtc"
      title: "QTc"
      source: "Fridericia 1920; Bazett 1920; Framingham (Sagie 1992); Hodges 1983"
      inputs:
        - { key: "qt", label: "Measured QT", unit: "ms", type: "number" }
        - { key: "hr", label: "Heart rate", unit: "bpm", type: "number" }
      notes:
        - "Fridericia QTc = QT ÷ (60/HR)^⅓. Prolonged roughly ≥ 460 ms; torsades risk climbs above 500 ms."
      caveats:
        - "At heart rates far from 60, prefer Fridericia/Framingham over Bazett; interpret with the clinical context (electrolytes, QT-prolonging drugs)."
