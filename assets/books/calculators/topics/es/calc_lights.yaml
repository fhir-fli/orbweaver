topic:
  id: "calc-lights"
  title: "Criterios de Light"
  list_subtitle: "exudado frente a trasudado pleural"
  last_reviewed: "Evidence review 2026-07-19 · Light 1972 · BTS 2023"
  tags: ["criterios de light", "light", "derrame pleural", "exudado", "trasudado", "toracocentesis", "pulmonar"]
  aliases:
  - "Criterios de Light"
  - "Líquido pleural"
  - "Exudado trasudado"
  category: "medical"
  blocks:
  - type: "prose"
    markdown: |
      Clasifica un derrame pleural como exudado o trasudado. Basta con que se cumpla
      un criterio para que sea un exudado.
  - type: "formula"
    kind: "lights"
    title: "Criterios de Light"
    source: "Light et al., Ann Intern Med 1972"
    inputs:
    - {key: "pleural_protein", label: "Proteínas pleurales", unit: "g/dL", type: "number"}
    - {key: "serum_protein", label: "Proteínas séricas", unit: "g/dL", type: "number"}
    - {key: "pleural_ldh", label: "LDH pleural", unit: "U/L", type: "number"}
    - {key: "serum_ldh", label: "LDH sérica", unit: "U/L", type: "number"}
    - {key: "serum_ldh_uln", label: "Límite superior normal de LDH sérica", unit: "U/L", type: "number"}
    notes:
    - "Exudado si CUALQUIERA: cociente de proteínas > 0.5, cociente de LDH > 0.6, o LDH pleural > ⅔ × LSN de la LDH sérica."
    caveats:
    - "Sobrediagnostica exudado en la insuficiencia cardíaca tratada con diuréticos — si es probable la IC, use el gradiente de albúmina suero-derrame (> 1.2 g/dL = trasudado) o el NT-proBNP."
