# translated-from-sha256: 03efca89d0e2ada1aec9725afbb2149f61546dd48ae258f6140d282838ae7f42
# ============================================================
# Osmolal gap.
# Evidence review 2026-07-19: gap = measured − calculated osmolality,
# calc = 2·Na + glucose/18 + BUN/2.8 (+ ethanol/3.7). An adjunct for
# toxic-alcohol evaluation — a normal/low gap does NOT rule out ingestion
# (esp. late, once the parent alcohol is metabolized). Levels + anion gap
# + clinical picture (and EXTRIP for dialysis) drive management.
# ============================================================

topic:
  id: "calc-osmolal-gap"
  title: "Brecha osmolal"
  list_subtitle: "cribado de alcoholes tóxicos"
  last_reviewed: "Evidence review 2026-07-19"
  tags: ["brecha osmolal", "brecha osmolar", "alcohol tóxico", "metanol", "etilenglicol", "osmolalidad", "toxicología"]
  aliases:
  - "Brecha osmolal"
  - "Brecha osmolar"
  category: "medical"

  blocks:

  - type: "prose"
    markdown: |
      Diferencia entre la osmolalidad sérica medida y la calculada. Una brecha
      grande sugiere osmoles no medidos (p. ej., metanol, etilenglicol) — pero
      una brecha normal no puede excluir la ingestión de un alcohol tóxico.

  - type: "formula"
    kind: "osmolal_gap"
    title: "Brecha osmolal"
    source: "Brecha = medida − (2·Na + glucosa/18 + BUN/2.8 + etanol/3.7)"
    inputs:
    - {key: "measured", label: "Osmolalidad medida", unit: "mOsm/kg", type: "number"}
    - {key: "sodium", label: "Na⁺", unit: "mEq/L", type: "number"}
    - {key: "glucose", label: "Glucosa", unit: "mg/dL", type: "number"}
    - {key: "bun", label: "BUN", unit: "mg/dL", type: "number"}
    - {key: "ethanol", label: "Etanol", unit: "mg/dL", type: "number", optional: true, help: "incluya el nivel medido si lo hay"}
    notes:
    - "Brecha normal ≈ ≤ 10 mOsm/kg. Incluya un nivel de etanol medido para que el alcohol no se interprete como un osmol no medido."
    caveats:
    - "Una brecha osmolal normal/baja NO excluye la intoxicación por alcoholes tóxicos — combínela con la brecha aniónica, los niveles específicos y el contexto clínico."
