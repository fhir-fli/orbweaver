  - type: "prose"
    markdown: |
      Puntuación de Wells dicotomizada (dos niveles) para la probabilidad pretest de embolia
      pulmonar. Orienta la vía del dímero D frente a la angiografía pulmonar por TC.
  - type: "score"
    title: "Puntuación de Wells — TEP"
    source: "Wells et al., 2000; guía de TEP de la ESC 2019"
    items:
    - {key: "dvt_signs", label: "Signos / síntomas clínicos de TVP", type: "toggle", points: 3}
    - {key: "pe_likely", label: "El TEP es el diagnóstico n.º 1, o igual de probable", type: "toggle", points: 3}
    - {key: "tachy", label: "Frecuencia cardíaca > 100", type: "toggle", points: 1.5}
    - {key: "immobil", label: "Inmovilización ≥ 3 días o cirugía en las 4 semanas previas", type: "toggle", points: 1.5}
    - {key: "prior_vte", label: "TVP / TEP previos", type: "toggle", points: 1.5}
    - {key: "hemoptysis", label: "Hemoptisis", type: "toggle", points: 1}
    - {key: "malignancy", label: "Neoplasia maligna (tratamiento en los últimos 6 meses o paliativo)", type: "toggle", points: 1}
    bands:
    - {min: 0, max: 4, label: "TEP improbable", detail: "→ dímero D (ajustado por edad / YEARS); si es negativo, se excluye el TEP.", severity: "none"}
    - {min: 4, label: "TEP probable", detail: "→ angiografía pulmonar por TC.", severity: "warn"}
    notes:
    - "Alternativa de tres niveles: < 2 baja, 2–6 moderada, > 6 alta probabilidad."
    - "La escala de Ginebra revisada es una puntuación pretest alternativa totalmente objetiva."
    caveats:
    - "Combínela con una estrategia de dímero D; la regla PERC puede excluir el TEP sin pruebas en pacientes de probabilidad realmente baja."
