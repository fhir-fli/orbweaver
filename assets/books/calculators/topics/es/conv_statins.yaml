topic:
  id: "conv-statins"
  title: "Intensidad de estatinas"
  list_subtitle: "intensidad baja / moderada / alta"
  last_reviewed: "OpenEvidence review 2026-06-18 · 2018 ACC/AHA Table 3"
  tags: ["estatina", "conversión", "intensidad", "atorvastatina", "rosuvastatina", "ldl"]
  aliases:
  - "Equivalencia de estatinas"
  - "Intensidad sobre el LDL"
  category: "medical"
  blocks:
  - type: "prose"
    markdown: |
      Las estatinas vienen en concentraciones fijas, así que esto compara por **nivel de intensidad
      de reducción del LDL** y no por una dosis exacta. **Toque una concentración** para
      resaltar su nivel — los equivalentes entre los demás fármacos.
  - type: "conversion"
    mode: "tiers"
    title: "Intensidad de estatinas"
    tiers: ["Baja", "Moderada", "Alta"]
    tier_note: "Intensidad de reducción del C-LDL (ACC/AHA 2018)."
    source: "Guía de colesterol ACC/AHA 2018, tabla 3"
    agents:
    - name: "Atorvastatina"
      doses:
      - {dose: "10 mg", tier: "Moderada"}
      - {dose: "20 mg", tier: "Moderada"}
      - {dose: "40 mg", tier: "Alta"}
      - {dose: "80 mg", tier: "Alta"}
    - name: "Rosuvastatina"
      doses:
      - {dose: "5 mg", tier: "Moderada"}
      - {dose: "10 mg", tier: "Moderada"}
      - {dose: "20 mg", tier: "Alta"}
      - {dose: "40 mg", tier: "Alta"}
    - name: "Simvastatina"
      doses:
      - {dose: "10 mg", tier: "Baja"}
      - {dose: "20 mg", tier: "Moderada"}
      - {dose: "40 mg", tier: "Moderada"}
    - name: "Pravastatina"
      doses:
      - {dose: "10 mg", tier: "Baja"}
      - {dose: "20 mg", tier: "Baja"}
      - {dose: "40 mg", tier: "Moderada"}
      - {dose: "80 mg", tier: "Moderada"}
    - name: "Lovastatina"
      doses:
      - {dose: "20 mg", tier: "Baja"}
      - {dose: "40 mg", tier: "Moderada"}
      - {dose: "80 mg", tier: "Moderada"}
    - name: "Fluvastatina"
      doses:
      - {dose: "20 mg", tier: "Baja"}
      - {dose: "40 mg", tier: "Baja"}
      - {dose: "80 mg XL", tier: "Moderada"}
    - name: "Pitavastatina"
      doses:
      - {dose: "1 mg", tier: "Moderada"}
      - {dose: "2 mg", tier: "Moderada"}
      - {dose: "4 mg", tier: "Moderada"}
    caveats:
    - "Equivalencia de intensidad ≠ intercambiables — sopese las interacciones, el riesgo de miopatía y la dosificación renal/hepática."
    - "Se omite la simvastatina 80 mg — la FDA desaconseja su uso (riesgo de miopatía/rabdomiólisis)."
