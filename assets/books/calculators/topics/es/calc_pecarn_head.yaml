# translated-from-sha256: a7242099d9edff951d6350763e83a35bfdcdadbdf6053da6a9dab953abca63a6
topic:
  id: "calc-pecarn-head"
  title: "PECARN traumatismo craneal pediátrico"
  list_subtitle: "decisión de TC craneal, niños < 18 a"
  last_reviewed: "Evidence review 2026-09-07 · Kuppermann 2009"
  tags: ["pecarn", "traumatismo craneal", "trauma craneal", "tce", "tc", "pediátrico", "pediatría", "niños", "conmoción", "imagen", "traumatismo"]
  aliases:
  - "PECARN"
  - "Regla de TC craneal de PECARN"
  - "Regla pediátrica de TC craneal"
  - "Regla de traumatismo craneal pediátrico"
  category: "trauma"
  blocks:
  - type: "prose"
    markdown: |
      Identifica a los menores de 18 años con traumatismo craneal cerrado en las últimas 24 h
      y GCS 14–15 que tienen un riesgo muy bajo de lesión cerebral clínicamente importante
      y pueden evitar la TC. Use la sección correspondiente a la edad del niño. Toque los
      predictores presentes; un predictor de alto riesgo prevalece sobre los demás.
  - type: "score"
    title: "Menores de 2 años"
    show_total: false
    source: "Kuppermann et al., Lancet 2009 (VPN en la validación 100%, sensibilidad 100%)"
    items:
    - {key: "gcs_ams", label: "GCS 14, u otros signos de estado mental alterado", type: "toggle", points: 10, help: "alto riesgo · EMA: agitación, somnolencia, preguntas repetitivas, respuesta lenta a la comunicación verbal"}
    - {key: "palpable", label: "Fractura de cráneo palpable", type: "toggle", points: 10, help: "alto riesgo"}
    - {key: "hematoma", label: "Hematoma de cuero cabelludo occipital, parietal o temporal", type: "toggle", points: 1, help: "intermedio · el hematoma frontal no cuenta"}
    - {key: "loc", label: "Pérdida de conciencia ≥ 5 s", type: "toggle", points: 1, help: "intermedio"}
    - {key: "mechanism", label: "Mecanismo de lesión grave", type: "toggle", points: 1, help: "intermedio · colisión vehicular con expulsión, muerte de otro pasajero o vuelco; peatón o ciclista sin casco atropellado por un vehículo motorizado; caída > 0.9 m (3 ft); cabeza golpeada por un objeto de alto impacto"}
    - {key: "not_normal", label: "No se comporta con normalidad según los padres", type: "toggle", points: 1, help: "intermedio"}
    bands:
    - {min: 0, max: 0, label: "TC no recomendada", detail: "Riesgo de lesión cerebral clínicamente importante < 0.02%.", severity: "none"}
    - {min: 1, max: 4, label: "Observación frente a TC", detail: "Riesgo de lesión cerebral clínicamente importante ~0.9%. Decida según la experiencia del clínico, hallazgos aislados o múltiples, empeoramiento durante la observación, la edad del paciente y la preferencia de los padres.", severity: "warn"}
    - {min: 10, label: "TC recomendada", detail: "Riesgo de lesión cerebral clínicamente importante 4.4%.", severity: "alert"}
  - type: "score"
    title: "2 años o más"
    show_total: false
    source: "Kuppermann et al., Lancet 2009 (VPN en la validación 99.95%, sensibilidad 96.8%)"
    items:
    - {key: "gcs_ams", label: "GCS 14, u otros signos de estado mental alterado", type: "toggle", points: 10, help: "alto riesgo · EMA: agitación, somnolencia, preguntas repetitivas, respuesta lenta a la comunicación verbal"}
    - {key: "basilar", label: "Signos de fractura de la base del cráneo", type: "toggle", points: 10, help: "alto riesgo"}
    - {key: "loc", label: "Cualquier antecedente de pérdida de conciencia", type: "toggle", points: 1, help: "intermedio"}
    - {key: "vomiting", label: "Antecedente de vómitos", type: "toggle", points: 1, help: "intermedio"}
    - {key: "mechanism", label: "Mecanismo de lesión grave", type: "toggle", points: 1, help: "intermedio · colisión vehicular con expulsión, muerte de otro pasajero o vuelco; peatón o ciclista sin casco atropellado por un vehículo motorizado; caída > 1.5 m (5 ft); cabeza golpeada por un objeto de alto impacto"}
    - {key: "headache", label: "Cefalea intensa", type: "toggle", points: 1, help: "intermedio"}
    bands:
    - {min: 0, max: 0, label: "TC no recomendada", detail: "Riesgo de lesión cerebral clínicamente importante < 0.05%.", severity: "none"}
    - {min: 1, max: 4, label: "Observación frente a TC", detail: "Riesgo de lesión cerebral clínicamente importante ~0.9%. Decida según la experiencia del clínico, hallazgos aislados o múltiples, empeoramiento durante la observación, la edad del paciente y la preferencia de los padres.", severity: "warn"}
    - {min: 10, label: "TC recomendada", detail: "Riesgo de lesión cerebral clínicamente importante 4.3%.", severity: "alert"}
    caveats:
    - "Se aplica al traumatismo craneal cerrado en las primeras 24 h con GCS 14–15. Un GCS ≤ 13 queda fuera de la regla — haga imagen. La derivación excluyó mecanismos triviales sin signos ni síntomas más allá de abrasiones/laceraciones del cuero cabelludo, el traumatismo penetrante y los trastornos neurológicos previos."
    - "En adultos (≥ 16 a) use la regla canadiense de TC craneal."
