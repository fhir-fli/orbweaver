# translated-from-sha256: f0eedd5f3d28c7ed321efd5ec9138a3c43f9c6830d6ddbd7f1a6b4b036f9adcb
# ============================================================
# CURB-65 — community-acquired pneumonia severity.
# Evidence review 2026-07-19: ATS/IDSA 2019 PREFERS PSI/PORT for the
# admission decision but CURB-65 is simpler and UK-standard (NICE NG250).
# Points per Lim 2003 (Thorax). Max 5. Use with clinical judgment.
# ============================================================

topic:
  id: "calc-curb65"
  title: "CURB-65"
  list_subtitle: "gravedad de la neumonía"
  last_reviewed: "Evidence review 2026-07-19 · Lim 2003 · ATS/IDSA 2019"
  tags: ["curb-65", "curb65", "neumonía", "nac", "gravedad", "ingreso", "mortalidad"]
  aliases:
  - "CURB-65"
  - "CURB"
  - "Gravedad de la neumonía"
  category: "medical"

  blocks:

  - type: "prose"
    markdown: |
      Estima la mortalidad a 30 días en la neumonía adquirida en la comunidad para apoyar
      la decisión de ingreso. Toque cada criterio que corresponda.

  - type: "score"
    title: "CURB-65"
    source: "Lim et al., Thorax 2003"
    items:
    - {key: "confusion", label: "Confusión (desorientación nueva)", type: "toggle", points: 1}
    - {key: "urea", label: "Urea > 7 mmol/L (BUN > 19 mg/dL)", type: "toggle", points: 1}
    - {key: "rr", label: "Frecuencia respiratoria ≥ 30", type: "toggle", points: 1}
    - {key: "bp", label: "Presión arterial: PAS < 90 o PAD ≤ 60", type: "toggle", points: 1}
    - {key: "age65", label: "Edad ≥ 65", type: "toggle", points: 1}
    bands:
    - {min: 0, max: 1, label: "Gravedad baja — considere manejo ambulatorio", severity: "none"}
    - {min: 2, max: 2, label: "Moderada — considere ingreso / estancia corta", severity: "warn"}
    - {min: 3, label: "Gravedad alta — ingrese; valore la necesidad de UCI", severity: "alert"}
    notes:
    - "CRB-65 (sin la urea) es la versión de atención primaria cuando no hay análisis de sangre."
    caveats:
    - "Úsela junto con el juicio clínico; ATS/IDSA 2019 prefiere PSI/PORT para identificar a los pacientes de bajo riesgo en la decisión de ingreso."
