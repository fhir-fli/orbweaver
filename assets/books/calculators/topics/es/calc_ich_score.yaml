# translated-from-sha256: 0ca45def39ad5050d4673e4dff190a8237bdbeee2300bef4eed5288a460de50d
topic:
  id: "calc-ich-score"
  title: "Puntuación ICH"
  list_subtitle: "mortalidad de la hemorragia intracerebral"
  last_reviewed: "Evidence review 2026-07-19 · Hemphill 2001 · AHA/ASA 2022"
  tags: ["puntuación ich", "hemorragia intracerebral", "ictus", "hemorragia", "mortalidad", "neuro"]
  aliases:
  - "Puntuación ICH"
  - "Hemphill"
  - "Puntuación de hemorragia intracerebral"
  category: "medical"
  blocks:
  - type: "prose"
    markdown: |
      Estima la mortalidad a 30 días tras una hemorragia intracerebral espontánea.
      Es solo una ayuda pronóstica — lea la advertencia antes de que oriente cualquier decisión.
  - type: "score"
    title: "Puntuación ICH"
    source: "Hemphill et al., Stroke 2001"
    items:
    - key: "gcs"
      label: "GCS"
      type: "choice"
      default: "g13_15"
      options:
      - {value: "g13_15", label: "13–15", points: 0}
      - {value: "g5_12", label: "5–12", points: 1}
      - {value: "g3_4", label: "3–4", points: 2}
    - {key: "volume", label: "Volumen de la hemorragia ≥ 30 cm³", type: "toggle", points: 1}
    - {key: "ivh", label: "Hemorragia intraventricular", type: "toggle", points: 1}
    - {key: "infratentorial", label: "Origen infratentorial", type: "toggle", points: 1}
    - {key: "age80", label: "Edad ≥ 80", type: "toggle", points: 1}
    bands:
    - {min: 0, max: 0, label: "Puntuación 0", detail: "~0% de mortalidad a 30 días (cohorte de Hemphill).", severity: "none"}
    - {min: 1, max: 1, label: "Puntuación 1", detail: "~13% de mortalidad.", severity: "warn"}
    - {min: 2, max: 2, label: "Puntuación 2", detail: "~26% de mortalidad.", severity: "warn"}
    - {min: 3, max: 3, label: "Puntuación 3", detail: "~72% de mortalidad.", severity: "alert"}
    - {min: 4, label: "Puntuación 4–6", detail: "~97–100% de mortalidad.", severity: "alert"}
    caveats:
    - "Profecía autocumplida: la retirada precoz de los cuidados infla la mortalidad que predice. La AHA/ASA 2022 aconseja un manejo precoz intensivo y aplazar nuevas órdenes de no reanimar hasta ≥ el día 2 — NO use esta puntuación para justificar limitar los cuidados."
