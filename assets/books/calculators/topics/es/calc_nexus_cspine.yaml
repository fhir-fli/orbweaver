# translated-from-sha256: 3bcf9a82e9814c8a2f6100213b32531c7b33052ac55351652e3dae68573c268b
# ============================================================
# NEXUS Low-Risk Criteria — cervical-spine imaging after blunt trauma.
# Evidence review 2026-09-07 (abstracts read whole via PubMed):
#   Hoffman et al., NEJM 2000 (PMID 10891516): 34,069 blunt-trauma patients
#   imaged at 21 US centres; the instrument missed 8/818 cervical-spine
#   injuries (sensitivity 99.0%, NPV 99.8%, specificity 12.9%) and 2/578
#   clinically significant injuries (sensitivity 99.6%, NPV 99.9%). No age
#   bound — MDCalc's evidence page for the same cohort gives ages 1–101.
#   Viccellio et al., Pediatrics 2001 (PMID 11483830): the < 18 y subgroup,
#   3,065 children, 30 injuries, sensitivity 100% (95% CI 87.8–100); only 88
#   were < 2 y and none of them injured, so the authors advise caution < 2 y.
#   Stiell et al., NEJM 2003 (PMID 14695411): prospective head-to-head in
#   8,283 alert stable adults — the Canadian C-Spine Rule was more sensitive
#   (99.4% vs 90.7%) and more specific (45.1% vs 36.8%) than NEXUS.
#   OpenEvidence 2026-09-07 (verified against the abstracts): Ala et al., PLoS
#   One 2018 (PMID 30388133) 90% sensitivity for both, specificity NEXUS
#   54.7% vs CCR 44.2%; Lee et al., JAMA Netw Open 2025 (PMID 41632125), 22,430
#   children, sensitivity PECARN CSI 93.3%, NEXUS 85.7%, CCR 90.8%; guideline
#   split and the CT-unavailable pathway per the OE ruling (Gesu 2021, ACR
#   2019, Spinal Cord Society 2020).
# All five criteria must be met to forgo imaging; any one present → image.
# Criterion labels are the five named in the NEJM abstract; no verbatim
# sub-definitions are reproduced here because the full text was not read.
# ============================================================

topic:
  id: "calc-nexus-cspine"
  title: "Criterios NEXUS de columna cervical"
  list_subtitle: "imagen de columna cervical tras traumatismo cerrado"
  last_reviewed: "Evidence review 2026-09-07 · Hoffman 2000 · Viccellio 2001 · Stiell 2003"
  tags: ["nexus", "columna cervical", "columna cervical", "cuello", "traumatismo", "imagen", "radiografía", "tc", "regla de decisión", "liberación"]
  aliases:
  - "Criterios NEXUS"
  - "Criterios NEXUS de bajo riesgo"
  - "Liberación de columna cervical"
  - "Regla de columna cervical"
  category: "trauma"

  blocks:

  - type: "prose"
    markdown: |
      Identifica a los pacientes con traumatismo cerrado cuya columna cervical puede liberarse
      clínicamente. Los cinco deben estar ausentes para omitir la imagen — toque cualquiera que esté
      presente; uno solo indica imagen. Regla complementaria para
      adultos alertas y estables: la [Regla canadiense de columna cervical](topic:calc-canadian-cspine),
      que además incluye la conducta cuando no hay TC. Niños:
      [PECARN columna cervical](topic:calc-pecarn-cspine).

  - type: "score"
    title: "Criterios NEXUS de bajo riesgo"
    unit: "present"
    source: "Hoffman et al., NEJM 2000; Viccellio et al., Pediatrics 2001 (niños)"
    items:
    - {key: "tenderness", label: "Dolor a la palpación en la línea media cervical", type: "toggle", points: 1}
    - {key: "neuro", label: "Déficit neurológico focal", type: "toggle", points: 1}
    - {key: "alertness", label: "Alteración del estado de alerta", type: "toggle", points: 1, help: "no está alerta con normalidad"}
    - {key: "intoxication", label: "Intoxicación", type: "toggle", points: 1}
    - {key: "distracting", label: "Lesión dolorosa que distrae", type: "toggle", points: 1}
    bands:
    - {min: 0, max: 0, label: "Bajo riesgo — NEXUS no exige imagen de columna cervical", detail: "VPN 99.8% para cualquier lesión, 99.9% para lesión clínicamente significativa.", severity: "none"}
    - {min: 1, label: "Imagen indicada — NEXUS no puede liberar la columna", severity: "warn"}
    notes:
    - "Las guías difieren: EAST y AANS/CNS usan NEXUS; NICE usa la regla canadiense de columna cervical; el ACR acepta cualquiera. En la comparación directa de los autores (Stiell 2003) la regla canadiense fue más sensible (99.4% frente a 90.7%) y más específica (45.1% frente a 36.8%); una comparación independiente (Ala 2018, 200 pacientes) halló 90% de sensibilidad para ambas y NEXUS más específica (54.7% frente a 44.2%)."
    - "Regla negativa: retire el collarín, sin imagen. Regla positiva sin TC disponible: radiografías simples, mínimo 3 proyecciones, preferiblemente 5 — y unas radiografías normales no liberan por completo al paciente (vea la página de la regla canadiense de columna cervical)."
    caveats:
    - "Mayores de 65: la sensibilidad de NEXUS es menor en pacientes mayores; la regla canadiense envía a imagen a todo paciente ≥ 65. Considere la imagen por el mecanismo o la exploración aunque NEXUS sea negativa."
    - "Niños: NEXUS y la regla canadiense se derivaron en adultos y no están validadas por debajo de unos 8 años; el subgrupo pediátrico (Viccellio 2001) tenía solo 88 niños menores de 2, ninguno lesionado. En 22,430 niños (Lee 2025) la sensibilidad fue NEXUS 85.7%, regla canadiense 90.8%, regla cervical de PECARN 93.3% — use la regla cervical de PECARN en niños."
