    class: other
    subtitle: antidote
    doses:
    - label: ≤ 1 year
      regimen: 0.5–1 g/kg
    - label: 1–12 years
      regimen: 25–50 g
    - label: Route
      regimen: By mouth or NG tube — confirm the tube is in the stomach, not the airway. Do not induce vomiting
    notes: '⚠️ Not on the printed Annex 2 — added because the guidelines dose it, which is what Annex 2 says it covers: "the doses of the drugs mentioned in these guidelines that are suitable for infants and children". Dose taken from §1.6.1. No weight bands: like the annex''s own digoxin, chloramphenicol and aminophylline entries, calculate from body weight.'
  - id: adrenaline
