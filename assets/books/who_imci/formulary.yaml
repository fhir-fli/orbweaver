    class: other
    subtitle: antidote
    doses:
    - label: Paracetamol poisoning — two-bag, all weights down to 5 kg
      regimen: '300 mg/kg over 20 h: bag 1 200 mg/kg over 4 h, bag 2 100 mg/kg over 16 h. Scale the diluent to weight in a small child — 7 ml/kg then 14 ml/kg in 5% glucose'
    - label: Under 5 kg
      regimen: Take toxicology advice
    notes: '⚠️ Not on the printed Annex 2 — added because the guidelines dose it, which is what Annex 2 says it covers: "the doses of the drugs mentioned in these guidelines that are suitable for infants and children". Dose taken from §1.6.4. No weight bands: like the annex''s own digoxin, chloramphenicol and aminophylline entries, calculate from body weight.'
  - id: activated-charcoal
