# ============================================================================
# WHO IMCI Annex 2 — Drug formulary (Pocket Book 2nd ed 2013, pp.353–373).
# A reusable "formulary" collection: records + facets (A–Z / class / indication).
# Rendered by the drug-index view; each record's doses reuse the weight-band table.
# Every dose verified against the source page renders (RULE #0).
# Cross-book dose pass 2026-08-28: the spectinomycin note still carried the old
#   ceftriaxone ophthalmia cap of 125 mg, contradicting the 250 mg applied to
#   S3.12.2 and S3.14 from OE flag 3-1. Corrected. It was missed the first time
#   because that grep covered topics/ only and the formulary is a separate file.
# Cross-book durations pass 2026-08-28: the PCP co-trimoxazole dose in this
#   formulary entry was still the withdrawn 8 mg/kg TDS (= 24 mg/kg/day),
#   three days after OE flag 4-1 capped it at 15-20 mg/kg/day and the PCP and
#   severe-pneumonia TOPICS were corrected. The formulary was missed again.
# 2026-08-29 band audit: ARTEMETHER-LUMEFANTRINE bands corrected against the
#   print (p.361 of the source PDF). The print doses AL by its own bands -
#   5-<15 kg one tablet, 15-24 kg two, ABOVE 25 kg THREE. The five columns in
#   this formulary are 3-<6, 6-<10, 10-<15, 15-<20, 20-29, which do not line
#   up, and the table read "1,1,1,2,2". That UNDERDOSED a 25-29 kg child, who
#   should get three tablets, and offered AL below 5 kg where the print does
#   not. Found by tool/who_formulary_band_audit.py once its millilitre parsing
#   was fixed - it had been multiplying millilitre bands by the vial total and
#   producing 21 false flags that hid this one.
# ============================================================================
