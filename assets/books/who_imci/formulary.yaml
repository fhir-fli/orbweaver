      regimen: 0.2–0.5 mg/kg/day
    notes: '⚠️ Not on the printed Annex 2 — added because the guidelines dose it, which is what Annex 2 says it covers: "the doses of the drugs mentioned in these guidelines that are suitable for infants and children". Dose taken from §10.4. No weight bands: like the annex''s own digoxin, chloramphenicol and aminophylline entries, calculate from body weight.'
  - id: amoxicillin
    name: Amoxicillin
    class: antibiotic
    subtitle: penicillin
    indications:
    - pneumonia
    page: 356
    doses:
    - label: Pneumonia (standard)
      regimen: 'Oral: 40 mg/kg twice a day'
      form: 250 mg tablet (chewable or dispersible)
      bands:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
    - label: Pneumonia — syrup
      regimen: 'Oral: 40 mg/kg twice a day'
      form: Syrup (250 mg/5 ml)
      bands:
      - 5 ml
      - 10 ml
      - 15 ml
      - 20 ml
      - —
    notes: 40 mg/kg per dose twice a day (80 mg/kg/day) is the WHO standard for pneumonia / chest-indrawing pneumonia (2014 IMCI revision). Some non-pneumonia infections use the lower 25 mg/kg twice a day (halve the amounts above).
  - id: amoxicillin-clavulanate
    name: Amoxicillin–clavulanate (co-amoxiclav)
    class: antibiotic
    subtitle: penicillin with beta-lactamase inhibitor
    indications:
    - urinary tract infection
    - chronic cough
    doses:
    - label: Febrile urinary tract infection / pyelonephritis — first choice
      regimen: 'Oral: 40–50 mg/kg/day OF THE AMOXICILLIN COMPONENT, every 8 hours (3 doses), for 7 days. Dose and prescribe by the amoxicillin component, never by the combined figure'
    - label: Ceiling once the child reaches 40 kg
      regimen: 'Do not exceed the adult dose: 1750 mg/day of the amoxicillin component'
    notes: '⚠️ Not on the printed Annex 2 — added because the guidelines dose it, which is what Annex 2 says it covers: "the doses of the drugs mentioned in these guidelines that are suitable for infants and children". §6.8 names it FIRST CHOICE for a urinary tract infection with fever, systemic upset, pyelonephritis, or in an infant; it is also named for protracted bacterial bronchitis in §4.7. **Use a high-ratio preparation (7:1 or 14:1 amoxicillin:clavulanate)** so the clavulanate stays at roughly 10 mg/kg/day or below — that is what limits the diarrhoea, and it is why the dose is written by the amoxicillin component. **Every 8 hours, not twice daily**, for the febrile/pyelonephritis indication. A 5-day course is proven noninferior to 10 days in a well-appearing child of 3 months to 5 years, so 5–7 days is defensible; 7 is the printed default, and longer only for a complicated case or a slow responder. Base the choice on local E. coli susceptibility where known. Dose, schedule, ceiling and duration confirmed by OpenEvidence 2026-08-31 (Montini, Pediatrics 2024, 50 mg/kg/day of the amoxicillin component in 3 divided doses; FDA label 25–45 mg/kg/day, upper end for the more severe indication).'
  - id: amphotericin-b
    name: Amphotericin B
    class: antibiotic
    subtitle: antifungal
    indications:
    - oesophageal candidiasis
    page: 356
    doses:
    - label: Oesophageal candidiasis
      regimen: 0.25 mg/kg/day increasing to 1 mg/kg/day as tolerated, IV infusion over 6 h/day for 10–14 days
      form: 50 mg vial
      bands:
      - —
      - 2–8 mg
      - 3–12 mg
      - 4.5–18 mg
      - 6–24 mg
  - id: ampicillin
    name: Ampicillin
    class: antibiotic
    subtitle: penicillin
    indications:
    - sepsis
    - severe pneumonia
    - meningitis
    page: 356
    doses:
    - label: Standard
      regimen: 'IM/IV: 50 mg/kg every 6 h'
      form: Vial of 500 mg + 2.1 ml sterile water → 500 mg/2.5 ml
      bands:
      - 1 ml
      - 2 ml
      - 3 ml
      - 5 ml
      - 6 ml
    notes: 'Oral doses are for mild disease and must be 2–4× higher if a course of injectable ampicillin is required for severe disease. Neonatal/premature dosing: see p.69.'
  - id: artemether
    name: Artemether
    class: antimalarial
    indications:
    - severe malaria
    page: 357
    doses:
    - label: Loading (40 mg/ml)
      regimen: 'IM: 3.2 mg/kg (loading dose)'
      form: 40 mg/1-ml ampoule
      bands:
      - 0.4 ml
      - 0.8 ml
      - 1.2 ml
      - 1.6 ml
      - 2.4 ml
    - label: Loading (80 mg/ml)
      regimen: 'IM: 3.2 mg/kg (loading dose)'
      form: 80 mg/1-ml ampoule
      bands:
      - 0.2 ml
      - 0.4 ml
      - 0.6 ml
      - 0.8 ml
      - 1.2 ml
    - label: Maintenance (40 mg/ml)
      regimen: 'IM: 1.6 mg/kg daily'
      form: 40 mg/1-ml ampoule
      bands:
      - 0.2 ml
      - 0.4 ml
      - 0.6 ml
      - 0.8 ml
      - 1.2 ml
    - label: Maintenance (80 mg/ml)
      regimen: 'IM: 1.6 mg/kg daily'
      form: 80 mg/1-ml ampoule
      bands:
      - 0.1 ml
      - 0.2 ml
      - 0.3 ml
      - 0.4 ml
      - 0.6 ml
    notes: Second-line alternative to IV/IM artesunate for severe malaria (artesunate is preferred; see Chapter 6). Give the maintenance dose daily for a minimum of 24 h until the patient can take oral artemisinin-based combination therapy (ACT).
  - id: artemether-lumefantrine
    name: Artemether/lumefantrine
    class: antimalarial
    indications:
    - malaria
    page: 357
    doses:
    - label: Standard
      regimen: 'Oral: 2 mg/kg artemether + 12 mg/kg lumefantrine twice per day, for 3 days'
      form: 'Tablet: 20 mg artemether / 120 mg lumefantrine'
      bands:
      - 1 (only if ≥ 5 kg)
      - '1'
      - '1'
      - '2'
      - 2 · 3 if > 25 kg
    notes: AL is dosed by its OWN weight bands — 5–<15 kg one tablet, 15–24 kg two, above 25 kg THREE — which do not line up with the five columns here. Below 5 kg AL is not recommended; above 25 kg give three tablets, not two.
  - id: artesunate
    name: Artesunate
    class: antimalarial
    indications:
    - severe malaria
    page: 357
    doses:
    - label: Standard
      regimen: 'IV or IM at 0, 12 and 24 h, then once daily until able to take orally: 3 mg/kg per dose for children under 20 kg; 2.4 mg/kg for 20 kg and over'
      form: 60 mg vial reconstituted to 15 mg/ml (dissolve in 0.6 ml 5% bicarbonate, dilute with 3.4 ml saline or 5% glucose)
      bands:
      - 0.9 ml
      - 1.6 ml
      - 2.5 ml
      - 3.5 ml
      - 3.9 ml
    notes: Artesunate is the first-line treatment for severe malaria (all species); quinine and IM artemether are alternatives only when it is unavailable. Volumes assume 15 mg/ml and the band midpoint — dose by actual body weight where possible. Prepare just before use; when the child can swallow, complete a full 3-day oral ACT course.
  - id: artesunate-amodiaquine
    name: Artesunate–amodiaquine (AS-AQ)
    class: antimalarial
    indications:
    - malaria
    page: 357
    band_label: Dose by body weight (kg) — once daily × 3 days
    band_columns:
    - 4.5–<9
    - 9–<18
    - 18–<36
    - ≥36
    regimen: 'Oral once daily for 3 days: artesunate 4 mg/kg + amodiaquine 10 mg/kg'
    doses:
    - label: 'Infant tablet: AS 25 / AQ 67.5 mg'
      bands:
      - '1'
      - —
      - —
      - —
    - label: 'Child tablet: AS 50 / AQ 135 mg'
      bands:
      - —
      - '1'
      - —
      - —
    - label: 'Adult tablet: AS 100 / AQ 270 mg'
      bands:
      - —
      - —
      - '1'
      - '2'
    notes: A WHO first-line ACT for P. falciparum in Africa; less efficacious than DHA–piperaquine in the Asia–Pacific region.
  - id: artesunate-mefloquine
    name: Artesunate–mefloquine
    class: antimalarial
    indications:
    - malaria
    page: 357
    doses:
    - label: Paediatric tablet
      regimen: 'Oral: 4 mg/kg artesunate + 8.3 mg/kg mefloquine once daily × 3 days'
      form: 'Tablet: 25 mg artesunate / 55 mg mefloquine'
      bands:
      - '1'
      - '1'
      - '2'
      - '2'
      - —
    - label: Adult tablet
      regimen: 'Oral: 4 mg/kg artesunate + 8.3 mg/kg mefloquine once daily × 3 days'
      form: 'Tablet: 100 mg artesunate / 220 mg mefloquine'
      bands:
      - —
      - —
      - —
      - —
      - '1'
    notes: 'Once daily × 3 days (target 4 mg/kg/day artesunate; range 2–10). Use WHOLE paediatric (25/55) tablets — do NOT quarter/halve them. ≥30 kg: 2 adult (100/220) tablets. Not recommended <5 months / <5 kg.'
  - id: aspirin
    name: Aspirin
    class: analgesia
    indications: []
    page: 357
    doses:
    - label: Standard
      regimen: 'Oral: 10–20 mg/kg every 4–6 h'
      form: 300 mg tablet
      bands:
      - —
      - ¼
      - ½
      - ¾
      - '1'
    notes: Not recommended for fever or pain in children — risk of Reye syndrome; use paracetamol or ibuprofen instead. Aspirin is retained only for specific indications such as acute rheumatic fever and Kawasaki disease, which use higher anti-inflammatory doses than the antipyretic dose shown here (see Chapter 6, rheumatic fever).
  - id: atropine
    name: Atropine
    class: other
    subtitle: antidote
    doses:
    - label: Organophosphate poisoning
      regimen: '0.02 mg/kg (20 µg/kg) IV — no maximum in severe poisoning — DOUBLED every 5 min until atropinisation: clear chest, HR > 80, SBP > 80'
    notes: '⚠️ Not on the printed Annex 2 — added because the guidelines dose it, which is what Annex 2 says it covers: "the doses of the drugs mentioned in these guidelines that are suitable for infants and children". Dose taken from §1.6.4. No weight bands: like the annex''s own digoxin, chloramphenicol and aminophylline entries, calculate from body weight.'
  - id: azithromycin
    name: Azithromycin
    class: antibiotic
    doses:
    - label: Pertussis
      regimen: 10 mg/kg (max 500 mg) on day 1, then 5 mg/kg (max 250 mg) daily on days 2–5; or 10 mg/kg daily for 3 days
    - label: Cholera
      regimen: Single 20 mg/kg dose, max 1 g
    - label: Dysentery (Shigella)
      regimen: 12 mg/kg on day 1, then 6 mg/kg on days 2–5
    - label: Typhoid
      regimen: 10–20 mg/kg/day for 5–7 days
    notes: '⚠️ Not on the printed Annex 2 — added because the guidelines dose it, which is what Annex 2 says it covers: "the doses of the drugs mentioned in these guidelines that are suitable for infants and children". Dose taken from §4.7.1, §5.2.1, §5.4 and §6.6. No weight bands: like the annex''s own digoxin, chloramphenicol and aminophylline entries, calculate from body weight.'
  - id: benzathine-benzylpenicillin
    name: Benzathine benzylpenicillin
    class: antibiotic
    subtitle: penicillin (long-acting)
    indications:
    - rheumatic fever
    - syphilis
    page: 367
    band_label: Rheumatic-fever prophylaxis — IM every 3–4 weeks
    band_columns:
    - under 30 kg
    - 30 kg and over
    regimen: Long-acting depot — fixed weight-category doses, NOT a daily dose. Reconstituted vial 1 200 000 U in 4 ml = 300 000 U/ml (600 000 U = 2 ml; 1 200 000 U = 4 ml).
    doses:
    - label: Benzathine benzylpenicillin (1 200 000 U vial + 4 ml)
      bands:
      - 600 000 U (2 ml)
      - 1 200 000 U (4 ml)
    notes: 'Rheumatic-fever secondary prophylaxis: the dose above every 3–4 weeks (every 3 weeks in high-risk/endemic settings), continued for years. Streptococcal pharyngitis (primary prevention): a single dose — 600 000 U under 27 kg, 1 200 000 U at 27 kg and over. Congenital syphilis: use IV aqueous benzylpenicillin or IM procaine penicillin for symptomatic infants; benzathine 50 000 U/kg as a single dose only for an asymptomatic infant whose mother was adequately treated.'
  - id: benzylpenicillin
    name: Benzylpenicillin (penicillin G)
    class: antibiotic
    subtitle: penicillin
