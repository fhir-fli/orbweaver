# ============================================================
# WHO IMCI §8.2.1 — Antiretroviral drugs (Tables 24 & 25). Pocket Book
# 2nd ed (2013), pp.233–234.
# 🛑 OpenEvidence-reviewed 2026-07 — MAJOR REVISION (paradigm shift):
# INSTIs (dolutegravir) are now the PREFERRED anchor class for nearly all
# children (ODYSSEY, NEJM 2021). Table 24 rewritten to add DTG/BIC/RAL +
# TAF + DRV/r and demote EFV/NVP/LPV/r; STAVUDINE (d4T) REMOVED (WHO
# phase-out for toxicity). Table 25 replaced with DTG-based first-line
# regimens by weight band. The 2013 "LPV/r-based under 3 years" framing is
# obsolete. Refs: DHHS/OARAC Pediatric ARV Guidelines 2024; ODYSSEY 2021;
# IMPAACT 2019 (dispersible DTG/ABC/3TC).
# ✅ OpenEvidence-reviewed again 2026-08-24: the DTG-based rewrite was
# confirmed current (DTG + 2 NRTIs preferred ≥ 30 d / ≥ 3 kg; Triumeq PD the
# first dispersible DTG single-tablet regimen; ODYSSEY and IMPAACT 2019 the
# supporting trials). ONE GAP FOUND AND FIXED: **HLA-B*5701 screening before
# any abacavir-containing regimen** was absent from the whole chapter, while
# abacavir is this page's own preferred backbone. §8.2.3 warned only to STOP
# if hypersensitivity occurs — reacting to the reaction rather than
# preventing it. Screening added here and cross-referenced in §8.2.3.
# ✅ ANSWERED AND APPLIED 2026-08-28. OE: print "screen WHERE AVAILABLE", do
# not mandate it. Where the test cannot be done, START abacavir with
# structured counselling and 6-week monitoring rather than withholding it —
# the explicit position of DHHS (CIII) and IDSA/HIVMA, and what WHO's
# public-health ART approach has always allowed. Allele is rare across most
# of sub-Saharan Africa but NOT uniform (Maasai >6%), so ancestry is not a
# substitute for the test. Added: the 6-week HSR warning set and stop rule,
# the never-rechallenge absolute, the higher bar for the Triumeq PD FDC with
# DTG + ZDV + 3TC as the alternative, and hepatitis B screening before any
# 3TC-containing regimen.
# ============================================================

