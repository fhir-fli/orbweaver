topic:
  id: "who-imci-8-2-1-arv-drugs"
  title: "Antiretroviral Drugs"
  list_subtitle: "8.2.1 · 3 classes · first-line regimens"
  last_reviewed: "WHO Pocket Book 2nd ed (2013)"
  tags: ["HIV", "ART", "NRTI", "NNRTI", "protease inhibitor", "pediatric"]
  aliases:
    - "ARV drugs"
    - "First-line regimen"
  category: "medical"

  page_number: 233

  blocks:

    - type: "prose"
      title: "Three drug classes"
      highlight: true
      markdown: |
        First-line regimens use **two NRTIs plus one NNRTI or a protease
        inhibitor**:
        - **NRTI** — nucleoside reverse transcriptase inhibitors
        - **NNRTI** — non-nucleoside reverse transcriptase inhibitors
        - **PI** — protease inhibitors

    - type: "table"
      title: "Table 24 · Classes recommended for children"
      columns: ["Class", "Drug", "Abbrev"]
      column_flex: [3, 4, 3]
      rows:
        - cells: ["NRTI", "Zidovudine", "ZDV (AZT)"]
        - cells: ["NRTI", "Lamivudine", "3TC"]
        - cells: ["NRTI", "Abacavir", "ABC"]
        - cells: ["NRTI", "Emtricitabine", "FTC"]
        - cells: ["NRTI", "Tenofovir", "TDF"]
        - cells: ["NNRTI", "Nevirapine", "NVP"]
        - cells: ["NNRTI", "Efavirenz", "EFV"]
        - cells: ["PI", "Lopinavir/ritonavir", "LPV/RTV"]
        - cells: ["PI", "Atazanavir", "ATZ"]

    - type: "prose"
      title: "Under 3 years — LPV/r-based"
      callout: true
      markdown: |
        All infants and children **< 3 years** should start on **LPV/r + two
        NRTIs**, regardless of exposure to nevirapine (to prevent mother-to-child
        transmission). Where viral load monitoring is available, consider
        substituting an NNRTI for LPV/r once virological suppression is sustained.

    - type: "prose"
      title: "3 years and over — EFV preferred NNRTI"
      markdown: |
        For children **≥ 3 years**, **efavirenz (EFV)** is the preferred NNRTI —
        particularly for once-daily therapy — though NVP is an alternative for
        those on twice-daily dosing. EFV is also the NNRTI of choice in children
        on **rifampicin**; if TB treatment must start first, complete it before
        starting NVP.

    - type: "table"
      title: "Table 25 · First-line regimens"
      columns: ["< 3 years", "≥ 3 years to 12 years"]
      column_flex: [1, 1]
      rows:
        - cells:
            - "ABC or ZDV\n+ 3TC\n+ LPV/r"
            - "ABC or ZDV\n+ 3TC\n+ EFV or NVP"
        - cells:
            - "ABC or ZDV\n+ 3TC\n+ NVP"
            - "TDF\n+ FTC or 3TC\n+ EFV or NVP"

    - type: "prose"
      title: "Notes on Table 25"
      markdown: |
        - **ABC** is the preferred NRTI for children **< 36 months**, regardless
          of nevirapine exposure or maternal PMTCT treatment.
        - **ABC + 3TC + EFV** is the **preferred** regimen for children **≥ 3 years
          up to 12 years**.
        - For drug dosages and regimens see **Annex 2, pp.370–3**.

    - type: "prose"
      title: "Dosing by weight band"
      markdown: |
        Children metabolize PI and NNRTI drugs **faster** than adults and need
        higher equivalent doses. **Doses must be increased as the child grows**,
        or there is a risk of under-dosage and resistance. Dosing is by **body
        surface area or weight**, or more conveniently by **weight bands**.
