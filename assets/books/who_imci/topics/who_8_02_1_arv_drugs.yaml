    - type: "prose"
      title: "Stavudine (d4T) — removed"
      callout: true
      palette:
        alert: "0xFFD32F2F"
        alert_fill: "0xFFFDECEA"
        alert_text: "0xFFB71C1C"
      markdown: |
        **Do NOT use stavudine (d4T).** WHO recommends complete **phase-out** for
        unacceptable mitochondrial toxicity (lipodystrophy, lactic acidosis,
        peripheral neuropathy) — toxicity was **50.6 per 1000 patient-years** vs
        **1.6** for abacavir. The product has been withdrawn.

    - type: "table"
      title: "Table 25 · First-line regimens by weight/age (updated)"
      columns: ["Group", "Preferred regimen"]
      column_flex: [4, 6]
      rows:
        - cells: ["Neonate < 4 wk", "RAL- or NVP-based (DTG data limited < 4 wk)"]
        - cells: ["≥ 4 wk & ≥ 3 kg", "DTG + ABC + 3TC (alt: DTG + ZDV + 3TC)"]
        - cells: ["≥ 6 kg (~3 mo)", "Dispersible FDC DTG/ABC/3TC (Triumeq PD)"]
        - cells: ["≥ 2 yr & ≥ 14 kg", "DTG + ABC + 3TC, or BIC/FTC/TAF (Biktarvy)"]
        - cells: ["≥ 25 kg", "DTG/ABC/3TC (Triumeq) or BIC/FTC/TAF single tablet"]

    - type: "prose"
      title: "Notes on the regimens"
      markdown: |
        - **Screen HLA-B*5701 where available** before starting an
          abacavir-containing regimen. **If positive, do not use abacavir** — use a
          ZDV- or TAF-based backbone instead.
        - **Where the test is not available, start abacavir with structured
          counselling and close monitoring for the first 6 weeks. Do not withhold
          it for lack of the test.** The allele is rare across most of sub-Saharan
          Africa — essentially absent in West African populations, ~1.5–3.3% in
          most East and Southern African groups — so the number needed to test to
          prevent one reaction is high and pre-emptive testing is often not
          cost-effective here. ⚠️ **It is not uniform**: some East African groups
          reach European frequencies or higher (Maasai of Kenya > 6%, up to ~13%),
          so **ancestry is not a substitute for the test where the test can be
          done.** The reaction is also less common clinically in Black African
          patients (2–3% vs 5–8% in White patients before screening existed).
        - After a suspected hypersensitivity reaction, **never rechallenge** —
          re-exposure can cause life-threatening hypotension and death within
          hours, regardless of HLA status.
        - **Screen for hepatitis B before starting any 3TC-containing regimen** —
          a severe HBV flare can follow if 3TC is later stopped.
        - **DTG + ABC + 3TC** is the preferred regimen across ages; the dispersible
          fixed-dose combination (**Triumeq PD**) makes it feasible from **≥ 6 kg /
          ~3 months** in resource-limited settings.
        - The 2013 **"LPV/r-based for children < 3 years"** approach is **obsolete**
          — DTG has replaced LPV/r as the preferred anchor.
        - For exact weight-band dosages see **Annex 2 / national paediatric ARV
          guidelines**.

    - type: "prose"
      title: "⚠ Starting abacavir untested — what to warn about and when to stop"
      callout: true
      markdown: |
        **Window:** hypersensitivity usually appears **within the first 6 weeks**,
        and can follow a single dose.

        **Warn the carer to return for** a **rash**, or symptoms in **two or more**
        of these groups:
        - **fever**
        - **constitutional** — malaise, fatigue, aching
        - **gastrointestinal** — nausea, vomiting, diarrhoea, abdominal pain
        - **respiratory** — breathlessness, cough, sore throat

        **Threshold to stop:** if hypersensitivity is suspected, **stop abacavir
        immediately even when another diagnosis is possible** — pneumonia,
        gastroenteritis, another drug reaction. Err on the side of stopping.

        **Absolute rule: never restart abacavir, or any abacavir-containing
        product, after a suspected reaction** — whatever the HLA result.

    - type: "prose"
      title: "The dispersible FDC (Triumeq PD) — a higher bar"
      markdown: |
        The principle is the same, but the practical bar for using the
        single-tablet FDC untested is **higher**, because a positive result cannot
        be acted on after the fact within a fixed-dose combination. Paediatric
        guidance is firmer: a **negative HLA-B*5701 before starting Triumeq PD**,
        and where the result is unknown or positive — or the FDC is unavailable —
        the alternative is **DTG + ZDV + 3TC**.
        - **Test available →** screen. Negative, use Triumeq PD; positive, use a
          ZDV- or TAF-based backbone.
        - **Test unavailable →** weigh the adherence gain of the once-daily
          dispersible FDC against not being able to exclude the allele. **Where
          you can reliably review the child through the first 6 weeks**, starting
          the FDC with counselling is consistent with the counsel-and-monitor
          allowance. **Where early follow-up is uncertain, prefer DTG + ZDV + 3TC**
          and remove the risk.

    - type: "prose"
      title: "Dosing by weight band"
      markdown: |
        Children metabolize many ARVs **faster** than adults and need higher
        equivalent doses. **Doses must be increased as the child grows**, or there
        is a risk of under-dosage and resistance. Dosing is by **weight band**
        (most convenient), body surface area, or weight.
