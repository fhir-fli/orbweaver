  blocks:

    - type: "prose"
      title: "Comfort matters"
      highlight: true
      markdown: |
        An immunologically compromised child often has **considerable
        discomfort** — good palliative care is essential. Take all decisions
        **with the parents/caretaker**, and communicate them clearly to all staff
        (including night staff). Consider palliative care **at home** as an
        alternative to hospital. Treating distressing conditions (oesophageal
        candidiasis, convulsions) can significantly improve remaining quality of
        life.

    - type: "prose"
      title: "When to give terminal care"
      markdown: |
        Give end-of-life (terminal) care if:
        - the child has **progressively worsening illness**, and
        - **everything possible** has been done to treat the presenting illness.

        Support the family to cope with the impending death, and support parents in
        giving palliative care **at home** so the child is not kept in hospital
        unnecessarily.

