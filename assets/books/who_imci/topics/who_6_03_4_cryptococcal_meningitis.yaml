  blocks:

    - type: "prose"
      title: "When to suspect it"
      highlight: true
      markdown: |
        Consider cryptococcal meningitis in **older children known or suspected
        to be HIV-positive with immunosuppression** who present with **altered
        mental status**.

    - type: "prose"
      title: "Diagnosis"
      markdown: |
        - **Lumbar puncture** — the opening pressure may be **elevated**, but CSF
          cell count, glucose and protein can be **virtually normal**.
        - Analyse CSF with an **India-ink preparation**, or (if available) a
          **rapid CSF cryptococcal antigen** test — latex agglutination or
          lateral-flow assay.

    - type: "prose"
      title: "Treatment"
      markdown: |
        A combination of **amphotericin and fluconazole**. Manage raised
        intracranial pressure and provide the same supportive care (airway,
        convulsions, hypoglycaemia, fluids) as for
        [bacterial meningitis](topic:who-imci-6-3-1-bacterial-meningitis).
