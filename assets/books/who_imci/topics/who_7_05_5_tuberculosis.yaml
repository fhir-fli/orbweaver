    - type: "prose"
      title: "If TB is strongly suspected"
      highlight: true
      markdown: |
        - Perform a **Mantoux test** (**false-negative results are frequent** in
          SAM).
        - Take a **chest X-ray** if possible.

        If these are positive, or TB is strongly suspected, **treat according to
        national TB guidelines** ([§4.7.2](topic:who-imci-4-7-2-tuberculosis)).
