  title: "Preoperative Care"
  list_subtitle: "9.1.1 · consent · fitness · fasting · antibiotics"
  last_reviewed: "WHO Pocket Book 2nd ed (2013)"
  tags: ["surgery", "preoperative", "fasting", "antibiotics", "pediatric"]
  aliases:
