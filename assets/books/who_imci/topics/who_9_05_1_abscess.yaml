  blocks:

    - type: "prose"
      title: "Diagnosis"
      highlight: true
      markdown: |
        An abscess is a collection of pus almost anywhere in the body.
        - **Fever, swelling, tenderness and a fluctuant mass.**
        - Determine the cause (injection, foreign body, underlying bone infection).
          **Injection abscesses** usually develop **2–3 weeks** after an injection.

    - type: "prose"
      title: "Treatment"
      callout: true
      markdown: |
        - **Incision and drainage** (large abscesses may need general anaesthesia).
          Send aspirate for microscopy and culture (including **TB**) if available.
        - **Antibiotics: cloxacillin 25–50 mg/kg 4× daily for 5 days** or until
          surrounding cellulitis resolves.
        - If **bowel flora** suspected (e.g. perirectal abscess): **ampicillin
          (25–50 mg/kg IM/IV 4× daily) + gentamicin (7.5 mg/kg IM/IV once daily) +
          metronidazole (10 mg/kg 3× daily)**.
