  blocks:

    - type: "prose"
      title: "What it prevents"
      highlight: true
      markdown: |
        Co-trimoxazole prevents **PCP** and reduces morbidity and mortality in
        HIV-infected and exposed children. It also protects against **common
        bacterial infections, toxoplasmosis and malaria**.

    - type: "prose"
      title: "Who should receive it"
      markdown: |
        - **All infants born to HIV-positive mothers** — start **4–6 weeks after
          birth** (or first encounter), and continue until HIV is definitively
          excluded **and** the mother is no longer breastfeeding.
        - **All HIV-infected infants, children and adolescents** —
          **irrespective of clinical stage, CD4 and ART.** Starting is not
          gated on a CD4 count or percentage at any age. Continue on ART.
        - The older stage- and CD4-based initiation criteria were dropped by
          WHO in 2014, in line with the adult recommendation.

    - type: "prose"
      title: "When to discontinue"
      callout: true
      markdown: |
        🛑 **Where malaria or severe bacterial infection is common, the answer is
        that you do not.** WHO recommends co-trimoxazole be **continued
        long-term** in such settings and **not stopped on immune
        reconstitution**. A malaria-endemic district hospital meets that
        criterion, so **indefinite continuation is the default here** and the
        CD4 rules below do not apply.

        - **HIV-exposed (uninfected):** stop once HIV is confidently excluded
          **and** breastfeeding has ended. This is the one routine stop.
        - **Never discontinue in an infant**, whatever the CD4.
        - **Do NOT discontinue** if the child is **not on ART**.
        - **History of PCP:** continue.

        **Only where malaria and severe bacterial infection are NOT common** may
        a CD4-based stop be considered, after **≥ 6 months on ART** with
        sustained recovery for **> 3 months**: age **≥ 6 years**, CD4
        **≥ 200/mm³**, or **CD4 ≥ 14%** where a count is unavailable.
        **Reinstitute** if CD4 falls below it.

        ℹ️ **These are stopping figures, not starting ones.** Prophylaxis is
        never gated on CD4 to start — see the section above. The **15%** that
        appears elsewhere is the older paediatric immune-category cutoff, which
        also governs live-vaccine decisions; **14%** is the figure paired with
        the count of 200. Different frameworks, not a contradiction.

    - type: "prose"
      title: "Prolonged prophylaxis in high-burden settings"
      markdown: |
        The **ARROW** trial (Uganda and Zimbabwe) randomised children who had
        been on ART for **more than 2 years with good CD4 recovery** — median
        CD4 **720** in those over 5. Continuing co-trimoxazole still produced
        **sustained reductions in hospitalisation and in malaria**, with benefit
        in **both malaria-endemic and non-endemic areas** and **no waning over
        time**. Its authors concluded that the WHO discontinuation criteria
        **need to be reconsidered**.

        This is the evidence behind the rule above: in a high-burden setting,
        **keep it going**. A good CD4 count is not a reason to stop.

    - type: "prose"
      title: "Excluding HIV in an exposed child"
      markdown: |
        Stop only after HIV is confidently excluded: non-breastfed with a negative
        virological test; breastfed < 18 months with a negative virological test
        6 weeks after cessation; breastfed > 18 months with a negative serological
        test 6 weeks after cessation.

    - type: "table"
      title: "Doses — by fixed age band, once daily"
      columns: ["Age", "Daily dose", "Suspension 200/40 per 5 ml", "Paediatric tab 100/20", "Single-strength 400/80", "Double-strength 800/160"]
      column_flex: [3, 3, 3, 2, 2, 2]
      rows:
        - cells: ["< 6 months", "100 mg SMX / 20 mg TMP", "2.5 ml", "1 tablet", "¼ tablet", "—"]
        - cells: ["6 months – 5 years", "200 mg SMX / 40 mg TMP", "5 ml", "2 tablets", "½ tablet", "—"]
        - cells: ["6 – 14 years", "400 mg SMX / 80 mg TMP", "10 ml", "4 tablets", "1 tablet", "½ tablet"]
        - cells: ["≥ 15 years", "800 mg SMX / 160 mg TMP", "—", "—", "2 tablets", "1 tablet"]

    - type: "prose"
      title: "Reading the table"
      markdown: |
        - **The step to a double-strength tablet is at 15 years, not at 5.** A
          child of 6–14 gets **one single-strength tablet, 80 mg trimethoprim**.
          The older wording "one adult tablet" did not say which strength, and
          that is a twofold difference in the delivered dose.
        - **Dose by the band, not per kilogram.** Trimethoprim 6–8 mg/kg/day is
          the pharmacological target behind these bands, not a bedside
          calculation.
        - ⚠️ **Round up, not down.** Pharmacokinetic studies show the fixed bands
          modestly **underdose** children against adult exposures, so where a
          child sits between two bands, take the higher tablet count.

    - type: "prose"
      title: "Allergy and follow-up"
      markdown: |
        If **allergic** to co-trimoxazole, alternatives are **dapsone** (from 4
        weeks, **2 mg/kg orally once daily**) or **atovaquone**.

        Assess tolerance and adherence at **every** clinic/follow-up visit —
        initially monthly, then every 3 months if well tolerated.
