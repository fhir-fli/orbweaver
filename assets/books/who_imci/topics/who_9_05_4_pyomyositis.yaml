  blocks:

    - type: "prose"
      title: "Pus within a muscle"
      highlight: true
      markdown: |
        In pyomyositis there is **pus within the substance of a muscle**.
        - **Fever, tenderness and swelling** of the involved muscle. A fluctuant
          mass may **not** be detected if the inflammation is deep in the muscle.
        - **Commonly occurs in the thigh.**

    - type: "prose"
      title: "Treatment"
      callout: true
      markdown: |
        - **Incision and drainage** (usually needs general anaesthesia).
        - Leave a **drain** in the abscess cavity for **2–3 days**.
        - **X-ray** to exclude underlying **osteomyelitis**.
        - **Cloxacillin 50 mg/kg IM/IV 4× daily for 5–10 days** — commonest organism
          **S. aureus**.
