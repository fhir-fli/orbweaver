  blocks:

    - type: "prose"
      title: "Turn often; keep skin dry"
      highlight: true
      markdown: |
        Teach carers to **turn the child at least once every 2 h**. If pressure
        sores develop, **keep them clean and dry**. Use local anaesthetics such as
        **tetracaine, adrenaline and cocaine** to relieve pain.
