  blocks:

    - type: "prose"
      title: "Well-child care plus HIV monitoring"
      highlight: true
      markdown: |
        HIV-infected children should, when not ill, attend **well-infant clinics**
        like other children. In addition, they need regular clinical follow-up at
        **first-level facilities** to monitor:
        - **clinical condition**
        - **growth**
        - **nutritional intake**
        - **vaccination status**.

        Give **psychosocial support** where possible, through community programmes.
