  blocks:

    - type: "prose"
      title: "Blood can transmit infection"
      highlight: true
      markdown: |
        Blood can be the **vehicle for transmitting infections** — **malaria,
        syphilis, hepatitis B and C, and HIV**. Therefore **screen donors** for as
        many of these infections as possible. To minimize the risk, give blood
        transfusions **only when essential.**
