  title: "Septic Arthritis or Osteomyelitis"
  list_subtitle: "6.9 · aspirate · cloxacillin · 3–5 weeks"
  last_reviewed: "WHO Pocket Book 2nd ed (2013) · pending OpenEvidence review"
  tags: ["septic arthritis", "osteomyelitis", "cloxacillin", "staphylococcus aureus", "salmonella", "pediatric"]
