# ============================================================
# WHO IMCI §8.1.3 — Testing and diagnosis of HIV infection. Pocket
# Book 2nd ed (2013), pp.229–230.
# ✅ OpenEvidence-reviewed 2026-07: added point-of-care NAT (Xpert HIV-1
# Qual, m-PIMA) for early infant diagnosis; updated the virological testing
# schedule (birth → 14–21 d → 1–2 mo → 4–6 mo) and breastfeeding intervals;
# de-emphasised ultrasensitive p24 antigen (superseded by NAT).
# ✅ OpenEvidence-reviewed again 2026-08-24. Confirmed: POC NAT, the
# virological schedule, and p24 de-emphasis all current. Two corrections
# applied and three additions made:
#   - post-cessation testing was "4–6 weeks and 4–6 months"; DHHS gives
#     4–6 weeks and **3 months** after cessation. Corrected.
#   - added the presumptive-ART caveat: ARVs suppress both RNA and DNA NAT,
#     so an extra virological test is needed 2–6 weeks after ARVs stop, and
#     DNA NAT is preferable while the infant is still on ART (it detects
#     cell-associated provirus, not active replication).
#   - added definitive-exclusion criteria, birth-test risk stratification,
#     and the rule that antibody-positive children ≥ 18 months are confirmed
#     by NAT.
# ⚠️ SOURCE NOTE: the granular schedules on this page (birth / 14–21 d /
#   1–2 mo / 4–6 mo, the 3-month post-cessation window, and the definitive-
#   exclusion rule) come from US DHHS/IDSA-ASM, which are more detailed than
#   classic WHO EID guidance (birth / 6 weeks, plus antibody at 9 months).
#   The clinical direction is identical; these are harmonised with current
#   US guidance rather than verbatim WHO.
#   Refs: DHHS Paediatric ARV Guidelines (OARAC 2026); IDSA/ASM Microbiology
#   Laboratory Guide 2024 update; Ochodo Cochrane 2021 (POC NAT).
# ============================================================

topic:
  id: "who-imci-8-1-3-testing-diagnosis"
  title: "Testing & Diagnosis"
  list_subtitle: "8.1.3 · antibody vs virological · < 18 months"
  last_reviewed: "WHO Pocket Book 2nd ed (2013)"
  tags: ["HIV", "testing", "diagnosis", "virological", "pediatric"]
  aliases:
    - "HIV testing"
    - "Virological testing"
  category: "medical"

  page_number: 229

  blocks:

    - type: "prose"
      title: "The < 18-month problem"
      highlight: true
      markdown: |
        Diagnosis in exposed infants and young children **< 18 months** is
        difficult: **passively acquired maternal antibodies** may persist in the
        child's blood, and breastfeeding adds ongoing exposure. Most children
        lose maternal antibodies between **9 and 18 months**, so a **virological
        test** is the **only reliable method** of determining HIV status in a
        child < 18 months.

        Where the mother or child has a **positive antibody test** and the child
        has **symptoms suggestive of HIV**, but virological testing is not
        available, the child may be **presumptively diagnosed** as HIV-infected.
        Do virological testing at the earliest opportunity to confirm.

        All diagnostic HIV testing must be **confidential**, accompanied by
        counselling, and conducted only with **informed consent**.

    - type: "prose"
      title: "Serological antibody test (ELISA / rapid test)"
      markdown: |
        Rapid tests are widely available, sensitive and reliable for diagnosis in
        children **> 18 months**. For children **< 18 months**, an antibody test
        is a sensitive way of detecting **exposure** or **excluding** HIV in
        non-breastfeeding children.

        Rapid tests can be used to **exclude** HIV in a child with severe acute
        malnutrition, TB or other serious illness in high-prevalence areas. For
        children **< 18 months**, confirm all positive results by virological
        testing as soon as possible; if not possible, **repeat antibody testing at
        18 months**.

        A child **≥ 18 months** with a positive antibody test may still carry
        **residual maternal antibody**. Confirm the diagnosis with **NAT** before
        committing the child to lifelong treatment.

    - type: "prose"
      title: "Virological tests"
      markdown: |
        Testing for HIV **RNA or DNA** (nucleic acid testing, **NAT**) is the most
        reliable method in children **< 18 months**. It may require sending a
        sample to a specialized laboratory, but the tests are relatively cheap,
        easy to standardize, and can be done on **dried blood spots**. Available
        assays:
        - **HIV DNA** on whole blood or dried blood spots
        - **HIV RNA** on plasma or dried blood spots.

        (Ultrasensitive **p24 antigen** is still technically available but has been
        **superseded by NAT** and is no longer a primary recommendation.)

    - type: "prose"
      title: "Point-of-care NAT — a major advance"
      callout: true
      markdown: |
        **Point-of-care NAT (POC NAT)** — e.g. **Xpert HIV-1 Qual** and
        **m-PIMA HIV-1/2 Detect** — gives a result in **52–90 minutes** from a
        **finger/heel-prick** sample (sensitivity **~98.6%**, specificity
        **~99.9%**). Compared with conventional dried-blood-spot testing (results
        in weeks to months), POC NAT dramatically **shortens turnaround** and
        **increases ART-initiation rates**. Use POC NAT for early infant diagnosis
        wherever available.

    - type: "prose"
      title: "When to do virological tests"
      markdown: |
        Test **at birth** in all perinatally exposed infants, then on a routine
        schedule:
        - **first routine test at 14–21 days**
        - **at 1–2 months**
        - **at 4–6 months**.

        A **birth** test is **essential in high-risk infants** — mother not on ART,
        started ART late, poor adherence, or a detectable maternal viral load near
        delivery. It is **not strictly necessary in low-risk infants** whose mother
        was on ART throughout pregnancy with a sustained undetectable viral load,
        though it is still commonly done.

        **One positive virological test** is sufficient to diagnose HIV — **start
        ART without delay**, and collect a **second specimen** to confirm. Return
        results to the clinic and family **within 4 weeks** of collection.

    - type: "prose"
      title: "Breastfeeding infants"
      markdown: |
        A breastfeeding infant remains **at risk** of acquiring HIV throughout
        breastfeeding. **Do not stop breastfeeding to perform testing.** Test
        **at least every 3 months while breastfeeding**, and again at **4–6 weeks
        and 3 months after complete cessation**. A **negative** result only
        reliably excludes HIV once this post-cessation window has passed.

    - type: "prose"
      title: "⚠ If the infant has had ARVs"
      callout: true
      markdown: |
        **Antiretrovirals suppress the test as well as the virus.** In an infant
        who received presumptive ART or prophylaxis, **both RNA and DNA NAT can be
        falsely negative** while the drug is on board.
        - Do an **additional virological test 2–6 weeks after ARVs are stopped**
          before accepting a negative result.
        - While the infant is **still on ART**, an **HIV DNA** assay is preferable
          to RNA: it detects **cell-associated provirus** rather than active
          replication, so it is less affected by drug suppression.

    - type: "prose"
      title: "Excluding HIV definitively"
      markdown: |
        In a child who is **not breastfeeding** and has had **no ARVs**, HIV is
        **definitively excluded** by either:
        - **two negative NATs** — one at **≥ 1 month** and one at **≥ 4 months**, or
        - **two negative antibody tests** at **≥ 6 months**.

        In a breastfeeding child, the clock does not start until breastfeeding has
        **completely stopped** — see the post-cessation window above.
