  # ETAT reference charts are the first group; clinical chapters are added
  # as groups (with sections/subsections) as they are authored.
  contents:
    - title: "1. Triage and emergency conditions"
      # WHO Pocket Book color-codes by chapter; Chapter 1 = magenta. Topics
      # inherit this; any topic may override its own palette.
      palette:
        accent: "0xFFD81B60"
      children:
        - topic: "topics/who_1_01_triage.yaml"
        - topic: "topics/who_1_02_etat_summary.yaml"
        - topic: "topics/who_1_03_assessment.yaml"
        - topic: "topics/who_triage_chart2.yaml"
        - topic: "topics/who_chart3_choking.yaml"
        - topic: "topics/who_chart4_airway.yaml"
        - topic: "topics/who_chart5_oxygen.yaml"
        - topic: "topics/who_chart6_positioning.yaml"
        - topic: "topics/who_chart7_iv_fluids_shock.yaml"
        - topic: "topics/who_chart8_iv_fluids_sam.yaml"
        - topic: "topics/who_chart9_diazepam.yaml"
        - topic: "topics/who_chart10_glucose.yaml"
        - topic: "topics/who_chart11_dehydration.yaml"
        - topic: "topics/who_1_04_sam_emergency.yaml"
        - title: "1.5 Diagnostic considerations"
          topic: "topics/who_1_05_diagnostic.yaml"
