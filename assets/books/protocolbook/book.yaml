  # section-divider pages: Emergency p.11, Ingestions p.27, Paediatric
  # p.41, …). Each group takes its own accent that cascades to its
  # topics (the printed book is B&W, so these accents are ours, chosen
  # per-section and freely editable here). Groups are added / filled in
  # as the page-by-page walkthrough reaches each section.
