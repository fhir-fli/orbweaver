# ============================================================
# ProtocolBook pp.132–134 — Sexually Transmitted Infections / Diseases
# (STI/STDs). Internal Medicine Protocols leaf. One cohesive syndromic-
# management topic → a single 3-page leaf (the three algorithms all feed
# the shared treatment-regimen reference on p.134).
#
# Rendering calls (hybrid rule):
#   - Presenting complaints / notes / treatment regimens → prose.
#   - The three syndromic pathways (female discharge / male discharge /
#     genital ulcer) → `algorithm` flowcharts. The female pathway's nested
#     "lower abdominal pain → danger signs?" sub-branch is LINEARISED into
#     two spine decisions (danger-signs → consult; then PID signs → treat
#     UGTI), preserving the routing on the single-spine model.
#   - The "children = sexual abuse" safeguarding note → red-alert callout.
#
# 🔴 GENUINE ERROR corrected (Grey approved 2026-07-19, silent per the rule):
#   p.134 printed regimen (e) as "Trichomoniasis" but listed clotrimazole /
#   nystatin — those are ANTIFUNGALS that treat CANDIDIASIS, not
#   trichomoniasis. Fixed by: relabelling that entry "Candidiasis" (its drugs
#   are correct for candidiasis) AND adding the proper "Trichomoniasis"
#   regimen = metronidazole 2 g PO ×1 (alt tinidazole 2 g PO ×1), per WHO /
#   CDC 2021 STI guidelines (trich = nitroimidazoles; VVC = topical azoles).
#   Grey must fix the source PDF.
#
# CONTENT FLAGS for the later OE / content pass:
#   - Syndromic management (treat-by-presentation without lab confirmation)
#     is standard WHO practice for low-resource settings. Doxycycline in
#     pregnancy is (correctly) routed to erythromycin; ceftriaxone 250 mg
#     is the older GC dose (now often 500 mg) — flag for OE.
# ============================================================

topic:
  id: "pb-im-sti"
  title: "Sexually Transmitted Infections (STIs)"
  list_subtitle: "pp.132–134 · syndromic management"
  last_reviewed: "pocketbook v1.7"
  tags: ["STI", "STD", "sexually transmitted", "discharge", "genital ulcer", "gonorrhea", "chlamydia", "syphilis", "chancroid", "herpes", "trichomoniasis", "bacterial vaginosis", "candidiasis", "PID", "upper genital tract infection", "ceftriaxone", "azithromycin", "doxycycline", "acyclovir", "benzathine penicillin", "internal medicine", "infectious disease"]
  category: "medical"

  pages:

    # ═══════════════════════ PAGE 132 ═══════════════════════
    - page_number: 132
      blocks:

        - type: "prose"
          title: "Common presenting complaints"
          markdown: |
            - Dysuria
            - Dyspareunia
            - Lower abdominal pain
            - Urethral / vaginal discharge
            - Vulvar / vaginal itching / burning
            - Penile / scrotal itching / burning
            - Blisters / sores / warts / growths in genital / anal area

        - type: "flowchart"
          variant: "algorithm"
          entry:
            text: "Female patient — c/o discharge"
            shape: "stadium"
          stages:
            - decision: "HIV test in the last 3 months?"
              outcomes:
                - label: "No"
                  box:
                    title: "HIV test"
                - label: "Yes"
                  continue: true
            - decision: "Abnormal discharge?"
              outcomes:
                - label: "No"
                  box:
                    title: "Consider other diagnoses"
                - label: "Yes"
                  box:
                    title: "Get pregnancy test"
                  continue: true
            - decision: "Lower abdominal pain with any danger sign?"
              criteria:
                - "Recent delivery / abortion"
                - "Amenorrhea"
                - "Abnormal vaginal bleeding"
                - "Abdominal guarding / rebound tenderness"
              outcomes:
                - label: "Yes"
                  box:
                    title: "Request gynaecological / surgical consult"
                - label: "No"
                  continue: true
            - decision: "Lower abdominal pain or cervical motion tenderness?"
              outcomes:
                - label: "Yes"
                  box:
                    title: "Treat for upper genital tract infections"
                - label: "No"
                  continue: true
            - decision: "Any of the following present?"
              criteria:
                - "Purulent discharge"
                - "Urethral discharge in partner"
                - "Sexual violence / prostitution"
                - "New partner or > 1 partner in the last 3 months"
                - "High clinical suspicion"
              outcomes:
                - label: "Yes"
                  box:
                    title: "Treat for gonorrhea and chlamydia"
                  continue: true
                - label: "No"
                  continue: true
          terminal:
            title: "Treat for bacterial vaginosis and trichomoniasis"
            bullets:
              - "Consider treatment for candidiasis"

    # ═══════════════════════ PAGE 133 ═══════════════════════
    - page_number: 133
      blocks:

        - type: "flowchart"
          variant: "algorithm"
          entry:
            text: "Male patient — c/o discharge"
            shape: "stadium"
          stages:
            - decision: "HIV test in the last 3 months?"
              outcomes:
                - label: "No"
                  box:
                    title: "HIV test"
                - label: "Yes"
                  continue: true
            - decision: "Urethral discharge present?"
              outcomes:
                - label: "Yes"
                  box:
                    title: "Treat for gonorrhea and chlamydia"
                - label: "No"
                  box:
                    title: "Look for another genital / anal finding"

        - type: "flowchart"
          variant: "algorithm"
          entry:
            text: "Patient — c/o genital ulcer"
            shape: "stadium"
          stages:
            - decision: "HIV test in the last 3 months?"
              outcomes:
                - label: "No"
                  box:
                    title: "HIV test"
                - label: "Yes"
                  continue: true
            - decision: "Sore / ulcer / vesicle present?"
              outcomes:
                - label: "No"
                  box:
                    title: "Consider other diagnoses"
                - label: "Yes"
                  continue: true
            - decision: "Any of the following?"
              criteria:
                - "Small painful vesicles"
                - "Small ulcers with recurrent vesicles"
              outcomes:
                - label: "Yes"
                  box:
                    title: "Treat for genital herpes"
                - label: "No"
                  box:
                    title: "Treat for syphilis AND chancroid"

        - type: "prose"
          title: "In children"
          callout: true
          palette:
            alert: "0xFFD32F2F"
            alert_fill: "0xFFFDECEA"
            alert_text: "0xFFB71C1C"
          markdown: |
            While beyond the scope of this text, these symptoms in any child are **sexual abuse until proven otherwise**. Always consider sexual assault.

        - type: "prose"
          title: "Partner treatment"
          markdown: |
            All sexual partners of the patient should be treated even if no symptoms — **except herpes, candidiasis and bacterial vaginosis**.

    # ═══════════════════════ PAGE 134 ═══════════════════════
    - page_number: 134
      blocks:

        - type: "prose"
          title: "Treatment regimens — upper genital tract infections"
          markdown: |
            - **Admit to hospital if any present:**
              - Concern for severe infection (sepsis), toxic appearance, clinical concern that the outpatient regimen is unsuitable
              - Concern for complicated infection (peritonitis, abscess)
              - Unclear etiology
              - Unable to tolerate PO
              - No improvement / worsening in the first 48 hrs of outpatient treatment
            - **Inpatient treatment:**
              - **Ceftriaxone 1 g IV every 24 hours** (not 250 mg IM — these patients have sepsis, peritonitis or an abscess)
              - Doxycycline 100 mg/dose PO BID × 14 days
              - Metronidazole 500 mg PO/IV BID × 14 days
              - **Step down to oral after clinical improvement, usually within 24–48 h**, to doxycycline 100 mg BD + metronidazole 500 mg BD, completing **14 days total**. Observe > 24 h first if there is a tubo-ovarian abscess
              - **Tubo-ovarian abscess:** metronidazole is essential for anaerobic cover; a clindamycin + aminoglycoside regimen is a recognised alternative. Consider drainage
            - **Ambulatory treatment:**
              - Ceftriaxone 500 mg IM × 1 dose (1 g if ≥ 150 kg)
              - Doxycycline 100 mg/dose PO BID × 14 days
              - Metronidazole 500 mg PO BID × 14 days

        - type: "prose"
          title: "Treatment regimens — by organism"
          markdown: |
            - **Gonorrhea:** **ceftriaxone 500 mg IM × 1 dose** (**1 g if ≥ 150 kg**). The 250 mg dose was raised because of declining cephalosporin susceptibility
              - **Do NOT add azithromycin routinely.** Ceftriaxone is given alone — unless chlamydia has not been excluded, in which case add **doxycycline 100 mg BD × 7 days**
              - Alternative **only if ceftriaxone is unavailable**, and only for urogenital or rectal infection: cefixime 800 mg PO × 1 dose. If ceftriaxone is truly unavailable: **gentamicin 240 mg IM + azithromycin 2 g PO**
              - ⚠️ **Cefixime is unreliable for pharyngeal infection — only ceftriaxone.** Test of cure is advised after pharyngeal gonorrhoea
            - **Chlamydia — non-pregnant: doxycycline 100 mg PO BD × 7 days** (better cure, especially rectal)
              - Alternative: azithromycin 1 g PO × 1 dose. **Where follow-up is unreliable, a single directly-observed 1 g dose is a legitimate first choice**, accepting a modestly lower cure rate
              - **Pregnant: azithromycin 1 g PO × 1 dose** (alternative amoxicillin 500 mg PO TDS × 7 days)
              - ⚠️ **Erythromycin is no longer recommended in pregnancy** (GI intolerance, adherence, adverse-outcome signals). The book previously printed erythromycin 1 g q12h — if erythromycin base must be used at all, the historical regimen is 500 mg QDS × 7 days
            - **Bacterial vaginosis: metronidazole 500 mg PO BD × 7 days** (alternatives: intravaginal metronidazole 0.75% gel daily × 5 days, or clindamycin cream × 7 days)
              - ⚠️ **Single-dose 2 g is NOT a recommended BV regimen** — it has a higher failure and recurrence rate. The book previously printed the trichomoniasis regimen here
              - **Partners are not routinely treated** in BV — a second exception to the "treat all partners" rule
            - **Trichomoniasis — women: metronidazole 500 mg PO BD × 7 days** (the 7-day course is now preferred over single-dose in women)
              - **Men: metronidazole 2 g PO × 1 dose**
              - **Treat partners** — this one is an STI
            - **Candidiasis** (using vaginal tablets): clotrimazole 500 mg inserted vaginally at bedtime × 1 dose
              - Alternative: clotrimazole 100 mg inserted vaginally at bedtime × 6 days
              - Alternative: nystatin 100,000 IU
            - **Herpes:**
              - Initial outbreak — acyclovir 400 mg/dose PO q8hrs × 7 days
              - Recurrence — acyclovir 400 mg/dose PO q8hrs × 5 days
              - **Timing:** most effective started early — within 72 hours of a first episode, or at the first sign of a recurrence — **but still offer it later if lesions are still forming or not yet fully crusted**, particularly in immunocompromised or HIV-positive patients. The benefit diminishes with time; it does not vanish at a cut-off
              - **In HIV**, episodes of **genital herpes** are more severe and prolonged — treat even outside the usual windows, and use a **higher, longer course: aciclovir 400 mg five times daily until the lesions resolve**
              - ⚠️ This entry is **genital herpes (HSV)**, not herpes zoster (shingles, VZV) — the two are different infections with different doses
            - **Syphilis:** benzathine penicillin **2.4 million IU total — given as 1.2 million IU IM in each buttock** (split for tolerability, but it is one 2.4 MU dose)
              - Early infection: 1 dose. **CDC uses a 1-year cutoff for "early"; some programmes use 2 years — follow the national programme**
              - Late or unknown duration: 1 dose weekly × 3 weeks
            - **Chancroid:** azithromycin 1 g PO × 1 dose (alternative: ceftriaxone 500 mg IM × 1 dose)
