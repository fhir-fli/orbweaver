# ============================================================
# ProtocolBook p.78 — Pain Management: r-FLACC Scale (Revised Face,
# Legs, Activity, Cry, Consolability; 2 months to 7 years old). Second
# leaf of the Pain Management section (p.77 NIPS → p.78 r-FLACC →
# p.79 faces/jerry cans → p.80 numeric + WHO analgesic ladder).
#
# Faithful-rendering calls:
#   - r-FLACC grid → same shape as the p.77 NIPS table: each of the
#     five categories is a `{text, span:2}` bold divider row, its
#     Finding / Points options beneath.
#   - Total = sum of the five categories (0–10). The shared scoring
#     interpretation (0 / 1–3 / 4–6 / 7–10) and the WHO analgesic
#     ladder treatment live on the p.80 numeric-scale page — noted
#     here; a cross-link will be added once p.80 is authored.
#   - Citation superscripts (76,77) dropped.
# ============================================================

topic:
  id: "pb-pain-flacc"
  title: "Pain — r-FLACC (2 mo – 7 yr)"
  list_subtitle: "p.78 · Face · Legs · Activity · Cry · Consolability"
  last_reviewed: "pocketbook v1.7"
  tags: ["pain", "pain management", "FLACC", "r-FLACC", "face legs activity cry consolability", "paediatric", "pain scale"]
  category: "medical"
  page_number: 78

  blocks:

    - type: "prose"
      markdown: |
        Revised FLACC scale (Face, Legs, Activity, Cry, Consolability) — for children **2 months to 7 years old**. Sum the five categories for a total score of 0–10; see [scoring & the WHO analgesic ladder](topic:pb-pain-ladder).

    - type: "table"
      title: "r-FLACC Scale"
      zebra: true
      columns: ["Finding", "Points"]
      column_flex: [8, 2]
      column_align: ["left", "center"]
      rows:
        - cells: [{text: "**Face**", span: 2}]
        - cells: ["No particular expression or smile", "0"]
        - cells: ["Occasional grimace or frown, withdrawn or disinterested; appears sad or worried", "1"]
        - cells: ["Consistent grimace or frown; frequent / constant quivering chin; clenched jaw; distressed-looking face; expression of fright or panic", "2"]
        - cells: [{text: "**Legs**", span: 2}]
        - cells: ["Normal position or relaxed; usual tone & motion to limbs", "0"]
        - cells: ["Uneasy, restless, tense; occasional tremors", "1"]
        - cells: ["Kicking, or legs drawn up; marked increase in spasticity; constant tremors or jerking", "2"]
        - cells: [{text: "**Activity**", span: 2}]
        - cells: ["Lying quietly, normal position, moves easily, regular & rhythmic respirations", "0"]
        - cells: ["Squirming, shifting back / forth, tense or guarded movements, mildly agitated, shallow splinting respirations, intermittent sighs", "1"]
        - cells: ["Arched, rigid or jerking, severe agitation, head banging, shivering, breath-holding, gasping or sharp intake of breaths, severe splinting", "2"]
        - cells: [{text: "**Cry**", span: 2}]
        - cells: ["No cry / verbalization", "0"]
        - cells: ["Moans or whimpers, occasional complaint, occasional verbal outburst or grunt", "1"]
        - cells: ["Crying steadily, screams or sobs, frequent complaints, repeated outbursts, constant grunting", "2"]
        - cells: [{text: "**Consolability**", span: 2}]
        - cells: ["Content or relaxed", "0"]
        - cells: ["Reassured by occasional touching, hugging or being talked to; distractible", "1"]
        - cells: ["Difficult to console or comfort; pushing away caregiver; resisting care or comfort measures", "2"]
