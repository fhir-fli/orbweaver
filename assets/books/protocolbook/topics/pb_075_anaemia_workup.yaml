# ============================================================
# ProtocolBook p.75 — Evaluation for Cause of Anaemia. Second leaf of
# the "Anaemia & Transfusion" section (p.74 approach → p.75 cause
# workup → p.76 transfusions).
#
# The printed page is a genuine branching decision tree (haemolysis
# screen → antihelminthic → MCV three-way classification) INTERLEAVED
# with the Iron Studies interpretation table and the supplementation
# doses. Per the hybrid rule, the DECISION spine renders as an
# `algorithm` flowchart; the Iron Studies table + note + drug doses
# render as `table` / `prose` blocks below, with the microcytic/
# normocytic arms pointing to the table textually (same pattern as the
# p.73 treatment page).
#
# Faithful-rendering calls:
#   - RI formula rendered in prose (MiniMarkdown has no fractions):
#     RI = (reticulocyte % ÷ 2) × (haematocrit ÷ normal haematocrit).
#   - Both Microcytic and Normocytic MCV arms point to the Iron Studies
#     table (verified from the source arrows); Macrocytic arm gets its
#     own workup box (B12/folate/LFTs/thyroid/EtOH/meds).
#   - Iron Studies table: ↑ / ↓ / nL kept as printed; Fe:TIBC cut-off
#     18% kept. Peripheral-smear note → prose under the table.
#   - Supplementation (Iron / Folate / B12) → nested bullets (drop the
#     decorative I/II/III + a/b outline numbering; MiniMarkdown renders
#     nested bullets by indent).
#   - Citation superscript (72) dropped.
#
# ✅ OE-CONFIRMED CHANGES APPLIED (Grey's OpenEvidence pass, 2026-07-26).
#   Both rated MINOR — the page was otherwise judged clinically sound.
#
#   1. RI FORMULA is a simplification. Placing "÷ 2" as a fixed divisor
#      is mathematically equivalent to dividing the corrected
#      reticulocyte count by a maturation factor of 2 — which only
#      holds at a haematocrit around 25%. The factor actually varies
#      with severity (~2.5 at Hct 15%, 2 at 25%, 1.5 at 35%, 1 at
#      normal). Kept the pocket-manual shortcut, added a sub-bullet
#      stating the assumption and the range, as OE recommended.
#      Ref: Agarwal & Rets 2020 Int J Lab Hematol.
#
#   2. ANTIHELMINTHIC now names the drug and dose. The empiric
#      deworming step was correct for the setting (WHO supports MDA
#      where helminth prevalence >20%) but was not actionable without
#      a drug. Added albendazole 400 mg PO single dose (>2 y) and
#      200 mg (1–2 y). Refs: Taylor-Robinson 2019 Cochrane;
#      Jourdan 2018 Lancet.
#
# ⚠️ HEADER CORRECTED 2026-07-29 — it said the TID regimen had been
#   "deliberately left as printed" long after the content had moved to
#   ONCE DAILY. OE caught the contradiction on re-review, and the stale
#   note had already caused one wrong recommendation: fed the old text,
#   OE advised "keep TID", which would have reverted a correct change.
#   ✅ IRON IS NOW ONCE DAILY, and that is the intended state:
#   - Children 3 mg/kg once daily (max 60 mg/day); adults 65 mg once
#     daily (= ferrous sulfate 200 mg), alternate-day if not tolerated.
#   - Source printed 1–2 mg/kg/dose q8h (~3–6 mg/kg/day) and adult
#     50 mg q8h — older divided-dose practice. The 2026 AAP clinical
#     report favours 3 mg/kg ONCE daily, and adult evidence supports
#     lower once-daily dosing with fewer side effects and better
#     absorption (hepcidin rises for ~24 h after a dose, so a second
#     dose the same day is absorbed less well).
#   - The once-daily wording is phrased as a PREFERENCE, not a ban:
#     TID is not wrong, and divided dosing can suit a setting stocking
#     only small-volume ferrous sulfate drops.
#
# ✓ OE-VERIFIED, NO CHANGE:
#   - B12 1–2 mg PO daily: valid alternative to IM (~1% of an oral
#     dose is absorbed by passive diffusion without intrinsic factor).
#   - Fe:TIBC 18% cut-off: simplified but clinically useful.
# ============================================================

topic:
  id: "pb-anaemia-workup"
  title: "Anaemia — Evaluate the Cause"
  list_subtitle: "p.75 · haemolysis screen · MCV · iron studies"
  last_reviewed: "pocketbook v1.7"
  tags: ["anaemia", "anemia", "haemolysis", "reticulocyte index", "MCV", "microcytic", "normocytic", "macrocytic", "iron studies", "iron deficiency", "ferritin", "B12", "folate", "supplementation"]
  category: "medical"
  page_number: 75

  blocks:

    - type: "prose"
      title: "Workup after stabilisation"
      markdown: |
        - Order once the child is stabilised and malaria & sepsis are ruled out
        - Labs: CBC, LDH, bilirubin, haptoglobin, reticulocyte index (RI)
        - RI = (reticulocyte % ÷ 2) × (haematocrit ÷ normal haematocrit)
          - The ÷ 2 is the maturation correction factor, which assumes a haematocrit around 25%. It rises as anaemia worsens — roughly 2.5 at Hct 15%, 2 at 25%, 1.5 at 35%, 1 at a normal Hct

    - type: "flowchart"
      variant: "algorithm"
      stages:
        - decision: "Is there ↑ LDH, ↑ bilirubin, ↓ haptoglobin, or RI > 2%?"
          outcomes:
            - label: "Yes — concern for haemolysis"
              box:
                title: "Consider the following tests"
                bullets:
                  - "Haemoglobin electrophoresis — evaluate for sickle cell, thalassaemia, or other haemoglobinopathy"
                  - "Coagulation studies and LFTs — evaluate for liver disease and DIC"
                  - "Peripheral smear — look for possible cancers"
                  - "G6PD testing"
            - label: "No"
              box:
                title: "Give all children an antihelminthic"
                bullets:
                  - "Albendazole 400mg PO single dose (age > 2 years)"
                  - "Albendazole 200mg PO single dose (age 1–2 years)"
              continue: true
        - decision: "Classify by MCV"
          outcomes:
            # Macrocytic first (higher) so the micro/normo arm below points
            # straight into the embedded Iron Studies table.
            - label: "Macrocytic anaemia"
              box:
                title: "Macrocytic workup"
                bullets:
                  - "B12 & folate levels"
                  - "LFTs"
                  - "Thyroid studies"
                  - "Ask about a history of alcohol abuse"
                  - "Review medications (zidovudine, hydroxyurea)"
            # Microcytic and normocytic are identical on the printed page —
            # merged, and their target Iron Studies table is embedded here as a
            # node in the flowchart (rather than a separate block below).
            - label: "Microcytic or normocytic anaemia"
              box:
                title: "Iron Studies"
                table:
                  columns: ["", "Fe", "TIBC", "Ferritin", "Fe : TIBC"]
                  align: ["left", "center", "center", "center", "center"]
                  rows:
                    - ["Iron deficiency", "↓", "↑", "↓", "<18%"]
                    - ["Anaemia of chronic inflammation", "↓", "nL", "↑", ">18%"]

    - type: "prose"
      markdown: |
        Also consider a peripheral smear: basophilic stippling suggests thalassaemia or sideroblastic anaemia.

    - type: "prose"
      title: "Supplementation"
      markdown: |
        - **Iron** — once daily, with or before food, not with milk or tea
          - Children: **3 mg/kg ONCE daily** of elemental iron (max 60 mg/day)
          - Adults: **65 mg ONCE daily** of elemental iron (= ferrous sulfate 200 mg, one tablet). If not tolerated, the same tablet every other day — equally effective and better absorbed
          - **Once daily is preferred** over splitting into three doses — equally effective, better absorbed, and taken more reliably. Divided dosing is not wrong if that is what your stock allows
        - **Folate (folic acid)**
          - Children: 0.4–1 mg PO daily
          - Adults: 1–5 mg PO daily (depending on severity)
          - ⚠️ **Do NOT give 5 mg folic acid to anyone taking an antifolate** — sulfadoxine-pyrimethamine (SP, used for malaria chemoprevention) or cotrimoxazole prophylaxis. High-dose folate rescues the parasite and roughly doubles antimalarial treatment failure. Keep folic acid at **≤1 mg/day, ideally 0.4 mg**, in these patients
          - Anaemia caused by an antifolate drug is treated with **folinic acid**, not folic acid
        - **B12 (cyanocobalamin)**
          - Children: 1 mg PO daily
          - Adults: 1–2 mg PO daily
