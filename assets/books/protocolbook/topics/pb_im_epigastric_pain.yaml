      title: "Epigastric pain"
      markdown: |
        - **Good and complete history and physical**
          - VS and SpO₂
          - Consider: ACS, pancreatitis, DKA, cholecystitis, ulcer, pre-eclampsia / eclampsia, HELLP, ectopic pregnancy
          - Tests to consider: 12-lead ECG, CXR
          - Labs to consider: CBC, RFTs, amylase / lipase, LFTs, glucose, pregnancy test
          - Signs requiring immediate surgical consult: unstable VS or signs of peritonitis (severe abdominal pain on palpation or rebound tenderness)
          - Indications for oesophagogastroduodenoscopy (OGD): > 55 yo, bleeding / bloody stools / bloody vomitus / anemia, early satiety, unexplained or unintended weight loss (> 10% body weight), progressive dysphagia, odynophagia, persistent n/v, PMHx or FHx of gastrointestinal cancer, previous ulcer, abdominal mass
          - Helicobacter pylori:
            - ≤ 55 yo — test for H. pylori if possible, treat if positive
            - > 55 yo — consider OGD; if negative, test for H. pylori, treat if positive
