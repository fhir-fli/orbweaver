# ============================================================
# ProtocolBook pp.39–40 — Suspected Snake bite (+ Types of
# Envenomation). Two-page topic (multi-page `pages:`).
#
# p.39 hybrid-rule split: the linear pre-decision flow (management
# box, side physical-exam box, immobilize DO-NOTs, labs) is titled
# prose (immobilize block = red-alert callout — it is all safety
# DO-NOTs); the true decision tree (Has envenomation occurred?
# no/suspected/yes → syndrome severe enough for antivenom?) is an
# `algorithm` flowchart. The shared "admit overnight for
# observation" box is a named `boxes:` target, goto-referenced from
# BOTH the "Suspected" outcome and the not-severe-enough "No"
# outcome (the book draws both arrows into one box).
#
# p.40 ("Types of Envenomation") is the companion outline the
# flowchart's "What type of envenomation syndrome?" decision refers
# to: three toxidromes (Neurotoxic / Cytotoxic / Haemotoxic), each
# with symptoms, treatment, indications for antivenom, and which
# antivenom — pure outline → one titled prose section per
# toxidrome.
#
# Faithful-rendering calls:
#   - Citation superscripts (title/exam 95, management 27, syndrome
#     3,95, types 3,95) dropped.
#   - "Skin marks BUT no symptoms" is the condition on the box in
#     print; carried as the outcome LABEL so the shared box works
#     from both references.
#   - p.40 outline letters (a/b/c/d, 1/2/3) dropped per the standing
#     rule; the antivenom-triad numbering kept (it is "the triad").
#
# ⚠️ GENUINE SOURCE TYPOS corrected (surfaced to Grey 2026-07-14):
#   - "DO NOTE treat with ice" → "DO NOT treat with ice" (ice is
#     contraindicated in snakebite; the line sits in a DO-NOT list —
#     verified on the 300 dpi render).
#   - "Consider the follow labs" → "following labs".
#   - "effected limb" (×2) → "affected limb".
#   - p.40 neurotoxic symptoms end "...paralysis and respiratory
#     failure paralysis" — duplicated word; rendered "paralysis and
#     respiratory failure".
#
# ✅ EVIDENCE-CURRENCY UPDATE APPLIED (audit pass 2026-07-26):
#   - The antivenom-reaction epinephrine line carried the same blanket
#     "max dose 0.3mL" as p.37 Anaphylaxis; updated in step with it to
#     "max 0.3mL child, 0.5mL adolescent/adult" (current AAAAI/ACAAI +
#     WAO ceiling). Kept verbatim-consistent with pb_anaphylaxis.
#
# ✅ OE-REVIEWED 2026-07-27 — pages confirmed clinically sound. Applied:
#    haemotoxic arm now leads with "give ANTIVENOM FIRST" before blood
#    products (factors transfused before the venom is neutralised are
#    consumed — wasted product, no benefit). ✓ Confirmed unchanged: all
#    four immobilisation DO-NOTs; the deliberate ABSENCE of a pressure-
#    immobilisation bandage (PIB is elapid/Australian practice and can
#    worsen local cytotoxic injury in a viper-predominant region like this
#    one); antivenom dilution and rate; antihistamine-not-routine; the
#    WBCT20; the neurotoxic triad; cytotoxic antivenom criteria; and the
#    added tetanus and cobra-only anticholinesterase blocks.
#
# ⚠️ OPEN — GREY TO CONFIRM (discharge-safety criterion, NOT changed):
#    The flowchart discharges "no skin marks, no symptoms an hour
#    post-bite". OE suggests extending that observation to 6–8 h, because
#    envenoming — haemotoxic especially — can declare late. I have NOT
#    changed it: it is a discharge criterion, OE hedged it as "consider",
#    and I have seen longer windows cited elsewhere, so the right number
#    should be confirmed rather than guessed. Worth asking OE directly
#    what the minimum observation is for a suspected bite with no marks.
#
# (historical) CONTENT FLAGS still OPEN for OE (audit pass 2026-07-26):
#   - NO TETANUS PROPHYLAXIS anywhere on the page — WHO snakebite
#     guidance includes tetanus toxoid once coagulopathy allows IM
#     injection. Genuine gap.
#   - NEUROTOXIC arm has no ANTICHOLINESTERASE TRIAL (neostigmine +
#     atropine / edrophonium test), which WHO recommends for
#     post-synaptic (cobra-type) neurotoxic envenoming as an adjunct
#     while antivenom takes effect. Genuine gap.
#   - Haemotoxic "blood products as necessary": WHO sequences this
#     AFTER adequate antivenom (clotting factors given before are
#     consumed). Nuance — OE to confirm phrasing.
#
# CONTENT FLAGS for the later OE / content pass (rendered faithfully):
#   - Snake Venom Detection Kit (SVDK) is an Australia-specific
#     product; already framed "if available" — fine, OE may localise.
#   - Plain immobilization without tourniquet matches WHO guidance
#     for viper-predominant regions (pressure-immobilization bandage
#     is elapid/Australia practice) — fine as printed.
# OpenEvidence-applied 2026-08-28 (WHO full advance pass):
#   Added prophylactic SC epinephrine before antivenom, which the page lacked
#   entirely, plus the hydrocortisone warning (WHO pass flag 1-3).
# Cross-book pass 2026-08-28: oxygen trigger 94% -> 90%. A routine 94%
#   trigger commits oxygen to a much larger group without mortality benefit,
#   and oxygen is the most rationed resource in this setting. The other book
#   used 90% throughout and this book already used 90% on its paediatric
#   pneumonia page. Discharge/target criteria on other pages are NOT this
#   figure and were left alone.
# ============================================================

topic:
  id: "pb-snake-bite"
  title: "Suspected Snake Bite"
  list_subtitle: "pp.39–40 · envenomation + antivenom"
  last_reviewed: "pocketbook v1.7"
  tags: ["snake", "snake bite", "envenomation", "antivenom", "viper", "cobra", "bite", "neurotoxic", "cytotoxic", "haemotoxic"]
  category: "medical"

  pages:

    # ═══════════════════════ PAGE 39 ═══════════════════════
    - page_number: 39
      blocks:

        - type: "prose"
          title: "Management"
          markdown: |
            - Monitor, support ABCs
            - Check vital signs (BP, PR, RR, spO2, Temp)
            - Start Oxygen if spO2 <90%
            - Perform brief, targeted history, physical exam

        - type: "prose"
          title: "Physical exam"
          markdown: |
            - **Airway** — check for hypersalivation and ability to clear secretions
            - **Breathing** — watch for respiratory muscle weakness
            - **Bleeding** — monitor for unusual bleeding (haematuria/oozing from wounds)
            - **Neuro** — full exam including cranial nerves
            - **Neurovascular status** of limb, swelling, necrosis

        - type: "prose"
          callout: true
          palette:
            alert: "0xFFD32F2F"
            alert_fill: "0xFFFDECEA"
            alert_text: "0xFFB71C1C"
          title: "Immobilize body part"
          markdown: |
            - **DO NOT** apply tourniquet
            - **DO NOT** incise wound
            - **DO NOT** administer antivenom outside of hospital
            - **DO NOT** treat with ice

        - type: "prose"
          title: "Tetanus — and a rule about every IM injection"
          markdown: |
            - Give **tetanus toxoid** — snakebite wounds are tetanus-prone
            - 🛑 **While clotting is abnormal (20WBCT positive, oozing wounds, any unusual bleeding), give NO intramuscular injection of anything** — not tetanus toxoid, not antibiotics, not analgesia. An IM injection into incoagulable blood causes a deep haematoma. **Use the IV or oral route until antivenom has restored clotting**, then give the toxoid

        - type: "prose"
          title: "Consider the following labs"
          markdown: |
            - CBC, CMP, PT/INR, PTT, FDP/d-dimer, CPK
            - Swab bite area, Snake Venom Detection Kit (SVDK) to be used if available and clinical/lab evidence for envenoming

        - type: "flowchart"
          variant: "algorithm"
          boxes:
            - id: "observe"
              title: "Admit overnight for observation"
              bullets:
                - "Elevate affected limb"
                - "If no new symptoms, discharge next day"
          stages:
            - decision: "Has envenomation occurred?"
              outcomes:
                - label: "No — no skin marks, no symptoms"
                  box:
                    title: "Observe at least 12 hours before discharge"
                    bullets:
                      - "Up to 10–90% of venomous bites are dry bites, and envenoming may not declare for many hours — one hour is far too short"
                      - "Observe 24 hours if the snake was not identified, the patient lives far from hospital, or labs are not available for serial monitoring"
                      - "Repeat clotting check (20WBCT) before discharge"
                      - "Instruct to return immediately if any symptom develops"
                    severity: "non_urgent"
                - label: "Suspected — skin marks BUT no symptoms"
                  goto: "observe"
                - label: "Yes — obvious bite marks and/or symptomatic"
                  continue: true
            - decision: "What type of envenomation syndrome? Severe enough to warrant antivenom? (see next page)"
              outcomes:
                - label: "No"
                  goto: "observe"
                - label: "Yes"
                  box:
                    title: "Antivenom administration"
                    bullets:
                      - "Dilute antivenom in NS (no more than 20mL/500mL bag), give slowly over 30 mins or no more than 1–2mL/min"
                      - "Polyvalent: titrate to symptoms, assess q30min"
                      - "Monovalent: monitor haematologic response, repeat dose if needed"
                      - "Epinephrine ready in case of anaphylaxis: Epinephrine (1mg/1ml 1:1000), 0.01mL/kg (max 0.3mL child, 0.5mL adolescent/adult), IM anterolateral thigh, repeat q5–15 minutes if no improvement"
                      - "Prophylactic SC epinephrine BEFORE the infusion: 0.005mg/kg (0.005mL/kg of 1:1000), max 0.25mg. The only premedication with randomised evidence — severe reactions cut ~40%, strongest with the less-purified polyspecific antivenoms used across sub-Saharan Africa"
                      - "Antihistamine: have available, not routinely recommended. Hydrocortisone does not prevent reactions and cancels out epinephrine's benefit — do not substitute either for epinephrine"
                      - "~90% of reactions occur in the first hour and 40% need rescue epinephrine — monitor at least 1–4 h"
                      - "Monitor Vital Signs"
                      - "Never run medications directly into affected limb"
                    severity: "emergency"

    # ═══════════════════════ PAGE 40 ═══════════════════════
    - page_number: 40
      blocks:

        - type: "prose"
          title: "Types of envenomation — Neurotoxic"
          markdown: |
            - **Symptoms:** Weakness, paresthesia, ptosis, diplopia, mydriasis, problems swallowing, excessive salivation, difficulty breathing, paralysis and respiratory failure
            - **Treatment**
              - IV placement
              - Monitor oxygenation and breathing
              - Intubation & mechanical ventilation if necessary
            - **Anticholinesterase trial — for suspected COBRA envenoming only. NOT for mamba** (mamba venom contains its own anticholinesterase, so it will not work). Antivenom and airway support come first — this is an adjunct, never a substitute
              - Record how open the eyes are before you start
              - **Atropine first, always** — adults 0.6 mg slow IV; children 50 mcg/kg slow IV
              - **Then neostigmine IM** — adults 0.02 mg/kg; children 0.04 mg/kg
              - Look again at 30 and 60 minutes for clearly stronger muscles or better eyelid opening. Roughly half the ptosis recovered within the hour = positive
              - If positive, continue: adults 0.5–2.5 mg every 1–3 h (max 10 mg in 24 h); children 0.01–0.04 mg/kg every 2–4 h — **each dose with atropine as above**
              - Stop after 3 doses if there is no response. Watch the airway throughout — a positive trial may delay intubation, it does not remove the need for it
            - **Indications for Antivenom (the triad of)**
              - 1. Paraesthesia
              - 2. Excessive salivation/metallic taste & sweating
              - 3. Dyspnea in the absence of painful, progressive swelling OR Paresis in the presence of significant swelling
            - **Treatment: Polyvalent Antivenom**

        - type: "prose"
          title: "Cytotoxic"
          markdown: |
            - **Symptoms:** Severe pain, bruising/swelling at site, blisters, severe tissue necrosis, abscess, compartment syndrome, hypotension, shock, rhabdomyolysis, renal failure
            - **Treatment**
              - IV placement
              - Analgesia
              - Place limb at heart level
              - IVF for shock/renal failure
              - Supportive care
            - **Indications for Antivenom**
              - Progressive swelling ≥15cm/hr
              - Swelling extending from foot/hand to knee/elbow in 4 hours
              - Entire limb swelling by 8 hours
              - Airway swelling
              - Associated coagulopathy
            - **Treatment: Polyvalent Antivenom**

        - type: "prose"
          title: "Haemotoxic"
          markdown: |
            - **Symptoms:** Bleeding at wound sites (may be minor wounds, lacerations, or puncture sites), Ecchymoses, Haematuria, Renal Failure, DIC
            - **Treatment**
              - IV access
              - **Give ANTIVENOM FIRST.** Clotting factors transfused before the venom is neutralised are simply consumed — wasted product, no benefit. Transfuse only after antivenom, and only for life-threatening bleeding
              - DO NOT give heparin, antifibrinolytics, thrombolytics
            - **Indications for Antivenom**
              - Active bleeding
              - Non-clotting blood in clean test tube after 20 minutes
              - Lab evidence of coagulopathy
            - **Treatment: Monovalent Antivenom**
