# ============================================================
# ProtocolBook p.13 — Paediatric Advanced Life Support Algorithm
#
# Schema features exercised by this page:
#   - entry_chain: 3 sequential boxes before the branch fork
#     (Safe/Stimulate/Shout → Assess → Unresponsive-decision)
#   - branch severity tinting (emergency=red, priority=yellow)
#   - convergence.exits: labeled arrows out of "Re-assess ABC"
#     - "Improvement" → loopback annotation to yellow branch
#     - "No change"   → labeled forward arrow to post_convergence
#   - post_convergence: the 6-step "continue cycles" box below
#
# ✅ OE-CONFIRMED CHANGES APPLIED (Grey's OpenEvidence pass, 2026-07-26):
#
#   1. 🔴 HIGH — RESCUE BREATHING RATE was a full guideline generation
#      behind. Printed "1 breath every 3–5 seconds (12–20 breaths/min)"
#      is the pre-2020 recommendation; the 2025 AHA/AAP PALS guidelines
#      raised it to 1 breath every 2–3 seconds (20–30 breaths/min) for
#      infants and children with a pulse but inadequate breathing.
#      Under-ventilating matters here because respiratory failure is
#      the leading cause of paediatric arrest. Now 2–3 s / 20–30 min.
#      Ref: Joyner 2026 Pediatrics (Part 6, Pediatric BLS 2025).
#
#   2. MODERATE — EPINEPHRINE had no ceiling. 0.1 mL/kg of 1:10,000 is
#      correct (0.01 mg/kg), and the 1-in-9 mixing instruction is
#      mathematically right and a sensible LMIC adaptation where
#      pre-mixed 1:10,000 is unavailable — but a large child could be
#      over-dosed with no cap printed. Added "max 10 ml (= 1 mg)".
#
#   3. LOW — "Second epinephrine dose after 3–5 minutes" implied a
#      two-dose total. Changed to "Repeat epinephrine every 3–5
#      minutes", which is what AHA actually says.
#
# ✓ OE-VERIFIED, NO CHANGE: 15:2 is the correct 2-rescuer paediatric
#   ratio for a facility setting; the D10% 5 mL/kg dose (= 500 mg/kg,
#   top of the 200–500 mg/kg range) and its 2 mL D50% + 8 mL NS recipe
#   are both correct and consistent with p.12.
#
# ✅ RESOLVED by OE (2026-07-27): termination threshold 15 min → 20 min
#    ("extend to 20 minutes minimum"). APPLIED.
#
# (historical) OPEN item, now closed: "If no improvement after 15
#   minutes, consider stopping." OE flagged 15 min as short (AHA sets
#   no fixed limit; meaningful survival falls off after 20–30 min) and
#   called it a judgment call for the protocol authors. Left as
#   printed at the time — a termination-of-resuscitation threshold is a
#   clinical and ethical policy decision for the setting, not a factual
#   fix, so it waited for Grey. Now decided: 20 minutes.
# OpenEvidence-applied 2026-08-28 (WHO full advance pass):
#   D10% 5 -> 2 mL/kg, both bradycardia branches (WHO pass flag 1-2).
# ============================================================

topic:
  id: "pb-pals-algorithm"
  title: "Paediatric Advanced Life Support"
  list_subtitle: "p.13 · PALS flowchart"
  last_reviewed: "pocketbook v1.7"
  tags: ["pals", "pediatric", "resuscitation", "emergency"]
  category: "critical_care"
  page_number: 13

  blocks:

    - type: "flowchart"
      variant: "severity"

      entry_chain:
        - text: "Safe, Stimulate, Shout for Help — move child to emergency area (as long as can be safely moved)"
          shape: "rectangle"
        - text: "Assess breathing and pulse — look, listen, feel for 5–10 seconds"
          shape: "rectangle"
        - text: "Unresponsive, not breathing, or only occasional gasps"
          shape: "diamond"

      branches:
        - id: "slow"
          label: "< 60 bpm (or no pulse)"
          severity: "emergency"
          actions:
            - text: "15 chest compressions : 2 rescue breaths with bag-valve mask for 2 minutes (rotate rescuer every 2 minutes)"
              kind: "procedure"
            - text: "Establish IV/IO access"
              kind: "procedure"
            - text: "Epinephrine 0.1 ml/kg of 0.1 mg/mL (1:10,000), max 10 ml (= 1 mg). If only 1 mg/mL (1:1,000) is stocked, dilute 1 ml in 9 ml normal saline — never give 1:1,000 undiluted IV"
              kind: "medication_administration"
            - text: "Dextrose 10% 2 ml/kg (mix 8 ml normal saline with 2 ml D50%)"
              kind: "medication_administration"
        - id: "palpable"
          label: "> 60 bpm, pulse palpable"
          severity: "priority"
          actions:
            - text: "Open airway / reposition head"
              kind: "procedure"
            - text: "1 breath every 2–3 seconds (20–30 breaths/min) with oxygen"
              kind: "procedure"
            - text: "Establish IV/IO access"
              kind: "procedure"
            - text: "Dextrose 10% 2 ml/kg (mix 8 ml normal saline with 2 ml D50%)"
              kind: "medication_administration"
            - text: "Continue examination to establish cause and treat"
              kind: "assessment"

      convergence:
        text: "Re-assess ABC"
        shape: "rounded_rectangle"
        exits:
          - label: "Improvement"
            loopback: "palpable"
          - label: "No change"

      post_convergence:
        text: |
          Continue cycles: 15 compressions : 2 breaths for 2 minutes
          Place NGT
          Reassess ABC every 2–3 minutes
          If pale, consider transfusion
          Repeat epinephrine every 3–5 minutes
          If no improvement after 20 minutes, consider stopping
        shape: "rectangle"
