topic:
  id: "pb-tb-diagnosis"
  title: "TB — Diagnosis & Systemic Score"
  list_subtitle: "p.71 · suspect / diagnose / Keith Edwards"
  last_reviewed: "pocketbook v1.7"
  tags: ["tuberculosis", "TB", "paediatric", "keith edwards score", "gastric aspirate", "diagnosis", "lymphadenopathy", "chronic cough", "tuberculin", "scoring"]
  category: "medical"
  page_number: 71

  blocks:

    - type: "prose"
      title: "Consider tuberculosis with any of the following"
      markdown: |
        - Chronic cough
        - Chronic fever
        - Pneumonia not improving on treatment
        - Wasting
        - Lymphadenopathy
        - Ascites
        - Heart failure / pericardial effusion
        - Refusal to bend a painful joint
        - Irritability, meningeal signs
        - Haematuria, sterile pyuria

    - type: "prose"
      title: "General considerations making tuberculosis more likely"
      markdown: |
        - Prolonged course of cough, fever, sweats
        - Patient's disease symptoms don't improve with expected treatment
        - Weight loss / malnutrition, especially if no improvement after 4 weeks
        - Large, painless lymphadenopathy
        - Close contact with someone with tuberculosis within the last 2 years

    - type: "prose"
      title: "Diagnosis"
      markdown: |
        - In children especially difficult — <5yo cannot produce sputum
        - **Bacteriological confirmation — if Xpert MTB/RIF Ultra is available, use it first.** Specimen priority: **sputum** (if the child can expectorate) → **stool** → gastric aspirate. Stool Xpert is WHO-endorsed in children who cannot expectorate and **removes the need for a gastric aspirate altogether**
        - **If Xpert is not available — <5yo or cannot produce sputum → gastric aspirate:**
          - Perform on different days, 3 times total
          - Early morning, before the child eats or ambulates (ideally wake the patient after sleeping prone all night)
        - **Test for HIV** — check the mother if the child is <18 months, otherwise test the child. HIV changes prognosis, mandates co-trimoxazole preventive therapy, and creates rifampicin–ART interactions that alter the regimen. See the [HIV opportunistic infections protocol](topic:pb-im-hiv-oi)
        - **Well child contacts who do NOT have TB — give preventive therapy.** Treat every child household contact, and do not wait for a test.
          - **First line: 3HR — isoniazid 10mg/kg/day (7–15, max 300mg) + rifampicin 15mg/kg/day (10–20, max 600mg), daily for 3 months.** The shorter rifamycin course completes far more often than 6 months of one drug, at equal efficacy
          - **Acceptable alternative where rifampicin fixed-dose combinations are not stocked: 6H — isoniazid 10mg/kg/day (7–15, max 300mg) daily for 6 months.** An available regimen given reliably beats an unstocked better one
          - **Child living with HIV, or under 5:** the same regimens. If ART drug interactions rule out a rifamycin, fall back to daily isoniazid for 6–9 months
          - **Add pyridoxine 12.5–25mg/day** if the child is HIV-positive or malnourished

    - type: "table"
      title: "Scoring systems — Systemic TB · Keith Edwards Score (≥7 indicative of TB)"
      zebra: true
      columns: ["Feature / score", "0", "1", "2", "3", "4"]
      column_flex: [7, 2, 2, 2, 2, 2]
      column_align: ["left", "center", "center", "center", "center", "center"]
      rows:
