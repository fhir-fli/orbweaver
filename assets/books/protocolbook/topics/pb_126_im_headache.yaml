topic:
  id: "pb-im-headache"
  title: "Headache — Red Flags"
  list_subtitle: "p.126 · secondary-headache danger signs"
  last_reviewed: "pocketbook v1.7"
  tags: ["headache", "red flags", "thunderclap", "secondary headache", "danger signs", "SNNOOP", "adult", "internal medicine", "common complaints", "neurology"]
  category: "medical"
  page_number: 126

  blocks:

    - type: "prose"
      title: "Headache"
      markdown: |
        - **Good and complete history and physical**

    - type: "prose"
      title: "Danger signs (\"red flags\")"
      callout: true
      palette:
        alert: "0xFFD32F2F"
        alert_fill: "0xFFFDECEA"
        alert_text: "0xFFB71C1C"
      markdown: |
        Suggest a space-occupying or vascular lesion, infection, metabolic disturbance, or systemic condition:

        - Systemic symptoms or condition (e.g. fever, ↓ weight, pregnancy, HIV)
        - Neuro symptoms (e.g. confusion, decreased consciousness, focal signs, vision changes, meningismus, convulsions, papilledema)
        - New onset (especially if > 40 yo) or sudden ("thunderclap")
        - History of head trauma, illicit drug use, toxic exposure
        - Headache awakens from sleep, worse with Valsalva, cough, exertion or sexual activity, or worse in a specific position
        - History of headache with a change in features: frequency, severity, associated features
