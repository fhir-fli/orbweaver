        See also [Anaemia — approach & thresholds](topic:pb-anaemia).

    - type: "prose"
      title: "General considerations"
      markdown: |
        - 10 mL PRBCs = 20 mL whole blood (WB) — a bedside rule of thumb. 🛑 **Do NOT use it to derive the fever-stratified volumes above:** those are the trial's own paired figures (30 WB ≈ 20 PRBC, 20 WB ≈ 10 PRBC). Halving 30 by this rule gives 15, which under-transfuses the afebrile child
        - If in shock, give WB for extra volume
        - If no shock and concern for volume overload (malnourished, heart failure), give PRBCs
        - 10–15 mL/kg PRBCs raises a child's Hb an average of 2–3 g/dL
        - Usual range for children: 10–20 mL/kg
        - 1 unit PRBCs raises an adult's Hb an average of 1 g/dL
        - Normal volume for adults: 1–2 units
        - Usually run 10 mL/kg (1 unit) over 3–4 hours

    - type: "prose"
      title: "Calculate transfusion volume"
      markdown: |
        **Paediatric — take the first line that applies:**
        - **Malnourished (any temperature): 5 mL/kg PRBCs, or 10 mL/kg WB** — slowly, watching for overload. **Do not repeat the transfusion.** Malnutrition overrides the afebrile higher-volume rule below
        - **Febrile (T ≥ 37.5 °C): 20 mL/kg WB, or 10 mL/kg PRBCs**
        - **Afebrile (T < 37.5 °C): 30 mL/kg WB, or 20 mL/kg PRBCs**
        - By age, where temperature is not the deciding factor: <1 yr 10 mL/kg PRBCs or 15 mL/kg WB; >1 yr 10 mL/kg PRBCs or 20 mL/kg WB
        - **Adult**: 1–2 units PRBCs

        **Print the pairing, not a conversion.** TRACT randomised to **30 mL/kg whole blood or 20 mL/kg red cells** (higher) against **20 mL/kg whole blood or 10 mL/kg red cells** (lower), treating each pair as equivalent. Take the figures as printed.

        **Why fever changes the volume.** In TRACT — 3,196 Ugandan and Malawian children with severe anaemia, the largest trial of transfusion volume in this population — the effect of volume differed by admission temperature. Afebrile children did better on the higher volume; **febrile children did worse on it**. Treat this as a **volume-selection rule**, not a mortality promise: it is a prespecified subgroup interaction in a trial whose primary endpoint was null, so the direction is well supported and the size of the benefit is not.

        **TRACT also found no benefit in transfusing uncomplicated moderate anaemia** (Hb 4–6 g/dL with no severity signs) — a conservative trigger belongs with these conservative volumes.

    - type: "prose"
      title: "Complications"
      markdown: |
        - **Acute haemolytic reaction (AHTR)** — within 24 h
          - Signs: fevers, chills, rigors, pain at the infusion site, chest / back / abdominal pain, low BP, shortness of breath
          - Treatment: stop the transfusion; send the unit back to the lab to recheck compatibility; **aggressive IV fluid hydration is the priority** — it protects the kidneys from free haemoglobin. Add **furosemide** only if urine output stays low despite adequate filling. **Vasopressors (e.g. dopamine) are for hypotension, not for urine output** — low-dose "renal" dopamine does not protect the kidneys
        - **Febrile non-haemolytic reaction** — within 6 h
          - Signs: fevers, chills, tachypnoea, headache, vomiting, BP change
          - Treatment: stop the transfusion; send the unit back to the lab to recheck compatibility (important to differentiate haemolytic from non-haemolytic); draw blood cultures; give paracetamol. **Pethidine (meperidine) for severe rigors is second-line only** — its metabolite accumulates and causes seizures with repeated dosing, and its benefit here has never been demonstrated
        - **Delayed haemolytic reaction** — typically 3–21 days
          - Signs: fever, anaemia, mild jaundice
          - Treatment: screen for new antibodies; no specific treatment
        - **Allergic / urticarial / anaphylaxis**
          - Signs: bronchospasm, laryngeal oedema, hypotension
          - Treatment: urticaria — diphenhydramine; anaphylaxis (see the [anaphylaxis protocol](topic:pb-anaphylaxis)) — epinephrine, diphenhydramine, H2-blocker, glucocorticoids
        - **Transfusion-related acute lung injury (TRALI)** — often within 1–2 h, sometimes within 6 h; usually improves in 48–96 h
          - Signs: fever, bilateral pulmonary oedema, hypoxaemia, respiratory failure, hypotension
          - Treatment: supplemental oxygen & respiratory support; CXR; evaluate for possible volume overload (presents with similar features)
