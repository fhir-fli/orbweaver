topic:
  id: "pb-im-dvt"
  title: "Deep Vein Thrombosis (DVT)"
  list_subtitle: "p.130 · Wells score · anticoagulation"
  last_reviewed: "pocketbook v1.7"
  tags: ["DVT", "deep vein thrombosis", "VTE", "Wells score", "D-dimer", "doppler ultrasound", "enoxaparin", "heparin", "warfarin", "anticoagulation", "iliofemoral", "internal medicine", "haematology"]
  category: "medical"
  page_number: 130

  blocks:

    - type: "prose"
      title: "Common presenting complaints"
      markdown: |
        - Leg swelling, pain, unilateral leg tenderness
        - Iliofemoral thrombosis may present with:
          - Pain in buttocks / groin, swelling in thigh, collateral superficial veins

    - type: "prose"
      title: "Risk factors"
      markdown: |
        - Prolonged bed rest, immobilization, air or bus travel
        - Age > 40 years
        - Obesity
        - HIV or tuberculosis

    - type: "prose"
      title: "Wells prediction score"
      markdown: |
        Score **≤ 0** low risk · **1–2** intermediate risk · **≥ 3** high risk.

    - type: "table"
      columns: ["Finding", "Points"]
      column_flex: [9, 2]
      column_align: ["left", "center"]
      rows:
        - cells: ["Previous DVT / PE", "1"]
        - cells: ["Paralysis / immobilization of lower extremity", "1"]
        - cells: ["Bedridden > 3 days or major surgery within 4 weeks", "1"]
        - cells: ["Local tenderness", "1"]
        - cells: ["Swelling of entire leg", "1"]
        - cells: ["Calf difference ≥ 3 cm", "1"]
        - cells: ["Pitting edema ONLY in symptomatic leg", "1"]
        - cells: ["Collateral superficial veins", "1"]
        - cells: ["Alternative diagnosis more likely than DVT", "−2"]

    - type: "prose"
      title: "Management recommendations"
      markdown: |
        - **Low risk:** can rule out with doppler ultrasound of the lower extremities or D-dimer if concerned; otherwise no treatment
        - **Moderate risk:**
          - Doppler ultrasound of lower extremities or D-dimer to rule out
          - Wait until results to begin treatment
        - **High risk:**
          - Begin treatment
          - Order doppler ultrasound of lower extremities for confirmation

    - type: "prose"
      title: "Treatment options for DVT or PE"
      markdown: |
        **Acute:**

        - Enoxaparin 1 mg/kg subcutaneously q12hrs
        - Unfractionated heparin IV **80 units/kg bolus, then 18 units/kg/hr — titrated to aPTT / anti-Xa, NOT capped**
          - 🛑 The book previously printed "5000 units max" and "1000 units/hr max". Those caps belong to the **fibrinolysis-associated** heparin on the ACS pages; they are **not part of the venous nomogram** and would **systematically underdose heavier patients** — an 80 kg patient needs ~1,440 units/hr, already above the printed hourly cap

        **Chronic — a DOAC is first-line, not warfarin.** Guideline-preferred over a
        vitamin-K antagonist in acute VTE without cancer: comparable efficacy, less major
        and intracranial bleeding, and **no INR monitoring** — which matters most exactly
        where monitoring is unreliable.

        - **No parenteral lead-in needed:** **rivaroxaban 15 mg BD × 21 days, then 20 mg daily**; or **apixaban 10 mg BD × 7 days, then 5 mg BD**
        - **Dabigatran and edoxaban DO need a 5–10 day parenteral lead-in**
        - 🛑 **If only warfarin is available:** **do NOT load.** Start low (2.5 mg in the
          older or frail), and **overlap with LMWH or UFH for at least 5 days AND until the
          INR has been ≥ 2 for 24 hours** — warfarin alone from day 1 is inadequate because
          of the early prothrombotic dip. Goal INR 2–3. The book previously printed
          "warfarin 10 mg daily × 2 days" with no heparin overlap
        - **Pregnancy and active cancer: LMWH is preferred**, not a DOAC or warfarin
          (edoxaban or rivaroxaban are acceptable alternatives in cancer-associated VTE,
          with caution for GI and GU bleeding)
        - This now matches the atrial-fibrillation page, which was corrected the same way
