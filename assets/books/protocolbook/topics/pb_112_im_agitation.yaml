# ============================================================
# ProtocolBook pp.112–113 — Severely Agitated or Violent Patient.
# Eleventh leaf of the Internal Medicine Protocols section.
#
# Two-page topic (`pages:`): p.112 = prevention / risk factors / warning
# signs / verbal de-escalation / DO-NOTs; p.113 = management (staff
# safety → verbal → restraint indications → monitor → rapid sedation
# by situation).
#
# Faithful-rendering calls:
#   - p.112 is a pure outline (I–V) → titled prose (decorative Roman/
#     letter numbering dropped).
#   - p.113 management is mostly a content-flow sequence → prose steps;
#     the 3-way rapid-sedation categorisation → a `table`
#     (situation → regimen).
#   - Citation superscripts dropped.
#
# CONTENT FLAGS for the later OE / content pass (rendered faithfully):
#   - Verbal de-escalation first, restraints only for imminent harm /
#     failed verbal approach, and haloperidol ± benzodiazepine sedation
#     (benzodiazepine-first for intoxication/withdrawal/undifferentiated,
#     to avoid lowering the seizure threshold / QT issues) is standard.
#     Doses (haloperidol 2.5–5 mg, midazolam 2.5–5 mg IV/IM) are
#     reasonable; monitor airway/respirations after sedation.
# ============================================================

# 🔴 BUG FIXED 2026-08-24 — the three sedation-safety notes (combination
# beats either drug alone, olanzapine as an alternative, and the haloperidol
# QT warning) sat at 4-space indent, which made them a THIRD entry under
# `pages:` with no page_number and no blocks. TopicPage.fromYaml turns that
# into an EMPTY PAGE, so none of it has ever rendered — including the QT
# warning. Re-indented into page 113's blocks. Found while converting this
# page to a flowchart; worth sweeping the other multi-page topics for the
# same shape.

topic:
  id: "pb-im-agitation"
  title: "Severely Agitated or Violent Patient"
  list_subtitle: "pp.112–113 · de-escalation · restraint · sedation"
  last_reviewed: "pocketbook v1.7"
  tags: ["agitation", "violent patient", "de-escalation", "restraint", "sedation", "adult", "internal medicine", "haloperidol", "midazolam", "psychiatry", "behavioural"]
  category: "medical"

  pages:

    # ═══════════════════════ PAGE 112 ═══════════════════════
    - page_number: 112
      blocks:

        - type: "prose"
          markdown: |
            Prevention is always better than treatment when possible.

        - type: "prose"
          title: "Factors making violence more likely"
          markdown: |
            - Male gender
            - A history of violence
            - Drug or alcohol abuse

        - type: "prose"
          title: "Signs of impending violence"
          markdown: |
            - Provocative behaviour
            - Angry demeanour
            - Loud, aggressive speech
            - Tense posturing (e.g. clenched fists)
            - Frequently moving or changing body position, pacing
            - Aggressive acts (e.g. pounding walls, throwing objects, hitting oneself)

        - type: "prose"
          title: "10 elements for verbal de-escalation"
          markdown: |
            - Respect personal space (2 arms' lengths)
            - Do not be provocative (remain calm)
            - Establish verbal contact (the first person to make contact leads the discussion)
            - Use concise, simple language
            - Identify feelings and desires ("What are you hoping for?")
            - Listen closely (repeat back to the patient to ensure accuracy)
            - Agree, be clear, agree to disagree if necessary
            - Set clear limits and boundaries (explain that violence/abuse is not tolerated)
            - Offer choices, stay positive
            - Debrief the patient and staff

        - type: "prose"
          title: "DO NOT"
          markdown: |
            - Argue
            - Threaten
            - Condescend
            - Command

    # ═══════════════════════ PAGE 113 ═══════════════════════
    - page_number: 113
      blocks:

        # 2026-08-24 — the print draws p.113 as a flowchart: staff safety at the
        # top feeding two parallel boxes (calm verbally / call security) that
        # converge into restraint indications, then monitoring, then a second
        # calming attempt, then the sedation gate into a three-column drug
        # table. It was four prose blocks. The drug table stays below the
        # chart: a `linear` step carries a title and bullets, not a table.
        - type: "flowchart"
          variant: "linear"
          warnings:
            - type: "safety"
              text: "Ensure STAFF SAFETY first"
          entry_chain:
            - text: "Severely agitated or violent patient"
              shape: "stadium"
          steps:
            - type: "content"
              title: "First response"
              bullets:
                - "Attempt to calm the patient using verbal techniques"
                - "Call security / police when possible for any concern about violence, or a patient threatening violence"
            - type: "content"
              title: "Indications for restraints"
              bullets:
                - "Imminent harm to others"
                - "Imminent harm to self"
                - "Disruption of important treatment"
                - "Damage to surrounding equipment / environment"
                - "Unsuccessful verbal approach"
            - type: "content"
              title: "Before sedation"
              bullets:
                - "Monitor, support ABCs"
                - "Establish IV / O₂ monitoring if possible"
                - "Check vital signs (BP, PR, RR, SpO₂, temp, weight)"
                - "Check blood glucose"
            - type: "action"
              text: "Re-attempt to calm the patient using verbal techniques"
              kind: "communication"
          convergence:
            text: "Rapid sedation required, and/or not responding to verbal techniques?"
            shape: "diamond"
            bullets:
              - text: "Choose by situation — see the table below"

        - type: "table"
          title: "Rapid sedation (if required, and/or not responding to verbal techniques)"
          zebra: true
          columns: ["Situation", "Sedation"]
          column_flex: [4, 6]
          column_align: ["left", "left"]
          rows:
            - cells: ["Severely violent patient", "Haloperidol 2.5–5 mg IV/IM AND/OR midazolam 2.5–5 mg IV/IM"]
            - cells: ["Drug intoxication / withdrawal, or undifferentiated", "Midazolam 2.5–5 mg IV/IM, AND (if necessary) haloperidol 2.5–5 mg IV/IM"]
            - cells: ["Known psychiatric disorder", "Haloperidol 2.5–5 mg IV/IM AND/OR midazolam 2.5–5 mg IV/IM"]

        - type: "prose"
          title: "Choosing the drug"
          markdown: |
            - **Combination works better than either drug alone.** Haloperidol **plus** midazolam is more effective than haloperidol on its own, which is the least effective of the usual options
            - **Olanzapine 10 mg IM**, where stocked, is a good alternative to haloperidol with fewer extrapyramidal effects
            - ⚠️ **Haloperidol prolongs the QT interval.** Get an ECG when that is feasible; avoid it if the QT is known to be long or the patient is on other QT-prolonging drugs. **IV carries more risk than IM**
