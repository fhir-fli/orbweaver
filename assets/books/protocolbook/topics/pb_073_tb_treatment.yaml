# ============================================================
# ProtocolBook p.73 — Paediatric Tuberculosis: Treatment (printed
# "Treatment for Pediatric Tuberculosis"). Third and final leaf of the
# Paediatric Tuberculosis group (p.71 diagnosis → p.72 scoring →
# p.73 treatment). p.74 (Anaemia) starts the next section.
#
# The printed page is a genuine decision flowchart INTERLEAVED with two
# drug-dose reference tables and a pyridoxine weight table. Per the
# hybrid rule, the DECISION clusters render as `algorithm` flowcharts;
# the tabular / sequential reference content renders as `table` /
# `prose` in strict top-to-bottom order, so the whole page reads the
# way it's printed.
#
# Block order (mirrors the page):
#   1. algorithm — LFT safety check (Check LFTs → ALT>3×ULN? →
#      Abnl LFTs but ALT<3×ULN? → begin treatment).
#   2. prose (**) — LFT-monitoring footnote (kept next to the check
#      it annotates rather than at page-bottom, for phone clarity).
#   3. table — First 2 months treatment (4 drugs).
#   4. algorithm — adjunctive steroids (Are any severe forms present?
#      → Yes: add Prednisone taper; converge → After 2 months duration).
#   5. table — After 2 months continuation regimen (2 drugs).
#   6. prose (*) + table — pyridoxine throughout treatment, by weight.
#   7. Citation superscripts (78, 181) dropped.
#
# Flowchart-box text is PLAIN (algorithm boxes render as plain Text,
# not MiniMarkdown) — no `**bold**` inside boxes/decisions/outcomes.
#
# GENUINE SOURCE TYPO surfaced to Grey (rendered CORRECTED here):
#   - Steroid-criteria list prints "Severe military TB" → corrected to
#     "Severe miliary TB" (miliary TB is the real entity; same
#     "military→miliary" slip corrected on p.72). Grey should fix the
#     source PDF.
#
# ⚠️ DROPPED ZERO corrected 2026-07-28 (Grey's standing typo/unit-slip
#   authorisation — the book contradicts itself elsewhere, three ways):
#   - Source p.73 prints the adjunctive steroid as "2mg/kg (max
#     6mg/day) x 4 weeks". Rendered "max 60 mg/day".
#     VERIFIED VISUALLY at 200 dpi (pb73-073.png) — the source really
#     does print 6mg, so it is not a text-extraction artifact.
#     Why 60 is certain:
#       1. A 6 mg/day cap on a 2 mg/kg/day dose binds at 3 kg, i.e. for
#          EVERY patient on this pathway — which makes the mg/kg
#          meaningless. A cap that never lets the weight-based dose
#          apply is self-evidently a misprint.
#       2. pb_049_uti_kidney prints the SAME drug at the SAME
#          2 mg/kg/day for the SAME 4 weeks with "max 60mg/day".
#       3. pb_128_im_tb (adult TB, the same indication) gives
#          prednisone 60 mg/day. The book would otherwise be giving an
#          adult 60 mg and capping a child at 6 mg.
#     60 mg/day is also the universal prednis(ol)one ceiling for this
#     indication. This matters: the gate above it is TB meningitis /
#     miliary TB / pericardial effusion, where adjunctive steroids
#     reduce mortality — a 10x under-cap would make them near-placebo.
#     Grey should fix the source PDF.
#
# ✅ APPLIED 2026-07-28 after OE confirmation (was §H2/§H3):
#   - PULMONARY TB CONTINUATION 6 → 4 MORE MONTHS (6 months total).
#     Source printed "6 more months" = an 8-month course. UCG 2023
#     tabulates 2RHZE/4RH and WHO agrees; the SHINE trial (NEJM 2022,
#     Uganda among its sites) showed 4 months non-inferior for
#     non-severe paediatric TB, and ATS/CDC/ERS/IDSA 2025 now
#     recommends 2HRZ(E)/2HR for that group. The book already had the
#     CNS figure exactly right (10 more months = UCG's 2RHZE/10RH).
#     Changed HERE and in pb_128_im_tb, which printed the same figure
#     for adults — both had to move together, which is why this was
#     flagged rather than silently corrected.
#   - LFT RULE now distinguishes symptomatic from asymptomatic
#     (>3× ULN with symptoms, >5× ULN without). The chart said 3× and
#     the footnote said 5×; both are real thresholds and the missing
#     distinction is what reconciles them.
#   Grey should carry both into the source PDF.
#
# CONTENT FLAGS for the later OE / content pass (rendered faithfully):
#   - 2HRZE / 4HR (2-month RIPE intensive → continuation isoniazid+
#     rifampicin) is the standard WHO paediatric regimen; durations
#     extended for CNS/disseminated disease. Doses transcribed as
#     printed (WHO 2010-era mg/kg bands; current WHO paediatric FDC
#     dosing is weight-band based — OE may modernise). Pyridoxine
#     co-administration is appropriate for at-risk / malnourished /
#     HIV+ children on isoniazid.
# ============================================================

topic:
  id: "pb-tb-treatment"
  title: "TB — Treatment"
  list_subtitle: "p.73 · LFT check · regimen · steroids"
  last_reviewed: "pocketbook v1.7"
  tags: ["tuberculosis", "TB", "paediatric", "treatment", "isoniazid", "rifampicin", "pyrazinamide", "ethambutol", "prednisone", "pyridoxine", "LFTs", "regimen"]
  category: "medical"
  page_number: 73

  blocks:

    - type: "flowchart"
      variant: "algorithm"
      entry:
        text: "Check LFTs before starting treatment"
        shape: "stadium"
      stages:
        - decision: "ALT > 3 × upper limit of normal?"
          outcomes:
            - label: "Yes"
              box:
                title: "Consult senior about a possible alternate regimen"
                severity: "priority"
            - label: "No"
              continue: true
        - decision: "Abnormal LFTs but ALT < 3 × upper limit of normal?"
          outcomes:
            - label: "Yes"
              box:
                title: "Recheck LFTs monthly during treatment"
              continue: true
            - label: "No"
              continue: true
      terminal:
        title: "Begin treatment — First 2 months regimen (table below)"

    - type: "prose"
      title: "LFT monitoring during treatment"
      markdown: |
        If liver tenderness, hepatomegaly or jaundice develop, recheck LFTs.

        - **With symptoms** (nausea, vomiting, abdominal pain, jaundice): stop and consult at **ALT >3 × the upper limit of normal**
        - **Without symptoms:** stop and consult at **ALT >5 × the upper limit of normal**

    - type: "table"
      title: "First 2 months treatment"
      zebra: true
      columns: ["Drug", "Recommended daily dose", "Range", "Max dose"]
      column_flex: [5, 4, 5, 5]
      column_align: ["left", "center", "center", "center"]
      rows:
        - cells: ["Isoniazid", "10 mg/kg", "7–15 mg/kg", "300 mg/day"]
        - cells: ["Rifampicin", "15 mg/kg", "10–20 mg/kg", "600 mg/day"]
        - cells: ["Pyrazinamide", "35 mg/kg", "30–40 mg/kg", "1.5 g/day"]
        - cells: ["Ethambutol", "20 mg/kg", "15–25 mg/kg", "1.6 g/day"]

    - type: "flowchart"
      variant: "algorithm"
      stages:
        - decision: "Are any of the following present?"
          criteria:
            - "TB meningitis"
            - "Pulmonary TB with respiratory distress"
            - "Pulmonary TB with airway obstruction from hilar lymph nodes"
            - "Severe miliary TB"
            - "Pericardial effusion"
          outcomes:
            - label: "Yes"
              box:
                title: "Add Prednisone"
                bullets:
                  - "2 mg/kg (max 60 mg/day) × 4 weeks"
                  - "Followed by 1 mg/kg × 1 week"
                  - "Followed by 0.5 mg/kg × 1 week"
              continue: true
            - label: "No"
              continue: true
      terminal:
        title: "After 2 months"
        bullets:
          - "Cerebral TB requires 10 more months of treatment (12 months total)"
          - "Pulmonary TB requires 4 more months of treatment (6 months total)"

    - type: "table"
      title: "After 2 months (continuation)"
      zebra: true
      columns: ["Drug", "Recommended daily dose", "Range", "Max dose"]
      column_flex: [5, 4, 5, 5]
      column_align: ["left", "center", "center", "center"]
      rows:
        - cells: ["Isoniazid", "10 mg/kg", "7–15 mg/kg", "300 mg/day"]
        - cells: ["Rifampicin", "15 mg/kg", "10–20 mg/kg", "600 mg/day"]

    - type: "prose"
      title: "Pyridoxine throughout treatment"
      markdown: |
        The patient should receive pyridoxine (vitamin B6) throughout the whole course of treatment.

    - type: "table"
      title: "Pyridoxine dose by weight (50 mg tablets)"
      zebra: true
      columns: ["Weight (kg)", "Number of pyridoxine (50 mg) tablets"]
      column_flex: [4, 6]
      column_align: ["left", "left"]
      rows:
        - cells: ["5–7", "Quarter tablet daily"]
        - cells: ["8–14", "Half tablet daily"]
        - cells: ["≥15", "One full tablet daily"]
