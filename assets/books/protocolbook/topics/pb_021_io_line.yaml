# ============================================================
# ProtocolBook p.21 — Use of intra-osseous lines
#
# Procedural guide: callout indication + 9-step technique + anatomic
# illustration. Pure prose + image; no new schema.
#
# ✅ OE-VERIFIED CLEAN — NO CHANGES (Grey's OpenEvidence pass,
#    2026-07-26). Indication (all children in shock without IV access)
#    matches the 2025 AHA/AAP position that IO is a rapid, safe,
#    effective first-line access route. Technique verified against
#    Fiser 1990 NEJM: 15–18 G IO/marrow needle with the 16–21 G
#    hypodermic fallback (a sound LMIC adaptation), aspiration with a
#    5 mL syringe, 3 mL NS flush to confirm, and replacing the IO with
#    an IV within 8 h to limit osteomyelitis / compartment syndrome.
#    Our landmark wording ("antero-medial flat surface of tibia, at
#    the junction of upper and middle thirds") describes the same
#    proximal tibial metaphysis as the more common "1–3 cm below the
#    tibial tuberosity" phrasing — accepted as equivalent.
#
# ⚠️ NOTED, NOT CHANGED (OE rated LOW, acceptable): we say a strict
#    90° insertion angle. Classic manual-needle teaching is 60–90°,
#    angled slightly away from the growth plate; 90° is what powered
#    devices (EZ-IO) use. OE called 90° a reasonable simplification
#    for a pocket manual.
# ============================================================

topic:
  id: "pb-io-line"
  title: "Intra-osseous Line Placement"
  list_subtitle: "p.21 · technique + illustration"
  last_reviewed: "pocketbook v1.7"
  tags: ["io", "procedure", "vascular_access", "shock", "pediatric"]
  category: "critical_care"
  page_number: 21

  blocks:

    - type: "prose"
      highlight: true
      markdown: |
        **Use IO** for all children in shock if no IV access, to avoid delays in fluid therapy.

    - type: "prose"
      title: "Technique"
      markdown: |
        - **Needle:** IO or bone-marrow needle **15–18 G** (or **16–21 G** hypodermic if IO unavailable).
        - **Landmarks then prep:** identify landmarks, sterile gloves, sterilize site.
        - **Site:** middle of the antero-medial (flat) surface of tibia, at the junction of upper and middle thirds.
        - **Sterility:** antiseptic + sterile gauze (alcohol 70 %, iodine, or chlorhexidine).
        - **Insert:** bevel to toes, vertical (90°), advance slowly with rotating movement.
        - **Stop** when you feel a **sudden give** — then aspirate with a 5 ml syringe.
        - **Flush:** slowly inject 3 ml NS looking for leakage under the skin — if OK, attach IV fluid set and secure with dressings / strap.
        - **Boluses:** a 20 ml or 50 ml syringe may be needed.
        - **Watch** for leg / calf muscle swelling.
        - **Replace** IO access with IV within **8 hours**.

    - type: "image"
      path: "assets/books/protocolbook/images/pb_io_line.png"
      caption: "Site: antero-medial tibia, junction of upper and middle thirds. Needle perpendicular, bevel toward toes."
      size: "large"
