# ============================================================
# ProtocolBook p.20 — Resuscitation Medications
#
# Two stacked tables (Children, Adults), same medication ordering.
# Kept separate rather than merged into one 3-col table because
# medication names and dose instructions are both long; a 3-col
# layout at 393 px phone width would be cramped.
#
# ✅ OE-CONFIRMED CHANGES APPLIED (Grey's OpenEvidence pass, 2026-07-26):
#
#   1. 🔴 HIGH — THE ALTERNATIVE D10% RECIPE WAS WRONG. Printed
#      "4 ml D5% with 1 ml D50%" yields 700 mg in 5 ml = **D14%**, not
#      D10% — a 40% overshoot from a formula a clinician would trust
#      at the bedside. Corrected to **8 ml D5% with 1 ml D50%**.
#      ⚠️ NOTE: this is NOT the number OE suggested. OE proposed
#      9 ml D5% + 1 ml D50% and called it "≈ D9.5%, close enough".
#      Solving it exactly: (500x + 50y)/(x+y) = 100 → 400x = 50y →
#      y = 8x, so 1 ml D50% + 8 ml D5% = 9 ml of EXACTLY D10.00%.
#      Verified all four recipes arithmetically:
#        8 ml NS  + 2 ml D50% = 1000 mg /10 ml = D10.00%  (printed, ✓)
#        4 ml D5% + 1 ml D50% =  700 mg / 5 ml = D14.00%  (printed, ✗)
#        9 ml D5% + 1 ml D50% =  950 mg /10 ml = D 9.50%  (OE's)
#        8 ml D5% + 1 ml D50% =  900 mg / 9 ml = D10.00%  (applied)
#      Exact beats approximate for a mixing instruction, and it
#      mirrors the "8 + 2" shape already on the page. Grey should fix
#      the source PDF, and may want to sanity-check this deviation.
#
#   2. MODERATE — paediatric EPINEPHRINE had no ceiling. Added
#      "max 10 ml (= 1 mg)", matching the same fix on p.13.
#
# ✓ OE-VERIFIED, NO CHANGE: adult epinephrine 1 mg in 10 ml + 20 ml
#   flush; adult dextrose 50 ml of D50% (25 g); adult diazepam
#   0.15 mg/kg (≈10.5 mg at 70 kg, inside the 5–10 mg label range);
#   adult diazepam PR 4 supp (=10 mg, inside 10–20 mg); the PR
#   weight bands and the "DO NOT USE in neonates" warning; PRBC
#   10 ml/kg and whole blood 20 ml/kg ≈ 1 g/dL.
#
# ⚠️ OPEN — GREY'S CALL, NOT APPLIED (both dose changes OE hedged on):
#   - PAEDIATRIC DIAZEPAM IV 0.3 mg/kg exceeds the FDA-approved
#     0.2 mg/kg (max 8 mg), though WHO/LMIC references do use 0.3.
#     ⚠️ INTERNAL INCONSISTENCY I found while checking: 0.3 mg/kg is
#     also on p.42 (twice), but p.29 organophosphate says 0.2 mg/kg.
#     So the book already disagrees with itself. Whichever way Grey
#     goes, it must change in THREE places (here + p.42 ×2) or ONE
#     (p.29), not one. Adults are consistently 0.15 (here + p.101).
#   - PHENOBARBITAL: SETTLED 2026-08-30. OE ruled 20 mg/kg at EVERY
#     age, no milligram cap, repeat 10-20 mg/kg to a cumulative max of
#     40 mg/kg and only where respiratory monitoring is available,
#     maintenance 3-5 mg/kg/day starting 12-24 h after the load. This
#     page already said 20; the FORMULARY still said 15 mg/kg with a
#     320 mg cap, which underdoses anyone over 16 kg. Both books are
#     now on 20. Do not re-raise.
# 2026-08-29: D10 5 -> 2 mL/kg. MISSED BY THE 2026-08-28 SWEEP, which matched
#   "5 ml/kg" and not "5mls/kg", and worked from a fixed file list rather than
#   re-grepping afterwards. Found by diffing the formulary against the pages.
# ============================================================

topic:
  id: "pb-resuscitation-meds"
  title: "Resuscitation Medications"
  list_subtitle: "p.20 · pediatric & adult dosing"
  last_reviewed: "pocketbook v1.7"
  tags: ["medications", "resuscitation", "emergency", "dosing"]
  category: "critical_care"
  page_number: 20

  blocks:

    - type: "table"
      title: "Children"
      columns: ["Medication", "Dose"]
      rows:
        - cells:
            - "Epinephrine (Adrenaline)"
            - "**0.1 ml/kg of 0.1 mg/mL (1:10,000)** IV, **max 10 ml (= 1 mg)** · flush 10 ml NS · 🛑 Use 0.1 mg/mL (1:10,000) for IV/IO. If only 1 mg/mL (1:1,000) ampoules are stocked, dilute 1 ml in 9 ml NS to make 1:10,000 — giving 1:1,000 undiluted IV can be fatal"
        - cells:
            - "Dextrose 10%"
            - |
              **2 ml/kg** IV. Three ways to make it — they are **not** the same fluid:
              - **D10 in ~0.7% saline** (has sodium, ~123 mmol/L): 8 ml NS + 2 ml D50%
              - **D10 in water** (no sodium, free water): 1 ml D50% + 4 ml sterile water
              - **D10 in water**, if only D5% is at hand: 1 ml D50% + 8 ml D5%
              For a hypoglycaemia bolus any of these is fine. **If it will run on as maintenance fluid, know which one you made** — the saline version carries sodium, the others are free water
        - cells:
            - "Diazepam PR ~2.5 mg suppository"
            - |
              - < 10 kg: 1 supp (**DO NOT USE** in neonates)
              - 10 – 15 kg: 2 supp
              - 15 – 20 kg: 3 supp
              - 20 – 25 kg: 4 supp
        - cells:
            - "Diazepam IV"
            - "**0.2 mg/kg** IV slowly over 1 minute, **max 10 mg** · may repeat once after 5–10 min · **maximum 2 doses**, then phenobarbital"
        - cells:
            - "Phenobarbitone / Phenobarbital"
            - "**Load** 20 mg/kg IM/IV over 20 min (all ages) · if still fitting after 15 min give a further **10 mg/kg**, to a **cumulative max 40 mg/kg** — only where respiratory monitoring is available · **Maint** 3–5 mg/kg IM/IV/PO OD"
        - cells:
            - "Packed Red Blood Cells (PRBCs)"
            - "10 ml/kg (raise Hgb 1 g/dL)"
        - cells:
            - "Whole Blood (WB)"
            - "20 ml/kg (raise Hgb 1 g/dL)"

    - type: "table"
      title: "Adults"
      columns: ["Medication", "Dose"]
      rows:
        - cells:
            - "Epinephrine (Adrenaline)"
            - "1 mg IV in 10 ml NS — flush with 20 ml NS"
        - cells:
            - "Dextrose"
            - "50 ml IV of 50% (1 amp)"
        - cells:
            - "Diazepam PR 2.5 mg suppository"
            - "4 suppositories PR"
        - cells:
            - "Diazepam IV"
            - "0.15 mg/kg IV slowly over 1 minute"
        - cells:
            - "Phenobarbitone / Phenobarbital"
            - "**Load** 20 mg/kg IM/IV over 20 min · **Maint** 3–5 mg/kg IM/IV/PO OD"
        - cells:
            - "Packed Red Blood Cells (PRBCs)"
            - "1 unit (raise Hgb 1 g/dL)"
        - cells:
            - "Whole Blood (WB)"
            - "2 units (raise Hgb 1 g/dL)"
