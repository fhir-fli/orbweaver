# ============================================================
# ProtocolBook p.16 — Paediatric Emergency Estimation of Child's Weight
#
# Schema feature exercised:
#   - RowBlock: side-by-side layout for the age and height tables,
#     cutting ~250 px of vertical space vs. stacking.
#
# ✅ OE-VERIFIED CLEAN — NO CHANGES (Grey's OpenEvidence pass,
#    2026-07-26). Values judged reasonable approximations, broadly
#    consistent with WHO 50th-percentile weights. OE noted the general
#    caveat that length-based methods (Broselow, PAWPER) outperform
#    age-based ones — but our page already carries the two adjustments
#    that matter: the underweight rule (use 2 age-categories younger /
#    1 height-category above) and the "severe malnutrition — charts are
#    inaccurate" warning, which OE called critically important and
#    correctly highlighted. Limitations appropriately acknowledged;
#    no change recommended.
# 2026-08-24 — restored the print's two WORKED EXAMPLES of the underweight
# rule ("underweight 10-month-old → use 4-6 months"; "underweight at 100 cm →
# use 11-12 kg"). The rule was carried, the examples were not, and the examples
# are what make the rule usable at speed. Found by numeric parity
# (tool/book_number_parity.py) — 11-12 kg appeared nowhere in the app.
# ============================================================

topic:
  id: "pb-weight-estimation"
  title: "Paediatric Emergency Weight Estimation"
  list_subtitle: "p.16 · age/height → weight"
  last_reviewed: "pocketbook v1.7"
  tags: ["pediatric", "weight", "estimation", "emergency"]
  category: "universal"
  page_number: 16

  blocks:

    - type: "prose"
      markdown: |
        Measure weight on admission. Estimate weight **only if unstable**; verify as soon as stabilized.

    - type: "row"
      blocks:

        - type: "table"
          title: "By age"
          columns: ["Age", "Wt (kg)"]
          rows:
            - cells: ["1 – 3 wk", "3"]
            - cells: ["4 – 7 wk", "4"]
            - cells: ["2 – 3 mo", "5"]
            - cells: ["4 – 6 mo", "7"]
            - cells: ["7 – 9 mo", "9"]
            - cells: ["10 – 12 mo", "10"]
            - cells: ["1 – 2 yr", "11"]
            - cells: ["2 – 3 yr", "13"]
            - cells: ["3 – 4 yr", "15"]
            - cells: ["4 – 5 yr", "17"]

        - type: "table"
          title: "By height"
          columns: ["Height (cm)", "Wt (kg)"]
          rows:
            - cells: ["50 – 64.99", "4 – 6"]
            - cells: ["65 – 73.99", "7 – 8"]
            - cells: ["74 – 80.99", "9 – 10"]
            - cells: ["81 – 94.99", "11 – 12"]
            - cells: ["95 – 106.99", "13 – 15"]
            - cells: ["107 – 120.99", "16 – 19"]
            - cells: ["121 – 132.99", "20 – 24"]
            - cells: ["133 – 137.99", "25 – 28"]
            - cells: ["138 – 150", "29 – 36"]

    - type: "prose"
      markdown: |
        **Underweight:** use **2 age-categories younger** (e.g. an underweight
        10-month-old — use the weight for 4–6 months) or **1 height-category
        above** (e.g. underweight at 100 cm — use **11–12 kg**).

    - type: "prose"
      highlight: true
      markdown: |
        **Severe malnutrition — charts are inaccurate.**
