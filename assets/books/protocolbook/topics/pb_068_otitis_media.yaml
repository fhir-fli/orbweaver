# Throat group. This is item "I." under the printed section header
# "Ear, Nose and Throat Infections" (I. Otitis Media / II. Otitis
# Externa / III. Mastoiditis / IV. Pharyngitis / V. Sinusitis span
# pp.68–70) — each condition is authored as its own leaf.
#
# Structure: roman-numeral outline (Presentation / Examination /
# Diagnosis / Treatment) → titled prose per subsection (same pattern as
# the SAM topics), then the printed Normal-TM vs Acute-OM otoscopy
# comparison figure as an image asset.
#
# Faithful-rendering calls:
#   - Citation superscripts on the printed figure (53/54/55) left in the
#     cropped image (tiny corner marks; cropping them would clip image
#     content); the page number "68" was trimmed off.
#   - "Duration" (printed as treatment item d.iii) kept under Treatment.
#
# CONTENT FLAGS for the later OE / content pass (rendered faithfully):
#   - Diagnosis criteria mirror the AAP acute-otitis-media definition
#     (moderate/severe TM bulging, or mild bulging + recent-onset pain /
#     intense erythema, or new otorrhoea not from otitis externa).
#   - Amoxicillin dosing printed as "45mg/dose PO BD (max/adult 875mg/
#     dose)" — high-dose amox is 80–90 mg/kg/day divided BD, i.e.
