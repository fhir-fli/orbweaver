topic:
  id: "pb-sickle-cell"
  title: "Sickle Cell Disease"
  list_subtitle: "p.59 · admission + home meds"
  last_reviewed: "pocketbook v1.7"
  tags: ["sickle cell", "SCD", "hydroxyurea", "folic acid", "penicillin prophylaxis", "malaria prophylaxis", "priapism", "paediatric", "haematology"]
  category: "medical"
  page_number: 59

  blocks:

    - type: "prose"
      title: "Admit a child with Sickle Cell Disease if any of the following"
      markdown: |
        - Pain: moderate to severe
        - Severe pallor, Hgb <5, symptomatic with Hgb <7 or 2+ drop in Hgb from baseline
        - Fever with tachycardia, tachypnea, hypotension or >38.0 C
        - Chest pain, difficulty breathing
        - Acute (0–7 days) abnormal CNS signs (e.g. headache, drowsiness, paralysis or limb weakness)
        - Priapism (>4 hours)
        - RDT or B/S + for Malaria
        - Diarrhea and/or vomiting with abdominal pain, distension or inability to drink enough to stay hydrated
        - Neutropenia (granulocytes <1000) and fever

    - type: "prose"
      callout: true
      palette:
        alert: "0xFFD32F2F"
        alert_fill: "0xFFFDECEA"
        alert_text: "0xFFB71C1C"
      title: "Priapism >4 hours — this is ischaemic, treat it now"
      markdown: |
        Delay causes permanent impotence. Do **not** wait for transfusion — **RBC transfusion does not treat priapism.**

        - IV fluids and analgesia (opioids as needed)
        - If not resolved within 1 hour of supportive care: **aspirate** dark blood from the corpus cavernosum with a 19G butterfly needle, then **irrigate with normal saline**
        - If aspiration alone fails: **phenylephrine 100–500 mcg intracavernosal** (dilute 1mg in 19mL NS = 50 mcg/mL), repeat every 5 minutes, **maximum 1mg total**
        - Keep **atropine** at the bedside — phenylephrine can cause reflex bradycardia
        - Still not resolved: **urgent surgical referral for a shunt**

    - type: "prose"
      title: "Home Medications at time of Discharge"
      markdown: |
        - **Folic Acid** 1mg PO QD — **not 5mg.** 1mg covers the increased demand from chronic haemolysis, and high-dose folate antagonises the monthly sulfadoxine-pyrimethamine below (it rescues the parasite and roughly doubles antimalarial treatment failure)
        - **Penicillin VK**
          - <3yo: 125mg PO BD
          - 3–5yo: 250mg PO BD
        - **Malaria Prophylaxis**
          - Sulfadoxine-pyrimethamine (SP): 2–5yo ½ tab monthly; 5–10yo 1 tab monthly; 10–15yo 2 tabs monthly; >15yo 3 tabs monthly
          - Sulfur allergy: Consider erythromycin 250mg PO q12hrs
        - **Hydroxyurea**
          - Should ideally be managed by specialized treatment centre
          - Indications: Frequent crises **≥3/year**; pain interfering with activities of daily living; Abnormal Transcranial Doppler (TCD) Ultrasonography velocity >200cm/s; H/o of Acute Chest Syndrome; H/o Stroke
          - **All children from 9 months should be started on hydroxyurea.** Safety and efficacy in sub-Saharan African children are established (REACH, NOHARM)
          - Starting Dose: 20mg/kg PO QD
          - Decision by a senior health worker after CBC, renal and liver function tests
