# ✓ VERIFIED CURRENT (audit pass 2026-07-26):
#   - The maintenance infusion is right: mixing the TOTAL bolus load
#     into 250 mL run at 50 mL/hr (<25 kg) or 500 mL at 100 mL/hr
#     (>25 kg) both deliver the loading dose over 5 hours = 20 %/hr,
#     which sits at the top of the standard 10–20 %-of-loading-dose
#     per hour regimen. No change needed.
#   - Rectal diazepam bands work out to ~0.4–0.5 mg/kg across the
