# ============================================================
# ProtocolBook p.29 — Organophosphate / Carbamate poisoning
# (insecticides / nerve gas).
#
# HYBRID rendering (Grey's call 2026-07-08): the source is a
# content-flow diagram (boxes + arrows, NO decision points) →
# rendered as clean sequential titled prose + a small weight-band
# table, preserving all content and the top-to-bottom flow. The
# box/arrow visual carries no clinical info beyond ordering.
#
# Faithful-rendering calls:
#   - Citation superscripts (…gas)87,88, ingestion182–186 / 187,
#     atropinisation88,188) are print footnotes → dropped.
#   - SLUDGE-BBB mnemonic letters kept bold (they spell the aid).
#   - Rectal-diazepam weight bands rendered as a table.
#
# CONTENT FLAGS for the later OE / content pass (rendered faithfully
# now, NOT changed):
#   - No OXIME (pralidoxime / 2-PAM) mentioned. WHO/LMIC practice is
#     often atropine-centred (oxime benefit is debated, esp. late /
#     carbamate), so this is defensible — flag for OE to confirm
#     whether to add an "where available" oxime note.
#   - Atropine "double the previous dose q5min until atropinised" is
#     the standard escalating regimen — consistent with current tox.
#
# ✓ VERIFIED CURRENT (audit pass 2026-07-26):
#   - The maintenance infusion is right: mixing the TOTAL bolus load
#     into 250 mL run at 50 mL/hr (<25 kg) or 500 mL at 100 mL/hr
#     (>25 kg) both deliver the loading dose over 5 hours = 20 %/hr,
#     which sits at the top of the standard 10–20 %-of-loading-dose
#     per hour regimen. No change needed.
#   - Rectal diazepam bands work out to ~0.4–0.5 mg/kg across the
#     range ✓. IV diazepam 0.2 mg/kg (child) / 10 mg (adult) ✓.
#   - Atropinisation endpoints ✓ (has 3 of the usual 5 — dry axillae
#     and non-pinpoint pupils not printed; cosmetic).
#
# ✅ OE-RESOLVED 2026-07-27, NO CHANGE NEEDED: paediatric atropine 0.02 mg/kg
#    is what the 2025 AHA guideline table prints, and because the regimen
#    DOUBLES every 5 min the practical difference from a 0.05 mg/kg start is
#    one cycle. Keep 0.02. The pralidoxime prose block was reviewed and
#    called well-calibrated (AHA gives it Class 2b; a 2026 umbrella review
#    found neither clear benefit nor harm; atropine remains the mainstay).
#    Atropinisation endpoints match the AHA wording exactly.
#
# (historical) CONTENT FLAG — OPEN (audit pass 2026-07-26, awaiting OE):
#   - Paediatric atropine bolus printed 0.02 mg/kg. WHO uses 0.02
#     mg/kg, but a number of current tox references start children at
#     0.05 mg/kg in OP poisoning. Since the regimen doubles q5min the
#     practical difference is one cycle — low risk either way, but
#     worth an OE confirmation of the starting dose.
# ============================================================

topic:
  id: "pb-organophosphate"
  title: "Organophosphate / Carbamate Poisoning"
  list_subtitle: "p.29 · insecticides / nerve gas"
  last_reviewed: "pocketbook v1.7"
  tags: ["organophosphate", "carbamate", "insecticide", "cholinergic", "atropine", "poisoning"]
  category: "medical"
  page_number: 29

  blocks:

    - type: "prose"
      markdown: |
        - Children: common accidental ingestion
        - Adults: common purposeful ingestion
        - **Diagnosis is on a clinical basis**

    # 2026-08-24 — the print draws p.29 as a BRANCHING chart: the SLUDGE-BBB
    # diagnosis box forks into two parallel arms (atropine bolus ‖ diazepam for
    # convulsions), which rejoin at maintenance, with over-atropinisation
    # hanging off the side. It was flat prose. Rendered as `severity`, whose
    # branches are semantically flexible. The paediatric diazepam weight table
    # stays a table below the chart.
    - type: "flowchart"
      variant: "severity"
      entry_chain:
        - text: "Organophosphate / carbamate exposure — diagnosis is on a clinical basis"
          shape: "stadium"
        - text: "SLUDGE-BBB: Salivation · Lacrimation · Urination · Diarrhoea · Gastric cramping · Emesis · Bronchorrhoea · Bronchospasm · Bradycardia. Also profuse sweating, convulsions and coma, fasciculations, constricted pupils"
          shape: "rectangle"
      branches:
        - id: "atropine"
          label: "Treatment — atropine bolus"
          severity: "emergency"
          criteria:
            - "Children: 0.02 mg/kg IV"
            - "Adults: 2 mg IV"
          actions:
            - text: "Double the previous dose and repeat every 5 minutes until atropinisation"
              kind: "medication_administration"
              timing: "every 5 min"
            - text: "Endpoints: pulmonary secretions dry (improved oxygenation, easier breathing), pulse > 80/min, SBP > 80 mmHg"
              kind: "assessment"
        - id: "convulsions"
          label: "Convulsions — diazepam"
          severity: "priority"
          criteria:
            - "Children: rectal diazepam 2.5 mg suppositories by weight (table below)"
            - "Or IV diazepam 0.2 mg/kg (children), max 10 mg"
            - "Adults: 10 mg IV"
          actions:
            - text: "Repeat as necessary if convulsions occur"
              kind: "medication_administration"
      convergence:
        text: "Maintenance after atropinisation"
        shape: "rounded_rectangle"
        bullets:
          - text: "Mix the total atropine given as boluses into NS or D5%"
          - text: "Patients < 25 kg: 250 mL, run at 50 mL/hr"
          - text: "Patients > 25 kg: 500 mL, run at 100 mL/hr"
          - text: "Monitor hourly for recurrent symptoms or over-atropinisation, and adjust the rate"

    - type: "prose"
      title: "Rectal diazepam by weight"
      markdown: |
        **Children — rectal diazepam** (2.5 mg suppositories):

    - type: "table"
      columns: ["Weight", "Suppositories (2.5 mg)"]
      rows:
        - cells: ["< 10 kg", "1"]
        - cells: ["10–15 kg", "2"]
        - cells: ["15–20 kg", "3"]
        - cells: ["20–25 kg", "4"]

    - type: "prose"
      markdown: |
        - Or IV diazepam 0.2 mg/kg (children), max 10 mg
        - Adults: 10 mg IV
        - Repeat as necessary if convulsions occur

    - type: "prose"
      markdown: |
        **Pralidoxime (2-PAM) — where available:**

        - **Children:** 20–50 mg/kg (max 2 g) IV over 30 minutes, then 10–20 mg/kg/hr
        - **Adults:** 1–2 g IV over 30 minutes, then 500 mg/hr

        Uganda Clinical Guidelines 2023 includes it, but evidence of a mortality benefit is uncertain (Cochrane review; Eddleston placebo-controlled trial). **Atropine, given early and to the endpoints above, is what changes outcome.**

    - type: "prose"
      title: "Over-atropinisation"
      callout: true
      markdown: |
        Watch for over-atropinisation:
        - Urinary retention
        - Confusion / delirium
        - Hyperthermia
