# ============================================================
# ProtocolBook p.14 — Adult Cardiac Arrest Algorithm
#
# Schema features exercised:
#   - TopicBranch.continuation on the No-Pulse branch
#     (asymmetric flow — right branch terminates, left continues)
#   - entry_arrow_label "Every 2 minutes" labels the arrow from the
#     branch's action list into its first continuation node
#   - H's and T's as a plain two-column table block
#   - High-Quality CPR as a highlighted prose callout
#
# ✅ OE-CONFIRMED CHANGE APPLIED (Grey's OpenEvidence pass, 2026-07-26):
#   MODERATE — COMPRESSION RATE "at least 100/min" → "100–120/min".
#   The upper bound is clinically load-bearing, not decorative: rates
#   above 120/min are associated with reduced compression depth and
#   potentially worse outcomes, so an open-ended "at least" invites the
#   exact failure mode the 2025 AHA guidelines bound. This was the item
#   left pending from the Emergency batch — now confirmed and applied.
#   Same fix applied in step to p.15 (pb_015_cpr_summary).
#   Refs: Kleinman 2025 Circulation (Part 7, Adult BLS); Meaney 2013.
#
# ✓ OE-VERIFIED, NO CHANGE: epinephrine 1 mg IV in 10 mL NS with a
#   20 mL flush every 2 minutes / every other cycle; the "definite
#   pulse" branch at 1 breath every 6 seconds (correct for ADULTS —
#   note this differs from the paediatric rate, see p.13/p.15).
#
# ✅ RESOLVED by OE (2026-07-27): KEEP hypoglycaemia in the H's, but mark
#    it as a deliberate setting-specific addition. A one-line footnote was
#    added under the table. (My earlier advice was to add nothing; OE asked
#    for the footnote, so the footnote is what is printed.)
#
# (historical) OPEN item, now closed: HYPOGLYCAEMIA leads our H's
#   list. It was in the 2005 AHA H's and T's but was dropped from 2010
#   onward; the current standard is 5 H's (Hypovolaemia, Hypoxia,
#   Hydrogen ion, Hypo-/Hyperkalaemia, Hypothermia) and 5 T's. OE
#   judged keeping it DEFENSIBLE and appropriate for an LMIC manual
#   where hypoglycaemia is a more prevalent reversible cause, and noted
#   6 H's + 5 T's is fine as a deliberately expanded list. Kept as
#   printed; all other H's and T's verified standard. Now decided:
#   keep it, with the footnote.
# 2026-08-28 loop-renderer pass:
#   1. The ACLS chart is now variant: cycle - a real back-edge from the
#      2-minute rhythm check to CPR. It was drawn one-way, with the loop
#      implied only by an "Every 2 minutes" arrow label on a chain that never
#      returned.
#   2. EPINEPHRINE INTERVAL CORRECTED. Epinephrine sat inside the "Every 2
#      minutes" cycle node, so the page read as 1 mg every 2 minutes - roughly
#      double the AHA interval. p.13 (PALS) in this same book already prints
#      "Repeat epinephrine every 3-5 minutes". Now stated explicitly on both
#      the CPR node and the resume-CPR branch. VERIFIED against the published
#      sources, not asserted from memory: AHA ACLS gives 1 mg every 3-5 min
#      for both shockable and non-shockable rhythms, and the 2-minute figure
#      is the rhythm-check/compressor-change interval, not the drug interval.
#      Conflating the two is what the chart did.
#      ncbi.nlm.nih.gov/books/NBK613285 - 2019 AHA Focused Update on ACLS.
# ============================================================

topic:
  id: "pb-adult-cardiac-arrest"
  title: "Adult Cardiac Arrest"
  list_subtitle: "p.14 · ACLS branches"
  last_reviewed: "pocketbook v1.7"
  tags: ["acls", "adult", "cardiac_arrest", "cpr", "resuscitation", "emergency"]
  category: "critical_care"
  page_number: 14

  blocks:

    - type: "flowchart"
      variant: "cycle"
      # Fixed-cycle resuscitation (loop taxonomy 3): CPR 2 min -> rhythm and
      # pulse check -> still no pulse -> back to CPR. The chart used to draw
      # this one-way, with the loop implied only by an "Every 2 minutes" arrow
      # label on a continuation chain that never returned.
      nodes:
        - title: "Safe, Stimulate, Shout for Help — move patient to emergency area (as long as can be safely moved)"
        - shape: "decision"
          title: "CHECK PULSE: DEFINITE pulse palpated within 10 seconds?"
          down_label: "No pulse"
          branches:
            - label: "Definite pulse"
              side: "right"
              box:
                title: "Pulse present — support and monitor"
                severity: "priority"
                bullets:
                  - "Open, maintain airway"
                  - "1 breath every 6 seconds"
                  - "Recheck pulse every 2 min"
                  - "→ Post Cardiac Arrest Algorithm"
        - id: "cpr"
          title: "Begin CPR — 2 minutes"
          severity: "emergency"
          bullets:
            - "Continuous compressions until bag-valve mask available"
            - "30 compressions : 2 breaths"
            - "Attach O2 to bag-valve mask"
            - "Epinephrine 1 mg IV in 10 ml normal saline, followed by a 20 ml flush — **repeat every 3–5 minutes**, NOT every cycle"
            - "Identify and treat reversible causes (H's and T's below)"
        - shape: "decision"
          title: "After 2 minutes — change compressors, check pulse (≤ 10 sec) and rhythm. Pulse present?"
          down_label: "Yes — ROSC"
          branches:
            - label: "No"
              side: "left"
              box:
                title: "Resume CPR immediately"
                severity: "emergency"
                bullets:
                  - "Epinephrine only if 3–5 minutes have passed since the last dose"
                  - "Keep working through the reversible causes"
              loop_to: "cpr"
              loop_label: "every 2 min"
        - title: "→ Post Cardiac Arrest Algorithm"

    - type: "table"
      columns: []
      rows:
        - cells:
            - "**H**ypoglycaemia"
            - "**T**ension Pneumothorax"
        - cells:
            - "**H**ypovolemia"
            - "**T**amponade, cardiac"
        - cells:
            - "**H**ypoxia"
            - "**T**oxins"
        - cells:
            - "**H**ydrogen ion (acidosis)"
            - "**T**hrombosis, pulmonary"
        - cells:
            - "**H**ypo- / Hyperkalaemia"
            - "**T**hrombosis, coronary"
        - cells:
            - "**H**ypothermia"
            - ""

    - type: "prose"
      markdown: |
        Hypoglycaemia is not in the standard AHA list — it is kept here deliberately, as a common and readily reversible cause of arrest in this setting.

    - type: "prose"
      title: "High-Quality CPR"
      highlight: true
      markdown: |
        - **Compression rate** 100–120/min
        - **Compression depth** at least 5 cm
        - **Allow complete chest recoil** after each compression
        - **Minimize interruptions** in chest compressions to < 10 seconds
        - **Avoid excessive ventilation** — give just enough volume to produce visible chest rise. Give 2 breaths every 30 compressions, or 1 breath every 6 seconds if intubated.
