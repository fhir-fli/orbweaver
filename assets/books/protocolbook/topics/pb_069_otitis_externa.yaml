  title: "Otitis Externa"
  list_subtitle: "p.69 · ENT infections II"
  last_reviewed: "pocketbook v1.7"
  tags: ["otitis externa", "swimmer's ear", "ear canal", "ENT", "otoscopy", "cortisporin", "otalgia", "tragus", "paediatric"]
  category: "medical"
  page_number: 69

  blocks:

    - type: "prose"
      title: "Presentation"
      markdown: |
        - Otalgia, pruritus, pressure/fullness of ear canal, hearing loss, jaw pain, discharge, redness/erythema, swelling/edema

    - type: "prose"
      title: "Examination"
      markdown: |
        Need to perform otoscopy as well.

        - Pain with tragus/pinna movement
        - Erythema/edema of ear canal
        - Cellulitis
        - Discharge from canal
        - **Manipulation of the external ear is generally painful in otitis externa, but not in otitis media**

    - type: "prose"
      title: "Treatment"
      markdown: |
        **Topical antibiotic:**

        - 🛑 **Look at the eardrum first. If it is perforated — or you cannot see it — DO NOT use neomycin.** Neomycin is an aminoglycoside and is **ototoxic** if it reaches the middle ear: it can cause permanent hearing loss. A discharging ear is exactly the one at risk
        - **Perforated, or unable to exclude perforation:** use a **fluoroquinolone drop — ciprofloxacin or ofloxacin**, 3–4 drops to the affected ear 8 hourly x 7–10 days. These are not ototoxic
        - **Eardrum intact:** Neomycin/Polymyxin B/Hydrocortisone (Cortisporin Otic) 3–4 drops to affected ear 8 hourly x 7–10 days
        - **If the canal is too swollen for drops to get in, place an ear wick** and clean the canal (aural toilet) — drops into a blocked canal do nothing
        - Give analgesia — paracetamol or ibuprofen
        - Educate about keeping the ear dry
