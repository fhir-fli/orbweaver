# ============================================================
# ProtocolBook p.24 — Malaria: Uncomplicated Rx
# PO regimens for outpatient treatment of uncomplicated malaria.
# Three weight-band dosing tables: Coartem, Artesunate/Amodiaquine,
# and DHA/Piperaquine.
#
# ✅ OE-VERIFIED CLEAN — NO CHANGES (Grey's OpenEvidence pass,
#    2026-07-26). ALL THREE weight-band tables checked row by row and
#    confirmed correct per WHO:
#      Coartem      5–14 kg 1 tab BID · 15–24 kg 2 · 25–34 kg 3 ·
#                   >35 kg 4, all × 3 days ✓
#      Artesunate/Amodiaquine — matches the WHO-prequalified
#                   fixed-dose combination bands ✓
#      DHA/Piperaquine — matches WHO exactly ✓
#    The "first two doses 8 hours apart" note is correct per WHO ✓.
#    The high-fat-meal warning for DHA/piperaquine was specifically
#    confirmed and matters: a high-fat meal can raise piperaquine
#    bioavailability ~3-fold, and piperaquine prolongs QTc — so this
#    is a cardiotoxicity precaution, not a tolerability note. (Small
#    amounts of fat in ordinary meals do not meaningfully change
#    exposure.) Refs: Reuter 2015; Chan 2018 Lancet ID; Annerberg 2011.
# ============================================================

topic:
  id: "pb-malaria-uncomplicated"
  title: "Malaria — Uncomplicated Rx"
  list_subtitle: "p.24 · PO regimens (outpatient)"
  last_reviewed: "pocketbook v1.7"
  tags: ["malaria", "uncomplicated", "coartem", "outpatient", "dosing", "pediatric"]
  category: "medical"
  page_number: 24

  blocks:

    - type: "prose"
      markdown: |-
        **Investigation**
        a) Blood slide (BS) for malaria parasites
        b) ± Haemoglobin estimation

        **Treatment** (outpatient)
        - Same regimen that complicated malaria should end with
        - Treat infants weighing **< 5 kg** as children weighing **5 kg**

    - type: "table"
      title: "1st line — Artemether / Lumefantrine (Coartem®)"
      columns: ["Weight (kg)", "Regimen for 3 days*", "Colour"]
      rows:
        - cells:
            - text: "5–14"
            - text: "1 tab twice a day"
            - text: "Yellow"
        - cells:
            - text: "15–24"
            - text: "2 tabs twice a day"
            - text: "Blue"
        - cells:
            - text: "25–34"
            - text: "3 tabs twice a day"
            - text: "Brown"
        - cells:
            - text: "> 35"
            - text: "4 tabs twice a day"
            - text: "Green"

    - type: "prose"
      markdown: |-
        \* First two doses should ideally be given **8 hours apart**.

    - type: "table"
      title: "Alt — Artesunate / Amodiaquine"
      columns: ["Weight (kg)", "Dose (3 days)", "Colour"]
      rows:
        - cells:
            - text: "4.5 – < 9"
            - text: "25/67.5 mg · 1 tab daily (3-tab blister)"
            - text: "Yellow"
        - cells:
            - text: "9 – < 18"
            - text: "50/135 mg · 1 tab daily (3-tab blister)"
            - text: "Blue"
        - cells:
            - text: "18 – < 36"
            - text: "100/270 mg · 1 tab daily (3-tab blister)"
            - text: "Brown"
        - cells:
            - text: "> 36"
            - text: "100/270 mg · 2 tabs daily (6-tab blister)"
            - text: "Green"

    - type: "table"
      title: "Alt — Dihydroartemisinin / Piperaquine"
      columns: ["Weight (kg)", "DHA / Piperaquine dose (mg) daily × 3 days"]
      rows:
        - cells: [ { text: "5 – <8" }, { text: "20 / 160" } ]
        - cells: [ { text: "8 – <11" }, { text: "30 / 240" } ]
        - cells: [ { text: "11 – <17" }, { text: "40 / 320" } ]
        - cells: [ { text: "17 – <25" }, { text: "60 / 480" } ]
        - cells: [ { text: "25 – <36" }, { text: "80 / 640" } ]
        - cells: [ { text: "36 – <60" }, { text: "120 / 960" } ]

    - type: "prose"
      markdown: |-
        **High-fat meals should be avoided with dihydroartemisinin / piperaquine.**
