#
# Two-page topic (`pages:`): p.82 = fluid-requirement table + total-
# fluids calculations + well-baby feeding; p.83 = enteral feeding +
# OGT/NGT indications + VLBW vitamin supplementation. Content-flow
# (no decision branch) → titled prose + a table.
#
# Faithful-rendering calls:
#   - Fluid table (ml/kg/day by day of life, <1500 g vs >1500 g) as a
#     `table`; units stated in the title (the printed header omits
#     them).
#   - Abbreviations kept as the book uses them (D10% = 10% dextrose,
#     MRL = the book's maintenance-feed level term, EBM = expressed
#     breast milk, BW = birth weight, IVF = IV fluids, OGT/NGT = oro-/
#     naso-gastric tube, LBW/VLBW = low / very low birth weight).
#   - bilitool.org link on the jaundice page (p.88), not here.
#   - Citation superscripts dropped.
#
# CONTENT FLAGS for the later OE / content pass (rendered faithfully):
#   - Perinatal-asphyxia NPO×24 h + IVF 50 ml/kg/day (fluid restriction)
#     is standard HIE practice. Vitamin D 400 IU/day + iron 2–4 mg/kg/day
#     from 2 weeks for VLBW are standard preterm supplements.
#   - "Bottle feed not recommended" (cup/spoon/tube preferred) is WHO/
#     LMIC breastfeeding-protection practice.
