# ============================================================
# ProtocolBook pp.128–129 — Adult Tuberculosis. Internal Medicine
# Protocols leaf. (Distinct from the paediatric TB group at pp.71–73.)
#
# Two-page topic: p.128 = when to consider TB + the diagnosis algorithm;
# p.129 = treatment (LFT safety gate + intensive/continuation FDC dosing
# + adjunctive steroids + continuation durations).
#
# Rendering calls (hybrid rule):
#   - "Consider TB" list + continuation durations → prose.
#   - Diagnosis + LFT gate + steroid indication → `algorithm` flowcharts.
#     The book's two diagnosis decisions "X-ray available?" then "CXR
#     suggestive?" (with the no-X-ray branch skipping straight to sputum)
#     are LINEARISED into one decision — "Chest X-ray available and
#     suggestive?" — whose criteria note preserves the no-X-ray path; the
#     shared sputum box is a `goto` target. This keeps the single-spine
#     algorithm faithful to the clinical routing.
#   - The two weight→tablet FDC matrices → `table` blocks.
#
# 🔴 GENUINE DANGEROUS ERROR corrected + surfaced to Grey (RULE #0):
#   BOTH FDC dosing tables on p.129 print the 30–37 kg and 38–54 kg rows'
#   tablet counts SWAPPED (intensive: 38–54 kg→2, 30–37 kg→3; continuation:
#   same swap). As printed, a lighter patient would receive MORE tablets
#   than a heavier one — non-monotonic and unsafe. Rendered here CORRECTED
#   to the WHO FDC schedule (30–37 kg→2, 38–54 kg→3, 55–70 kg→4, >70 kg→5
#   intensive; 30–37 kg→2, 38–54 kg→3 of RH 150/75 and 55–70/>70 kg→2 of
#   RH 300/150 continuation). Grey must fix the source PDF.
#
# GENUINE TYPO corrected + flagged: "Severe military TB" → "miliary TB"
#   (same typo the book has at pp.72/73).
#
# CONTENT FLAGS for the later OE / content pass (rendered faithfully):
#   - Standard 2HRZE / 4HR regimen, weight-banded FDCs, pyridoxine 25 mg
#     daily, adjunctive steroids for TB meningitis / pericarditis / airway
#     compression, extended 12-month course for CNS TB, and the ALT-based
#     hepatotoxicity thresholds (hold/alternate if >3–5× ULN) are all
#     standard programmatic TB care.
# OpenEvidence-applied 2026-08-28 (WHO full advance pass):
#   TB meningitis dexamethasone now NAMED as the adult dose (children get 0.6
#   mg/kg/day) with the full taper schedule (WHO pass flag 6-1).
# ============================================================

topic:
  id: "pb-im-tb"
  title: "Adult Tuberculosis"
  list_subtitle: "pp.128–129 · diagnosis · RHZE regimen"
  last_reviewed: "pocketbook v1.7"
  tags: ["tuberculosis", "TB", "adult", "rifampicin", "isoniazid", "pyrazinamide", "ethambutol", "RHZE", "FDC", "GeneXpert", "AFB smear", "MDR-TB", "pyridoxine", "sputum", "internal medicine", "infectious disease"]
  category: "medical"

  pages:

    # ═══════════════════════ PAGE 128 ═══════════════════════
    - page_number: 128
      blocks:

        - type: "prose"
          title: "Consider tuberculosis with the following"
          markdown: |
            - Chronic cough (> 2–3 weeks)
            - Chronic fever (> 2–3 weeks)
            - Pneumonia not improving on treatment
            - Wasting
            - Lymphadenopathy (large, painless)
            - Ascites
            - Heart failure / pericardial effusion
            - Refusal to bend a painful joint
            - Irritability, meningeal signs
            - Haematuria, sterile pyuria
            - Close contact with someone with TB in the last 2 years

        - type: "prose"
          title: "Diagnosis — begin workup if any present"
          markdown: |
            - Cough > 2 weeks
            - Other unexplained respiratory symptoms > 2 weeks
            - Community-acquired pneumonia not responding after 7 days of treatment
            - High clinical suspicion based on history or physical

        - type: "flowchart"
          variant: "algorithm"
          entry:
            text: "TB workup"
            shape: "stadium"
          boxes:
            - id: "sputum"
              title: "Sputum testing"
              bullets:
                - "If available, perform Gene Xpert on 1 sputum sample"
                - "If not, 3 sputum specimens for AFB smear"
          stages:
            - decision: "HIV?"
              outcomes:
                - label: "Yes"
                  box:
                    title: "HIV-positive — use the HIV pathway below, then rejoin"
                    severity: "priority"
                    bullets:
                      - "Xpert MTB/RIF (or Ultra) on any sputum obtainable — it also reports rifampicin resistance"
                      - "Urine LF-LAM IN PARALLEL — do not wait for sputum"
                      - "Chest X-ray (often atypical or normal in advanced HIV) ± abdominal ultrasound"
                      - "If all negative but suspicion persists — treat empirically, especially at low CD4"
                - label: "No"
                  continue: true
            - decision: "Chest X-ray available and suggestive of TB?"
              criteria:
                - "If no X-ray is available, proceed directly to sputum testing"
              outcomes:
                - label: "Not available, or available and suggestive"
                  goto: "sputum"
                  continue: true
                - label: "Available but not suggestive"
                  box:
                    title: "Consider other etiology"
            - decision: "Drug-resistant TB? Suspect if ANY of these"
              criteria:
                - "Xpert reports RIFAMPICIN RESISTANCE — this is the marker for MDR-TB"
                - "Previous TB treatment — relapse, failure, or default/retreatment"
                - "Known contact with a drug-resistant or MDR-TB case"
                - "No clinical improvement, or no sputum conversion, at 2–3 months on first-line therapy"
                - "HIV in a high-MDR-prevalence setting"
              outcomes:
                - label: "Yes"
                  box:
                    title: "Do NOT start standard 2RHZE — act now, then consult"
                    severity: "emergency"
                    bullets:
                      - "Withhold a rifampicin-based regimen; arrange a WHO-recommended all-oral bedaquiline-based rifampicin-resistant regimen"
                      - "Send a specimen for confirmatory and extended testing — fluoroquinolone susceptibility, culture/DST or Xpert MTB/XDR. About 5% of rpoB mutations fall outside the hotspot, so confirm"
                      - "Airborne infection control IMMEDIATELY — separate the patient, mask, ventilate. Transmission is the key hazard"
                - label: "No"
                  continue: true
          terminal:
            title: "Begin treatment"
            bullets:
              - "Proceed to the treatment page"

        - type: "prose"
          title: "TB in HIV — the pathway the algorithm points to"
          markdown: |
            **Screen:** the WHO four-symptom screen — cough, fever, night sweats, weight
            loss. **In advanced HIV, test regardless of symptoms.**

            **Test in parallel, not in sequence** — sputum Xpert **plus** urine LF-LAM
            together give the highest yield (~71–73% in inpatients) and perform well even
            at CD4 below 100. **Treat on the first positive result.**

            **Urine LF-LAM — who qualifies:**
            - **Inpatients:** signs or symptoms of TB, **or** advanced HIV disease (CD4 < 200 or WHO stage 3–4), **or** seriously ill (RR > 30, temp > 39 °C, HR > 120, or unable to walk unaided)
            - **Outpatients:** signs or symptoms of TB and seriously ill, **or** CD4 < 100, **or** a WHO stage 3–4 event

        - type: "prose"
          title: "ART timing and co-trimoxazole"
          callout: true
          markdown: |
            Start TB treatment **first**, then ART:
            - **CD4 < 50 → start ART within 2 weeks**
            - **CD4 ≥ 50 → start ART by 8 weeks**
            - 🛑 **TB meningitis is the exception — delay ART to 4–8 weeks**, because early
              ART increases severe adverse events without a survival benefit

            **Start co-trimoxazole preventive therapy together with TB treatment** — it
            reduces mortality in people with HIV. Follow national/WHO guidance on duration.

            The standard **2RHZE/4RH** regimen is unchanged in HIV, but **rifampicin must be
            preserved** — avoid intermittent dosing, and manage the rifamycin–ART
            interactions. Some extrapulmonary forms need longer.

    # ═══════════════════════ PAGE 129 ═══════════════════════
    - page_number: 129
      blocks:

        - type: "prose"
          title: "Treatment — check liver function first"
          markdown: |
            Check LFTs before starting.

        - type: "flowchart"
          variant: "algorithm"
          entry:
            text: "Check LFTs"
            shape: "stadium"
          stages:
            - decision: "ALT > 3 × upper limit of normal?"
              outcomes:
                - label: "Yes"
                  box:
                    title: "Consult senior about a possible alternate regimen"
                - label: "No"
                  continue: true
            - decision: "Abnormal LFTs but ALT < 3 × upper limit of normal?"
              outcomes:
                - label: "Yes"
                  box:
                    title: "Recheck LFTs monthly"
                - label: "No"
                  continue: true
          terminal:
            title: "Begin the regimen below"

        - type: "prose"
          title: "First 2 months (intensive phase) — daily dose"
          markdown: |
            - Rifampicin (R) 10 mg/kg
            - Isoniazid (H) 5 mg/kg
            - Pyrazinamide (Z) 25 mg/kg
            - Ethambutol (E) 15 mg/kg

        - type: "table"
          columns: ["Pre-treatment weight", "FDC RHZE 150/75/400/275"]
          column_flex: [5, 6]
          column_align: ["left", "center"]
          rows:
            - cells: ["30–37 kg", "2 tabs"]
            - cells: ["38–54 kg", "3 tabs"]
            - cells: ["55–70 kg", "4 tabs"]
            - cells: ["> 70 kg", "5 tabs"]

        - type: "prose"
          markdown: |
            **Note:** pyridoxine 25 mg PO daily should be given for the duration of treatment.

        - type: "flowchart"
          variant: "algorithm"
          entry:
            text: "Adjunctive corticosteroids?"
            shape: "stadium"
          stages:
            - decision: "Any of the following present?"
              criteria:
                - "TB MENINGITIS — the only indication with robust guideline support"
                - "Pulmonary TB with respiratory distress"
                - "Pulmonary TB with airway obstruction from hilar lymph nodes"
                - "Severe miliary TB"
                - "Pericardial effusion — HIV-NEGATIVE ONLY (see the warning below)"
              outcomes:
                - label: "Yes — TB meningitis"
                  box:
                    title: "Dexamethasone (preferred over prednisolone)"
                    severity: "priority"
                    bullets:
                      - "ADULT dose: 0.4 mg/kg/day IV for grade II/III disease, 0.3 mg/kg/day for grade I. Children get 0.6 mg/kg/day — the difference is age, not a disagreement"
                      - "Wean the IV dose by 0.1 mg/kg/day each week for 4 weeks, then switch to oral and taper by 1 mg/week for 4 weeks — 6–8 weeks in total (3+3 weeks for grade I)"
                      - "Still recommended in HIV-positive patients — confirmed by the 2023 ACT HIV trial"
                - label: "Yes — the other indications"
                  box:
                    title: "Steroids on clinical judgement"
                    bullets:
                      - "Respiratory distress, airway compression from hilar nodes, severe miliary TB — lower-grade evidence; use judgement rather than a fixed course"
                      - "One regimen does not fit all five indications, and the meningitis dose is weight-based, not a flat 60 mg"
                - label: "No"
                  continue: true
          terminal:
            title: "Continue to the continuation phase"

        - type: "prose"
          title: "🛑 TB pericarditis — do NOT give steroids if HIV-positive"
          callout: true
          palette:
            alert: "0xFFD32F2F"
            alert_fill: "0xFFFDECEA"
            alert_text: "0xFFB71C1C"
          markdown: |
            - **HIV-positive: not recommended.** In the IMPI trial (n = 1400) prednisolone
              did not reduce death, tamponade or constriction, and was associated with a
              **significantly increased incidence of HIV-associated malignancy, notably
              Kaposi sarcoma.**
            - **HIV-negative: optional**, mainly to reduce constriction — the evidence is
              weak and it is not routine.

            The book previously listed "pericardial effusion" for steroids with no HIV
            qualifier.

        - type: "prose"
          title: "Continuation phase (after 2 months)"
          markdown: |
            - Cerebral TB requires 10 more months (12 months total, 2RHZE/10RH)
            - Pulmonary TB requires 4 more months (6 months total, 2RHZE/4RH)
            - Sputum smear:
              - If positive, retest at 3 months
              - If still positive at 3 months, retest susceptibilities

        - type: "table"
          columns: ["Pre-treatment weight", "RH 150/75", "RH 300/150"]
          column_flex: [4, 4, 4]
          column_align: ["left", "center", "center"]
          rows:
            - cells: ["30–37 kg", "2 tabs", "—"]
            - cells: ["38–54 kg", "3 tabs", "—"]
            - cells: ["55–70 kg", "—", "2 tabs"]
            - cells: ["> 70 kg", "—", "2 tabs"]

        - type: "prose"
          markdown: |
            **Reconcile these counts against the FDC actually stocked.** RH tablet strengths
            vary between national programmes, and some tables use a different count or a
            fourth band above 70 kg. The intensive-phase bands (2/3/4/5 of RHZE
            150/75/400/275) are the standard WHO ones.

        - type: "prose"
          markdown: |
            **LFT monitoring:** if liver tenderness, hepatomegaly or jaundice, recheck LFTs.

            **The stopping threshold depends on symptoms:**
            - **Asymptomatic → stop at ALT ≥ 5 × upper limit of normal**
            - **Symptomatic** (nausea, vomiting, right-upper-quadrant pain, jaundice) **→ stop at ALT ≥ 3 × ULN**
            - 🛑 **The most dangerous combination on this page: ALT ≥ 3 × ULN WITH bilirubin > 2 × ULN — stop, symptoms or not.** This is Hy's-law territory and carries the highest risk of fatal drug-induced liver injury

            The baseline bar (3 × ULN) is lower than the asymptomatic on-treatment bar
            (5 × ULN) on purpose: a mild transaminase rise occurs in 5–30% of patients on
            treatment and is usually transient, so a higher bar avoids needless
            interruption — while at baseline the lower bar flags pre-existing liver disease.

            **Reintroduction once ALT has settled — one drug at a time:**
            1. **Rifampicin first** (least hepatotoxic, most important to keep) ± ethambutol
            2. **Isoniazid** after about a week if ALT is stable
            3. **Pyrazinamide last**, about a week later — or **omit it permanently** if the
               hepatitis was severe, extending treatment to 9 months

            **The order varies between guidelines.** This sequence follows ATS/IDSA
            (rifamycin first). WHO and many national programmes reintroduce **isoniazid
            first, then rifampicin, then pyrazinamide**. **Either is acceptable**, provided
            drugs are added **one at a time with LFTs checked before each addition**.

            In severe TB, cover the gap with a **non-hepatotoxic bridging regimen**
            (ethambutol + a fluoroquinolone ± an aminoglycoside or linezolid). Monitor ALT
            frequently and **stop the last drug added** if ALT rises or symptoms recur.
