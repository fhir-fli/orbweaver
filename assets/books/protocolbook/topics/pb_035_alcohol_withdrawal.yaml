# ============================================================
# ProtocolBook p.35 — Alcohol Withdrawal.
#
# Top half = definition + a formal stages outline (Stage 1 minor
# symptoms → Stage 2 alcoholic hallucinosis → Stage 3 withdrawal
# seizures → Stage 4 delirium tremens).  Bottom half = a TRUE
# decision flowchart (Wernicke concern? → thiamine; CIWA-Ar ≥10? →
# lorazepam, with BOTH branches looping back to re-scoring) → the
# `algorithm` variant per the hybrid rule.
#
# Faithful-rendering calls:
#   - Citation superscript (management 27) dropped.
#   - Stage numbering is semantic (temporal sequence) → kept as bold
#     "Stage N" leads; the a/b sub-labels dropped (indentation).
#   - The management box (monitor/vitals/GCS/IVs) precedes the first
#     decision on the printed chart; rendered as the flowchart
#     `entry`-adjacent titled prose section above it (same order).
#   - The two reevaluate loop-backs (q5–10 min after lorazepam,
#     q15–30 min if <10) are textual "→ recalculate CIWA-Ar" pointers
#     per the standing no-drawn-back-arrow rule; both branches carry
#     (continue ↓) to the once-stable wean terminal, mirroring the
#     book's single down-arrow to that box.
#   - Flowchart boxes are plain text (no links) → the CIWA-Ar scale
#     cross-link lives in the prose line above the chart; the scale
#     (p.36) links back.  Final "concern for more?" box rendered as a
#     titled prose section (as on p.34) with the live altered-mental-
#     status link.
#
# ✅ OE-CONFIRMED CHANGES APPLIED (Grey's OpenEvidence pass, 2026-07-26):
#   Both were rated MODERATE severity — they affect management of a
#   life-threatening condition.
#
#   1. WERNICKE SCREENING CRITERIA were incomplete. The decision node
#      listed only "ataxia / ophthalmoplegia". The classic triad is
#      CONFUSION + oculomotor dysfunction + ataxia, and the full triad
#      appears in only ~10% of cases (the more sensitive Caine criteria
#      need just 2 of 4: dietary deficiency, oculomotor abnormality,
#      cerebellar dysfunction, altered mental status). "Confusion"
#      added to the parenthetical; order now mirrors the stated triad.
#      Refs: Sinha 2019 Mayo Clin Proc; Li 2025 Front Neurol; ASAM 2020.
#
#   2. THIAMINE DOSE was prophylaxis-only on a treatment trigger.
#      100 mg IV daily is the ASAM PROPHYLAXIS dose (3–5 days); this
#      node is fired by concern for Wernicke's, which warrants
#      100–200 mg IV THREE TIMES DAILY for 3 days then oral. The box
#      now carries both, labelled, so the malnourished-but-no-signs
#      patient still gets the lower prophylactic regimen.
#      (My original flag proposed 500 mg IV TDS per RCP/EFNS; OE
#      landed on 200 mg IV TID — OE's value is what is applied.)
#
# ✓ OE-VERIFIED, NO CHANGE: stage timings 1–4 and the "stages may not
#   go in order" caveat (ASAM — seizures can occur without preceding
#   mild symptoms); lorazepam 2 mg IV; CIWA-Ar ≥10 treatment threshold
#   (moderate withdrawal = 10–18); q5–10 min reassessment; wean to
#   q2–4h prn.
#
# ⚠️ GENUINE SOURCE TYPO corrected (surfaced to Grey 2026-07-13):
#   - Stage 4 printed "delirium trements" — spelling typo for
#     "delirium tremens" (verified on the 300 dpi render).  Corrected
#     here (searchability matters); source PDF should be fixed too.
# Cross-book pass 2026-08-28: oxygen trigger 94% -> 90%. A routine 94%
#   trigger commits oxygen to a much larger group without mortality benefit,
#   and oxygen is the most rationed resource in this setting. The other book
#   used 90% throughout and this book already used 90% on its paediatric
#   pneumonia page. Discharge/target criteria on other pages are NOT this
#   figure and were left alone.
# 2026-08-29: dropped "(next page)" after the CIWA-Ar link. In the print the
#   scale is on the facing page; in the app it is a SEPARATE TOPIC reached by
#   the link, and there is no next page to turn. The other seven "(next page)"
#   references in the book were checked and are correct: each points within a
#   multi-page topic, which the app does paginate (topic_view.dart iterates
#   topic.pages), so the reader really does swipe to the next page.
# ============================================================

topic:
  id: "pb-alcohol-withdrawal"
  title: "Alcohol Withdrawal"
  list_subtitle: "p.35 · stages + CIWA-Ar algorithm"
  last_reviewed: "pocketbook v1.7"
  tags: ["alcohol", "ethanol", "withdrawal", "delirium tremens", "seizure", "ciwa", "lorazepam", "thiamine", "wernicke"]
  category: "medical"
  page_number: 35

  blocks:

    - type: "prose"
      markdown: |
        Occurs when a patient stops drinking alcohol after a period of drinking large amounts over a prolonged time.

    - type: "prose"
      title: "Stages"
      markdown: |
        Not all patients have all stages, stages may not go in order.

        - **Stage 1 — minor symptoms**
          - 6–12 hours after stopping
          - Tremors, agitation, lack of appetite, nausea, vomiting, anxiety, sweating, restlessness
        - **Stage 2 — alcoholic hallucinosis**
          - 12–24 hours after stopping
          - Hallucinations may occur
        - **Stage 3 — withdrawal seizures**
          - 24–48 hours after stopping (occasionally sooner)
          - Usually tonic-clonic
        - **Stage 4 — delirium tremens**
          - 3–7 days after stopping (up to 14 days after)
          - Hallucinations (usually visual), confusion, tachycardia, hypertension, agitation, sweating

    - type: "prose"
      title: "Management of alcohol withdrawal"
      markdown: |
        - Monitor, support ABCs
        - Check vital signs (BP, PR, RR, spO2, Temp, Weight)
        - Assess GCS, hydration status
        - Insert 2 IVs, Start Oxygen if spO2 <90%

        Score withdrawal severity with the [CIWA-Ar Scale](topic:pb-ciwa-ar).

    - type: "flowchart"
      variant: "cycle"
      # Reassessment loop: CIWA-Ar is re-scored, and BOTH branches (treat with
      # lorazepam, or wait) loop back UP to the re-score hub; the only exit is
      # straight down ("once stable").  Matches the printed p.35 layout.
      nodes:
        - title: "Concern for Wernicke's encephalopathy (confusion / ophthalmoplegia / ataxia), or patient appears severely malnourished?"
          branches:
            - label: "Yes"
              side: "right"
              box:
                title: "Thiamine IV (if available)"
                bullets:
                  - "Suspected Wernicke's: 200mg IV TID × 3 days, then oral"
                  - "Prophylaxis only (malnourished, no Wernicke's signs): 100mg IV daily × 3–5 days"
        - id: "rescore"
          title: "Calculate CIWA-Ar Score"
          bullets:
            - "Clinical Institute Withdrawal Assessment — Alcohol, revised (see link above)"
        - shape: "decision"
          title: "CIWA-Ar ≥ 10?"
          down_label: "once stable"
          branches:
            - label: "No"
              side: "left"
              box:
                title: "Reevaluate q15–30 min"
                bullets:
                  - "then re-score"
              loop_to: "rescore"
            - label: "Yes"
              side: "right"
              box:
                title: "Lorazepam 2mg IV"
                bullets:
                  - "reassess q5–10 min → re-score"
                severity: "priority"
              loop_to: "rescore"
        - title: "Continue to monitor"
          bullets:
            - "Once stable begin to wean Lorazepam 2mg IV to q2–4hrs prn"

    - type: "prose"
      title: "Concern for more than solely alcohol intoxication?"
      markdown: |
        - Follow [altered mental status protocol](topic:pb-altered-mental-status)
        - Possible tests for disorders related to alcohol or with a similar presentation
          - BMP, Magnesium, Liver Functions, Lipase
