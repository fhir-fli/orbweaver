  blocks:

    - type: "prose"
      title: "Syncope"
      markdown: |
        - **Good and complete history and physical**
          - Include circumstances: changes in medication, dehydration, defecation, urination, coughing, pain, heat exposure, standing outside for long periods of time, head rotation, pressure on carotid sinus (such as shaving), exercise, shortness of breath
        - Check RBS, CBC, pregnancy test
        - Consider convulsions (but remember shaking alone does not mean convulsion — non-convulsive shaking is common after syncope)
        - 12-lead ECG; ECHO if concerning murmur, or if syncope occurred during exercise or was associated with chest pain
        - Electrolytes **only** in patients with high likelihood of abnormalities
        - If above are all within normal limits, including VS, may be safely discharged home
