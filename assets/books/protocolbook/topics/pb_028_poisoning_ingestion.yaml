#     mL/kg/hr ≈ 0.07–0.14 g/kg/hr maintenance — both textbook, and
#     the LMIC-appropriate choice), but TWO pillars of methanol
#     management are absent: (a) FOLINIC / FOLIC ACID (accelerates
