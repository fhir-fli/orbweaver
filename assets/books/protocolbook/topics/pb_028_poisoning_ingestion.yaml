topic:
  id: "pb-poisoning-ingestion"
  title: "Poisoning / Ingestion — Suspected Acutely Poisoned Patient"
  list_subtitle: "p.28 · initial algorithm"
  last_reviewed: "pocketbook v1.7"
  tags: ["poisoning", "ingestion", "toxicology", "toxidrome", "antidote"]
  category: "medical"
  page_number: 28

  blocks:

    - type: "prose"
      title: "Initial management"
      markdown: |
        - If **ANY** concern for residue on skin or clothing — use personal protective equipment (gloves, gowns, masks); remove / bag / discard clothing; wash patient and area thoroughly with soap and water (clothing and PPE are hazardous waste — dispose properly)
        - Monitor and support ABCD
        - Check vital signs (BP, PR, RR, spO2, Temp)
        - If spO2 < 90% or **ANY** concern for respiration, start 100% O2 via facemask
        - Bedside RBS and treat hypoglycemia
        - Place large-bore IV line
        - Perform brief, targeted history and physical exam; pay attention to mental status
          - What was taken, how long ago, volume / how much, immediate effects
        - Beware occult trauma
        - Obtain labs: CBC, renal functions, electrolytes, liver functions
        - 12-lead ECG
        - Seizures are a neurological emergency and should be treated promptly with diazepam
        - Gastric lavage: almost **NEVER INDICATED**
        - Consider **single-dose activated charcoal 1 g/kg PO/NGT within 1 hour** of ingestion, for substances known to be adsorbed. Do not give it to a patient who is not fully awake, and never intubate solely in order to give it

    - type: "prose"
      title: "Indications for ICU admission"
      markdown: |
        - Need for ETT and mechanical ventilation
        - GCS < 12 / AVPU = U / status epilepticus
        - Toxins with potential for respiratory depression (e.g. amitraz poisoning)
        - Acid–base imbalances
        - Unclear / unpredictable clinical course of poisoning (i.e. poorly studied)

    - type: "prose"
      title: "Common toxidromes & antidotes"
      markdown: |
        - See the specific protocol for: Organophosphates / Carbamates / Cholinergics, Hydrocarbons / Paraffin / Kerosene, Benzodiazepines / Opiates, Paracetamol, Ethanol
        - **Adrenergic / Sympathomimetics**
          - Cocaine, amphetamines (crystal meth, Adderall), pseudoephedrine
          - Presentation: HTN, tachycardia, mydriasis, anxiety, delirium, delusions
          - Rx: supportive — **benzodiazepines first** (they usually settle the hypertension and tachycardia on their own), plus IV fluids; anti-hypertensives only if still needed
        - **Anticholinergic / Tricyclic antidepressants (TCA) / antihistamines**
          - Presentation: hyperpyrexia, cutaneous vasodilation (flushing), decreased saliva, mydriasis, urinary retention, dysrhythmias
          - Rx:
            - Physostigmine — avoid in TCA; only if persistent tachyarrhythmias or convulsions. Call the anesthetist prior to administering.
            - NaHCO3 for TCA
        - **Methanol**
          - Presentation: delirium, loss of vision
          - Rx: oral by NGT — 1.8 ml/kg of 43% ethanol (roughly **three 40 ml shots, ≈126 ml**, in a 70 kg adult); maintenance 0.2–0.4 ml/kg/hour of 43% ethanol
          - **Plus folic acid 1 mg/kg (or 50 mg) IV every 4–6 hours** — it speeds conversion of formic acid to CO₂ and water, and is cheap and available
          - **Refer urgently for haemodialysis if available:** pH ≤ 7.15, visual symptoms, seizures, coma, or deterioration despite the antidote. Dialysis clears both methanol and formate and is the definitive treatment
