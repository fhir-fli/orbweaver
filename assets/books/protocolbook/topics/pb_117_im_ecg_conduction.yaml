  blocks:

    - type: "prose"
      title: "Conduction abnormalities"
      callout: true
      palette:
        alert: "0xFF0D47A1"
        alert_fill: "0xFFE8EEF7"
        alert_text: "0xFF0D47A1"
      markdown: |
        Bundle branch blocks — recognised by QRS widening and characteristic V1 / V6 morphology.

    - type: "prose"
      title: "Right bundle branch block (RBBB)"
      markdown: |
        - rSR' pattern in V1 (small initial r wave, followed by a normal size S wave, and then another large positive deflection)
        - Complete RBB: QRS > 0.12 seconds with above pattern
        - Incomplete RBB: QRS 0.10–0.12 seconds with above pattern

    - type: "prose"
      title: "Left bundle branch block (LBBB)"
      markdown: |
        - Loss of initial r wave in V1 & q wave in V6
        - QS pattern in V1 (just downward deflecting, may be notched)
        - R pattern in V6 (just upward deflecting, may be notched)
        - **Complete LBBB: QRS ≥ 0.12 seconds (≥ 120 ms)** with the above pattern
        - **Incomplete LBBB: QRS 0.10–0.12 seconds (110–120 ms)** with the above pattern

    - type: "image"
      path: "assets/books/protocolbook/images/pb_ecg_conduction.png"
      size: "full"
      caption: "Normal vs. RBBB vs. LBBB in leads V1 and V6."
