# ============================================================
# ProtocolBook p.37 — Anaphylaxis.
#
# Hybrid-rule split: everything above "Wheezing?" on the printed
# chart is a LINEAR flow with no branch points (symptoms → 3
# diagnostic-criteria boxes feeding "any of the 3" → epinephrine →
# 5-item management box), so that half is titled prose with the
# epinephrine action as a red-alert callout.  The true decision
# tail (Wheezing? → treat as asthma; Hypotension? → IV fluids;
# → adjunctive treatment) is an `algorithm` flowchart; the
# adjunctive box is the spine terminal (every path receives it).
#
# Faithful-rendering calls:
#   - Criteria 1 ends with a stray unmatched ")" in the source —
#     dropped (typo, no content).
#   - "Treat as asthma exacerbation" is plain text for now; becomes a
#     topic: cross-link once the Wheezing/Asthma pages (~p.53) are
#     authored (same deferral as p.30's convulsion pointer).
#
# ✅ EVIDENCE-CURRENCY UPDATES APPLIED (audit pass 2026-07-26) — the
# two items below were pre-designated CLEAR-CUT and are now applied:
#   - RANITIDINE → FAMOTIDINE. Ranitidine was withdrawn worldwide in
#     April 2020 (NDMA impurity) and is no longer obtainable; it can
#     no longer be printed as an option. Substituted with the standard
#     famotidine anaphylaxis dosing (0.25 mg/kg IV, max 20 mg;
#     0.5 mg/kg PO, max 40 mg) — the SUBSTITUTE DOSE is mine and
#     should be OE-confirmed.
#   - EPINEPHRINE MAX 0.3 mL → "max 0.3 mL (child), up to 0.5 mL
#     (adolescent / adult)". 0.01 mg/kg IM with a 0.5 mg adult ceiling
#     and a 0.3 mg prepubertal ceiling is the current AAAAI/ACAAI +
#     WAO parameter; 0.3 mg is the paediatric cap only, so the printed
#     blanket 0.3 mL under-doses adults.
#
# CONTENT FLAGS still OPEN for OE (rendered as printed):
#   - The algorithm TERMINATES in an "Adjunctive treatment" box of
#     H1 blocker / H2 blocker / steroids. Current practice parameters
#     recommend AGAINST routine corticosteroids and antihistamines,
#     note they do NOT prevent biphasic reactions, and stress they
#     must never replace or delay epinephrine. Reframing this box
#     (symptomatic cutaneous relief only, adjunct-never-substitute)
#     is an OE call — not applied.
#   - NO OBSERVATION PERIOD and NO BIPHASIC-REACTION warning anywhere
#     on the page (current guidance: observe ~4–6 h, longer if severe
#     or if repeat epinephrine was needed), and no discharge planning
#     / autoinjector counselling. Genuine gap — OE to decide whether
#     to add.
#   - Diagnostic criteria are the classic 2006 NIAID/FAAN set — still
#     widely taught; WAO 2020 simplified to 2 criteria. Optional.
# ============================================================

topic:
  id: "pb-anaphylaxis"
  title: "Anaphylaxis"
  list_subtitle: "p.37 · criteria + epinephrine"
  last_reviewed: "pocketbook v1.7"
  tags: ["anaphylaxis", "allergy", "allergic reaction", "epinephrine", "adrenaline", "angioedema", "hives", "hypotension"]
  category: "medical"
  page_number: 37

  blocks:

    - type: "prose"
      title: "Common symptoms"
      markdown: |
        - **Mucocutaneous:** angioedema, hives, pruritis, flushing
        - **Respiratory:** dyspnea, wheezing, stridor, hypoxia
        - **GI:** nausea/vomiting/diarrhea/abdominal cramping
        - **End-organ dysfunction:** syncope, hypotonia

    - type: "prose"
      title: "Diagnostic criteria — any of the 3 → epinephrine"
      markdown: |
        - **Criteria 1:** Acute skin/mucosal tissue signs + 1 of the following: Respiratory compromise, Hypotension, OR Signs of end-organ dysfunction
        - **Criteria 2:** Rapid onset after likely antigen exposure of 2 of the following: Mucocutaneous signs, Respiratory symptoms, Hypotension, OR GI symptoms
        - **Criteria 3:** Hypotension after exposure to known allergen
          - Adults SBP <90
          - Children age 11–17: SBP <90
          - Children age 1–10: SBP <(70 + [age x 2])
          - Children age 1 month to 1 year: SBP <70
          - Term neonate: SBP <60

    - type: "prose"
      callout: true
      palette:
        alert: "0xFFD32F2F"
        alert_fill: "0xFFFDECEA"
        alert_text: "0xFFB71C1C"
      title: "Epinephrine (1mg/1ml 1:1000)"
      markdown: |
        - 0.01mL/kg — max 0.3mL (child), up to 0.5mL (adolescent / adult)
        - IM anterolateral thigh
        - Repeat q5–15 minutes if no improvement

    - type: "prose"
      title: "Initial management"
      markdown: |
        - Monitor, support ABCs
        - Check vital signs (BP, PR, RR, spO2, Temp, Weight)
        - Assess GCS, hydration status
        - Insert 2 IVs, Start Oxygen if spO2 <94%
        - Draw CBC, malaria, and blood glucose

    - type: "flowchart"
      variant: "algorithm"
      stages:
        - decision: "Wheezing and/or shortness of breath?"
          outcomes:
            - label: "Yes"
              box:
                title: "Treat as asthma exacerbation"
              continue: true
            - label: "No"
              continue: true
        - decision: "Hypotension?"
          outcomes:
            - label: "Yes"
              box:
                title: "IV fluids — NS or RL"
                bullets:
                  - "Children: 30mL/kg in first hour"
                  - "Adults: 1–2L, 5–10mL/kg in first 5 min"
                  - "May try recumbent positioning or vasopressors prn"
                severity: "priority"
              continue: true
            - label: "No"
              continue: true
      terminal:
        title: "Adjunctive treatment"
        bullets:
          - "H1 receptor blocker: Diphenhydramine 1mg/kg IV or PO, max dose 50mg"
          - "H2 receptor blocker: Famotidine 0.25mg/kg IV (max 20mg) or 0.5mg/kg PO (max 40mg)"
          - "Steroids: Hydrocortisone 5mg/kg IM/slow IV (max 200mg)"
