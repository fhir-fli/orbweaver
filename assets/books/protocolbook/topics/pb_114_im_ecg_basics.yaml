topic:
  id: "pb-im-ecg-basics"
  title: "ECG — Basics & Approach"
  list_subtitle: "pp.114–115 · placement · intervals · axis"
  last_reviewed: "pocketbook v1.7"
  tags: ["ECG", "EKG", "electrocardiography", "adult", "internal medicine", "lead placement", "axis", "PR interval", "QRS", "QT", "QTc", "rate", "rhythm", "cardiology"]
  category: "medical"

  pages:

    # ═══════════════════════ PAGE 114 ═══════════════════════
    - page_number: 114
      blocks:

        - type: "prose"
          title: "Lead placement"
          markdown: |
            - **LA / RA: wrists. LL / RL: ankles** — or at minimum on the limbs distal to the shoulders and hips. **This is the standard placement for a DIAGNOSTIC 12-lead**, and it is the placement all the criteria in this chapter assume
            - ⚠️ **Torso (Mason-Likar) placement** — arms mid-arm at the lateral bicep, legs 7.5 cm below the umbilicus — **is for MONITORING**, or for recording during exercise or in the prone patient. It measurably alters limb-lead voltages and axis (most through the left-arm electrode) and can distort **LVH voltage criteria and inferior Q-waves / axis**, which are exactly the criteria used later in this chapter. The book previously printed these torso positions as the standard
            - **V1:** 4th ICS, just right of the sternum
            - **V2:** 4th ICS, just left of the sternum
            - **V3:** midway between V2 & V4
            - **V4:** midclavicular line, 5th ICS
            - **V5:** anterior axillary line, lateral to V4
            - **V6:** midaxillary line, lateral to V4 & V5
            - ⚠️ **The commonest placement error is putting V1–V2 too high** — in the 2nd or 3rd interspace instead of the 4th. That produces **false poor R-wave progression or a pseudo-anterior-infarct pattern**

        - type: "image"
          path: "assets/books/protocolbook/images/pb_ecg_leads.png"
          size: "full"
          caption: "Precordial (V1–V6) and limb (RA/LA/RL/LL) electrode placement."

        - type: "prose"
          title: "Properly mounted?"
          markdown: |
            - **The amplitude of lead II equals the sum of leads I and III** (Einthoven's law). It applies to the **net deflection at any instant**, not to the R wave alone — written as "R in II = R in I + R in III" it will often appear not to hold on a real tracing
            - The sum of the waves in aVR, aVL & aVF should equal zero

        - type: "prose"
          title: "Basic parts of the ECG"
          markdown: |
            - **P wave** — atrial depolarisation (activation)
            - **QRS complex** — ventricular depolarisation (activation)
            - **ST segment, T wave, U wave** — ventricular repolarisation (recovery)

        - type: "image"
          path: "assets/books/protocolbook/images/pb_ecg_waveform.png"
          size: "full"
          caption: "ECG waveform — P/Q/R/S/T/U waves with the PR, QRS, ST, QT and RR intervals. 1 large box = 0.20 s."

    # ═══════════════════════ PAGE 115 ═══════════════════════
    - page_number: 115
      blocks:

        - type: "prose"
          title: "Calibration"
          markdown: |
            - 1 large box = 5 mm = 0.20 seconds
            - 1 small box = 1 mm = 0.04 seconds
            - 5 small boxes = 1 large box
            - Proper calibration: 10 mm tall represents 1 mV (10 small boxes / 2 large boxes) — ensured by a standardisation mark at the beginning of the ECG

        - type: "prose"
          title: "Approach (a systematic approach is vital)"
          markdown: |
            - **Rate** (tachy? brady?): 300 ÷ R-R interval (in large boxes) = beats per minute
            - **Rhythm** (relationship between P and QRS?): sinus = a P before every QRS, a QRS after every P, and P upright in II and down in aVR
            - **Intervals:**
              - PR 0.12–0.2 sec (3–5 small boxes)
              - QRS < 0.1–0.11 sec
              - QT / QTc (QTc = 0.33–0.44 / 0.45 sec)
            - **Easily confused points:**
              - The RR interval is really the QRS–QRS interval
              - The PR interval is really the start of P to the start of QRS
              - The QT interval is really the onset of QRS to the end of T
              - Not every QRS has all 3

        - type: "prose"
          title: "Mean QRS axis (LAD or RAD?)"
          markdown: |
            - Midway between two extremity leads with tall R waves of equal height
            - Points at 90° (right angle) to any extremity lead with a biphasic QRS complex (Q = R or R = S)
            - Normal is between −30° and 100°
            - If QRS positive in I & II → axis is normal
            - If QRS positive in I & negative in II → left axis deviation (LAD)
            - If QRS positive in II & negative in I → right axis deviation (RAD)

        - type: "image"
          path: "assets/books/protocolbook/images/pb_ecg_axis.png"
          size: "full"
          caption: "Hexaxial reference system — the lead axis for each limb lead (degrees)."
