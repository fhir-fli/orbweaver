# translated-from-sha256: 6be84d6dc7f25a10976a5fc6fa1b58688a0de3c21e9e19771811fd4e527e6cc8
topic:
  id: "pb-alcohol-withdrawal"
  title: "Abstinencia alcohólica"
  list_subtitle: "p.35 · fases + algoritmo CIWA-Ar"
  last_reviewed: "pocketbook v1.7"
  tags: ["alcohol", "etanol", "abstinencia", "delirium tremens", "convulsión", "ciwa", "lorazepam", "tiamina", "wernicke"]
  category: "medical"
  page_number: 35
  blocks:
  - type: "prose"
    markdown: |
      Ocurre cuando un paciente deja de beber alcohol tras un periodo de consumo de grandes cantidades durante mucho tiempo.
  - type: "prose"
    title: "Fases"
    markdown: |
      No todos los pacientes pasan por todas las fases, y estas pueden no seguir el orden.

      - **Fase 1 — síntomas menores**
        - 6–12 horas después de dejar de beber
        - Temblor, agitación, falta de apetito, náuseas, vómitos, ansiedad, sudoración, inquietud
      - **Fase 2 — alucinosis alcohólica**
        - 12–24 horas después de dejar de beber
        - Pueden aparecer alucinaciones
      - **Fase 3 — convulsiones por abstinencia**
        - 24–48 horas después de dejar de beber (a veces antes)
        - En general tonicoclónicas
      - **Fase 4 — delirium tremens**
        - 3–7 días después de dejar de beber (hasta 14 días después)
        - Alucinaciones (en general visuales), confusión, taquicardia, hipertensión, agitación, sudoración
  - type: "prose"
    title: "Manejo de la abstinencia alcohólica"
    markdown: |
      - Monitorice, mantenga el ABC
      - Controle los signos vitales (PA, FC, FR, spO2, Temp, peso)
      - Evalúe la GCS, el estado de hidratación
      - Coloque 2 vías IV, inicie oxígeno si la spO2 <90%

      Puntúe la gravedad de la abstinencia con la [escala CIWA-Ar](topic:pb-ciwa-ar).
  - type: "flowchart"
    variant: "cycle"
    nodes:
    - title: "¿Sospecha de encefalopatía de Wernicke (confusión / oftalmoplejía / ataxia), o el paciente parece gravemente desnutrido?"
      branches:
      - label: "Sí"
        side: "right"
        box:
          title: "Tiamina IV (si está disponible)"
          bullets:
          - "Sospecha de Wernicke: 200mg IV tres veces al día × 3 días, luego oral"
          - "Solo profilaxis (desnutrido, sin signos de Wernicke): 100mg IV al día × 3–5 días"
    - id: "rescore"
      title: "Calcule la puntuación CIWA-Ar"
      bullets:
      - "Clinical Institute Withdrawal Assessment — Alcohol, revisada (vea el enlace de arriba)"
    - shape: "decision"
      title: "¿CIWA-Ar ≥ 10?"
      down_label: "una vez estable"
      branches:
      - label: "No"
        side: "left"
        box:
          title: "Reevalúe cada 15–30 min"
          bullets:
          - "luego vuelva a puntuar"
        loop_to: "rescore"
      - label: "Sí"
        side: "right"
        box:
          title: "Lorazepam 2mg IV"
          bullets:
          - "reevalúe cada 5–10 min → vuelva a puntuar"
          severity: "priority"
        loop_to: "rescore"
    - title: "Continúe vigilando"
      bullets:
      - "Una vez estable, empiece a espaciar el lorazepam 2mg IV a cada 2–4 h según necesidad"
  - type: "prose"
    title: "¿Sospecha de algo más que una intoxicación alcohólica?"
    markdown: |
      - Siga el [protocolo de alteración del estado mental](topic:pb-altered-mental-status)
      - Pruebas posibles para trastornos relacionados con el alcohol o de presentación similar
        - Panel metabólico básico, magnesio, pruebas de función hepática, lipasa
