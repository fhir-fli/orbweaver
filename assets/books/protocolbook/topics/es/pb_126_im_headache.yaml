    callout: true
    palette:
      alert: "0xFFD32F2F"
      alert_fill: "0xFFFDECEA"
      alert_text: "0xFFB71C1C"
    markdown: |
      Sugieren una lesión ocupante de espacio o vascular, infección, alteración metabólica o enfermedad sistémica:

      - Síntomas o enfermedad sistémicos (p. ej., fiebre, ↓ peso, embarazo, VIH)
      - Síntomas neurológicos (p. ej., confusión, disminución de la conciencia, signos focales, cambios visuales, meningismo, convulsiones, papiledema)
      - De inicio reciente (sobre todo si > 40 años) o súbito ("en trueno")
      - Antecedente de traumatismo craneal, consumo de drogas ilícitas, exposición a tóxicos
      - La cefalea despierta al paciente, empeora con Valsalva, tos, esfuerzo o actividad sexual, o empeora en una postura concreta
      - Antecedente de cefalea con cambio de sus características: frecuencia, intensidad, síntomas asociados
