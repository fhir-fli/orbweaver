topic:
  id: "pb-weight-estimation"
  title: "Estimación del peso en emergencias pediátricas"
  list_subtitle: "p.16 · edad/talla → peso"
  last_reviewed: "pocketbook v1.7"
  tags: ["pediátrico", "peso", "estimación", "emergencia"]
  category: "universal"
  page_number: 16
  blocks:
  - type: "prose"
    markdown: |
      Mida el peso al ingreso. Estime el peso **solo si está inestable**; verifíquelo en cuanto se estabilice.
  - type: "row"
    blocks:
    - type: "table"
      title: "Por edad"
      columns: ["Edad", "Peso (kg)"]
      rows:
      - cells: ["1 – 3 sem", "3"]
      - cells: ["4 – 7 sem", "4"]
      - cells: ["2 – 3 meses", "5"]
      - cells: ["4 – 6 meses", "7"]
      - cells: ["7 – 9 meses", "9"]
      - cells: ["10 – 12 meses", "10"]
      - cells: ["1 – 2 años", "11"]
      - cells: ["2 – 3 años", "13"]
      - cells: ["3 – 4 años", "15"]
      - cells: ["4 – 5 años", "17"]
    - type: "table"
      title: "Por talla"
      columns: ["Talla (cm)", "Peso (kg)"]
      rows:
      - cells: ["50 – 64.99", "4 – 6"]
      - cells: ["65 – 73.99", "7 – 8"]
      - cells: ["74 – 80.99", "9 – 10"]
      - cells: ["81 – 94.99", "11 – 12"]
      - cells: ["95 – 106.99", "13 – 15"]
      - cells: ["107 – 120.99", "16 – 19"]
      - cells: ["121 – 132.99", "20 – 24"]
      - cells: ["133 – 137.99", "25 – 28"]
      - cells: ["138 – 150", "29 – 36"]
  - type: "prose"
    markdown: |
      **Bajo peso:** use **2 categorías de edad menores** (p. ej., para un lactante de 10 meses
      con bajo peso — use el peso de 4–6 meses) o **1 categoría de talla
      menor**, la fila de arriba en la tabla (p. ej., bajo peso con 100 cm — use **11–12 kg**).
  - type: "prose"
    highlight: true
    markdown: |
      **Desnutrición grave — las tablas no son exactas.**
