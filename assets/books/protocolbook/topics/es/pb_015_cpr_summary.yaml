topic:
  id: "pb-cpr-summary"
  title: "Resumen de RCP — adultos, niños, lactantes"
  list_subtitle: "p.15 · tabla comparativa"
  last_reviewed: "pocketbook v1.7"
  tags: ["rcp", "reanimación", "comparación"]
  category: "critical_care"
  page_number: 15
  blocks:
  - type: "table"
    columns: ["Componente", "Adultos", "Niños", "Lactantes"]
    rows:
    - cells:
      - "Reconocimiento"
      - text: |
          No responde (todas las edades)
          No respira o solo jadea
          No se palpa pulso en 10 segundos
          Recién nacido: FC < 60
        span: 3
    - cells:
      - "Secuencia de RCP"
      - text: |
          Compresiones torácicas, vía aérea, respiración (C-A-B)
          Recién nacido: vía aérea, respiración, compresiones (A-B-C)
        span: 3
    - cells:
      - "Frecuencia de compresión"
      - text: "100–120/min"
        span: 3
    - cells:
      - "Profundidad de compresión"
      - "Al menos 5 cm"
      - text: |
          Al menos 1/3 del diámetro AP
          Aproximadamente 5 cm
      - text: |
          Al menos 1/3 del diámetro AP
          Aproximadamente 4 cm
    - cells:
      - "Reexpansión de la pared torácica"
      - text: |
          Permita la reexpansión completa entre compresiones
          Rote a quien comprime cada 2 minutos
          Recién nacidos: se prefiere la técnica de los 2 pulgares con las manos alrededor del tórax
        span: 3
    - cells:
      - "Interrupciones de las compresiones"
      - text: |
          Minimice las interrupciones de las compresiones torácicas
          Intente limitarlas a < 10 segundos
        span: 3
    - cells:
      - "Vía aérea"
      - text: |
          Inclinación de la cabeza — elevación del mentón (sospecha de traumatismo: tracción mandibular)
          Recién nacido: posicionar, aspirar solo si hay secreciones
        span: 3
    - cells:
      - "Relación compresión : ventilación (hasta colocar una vía aérea avanzada)"
      - text: |
          30:2
          1 o 2 reanimadores
      - text: |
          30:2 (un reanimador)
          15:2 (2 reanimadores)
          3:1 (solo recién nacidos)
        span: 2
    - cells:
      - "Ventilaciones de rescate (no responde, con pulso)"
      - text: |
          1 ventilación cada 5–6 segundos
          (10–12 ventilaciones/min)
      - text: |
          1 ventilación cada 2–3 segundos
          (20–30 ventilaciones/min)
          Recién nacidos: 30–50 ventilaciones/min
        span: 2
    - cells:
      - "Ventilaciones con vía aérea avanzada (intubado)"
      - text: |
          1 ventilación cada 6–8 segundos
          (8–10 ventilaciones/min)
      - text: |
          1 ventilación cada 2–3 segundos
          (20–30 ventilaciones/min)
        span: 2
