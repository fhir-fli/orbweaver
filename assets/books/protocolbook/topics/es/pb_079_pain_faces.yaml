topic:
  id: "pb-pain-faces"
  title: "Dolor — escalas de caras y de bidones"
  list_subtitle: "p.79 · caras de Wong-Baker · bidones"
  last_reviewed: "pocketbook v1.7"
  tags: ["dolor", "manejo del dolor", "wong-baker", "escala de caras", "bidón", "analógica visual", "autoinforme", "pediátrico", "escala de dolor"]
  category: "medical"
  page_number: 79
  blocks:
  - type: "prose"
    markdown: |
      Escalas visuales de autoinforme — pida al paciente que señale el dibujo que mejor refleje su dolor.
      - **Caras de Wong-Baker** — para edades de **4–12** (puede usarse hasta los 18)
      - **Bidones** — una alternativa para pacientes que no entienden las caras
  - type: "prose"
    title: "Escala de caras de Wong-Baker"
    markdown: |
      Edades 4–12 (puede usarse hasta los 18).
