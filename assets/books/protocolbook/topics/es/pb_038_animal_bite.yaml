  blocks:
  - type: "prose"
    title: "Mordeduras de mamíferos (no humanas)"
    markdown: |
      - Limpie la herida con agua y jabón
      - Desbride el tejido desvitalizado
      - Los antibióticos profilácticos son controvertidos, pero en general se recomiendan en los siguientes casos
        - Pacientes inmunodeprimidos
        - Pacientes asplénicos
        - Hepatopatía avanzada
        - Lesión moderada-grave o por aplastamiento
        - Edema en el sitio de la mordedura
        - Lesiones cerca de la mano, próximas a otros huesos/articulaciones, sobre todo si penetran la cápsula articular o el periostio
  - type: "prose"
    title: "Mordeduras humanas"
    markdown: |
      - Limpie la herida con agua y jabón
      - Desbride el tejido desvitalizado
      - Toda mordedura humana debe recibir antibióticos profilácticos
      - Considere la profilaxis posexposición para el VIH; en general el riesgo es bajo, pero mayor si la saliva está contaminada con sangre
      - Se recomienda la vacuna contra la hepatitis B ≤24 h tras la mordedura si no estaba inmunizado
  - type: "prose"
    title: "Tratamiento profiláctico"
    markdown: |
      - **Amoxicilina-ácido clavulánico x 5 días**
        - Pediátrico: 25mg/kg/dosis VO dos veces al día
        - Adulto: 1 gramo VO dos veces al día
      - **Si no hay amoxicilina-clavulánico pero sí amoxicilina sola** (un problema de suministro, no una alergia) — **amoxicilina a la misma dosis MÁS metronidazol** (adultos 400mg VO tres veces al día · niños 7.5mg/kg/dosis VO tres veces al día) x 5 días
      - **Alergia a la penicilina — use una PAREJA, no un solo fármaco** (ninguna alternativa única cubre a la vez **Pasteurella** y los anaerobios orales):
        - **Doxiciclina** — adultos 100 mg VO dos veces al día · niños 2.2 mg/kg/dosis VO dos veces al día (máx. 100 mg/dosis). **Segura a cualquier edad en ciclos de menos de 21 días — no tiñe los dientes**
        - **MÁS metronidazol** — adultos 500 mg VO tres veces al día · niños 7.5 mg/kg/dosis VO tres veces al día (máx. 500 mg/dosis)
