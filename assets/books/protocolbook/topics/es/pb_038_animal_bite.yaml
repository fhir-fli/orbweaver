  - type: "table"
    title: "Rabia — suponiendo que no estaba vacunado"
    columns: ["Biológico", "Pauta"]
    column_flex: [2, 5]
    rows:
    - cells: ["**Inmunoglobulina antirrábica** (solo exposición de categoría III)", "Ig humana 20 UI/kg O Ig equina 40 UI/kg. **Es un MÁXIMO, no un objetivo — no hay dosis mínima. No lo supere** (el exceso suprime la propia respuesta de anticuerpos del paciente). **Infiltre TODA la dosis en y alrededor de la(s) herida(s)**; si el volumen no alcanza para todas las heridas, dilúyala con solución salina normal. Administre el resto IM solo si la herida físicamente no lo admite. **Solo el día 0 — nunca administre la IGR más de 7 días después de la primera dosis de vacuna.** No se necesita prueba cutánea antes de la Ig equina."]
    - cells: ["**Vacuna**", "IM (deltoides o cara anterolateral del muslo), una inyección los días 0, 3, 7 y 14"]
  - type: "prose"
    markdown: |
      **Sobre el resto de la inmunoglobulina:** la OMS (2018) aconseja infiltrar **toda** la dosis en y alrededor de la herida. Las Uganda Clinical Guidelines 2023 aún aconsejan administrar el resto IM en el glúteo. **Ambas son aceptables** — infiltrar solo la herida además rinde más un biológico escaso.
