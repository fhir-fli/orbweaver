        Ejemplos de elevación del segmento ST con bloqueo de rama izquierda:
    - type: "image"
      path: "assets/books/protocolbook/images/pb_ecg_ste_lbbb.png"
      size: "full"
      caption: "Elevación del segmento ST en presencia de BRI."
    - type: "prose"
      title: "🛑 IAMCEST con BRI — un BRI nuevo NO es automáticamente un IAMCEST"
      callout: true
      palette:
        alert: "0xFFD32F2F"
        alert_fill: "0xFFFDECEA"
        alert_text: "0xFFB71C1C"
      markdown: |
        Un BRI nuevo o presuntamente nuevo **ya no cuenta por sí solo como equivalente
        de IAMCEST**. Aplique en su lugar los **criterios de Sgarbossa**:

        - **Elevación concordante del ST ≥ 1 mm** en cualquier derivación — el más específico
        - **Descenso concordante del ST ≥ 1 mm en V1–V3**
        - **Elevación discordante excesiva del ST** — modificado por Smith: **cociente ST/S ≤ −0.25**

        **Un BRI, un BRD o un ritmo de marcapasos con alta sospecha clínica de isquemia
        en curso es un equivalente de IAMCEST** y debe triarse a reperfusión. Esto
        importa aquí porque el trombolítico está en el estante.
    - type: "prose"
      title: "Derivaciones adicionales — regístrelas antes de decidir"
      markdown: |
        - **Sospecha de IAMCEST INFERIOR (II, III, aVF) → registre las derivaciones derechas V3R–V4R.**
          La elevación del ST en **V4R** indica infarto del ventrículo derecho, lo que **cambia
          el manejo: evite los nitratos, administre líquidos**
        - **Sospecha de IAM POSTERIOR → registre las derivaciones posteriores V7–V9.** La elevación
          del ST **≥ 0.5 mm** lo confirma. El descenso del ST en V1–V2 en el ECG estándar de 12 derivaciones es
          la pista, no el diagnóstico
        - Úselas siempre que los síntomas persistan y el ECG estándar de 12 derivaciones no sea
          concluyente
    - type: "prose"
      title: "Antes de administrar un trombolítico — los imitadores de la elevación del ST"
      markdown: |
        No toda elevación del ST es isquémica. Considere y descarte:
        **repolarización precoz · pericarditis · HVI · BRI · hiperpotasemia.**
        Deciden el patrón y el cuadro clínico, no solo los milímetros.
    - type: "prose"
      title: "IAM sin elevación del ST (IAMSEST)"
      markdown: |
        - Isquemia subendocárdica
        - Segmento ST anormal
          - Presente en 2 derivaciones contiguas
          - Descenso del ST horizontal o descendente
          - De 1 mm o más
          - Que dura al menos 0.08 segundos
        - **NOTA:** los descensos del ST < 1 mm (o solo del punto J) con ascenso rápido del segmento ST se consideran normales
    - type: "image"
      path: "assets/books/protocolbook/images/pb_ecg_std_examples.png"
      size: "full"
      caption: "Ejemplos de descenso del segmento ST."
