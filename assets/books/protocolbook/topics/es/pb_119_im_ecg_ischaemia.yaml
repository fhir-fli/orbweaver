    blocks:
    - type: "prose"
      title: "Vaso culpable"
      markdown: |
        En general es el resultado de la oclusión de una de las 3 arterias principales:

        - La arteria coronaria derecha (CD) irriga la cara inferior
        - La descendente anterior (DA) irriga la cara anterior
        - La circunfleja (Cx) irriga la cara lateral
        - Nota: el tronco común irriga tanto la cara anterior como la lateral
    - type: "prose"
      title: "Localización por el ECG"
      markdown: |
        A veces es posible localizarlo con el ECG:
    - type: "table"
      columns: ["Zona anatómica", "Derivaciones del ECG", "Arteria coronaria"]
      column_flex: [3, 4, 5]
      rows:
      - cells: ["Septal", "V1–V2", "DA proximal"]
      - cells: ["Anterior", "V3–V4", "DA"]
      - cells: ["Apical", "V5–V6", "DA distal, Cx o CD"]
      - cells: ["Lateral", "I, aVL", "Cx"]
      - cells: ["Inferior", "II, III, aVF", "CD (85%), Cx (15%)"]
      - cells: ["VD", "V1–V2 y V4R", "CD proximal"]
      - cells: ["Posterior", "Descenso del ST en V1–V2 — **confírmelo con elevación del ST ≥ 0.5 mm en V7–V9**", "CD o Cx"]
    - type: "prose"
      title: "IAM con elevación del ST (IAMCEST)"
      markdown: |
        - Isquemia transmural — todo el espesor
        - Elevación del segmento ST en el punto J en 2 derivaciones contiguas
          - **Derivaciones V2–V3:**
            - Elevación de 2 mm en hombres ≥ 40 años
            - Elevación de 2.5 mm en hombres < 40 años
            - Elevación de 1.5 mm en mujeres
          - Elevación de 1 mm en todas las demás derivaciones
