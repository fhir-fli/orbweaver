  - type: "prose"
    title: "Flutter auricular"
    markdown: |
      - En general ~300 ciclos/minuto, frecuencia ventricular de 150/min
      - Ondas F clásicas negativas en II, III, aVF y positivas en V1
      - Flutter (en dientes de sierra o grueso)
