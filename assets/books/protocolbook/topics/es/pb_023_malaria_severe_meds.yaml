  blocks:
  - type: "prose"
    highlight: true
    markdown: |-
      **Todos los esquemas parenterales deben seguirse de 3 días de tratamiento oral cuando tolere la VO.**
  - type: "prose"
    markdown: |-
      a) **1.ª línea — Artesunato**
        i) **3 mg/kg** < 20 kg · **2.4 mg/kg** ≥ 20 kg IV/IM a las **0, 12, 24 h**
        ii) Tratamiento parenteral ≥ 24 h, luego diario hasta que tolere la VO → cambie a oral
      b) **2.ª línea — Arteméter**
        i) **3.2 mg/kg IM** al ingreso
        ii) **1.6 mg/kg IM** al día hasta que pueda tomar medicación oral → cambie a VO
      c) **3.ª línea — Quinina**
        i) Dosis de carga **20 mg/kg** — **PELIGRO:** la administración rápida es peligrosa. Mezcle con **10 mL/kg de dextrosa al 5 %** y pase en **2–4 h**. **NO supere 5 mg/kg/h.**  Seguida de:
        ii) **10 mg/kg** (en 2 h) cada **8 h**
        iii) Si no hay mejoría en **48 h** → reduzca a **10 mg/kg cada 12 h**
