topic:
  id: "pb-im-pe"
  title: "Embolia pulmonar (EP)"
  list_subtitle: "p.131 · PERC · puntuación de Wells"
  last_reviewed: "pocketbook v1.7"
  tags: ["embolia pulmonar", "EP", "ETV", "PERC", "puntuación de Wells", "disnea", "dolor torácico pleurítico", "hemoptisis", "anticoagulación", "dímero D", "medicina interna", "respiratorio"]
  category: "medical"
  page_number: 131
  blocks:
  - type: "prose"
    title: "Motivos de consulta frecuentes"
    markdown: |
      En general de inicio rápido:

      - Disnea
      - Taquipnea
      - Dolor torácico pleurítico
      - Tos
      - Fiebre
      - Taquicardia
  - type: "prose"
    title: "Factores de riesgo"
    markdown: |
      - Los mismos que en la TVP

      Además:

      - Medicamentos: anticonceptivos hormonales, terapia hormonal sustitutiva, antipsicóticos, fibratos
  - type: "prose"
    title: "🛑 Evalúe la probabilidad pretest ANTES de usar PERC"
    callout: true
    palette:
      alert: "0xFFD32F2F"
      alert_fill: "0xFFFDECEA"
      alert_text: "0xFFB71C1C"
    markdown: |
      **PERC no es un cribado para todos.** Solo es válido cuando el paciente ya se
      ha juzgado de **baja probabilidad** — por Wells (puntuación < 2) o por una impresión
      clínica validada de menos de un 15% aproximadamente. Aplicado a un paciente que usted cree que probablemente tiene una EP,
      produce un **"descarte" falsamente tranquilizador**. Las guías europeas no usan PERC
      en absoluto, y advierten que puede no ser seguro donde la prevalencia de EP es alta.

      **Orden: probabilidad pretest → luego PERC → luego dímero D → luego imagen.**
      El libro ponía antes PERC en primer lugar.
  - type: "prose"
    title: "Sospecha de EP — la secuencia donde no hay angiografía pulmonar por TC"
    markdown: |
      1. **Evalúe primero la probabilidad pretest** — puntuación de Wells (abajo), o Ginebra, o impresión clínica
      2. **Probabilidad alta, o inestabilidad hemodinámica** → NO haga PERC ni dímero D. Este paciente necesita imagen o tratamiento empírico — vea la sección de alto riesgo de abajo
      3. **Probabilidad baja** → aplique PERC. Los 8 negativos → EP descartada, pare
      4. **Probabilidad baja pero PERC positivo, o probabilidad intermedia** → dímero D, usando el **punto de corte ajustado por edad (edad × 10 µg/L si la edad es > 50)**
      5. **Dímero D por debajo del corte** → EP descartada
      6. **Dímero D por encima del corte** → imagen. Si no hay angio-TC: **gammagrafía V/Q, o ecografía de compresión de ambas piernas** (una TVP proximal justifica la misma anticoagulación sin imagen torácica), y **ecocardiografía para ver sobrecarga del VD**
  - type: "flowchart"
    variant: "algorithm"
    entry:
      text: "PERC — solo si ya se evaluó como de BAJA probabilidad"
      shape: "stadium"
    stages:
    - decision: "¿Cumple el paciente TODOS estos?"
      criteria:
      - "Edad < 50 años"
      - "Pulso < 100"
      - "SpO₂ > 94%"
      - "Sin hinchazón unilateral de la pierna"
      - "Sin hemoptisis"
      - "Sin cirugía ni traumatismo en las últimas 4 semanas"
      - "Sin TVP / EP previa"
