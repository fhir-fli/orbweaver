  blocks:
  - type: "flowchart"
    variant: "linear"
    entry_chain:
    - text: "Hallazgos neurológicos nuevos — hemiparesia, déficit neurológico focal, trastorno del habla — O alta sospecha clínica"
      shape: "stadium"
    steps:
    - type: "content"
      title: "Manejo inicial"
      bullets:
      - "Monitorice, mantenga el ABC"
      - "Controle los signos vitales (PA, FC, FR, spO2, Temp, peso)"
      - "Inicie oxígeno si la spO2 < 90%"
      - "Evalúe la GCS"
      - "Evalúe el estado de hidratación"
      - "Coloque una vía IV, extraiga hemograma, malaria, glucemia aleatoria"
      - "Haga una historia y una exploración física breves y dirigidas"
    - type: "content"
      title: "Maneje los problemas concurrentes (tabla de abajo)"
      bullets:
      - "Fiebre · Hipoglucemia · Convulsiones"
