      - cells: ["Albúmina (g/dL)", "> 3.5", "2.8–3.5", "< 2.8"]
      - cells: ["TP (seg > control)", "< 4", "4–6", "> 6"]
      - cells: ["o INR", "< 1.7", "1.8–2.3", "> 2.3"]
    - type: "table"
      title: "Clase de Child-Pugh → supervivencia a 1 año"
      zebra: true
      columns: ["Clase", "Puntos totales", "Supervivencia a 1 año"]
      column_flex: [3, 4, 4]
      column_align: ["center", "center", "center"]
