      - cells: ["B", "7–9", "80%"]
      - cells: ["C", "10–15", "45%"]
    - type: "prose"
      title: "Manejo crónico"
      markdown: |
        - Vacune contra la hepatitis A y B si no se ha hecho
        - Eduque para evitar el alcohol, el paracetamol y otros fármacos hepatotóxicos
        - **Profilaxis de la hemorragia por várices:**
          - Inicie la profilaxis 1 semana después de un sangrado si está hemodinámicamente estable
          - **Carvedilol 6.25 mg VO al día, ajustando a 12.5 mg al día — de preferencia.** Su bloqueo alfa adicional baja la presión portal mejor que el propranolol. Use propranolol 20 mg VO dos veces al día solo si no hay carvedilol
          - Ajuste hasta uno de: FC en reposo 55–60 lpm; reducción de la FC del 25% respecto a la basal; o aparición de efectos adversos
          - **Suspenda el betabloqueante si la PAS baja de 90**, o en la ascitis refractaria
        - **Profilaxis de la PBE — dos indicaciones distintas, no exija ambas:**
          - **Secundaria (ya tuvo una PBE): trate sea cual sea cualquier otro criterio.** Cotrimoxazol 160/800 mg VO 5 días/semana, o norfloxacino 400 mg VO al día, de forma indefinida
          - **Primaria (nunca tuvo PBE):** considérela si las **proteínas del líquido ascítico son < 1.5 g/dL** Y hay función renal alterada (Cr > 1.2, BUN > 25 o Na < 130) **o** hepatopatía avanzada (Child-Turcotte-Pugh > 9 con bilirrubina > 3)
        - **Tratamiento de la ascitis:**
          - Educación: reducir la sal; reducir la ingesta de líquidos si hay Na bajo e hipervolemia
          - Diuréticos (ambos si la PA lo tolera): espironolactona 100 mg/día (máx. 400) y furosemida 40 mg/día (máx. 160)
          - Si es refractaria, considere la paracentesis terapéutica
    - type: "prose"
      title: "Niños"
      markdown: |
        - Casi siempre secundaria (casi nunca hepatopatía intrínseca)
        - Si es intrínseca, la hepatitis A es la más frecuente — pero haga cribado de hepatitis B/C
        - Si hay colelitiasis / coledocolitiasis, debe descartarse la drepanocitosis
