  - page_number: 95
    blocks:
    - type: "prose"
      title: "Tratamiento — en todas las descompensaciones"
      markdown: |
        - Vigile ingresos/egresos, considere una sonda Foley, pese a diario
        - Considere electrolitos, BUN, Cr
        - Ecocardiograma si es un diagnóstico nuevo; repítalo cuando esté estable si puede haber empeorado la enfermedad de base
    - type: "prose"
      title: "Frío y húmedo — tratamiento"
      markdown: |
        - Vasopresor para mantener la PAS > 90 — **la noradrenalina 0.05–0.5 mcg/kg/min es la primera opción donde esté disponible** (puede pasarse por vía periférica con contador de gotas si no hay vía central). Si no hay, dopamina 3–10 mcg/kg/min — eficaz, pero con muchas más arritmias y mayor mortalidad
        - Furosemida — iníciela cuando la PA se mantenga; 40–80 mg IV cada 2 horas según la evaluación clínica. **Reevalúe antes de cada dosis repetida** (diuresis, PVY, tórax, PA) y **mida potasio y creatinina a diario** — las dosis repetidas cada 2 horas agotan el potasio rápidamente
        - Digoxina — **SOLO SI SE DEMUESTRA** una taquicardia supraventricular (fibrilación auricular, flutter auricular, etc.). **Digitalice:** 0.25–0.5 mg IV, luego 0.25 mg cada 6–8 horas hasta 2 dosis más (total ≤1–1.5 mg). **Luego mantenimiento 0.125–0.25 mg VO UNA VEZ AL DÍA.** 🛑 **No continúe con dosis cada 6–8 horas** — eso son ~0.75–1 mg/día y alcanza niveles tóxicos con seguridad. Objetivo 0.5–0.9 ng/mL; reduzca en la insuficiencia renal y en los ancianos
    - type: "prose"
      title: "Frío y seco — tratamiento"
      markdown: |
        - Vasopresor para mantener la PAS > 90 — **la noradrenalina 0.05–0.5 mcg/kg/min es la primera opción donde esté disponible** (puede pasarse por vía periférica con contador de gotas si no hay vía central). Si no hay, dopamina 3–10 mcg/kg/min — eficaz, pero con muchas más arritmias y mayor mortalidad
        - Digoxina — **SOLO SI SE DEMUESTRA** una taquicardia supraventricular (fibrilación auricular, flutter auricular, etc.). **Digitalice:** 0.25–0.5 mg IV, luego 0.25 mg cada 6–8 horas hasta 2 dosis más (total ≤1–1.5 mg). **Luego mantenimiento 0.125–0.25 mg VO UNA VEZ AL DÍA.** 🛑 **No continúe con dosis cada 6–8 horas** — eso son ~0.75–1 mg/día y alcanza niveles tóxicos con seguridad. Objetivo 0.5–0.9 ng/mL; reduzca en la insuficiencia renal y en los ancianos
    - type: "prose"
      title: "Caliente y húmedo — tratamiento"
      markdown: |
        - Furosemida — la dosis IV inicial debe igualar o superar la dosis VO diaria crónica, O bolo de 40–80 mg IV (duplique la dosis si no hay efecto en 30 minutos); considere un 2.º diurético si no responde; continúe cada 2 horas según necesidad
        - 🛑 **No administre morfina para la disnea en la insuficiencia cardíaca aguda.** Se asocia a mayor mortalidad, más ventilación mecánica y más ingresos en UCI, y no mejora la disnea. Trate el edema — oxígeno, sentado, furosemida, nitratos
        - Si hay hipertensión: IECA
        - Continúe la dosis habitual de betabloqueante o IECA si está hemodinámicamente estable, pero no la ajuste hasta resolver la descompensación
    - type: "prose"
      title: "Caliente y seco — tratamiento"
      markdown: |
        Insuficiencia cardíaca crónica estable — el tratamiento también debe iniciarse en el hospital tras estabilizar una descompensación aguda, antes del alta:
        - IECA — ajuste hasta la dosis más alta tolerada; controle periódicamente Cr y K+
        - Betabloqueante — empiece bajo y suba cada dos semanas hasta la dosis máxima tolerada
        - Furosemida — para la sobrecarga de volumen crónica
        - Espironolactona — en clase II–IV de la NYHA; Cr sérica < 2.5 / 2 (hombres/mujeres); potasio < 5
        - **Inhibidor de SGLT2 — donde esté disponible:** dapagliflozina 10 mg una vez al día o empagliflozina 10 mg una vez al día. Es ya un cuarto pilar junto al IECA, el betabloqueante y la espironolactona; reduce las hospitalizaciones y la muerte cardiovascular **tenga o no diabetes el paciente**
    - type: "table"
      title: "Clases de la New York Heart Association (NYHA)"
      zebra: true
      columns: ["Clase", "Descripción"]
      column_flex: [2, 8]
      column_align: ["center", "left"]
      rows:
      - cells: ["I", "Sin limitación de la actividad física. La actividad física habitual no causa cansancio excesivo, palpitaciones ni disnea."]
      - cells: ["II", "Limitación leve de la actividad física. Cómodo en reposo. La actividad física habitual produce cansancio, palpitaciones o disnea."]
      - cells: ["III", "Limitación marcada de la actividad física. Cómodo en reposo. Una actividad menor de la habitual causa cansancio, palpitaciones o disnea."]
      - cells: ["IV", "No puede realizar ninguna actividad física sin molestias. Síntomas de insuficiencia cardíaca en reposo. Cualquier actividad física aumenta las molestias."]
