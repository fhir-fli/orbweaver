    - type: "prose"
      title: "Motivos de consulta frecuentes"
      markdown: |
        - Disuria
        - Dispareunia
        - Dolor en la parte baja del abdomen
        - Secreción uretral / flujo vaginal
        - Picor / ardor vulvar / vaginal
        - Picor / ardor en el pene / escroto
        - Ampollas / llagas / verrugas / bultos en la zona genital / anal
    - type: "flowchart"
      variant: "algorithm"
      entry:
        text: "Paciente mujer — consulta por flujo"
        shape: "stadium"
      stages:
      - decision: "¿Prueba de VIH en los últimos 3 meses?"
        outcomes:
        - label: "No"
          box:
            title: "Prueba de VIH"
        - label: "Sí"
          continue: true
      - decision: "¿Flujo anormal?"
        outcomes:
        - label: "No"
          box:
            title: "Considere otros diagnósticos"
        - label: "Sí"
          box:
            title: "Haga una prueba de embarazo"
          continue: true
      - decision: "¿Dolor en la parte baja del abdomen con algún signo de peligro?"
        criteria:
        - "Parto / aborto reciente"
        - "Amenorrea"
        - "Sangrado vaginal anormal"
        - "Defensa abdominal / dolor de rebote"
        outcomes:
