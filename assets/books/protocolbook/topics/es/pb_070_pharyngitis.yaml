  blocks:
  - type: "prose"
    markdown: |
      - La faringitis estreptocócica suele presentarse con dolor de garganta, fiebre, cefalea o dolor de estómago, pero **NO** con síntomas virales como tos, coriza o conjuntivitis
      - **Solo la faringitis estreptocócica debe tratarse con antibióticos** — todas las demás solo con medidas de soporte
      - **Por qué tratarla:** para prevenir la **fiebre reumática aguda** y la cardiopatía reumática que le sigue. Por eso deben completarse los 10 días aunque el dolor de garganta ceda en 2–3 días. Vea el [protocolo de fiebre reumática](topic:pb-rheumatic-fever)
