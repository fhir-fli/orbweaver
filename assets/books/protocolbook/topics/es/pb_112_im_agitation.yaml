  pages:
  - page_number: 112
    blocks:
    - type: "prose"
      markdown: |
        Siempre que se pueda, es mejor prevenir que tratar.
    - type: "prose"
      title: "Factores que hacen más probable la violencia"
      markdown: |
        - Sexo masculino
        - Antecedentes de violencia
        - Consumo de drogas o alcohol
    - type: "prose"
      title: "Signos de violencia inminente"
      markdown: |
        - Conducta provocadora
        - Actitud enfadada
        - Habla alta y agresiva
        - Postura tensa (p. ej., puños apretados)
        - Se mueve o cambia de postura con frecuencia, camina de un lado a otro
        - Actos agresivos (p. ej., golpear paredes, lanzar objetos, golpearse a sí mismo)
    - type: "prose"
      title: "10 elementos de la desescalada verbal"
      markdown: |
        - Respete el espacio personal (2 brazos de distancia)
        - No provoque (mantenga la calma)
        - Establezca contacto verbal (la primera persona en hacer contacto dirige la conversación)
        - Use un lenguaje breve y sencillo
        - Identifique sentimientos y deseos ("¿Qué espera conseguir?")
        - Escuche con atención (repita al paciente lo que dijo para asegurarse)
        - Dé la razón, sea claro, acepte discrepar si es necesario
        - Fije límites claros (explique que no se toleran la violencia ni el maltrato)
        - Ofrezca opciones, sea positivo
        - Haga una sesión de análisis con el paciente y el personal
    - type: "prose"
      title: "NO"
      markdown: |
        - Discuta
        - Amenace
        - Sea condescendiente
        - Dé órdenes
  - page_number: 113
    blocks:
