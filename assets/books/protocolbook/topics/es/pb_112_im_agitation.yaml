      - cells: ["Intoxicación / abstinencia de drogas, o no diferenciado", "Midazolam 2.5–5 mg IV/IM, Y (si es necesario) haloperidol 2.5–5 mg IV/IM"]
      - cells: ["Trastorno psiquiátrico conocido", "Haloperidol 2.5–5 mg IV/IM Y/O midazolam 2.5–5 mg IV/IM"]
    - type: "prose"
      title: "Elección del fármaco"
      markdown: |
        - **La combinación funciona mejor que cualquiera de los dos fármacos solo.** Haloperidol **más** midazolam es más eficaz que el haloperidol solo, que es la menos eficaz de las opciones habituales
        - **Olanzapina 10 mg IM**, donde haya, es una buena alternativa al haloperidol con menos efectos extrapiramidales
        - ⚠️ **El haloperidol prolonga el intervalo QT.** Haga un ECG cuando sea factible; evítelo si se sabe que el QT es largo o si el paciente toma otros fármacos que lo prolongan. **La vía IV conlleva más riesgo que la IM**
