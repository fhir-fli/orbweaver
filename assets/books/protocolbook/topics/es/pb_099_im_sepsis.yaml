    - type: "prose"
      title: "Manejo terapéutico"
      markdown: |
        - **Cardiovascular** — vigile FC, PA, diuresis y llenado capilar en busca de signos de hipoperfusión
          - Bolo inicial: 30 mL/kg de RL/SSN en las primeras 3 horas — **adminístrelo en pasos de 500 mL–1 L y reevalúe entre cada uno** (tórax, PVY, saturación de oxígeno, diuresis). Donde no hay ventilación mecánica, la sobrecarga de líquidos es mucho más difícil de rescatar, y los ensayos en el África subsahariana han mostrado daño por la carga agresiva de líquidos
          - Bolo adicional: otros 500 mL – 1 L de RL/SSN según necesidad
          - Vasopresor: inícielo si la PAM < 65 tras la reanimación con líquidos. **La noradrenalina es de primera línea donde esté disponible** — empiece con 0.05–0.1 mcg/kg/min y ajuste a PAM ≥ 65; puede pasarse por vía periférica con contador de gotas si no hay vía central. Si no hay, dopamina 5–20 mcg/kg/min — aceptable, pero con muchas más arritmias y mayor mortalidad
        - **Respiratorio** — oxígeno según necesidad para mantener la Sat O₂ > 90%
        - **Análisis** — hemograma, malaria, hemocultivo; función renal, electrolitos; función hepática, amilasa, lipasa; TP/INR, TTP; urocultivo
        - **Transfunda** — Hb < 5
        - **Control de la glucosa** — insulina para mantener la glucosa por debajo de 10 mmol/L (180 mg/dL); no busque un control estricto, aquí la hipoglucemia hace más daño
        - **Profilaxis de TVP** — **enoxaparina 40 mg SC al día**, o heparina no fraccionada 5000 unidades SC dos o tres veces al día, salvo sangrado activo o plaquetas bajas
        - **Profilaxis GI** — solo si está con ventilación mecánica o tiene coagulopatía; puede considerarse en el paciente muy grave con varias comorbilidades; puede usarse un antagonista H2 o un IBP
        - **Nutrición** — inicie la alimentación enteral pronto en el curso de la enfermedad
    - type: "prose"
      title: "Elección de antibióticos (IV)"
      markdown: |
        - Doble terapia SOLO en los pacientes en choque
        - Use un antibiótico de 2.ª línea o adicional según la sospecha clínica del foco
        - **1.ª línea:** ceftriaxona 2 g IV al día
        - **Gramnegativos:**
          - Gentamicina IV 5 mg/kg/día
          - Meropenem 1 g IV cada 8 horas (también cubre grampositivos, pero NO SARM)
        - **Grampositivos (incluido SARM):**
          - Clindamicina 600 mg IV cada 8 horas (también anaerobios)
          - Vancomicina 15 mg/kg IV **cada 6 horas** (consulte con farmacia) — cada 6 horas en el SARM grave, nivel valle objetivo 15–20 mg/L
