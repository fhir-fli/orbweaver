topic:
  id: "pb-im-sepsis"
  title: "Sepsis del adulto"
  list_subtitle: "pp.99–100 · qSOFA · SOFA · antibióticos"
  last_reviewed: "pocketbook v1.7"
  tags: ["sepsis", "choque séptico", "adulto", "medicina interna", "qSOFA", "SOFA", "lactato", "vasopresor", "ceftriaxona", "antibióticos", "PAM"]
  category: "medical"
  pages:
  - page_number: 99
    blocks:
    - type: "prose"
      title: "Definiciones"
      markdown: |
        - **Sepsis** (ya no existe la "sepsis grave"): disfunción orgánica potencialmente mortal causada por una respuesta desregulada del huésped a la infección
        - **Disfunción orgánica**: un cambio agudo en la puntuación SOFA ≥ 2 puntos secundario a la infección
        - **Choque séptico**
          - Sepsis con alteraciones circulatorias / celulares / metabólicas graves que aumentan sustancialmente la mortalidad (mortalidad hospitalaria ≥ 40%)
          - Definición clínica: hipotensión persistente que requiere vasopresores para mantener PAM ≥ 65, y lactato sérico > 2 mmol/L (18 mg/dL), tras una reanimación con volumen adecuada
    - type: "prose"
      title: "Manejo"
      markdown: |
        - Monitorice, mantenga el ABC
        - Controle los signos vitales (PA, FC, FR, SpO₂, temp, peso)
        - Inicie oxígeno si la SpO₂ < 90%
        - ECG de 12 derivaciones
        - Haga una historia y una exploración física breves y dirigidas
    - type: "flowchart"
      variant: "algorithm"
      stages:
      - decision: "qSOFA — ¿2 o más de estos?"
        criteria:
        - "GCS < 15"
        - "Frecuencia respiratoria > 22"
        - "PAS < 100"
        - "⚠️ El qSOFA NO DETECTA a muchos pacientes sépticos — una puntuación menor de 2 NO descarta la sepsis. Trate según la sospecha clínica"
        outcomes:
        - label: "Sí"
          box:
            title: "Trate como sepsis hasta tener los resultados"
            bullets:
            - "Bolo de líquidos IV"
            - "Inicie antibióticos — EN MENOS DE 1 HORA en el choque séptico, en menos de 3 horas en los demás"
            - "Extraiga análisis, incluidos hemocultivos"
            severity: "priority"
        - label: "No"
          box:
            title: "No trate como sepsis"
            severity: "non_urgent"
    - type: "prose"
      title: "Puntuación SOFA (puntos por sistema orgánico)"
      markdown: |
        - **PaO₂/FiO₂ (mmHg)** — 0: ≥ 400 · 1: < 400 · 2: < 300 · 3: < 200 con soporte respiratorio · 4: < 100 con soporte respiratorio
        - **Plaquetas (×10³/µL)** — 0: ≥ 150 · 1: < 150 · 2: < 100 · 3: < 50 · 4: < 20
        - **Bilirrubina (mg/dL)** — 0: < 1.2 · 1: 1.2–1.9 · 2: 2.0–5.9 · 3: 6.0–11.9 · 4: > 12.0
        - **PAM / vasopresores** — 0: ≥ 70 · 1: < 70 · 2: dopamina < 5 o dobutamina (cualquier dosis) · 3: dopamina 5.1–15 o adrenalina ≤ 0.1 o noradrenalina ≤ 0.1 · 4: dopamina > 15 o adrenalina > 0.1 o noradrenalina > 0.1
        - **GCS** — 0: 15 · 1: 13–14 · 2: 10–12 · 3: 6–9 · 4: < 6
        - **Creatinina (mg/dL)** — 0: < 1.2 · 1: 1.2–1.9 · 2: 2.0–3.4 · 3: 3.5–4.9 · 4: > 5.0
        - **Diuresis (mL/día)** — 3: < 500 · 4: < 200
    - type: "flowchart"
      variant: "algorithm"
      stages:
      - decision: "¿Aumento ≥ 2 de la puntuación SOFA respecto a la basal? (suponga una basal de 0 si no hay disfunción orgánica previa conocida)"
        outcomes:
        - label: "Sí"
          box:
            title: "Trate la sepsis"
            severity: "priority"
        - label: "No"
          box:
            title: "No trate como sepsis"
            severity: "non_urgent"
    - type: "prose"
      title: "Recordatorio"
      highlight: true
      markdown: |
        Este protocolo puede usarse durante la hospitalización, no solo al ingreso.
