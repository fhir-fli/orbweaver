  - type: "prose"
    markdown: |-
      **Estudios**
      a) Gota gruesa (GG) para parásitos de malaria
      b) ± Determinación de hemoglobina

      **Tratamiento** (ambulatorio)
      - Es el mismo esquema con el que debe terminar la malaria complicada
      - Trate a los lactantes de **< 5 kg** como niños de **5 kg**

  - type: "table"
