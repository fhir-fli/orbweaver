      - text: "Marrón"
    - cells:
      - text: "> 35"
      - text: "4 tabletas dos veces al día"
      - text: "Verde"

  - type: "prose"
    markdown: |-
      \* Idealmente, las dos primeras dosis deben administrarse con **8 horas de intervalo**.

