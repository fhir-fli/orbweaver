  - page_number: 88
    blocks:
    - type: "prose"
      title: "Evaluación"
      markdown: |
        - Busque la ictericia con luz natural intensa si es posible. Mire los ojos, bajo la lengua, las palmas y las plantas.
        - Mida siempre la bilirrubina sérica si tiene < 24 horas y si la ictericia es clínicamente moderada o intensa. Trate según [bilitool.org](https://bilitool.org/) o según la edad en días conforme a las guías de la OMS de abajo.
        - **Toda ictericia < 24 horas requiere más estudio y tratamiento urgente con fototerapia o exanguinotransfusión.**
        - Si no puede medir la bilirrubina, inicie fototerapia:
          - En un bebé sano con ictericia fácilmente visible en la planta del pie durante la primera semana de vida
          - En un prematuro (< 2000 g) con CUALQUIER ictericia visible
          - En un bebé enfermo que come mal, está irritable y tiene ictericia moderada a intensa — evalúe y trate la sepsis
        - Los bebés de más de 2 semanas necesitan estudio de causas obstructivas de ictericia como la atresia biliar. En general no requieren fototerapia.
        - La fototerapia no trata la hiperbilirrubinemia **directa (conjugada)**.
    - type: "prose"
      title: "Fototerapia y cuidados de soporte — lista de control"
      markdown: |
        - **Proteja los ojos** con un parche ocular o un gorro. Retírelo de vez en cuando durante las tomas.
        - **Mantenga al bebé desnudo.**
        - **Coloque al bebé cerca de la fuente de luz** — a menudo se recomiendan 45 cm de distancia, pero más cerca está bien si el bebé no se sobrecalienta. Puede usar una tela blanca alrededor de la luz para reflejarla hacia el bebé. Conozca la distancia recomendada para su equipo.
        - **No coloque nada sobre los equipos de fototerapia.** Las luces y el bebé deben mantenerse frescos, así que no tape las rejillas de ventilación. Mantenga el equipo limpio — el polvo puede transportar bacterias y reducir la luz emitida.
        - **Fomente la lactancia materna frecuente.** Salvo que el bebé esté deshidratado, los suplementos o líquidos IV son innecesarios. La fototerapia puede interrumpirse para las tomas y para el vínculo materno.
        - **Cambie de posición periódicamente** de decúbito supino a prono. Exponga la máxima superficie del bebé. Recoloque tras cada toma.
        - **Controle la temperatura** cada 2 horas y el peso cada 24 horas.
        - **Se requiere una bilirrubina plasmática/sérica periódica (cada 12–24 h).** La valoración visual de la ictericia no es fiable.
        - **Asegúrese de que la fuente de luz funciona** y emite luz. Los tubos fluorescentes deben cambiarse si llevan más de 6 meses de uso, si los extremos se han ennegrecido o si las luces parpadean.
