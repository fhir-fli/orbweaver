    - type: "prose"
      markdown: |
        - La exanguinotransfusión no se describe en este libro de bolsillo; los niveles de bilirrubina sérica se incluyen por si es posible hacerla, o si el lactante puede trasladarse con rapidez y seguridad a otro centro donde se pueda realizar.
        - Los factores de riesgo incluyen tamaño pequeño (< 2.5 kg al nacer o nacido antes de las 37 semanas de gestación), hemólisis y sepsis.
        - Cualquier ictericia visible en cualquier parte del cuerpo el día 1 es significativa.
