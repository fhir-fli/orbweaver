  blocks:
  - type: "prose"
    markdown: |
      - **No** requiere antibióticos salvo que sea bacteriana
  - type: "table"
    title: "Diagnóstico de sinusitis aguda — 2 síntomas mayores, O 1 mayor + ≥2 menores"
    columns: ["Síntomas mayores", "Criterios menores"]
    column_flex: [1, 1]
    rows:
    - cells:
      - bullets:
        - "Congestión u obstrucción nasal"
        - "Secreción nasal purulenta"
        - "Hiposmia o anosmia"
        - "Congestión o plenitud facial"
        - "Dolor o presión facial"
