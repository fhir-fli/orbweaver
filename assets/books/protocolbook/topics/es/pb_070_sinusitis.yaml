  - type: "prose"
    title: "Diagnóstico de sinusitis BACTERIANA — cualquiera de"
    markdown: |
      - Signos/síntomas anteriores que duran ≥10 días
      - Empeoramiento o aparición de signos/síntomas tras una mejoría inicial, en general a los 5–6 días (**empeoramiento bifásico**)
      - Síntomas graves con fiebre concurrente (>38.5 axilar) y secreción nasal purulenta o dolor facial durante ≥3 días
  - type: "prose"
    title: "Tratamiento de la sinusitis bacteriana (debe cumplir los criterios anteriores)"
    markdown: |
      - Amoxicilina 45mg/kg/dosis dos veces al día x 7 días si tiene >2 años y enfermedad leve-moderada no complicada
      - Amoxicilina/ácido clavulánico 45mg/kg/dosis dos veces al día x 7 días si tiene <2 años, enfermedad moderada-grave, asiste a guardería o recibió antibióticos en las últimas 4 semanas
      - Si no mejora en 72 horas, considere cambiar de antibiótico
