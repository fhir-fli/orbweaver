    palette:
      alert: "0xFFD32F2F"
      alert_fill: "0xFFFDECEA"
      alert_text: "0xFFB71C1C"
    title: "La DAG complicada incluye cualquiera de los siguientes"
    markdown: |
      Hipoglucemia, hipotermia, infecciones, deshidratación grave, choque, Hb <4, insuficiencia cardíaca, úlcera corneal, dermatosis grave, o signos de peligro de la AIEPI como anorexia, vómitos incoercibles, convulsiones, letargo/pérdida de conciencia, incapacidad para comer o mamar, fiebre >39.
