    - cells: ["**<6 meses**", "Edema", "Ausente", "Presente"]
    - cells: ["**6–59 meses**", "Peso/longitud, peso/talla", "≥−3DE y <−2DE", "<−3DE"]
    - cells: ["**6–59 meses**", "Edema", "Ausente", "Presente"]
    - cells: ["**6–59 meses**", "PB", "≥11.5 y <12.5cm", "<11.5cm (rojo)"]
    - cells: ["**5–19 años**", "IMC/edad", "≥−3DE y <−2DE", "<−3DE"]
