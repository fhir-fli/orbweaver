  title: "DAG — evaluación y clasificación"
  list_subtitle: "p.63 · PB/PT + DAM frente a DAG"
  last_reviewed: "pocketbook v1.7"
  tags: ["desnutrición", "DAG", "DAM", "desnutrición aguda grave", "PB", "peso para la talla", "edema", "nutrición", "pediátrico", "puntuación z"]
  category: "medical"
  page_number: 63
  blocks:
  - type: "prose"
    title: "Evaluación nutricional"
    markdown: |
      - **Perímetro braquial (PB)** en cm
        - Mide la emaciación/masa muscular en niños mayores de 6 meses
        - Se correlaciona de forma significativa con el riesgo de muerte
        - Herramienta de cribado fácil en la comunidad
        - Se usa en pacientes muy enfermos a los que no se puede pesar/medir
      - **Peso corporal** (en kg con precisión de 0.1 kg)
        - Pese en cuanto llegue al hospital
        - Hágalo una hora antes o después de una comida
        - Quite la ropa, joyas, pañales, etc.
        - Mantenga al niño abrigado con una manta mientras espera para medir
      - **Longitud/talla**
        - Longitud (niño acostado): <2 años, o <87cm si se desconoce la edad
        - Talla (niño de pie): ≥2 años, o ≥87cm si se desconoce la edad
        - Si tiene ≥2 años y no puede ponerse de pie, mida la longitud y reste 0.7 cm
        - El niño debe estar descalzo, sin nada en la cabeza
        - Hombros, glúteos y talones deben tocar el tallímetro
        - Mida con precisión de 0.1 cm
  - type: "prose"
    title: "Cómo interpretar las mediciones"
    markdown: |
      - Use peso para la longitud/talla (peso/longitud, peso/talla) si tiene <5 años (59 meses)
      - Use IMC para la edad si tiene ≥5 años
      - Marque las mediciones (use las curvas de crecimiento) y obtenga la puntuación Z
      - Clasifique el grado de desnutrición
  - type: "table"
    title: "Clasificación de la desnutrición aguda"
    columns: ["Edad", "Indicador", "DAM (moderada)", "DAG (grave)"]
    column_flex: [3, 3, 4, 4]
