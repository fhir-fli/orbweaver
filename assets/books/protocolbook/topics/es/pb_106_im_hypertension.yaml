  - page_number: 106
    blocks:
    - type: "prose"
      title: "Urgencia y emergencia hipertensivas"
      markdown: |
        - PA > 180/120 → siga este protocolo
        - PA 140/90 – 180/120 → hipertenso; vea el tratamiento de la hipertensión esencial (página siguiente)
        - PA < 140/90 → no hipertenso
    - type: "prose"
      title: "Manejo"
      markdown: |
        - Monitorice, mantenga el ABC
        - Controle los signos vitales (FC, FR, SpO₂, temp)
        - Repita y **verifique** la PA
        - Inicie oxígeno si la SpO₂ < 90%
        - Acceso IV; ECG de 12 derivaciones
        - Análisis: glucemia aleatoria, hemograma, función renal, examen de orina para proteinuria
        - Haga una historia y una exploración física breves y dirigidas
    - type: "prose"
      title: "Recordatorio"
      highlight: true
      markdown: |
        La cefalea sola NUNCA es una emergencia.
    - type: "flowchart"
      variant: "algorithm"
      stages:
      - decision: "¿Evidencia de daño de órgano diana?"
        criteria:
        - "Dolor torácico / angina / SCA / insuficiencia cardíaca"
        - "Falta de aire o edema pulmonar"
        - "Ictus, entumecimiento/debilidad, cambios visuales, dificultad para hablar"
        - "Encefalopatía"
