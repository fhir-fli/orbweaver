      Si la **PDR es negativa** → **no trate**.

  - type: "prose"
    markdown: |-
      **Sea cual sea el resultado de las pruebas:** si el paciente tiene signos o síntomas de **malaria grave**, trate de forma presuntiva y haga después la prueba para confirmar.

