  - type: "row"
    blocks:
    - type: "prose"
      flex: 7
      highlight: true
      markdown: |-
        **Grave = fiebre MÁS cualquiera de:**
        - AVPU = V, P, U o ≤ 2
        - ≥ 2 convulsiones
        - Fiebre ≥ 40 °C (104 °F)
        - Hipoglucemia (< 2.5 mmol/L; < 3.0 en la desnutrición grave)
        - Anemia (Hb < 7)
    - type: "arrows"
      flex: 1
      direction: "right"
      count: 1
      label: "No"
      length: 24
    - type: "prose"
      flex: 4
      boxed: true
      markdown: "Trate como **malaria no complicada**"

  - type: "row"
    blocks:
    - type: "arrows"
      flex: 6
      count: 1
      label: "Sí"
      length: 24
      inline: true
    - type: "prose"
      flex: 6
      markdown: ""

  - type: "prose"
    title: "Malaria grave — tratamiento inmediato"
    highlight: true
    markdown: |-
      - **Artesunato\* IV / IM** a las **0, 12, 24 h** — < 20 kg: **3 mg/kg** · ≥ 20 kg: **2.4 mg/kg**
      - Trate la hipoglucemia → dextrosa al 10 % **2 ml/kg**
      - Líquidos / alimentación de mantenimiento
      - **NO administre bolos** salvo diarrea con signos de deshidratación grave
      - Si hay palidez intensa, dificultad respiratoria o Hb conocida < 5 → considere una transfusión de **10–20 ml/kg en 2–4 h**

      Tras 24 h de artesunato: si tolera la VO → cambie a **3 días de tratamiento VO**. Si no → continúe el artesunato una vez al día hasta **7 días** o hasta que tolere la VO.

  - type: "prose"
    markdown: |-
      \* La malaria grave también puede incluir PAS < 70 con piel fría y húmeda, sangrado anormal / CID, insuficiencia renal (anuria referida o Cr > 3 mg/dL), hemoglobinuria macroscópica o hiperbilirrubinemia (> 3 mg/dL) con gota gruesa MPS +++.

      El tratamiento se aplica a todos los adultos y niños, incluidos lactantes, embarazadas en todos los trimestres y mujeres que amamantan.
