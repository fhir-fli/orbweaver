      highlight: true
      markdown: |-
        **Grave = fiebre MÁS cualquiera de:**
        - AVPU = V, P, U o ≤ 2
        - ≥ 2 convulsiones
        - Fiebre ≥ 40 °C (104 °F)
        - Hipoglucemia (< 2.5 mmol/L; < 3.0 en la desnutrición grave)
        - Anemia (Hb < 7)
    - type: "arrows"
      flex: 1
      direction: "right"
      count: 1
      label: "No"
      length: 24
    - type: "prose"
      flex: 4
      boxed: true
      markdown: "Trate como **malaria no complicada**"
  - type: "row"
    blocks:
