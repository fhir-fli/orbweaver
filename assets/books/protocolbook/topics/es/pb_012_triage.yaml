# ============================================================
# ProtocolBook p.12 — Paediatric Triage of Sick Children
# Three-tier triage: emergency / priority (3TPR-MOB) / non-urgent.
# Emergency has 4 sign-clusters (Airway, Circulation, Disability,
# Severe Diarrhoea) that all feed the same 9-step action list.
#
# ✅ OE-VERIFIED CLEAN — NO CHANGES (Grey's OpenEvidence pass,
#    2026-07-26). The three-tier Emergency/Priority/Non-urgent scheme
#    was confirmed consistent with the WHO ETAT framework, and all
#    emergency sign-clusters (airway/breathing, circulation, disability,
#    severe diarrhoea) verified appropriate. The 9-step action list is
#    appropriate for the setting. Step 7's empiric D10% 5 mL/kg
#    (= 500 mg/kg, within the standard 200–500 mg/kg range) was
#    specifically endorsed as a reasonable LMIC step given how common
#    hypoglycaemia is in critically ill children here; diazepam IV/PR
#    likewise appropriate where midazolam may be unavailable.
# OpenEvidence-applied 2026-08-28 (WHO full advance pass):
#   D10% 5 -> 2 mL/kg (WHO pass flag 1-2).
# ============================================================

topic:
  id: "pb-triage-sick-children"
  title: "Triaje pediátrico del niño enfermo"
  list_subtitle: "p.12 · tabla de gravedad"
  last_reviewed: "pocketbook v1.7"
  tags: ["triaje", "pediátrico", "emergencia"]
  category: "universal"
  page_number: 12

  blocks:

  - type: "table"
    columns: ["Evaluar", "Tratar"]
    rows:

    - severity: "emergency"
      title: "Signos de emergencia — cualquiera positivo"
      cells:
      - |
        **Vía aérea y respiración**
        - Respiración obstruida
        - Cianosis central
        - Dificultad respiratoria grave
        - Respiración débil / ausente

        **Circulación** — manos frías con cualquiera de:
        - Llenado capilar > 3 seg
        - Pulso débil + rápido
        - Pulso lento (< 60 lpm) o ausente

        **Discapacidad (neurológico)**
        - Coma
        - Convulsiones
        - Confusión (AVPU: V, P o U)

        **Diarrea grave** — con cualquiera de:
        - Letargo / inconsciente
        - No puede beber / bebe mal
        - El pliegue cutáneo vuelve lentamente
        - Ojos hundidos
      - |
        1. Pida ayuda
        2. Traslade a una cama de emergencia
        3. Administre oxígeno por cánula nasal
        4. Canalice una vía IV
        5. Controle los signos vitales (peso, FC, FR, PA)
        6. Extraiga sangre — Hb, malaria, grupo y pruebas cruzadas si está pálido (tubo rojo y morado)
        7. D10% 2 ml/kg IV
        8. Si hay convulsiones: **diazepam IV o rectal**
        9. Mantenga al paciente abrigado

    - severity: "priority"
      title: "Signos prioritarios (3TPR-MOB) — cualquiera positivo"
      cells:
      - |
        - **T**iny (pequeño) — lactante enfermo < 2 meses
        - **T**emperatura — muy alta o muy baja
        - **T**raumatismo — traumatismo mayor
        - **P**ain (dolor) — niño con dolor intenso
        - **P**oisoning (intoxicación) — la madre refiere una intoxicación
        - **P**alidez — palidez palmar intensa
        - **R**estless (inquieto) / irritable / hipotónico
        - **R**espiratoria, dificultad
        - **R**eferencia — trae una carta de referencia urgente
        - **M**alnutrición — emaciación grave visible
        - **O**edema (edema) de ambos pies
        - **B**urns (quemaduras) — quemaduras graves
      - |
        **Al frente de la fila:**
        - Revisión clínica lo antes posible
        - Pesar
        - Observaciones basales y signos vitales

    - severity: "non_urgent"
      title: "No urgente — ninguno de los signos anteriores"
      cells:
      - ""
      - Continúe con la evaluación y el tratamiento de rutina según la prioridad del niño.
