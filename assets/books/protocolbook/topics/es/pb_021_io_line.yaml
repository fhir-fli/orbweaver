# translated-from-sha256: 935e0a2759da3b4755fb27a2302a04c1f55902ec5e98e0f37b3f24676c8e37a4
# ============================================================
# ProtocolBook p.21 — Use of intra-osseous lines
#
# Procedural guide: callout indication + 9-step technique + anatomic
# illustration. Pure prose + image; no new schema.
#
# ✅ OE-VERIFIED CLEAN — NO CHANGES (Grey's OpenEvidence pass,
#    2026-07-26). Indication (all children in shock without IV access)
#    matches the 2025 AHA/AAP position that IO is a rapid, safe,
#    effective first-line access route. Technique verified against
#    Fiser 1990 NEJM: 15–18 G IO/marrow needle with the 16–21 G
#    hypodermic fallback (a sound LMIC adaptation), aspiration with a
#    5 mL syringe, 3 mL NS flush to confirm, and replacing the IO with
#    an IV within 8 h to limit osteomyelitis / compartment syndrome.
#    Our landmark wording ("antero-medial flat surface of tibia, at
#    the junction of upper and middle thirds") describes the same
#    proximal tibial metaphysis as the more common "1–3 cm below the
#    tibial tuberosity" phrasing — accepted as equivalent.
#
# ⚠️ NOTED, NOT CHANGED (OE rated LOW, acceptable): we say a strict
#    90° insertion angle. Classic manual-needle teaching is 60–90°,
#    angled slightly away from the growth plate; 90° is what powered
#    devices (EZ-IO) use. OE called 90° a reasonable simplification
#    for a pocket manual.
# ============================================================

topic:
  id: "pb-io-line"
  title: "Colocación de una vía intraósea"
  list_subtitle: "p.21 · técnica + ilustración"
  last_reviewed: "pocketbook v1.7"
  tags: ["io", "procedimiento", "acceso_vascular", "choque", "pediátrico"]
  category: "critical_care"
  page_number: 21

  blocks:

  - type: "prose"
    highlight: true
    markdown: |
      **Use la vía IO** en todo niño en choque si no hay acceso IV, para no retrasar la fluidoterapia.

  - type: "prose"
    title: "Técnica"
    markdown: |
      - **Aguja:** aguja IO o de médula ósea **15–18 G** (o hipodérmica **16–21 G** si no hay IO).
      - **Referencias y preparación:** identifique las referencias anatómicas, guantes estériles, desinfecte la zona.
      - **Sitio:** centro de la cara anteromedial (plana) de la tibia, en la unión del tercio superior y el tercio medio.
      - **Asepsia:** antiséptico + gasa estéril (alcohol al 70 %, yodo o clorhexidina).
      - **Inserción:** bisel hacia los dedos del pie, en vertical (90°), avance lentamente con movimiento rotatorio.
      - **Deténgase** cuando note una **pérdida brusca de resistencia** — luego aspire con una jeringa de 5 ml.
      - **Lavado:** inyecte lentamente 3 ml de SSN observando si hay fuga bajo la piel — si todo está bien, conecte el equipo de líquidos IV y fíjelo con apósitos / cinta.
      - **Bolos:** puede necesitar una jeringa de 20 ml o 50 ml.
      - **Vigile** si se hinchan la pierna / los músculos de la pantorrilla.
      - **Sustituya** el acceso IO por uno IV en **8 horas**.

