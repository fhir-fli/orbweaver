topic:
  id: "pb-anaemia"
  title: "Anaemia — Approach & Transfusion Thresholds"
  list_subtitle: "p.74 · assess / resuscitate / when to transfuse"
  last_reviewed: "pocketbook v1.7"
  tags: ["anaemia", "anemia", "pallor", "transfusion", "haemoglobin", "malaria", "sepsis", "bleeding", "koilonychia"]
  category: "medical"
  page_number: 74

  blocks:

    - type: "prose"
      title: "History"
      markdown: |
        - Sleepiness
        - Anorexia
        - Dysphagia
        - Fatigue
        - Dyspnoea on exertion
        - Syncope

    - type: "prose"
      title: "Clinical findings"
      markdown: |
        - Pallor
        - Tachycardia
        - Stomatitis
        - Koilonychia
        - Angular stomatitis
        - Glossitis
        - Oesophageal / pharyngeal webs
        - Heart failure symptoms

    - type: "prose"
      title: "Management"
      markdown: |
        - Monitor, support ABCs
        - Check vital signs (BP, PR, RR, SpO₂, Temp, **Weight**)
        - Assess GCS, hydration status
        - Insert 2 IVs; start oxygen if SpO₂ < 94%
        - Draw CBC, malaria; consider blood cultures if concern for sepsis
        - Type and cross if tachycardic, tachypnoeic, or severe pallor
        - Perform a brief, targeted history and physical exam

    - type: "prose"
      title: "Is there a possibility of bleeding?"
      markdown: |
        - Ask about recent trauma
        - Clinically significant GI bleeding should be visible as haematemesis, coffee-ground emesis, melaena, or haematochezia
        - Four locations in the body may hide active bleeding: thorax, abdomen, retroperitoneum / pelvis, thigh

    - type: "prose"
      title: "Empirical treatment"
      highlight: true
      markdown: |
        Consider empirically treating for malaria and sepsis if appropriate — remember there is NO way to clinically differentiate between malaria and sepsis.

    - type: "table"
      title: "When to transfuse"
      zebra: true
      columns: ["Setting", "Transfuse if haemoglobin"]
      column_flex: [5, 5]
      column_align: ["left", "left"]
      rows:
        - cells: [{text: "**High malaria areas**", span: 2}]
        - cells: ["Low blood supply", "<4 g/dL, or <5 g/dL and unstable"]
        - cells: ["Good blood supply", "<5 g/dL"]
        - cells: [{text: "**Low malaria areas**", span: 2}]
        - cells: ["—", "<7 g/dL, or <10 g/dL and unstable"]

    - type: "prose"
      markdown: |
        **"Unstable" means any of:** respiratory distress (RR >50 in infants, >40 in older children) · impaired consciousness · clinical shock (weak fast pulse, cold extremities, capillary refill >3 s) · acidotic breathing.

        Then [evaluate for the cause of anaemia](topic:pb-anaemia-workup).
