        - ≤ 20 kg: 2.5 mg/dose in 3 mL NS
        - > 20 kg: 5 mg/dose in 5 mL NS

        **MDI (metered dose inhaler):**
        - 5–10 kg: 4 puffs
        - 10–20 kg: 6 puffs
        - > 20 kg: 8 puffs
      notes: |
        **DO NOT EVER GIVE ORALLY — not effective.**

    - id: "streptokinase"
      name: "Streptokinase"
      class: "thrombolytic"
      dose: |
        **STEMI — adults:** 1.5 million IU IV over **60 minutes**

        **High-risk PE — adults:** **250,000 IU IV over 30 min, then 100,000 IU/hr for
        12–24 hours** (an accelerated 1.5 million IU over 2 h is also described)

        ⚠️ **The PE regimen is a prolonged 12–24 h infusion, unlike the single STEMI
        infusion** — this is the key difference on the shelf.
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        🛑 **Hold heparin during the streptokinase infusion**; start or resume once the
        aPTT falls.
        **Do not repeat** from about 5 days to 12 months after a previous dose
        (neutralising antibodies). Hypotension during the infusion is common — slow the rate.
        Usually the most commonly stocked lytic in this setting.

    - id: "sulphadoxine-pyrimethamine"
      name: "Sulphadoxine-pyrimethamine (SP)"
      class: ""
      page: 156
      dose: |
        **Children:**
        - 2–5 yo: ½ tab monthly
        - 5–10 yo: 1 tab monthly
        - 10–15 yo: 2 tabs monthly
        - > 15 yo: 3 tabs monthly
      notes: |
        Malaria prophylaxis in patients with sickle cell disease.

    - id: "spironolactone"
      name: "Spironolactone"
      class: ""
      page: 156
      dose: |
        - Children: 0.5–1.5 mg/kg/dose BD
        - Adults: 25 mg PO OD
      notes: |
        Max dose: 100 mg/day.

    - id: "tenecteplase"
      name: "Tenecteplase"
      class: "thrombolytic"
      dose: |
        **STEMI — adults**, single IV bolus over 5 seconds, by weight:
        - < 60 kg: 30 mg · 60–69 kg: 35 mg · 70–79 kg: 40 mg · 80–89 kg: 45 mg · ≥ 90 kg: 50 mg

        **High-risk PE — adults:** the **same weight-banded bolus** (off-label for PE)
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        Absolute contraindications: prior intracranial haemorrhage, structural cerebral
        lesion, ischaemic stroke within 3 months, active bleeding, suspected aortic
        dissection.
        **The bolus makes it ideal where infusion pumps are scarce.**

    - id: "ticagrelor"
      name: "Ticagrelor"
      class: "antiplatelet"
      dose: |
        **NSTEMI NOT receiving fibrinolysis — adults:** 180 mg PO loading, then
        **90 mg PO BD** (60 mg BD after 12 months if continued)
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        🛑 **Never combine with a fibrinolytic — use clopidogrel in lysed patients.**
        Contraindicated after intracranial haemorrhage. Causes dyspnoea. Avoid aspirin
        above 100 mg/day.
        **Not on the WHO EML and often unavailable or unaffordable at district level —
        clopidogrel is the practical substitute here.**

    - id: "valacyclovir"
      name: "Valacyclovir"
      class: ""
      page: 156
      dose: |
        **Children:**
        - HSV: **20 mg/kg/dose PO BD–TID (max 1 g/dose)**
        - VZV: 20 mg/kg/dose PO TID

        **Adults:**
        - HSV, initial episode: **1 g PO BD × 7–10 days**
        - HSV, recurrence: **500 mg PO BD × 3 days**
        - HSV in HIV: 500 mg PO BD, 5–10 days
        - VZV (zoster): 1 g PO TID × 7 days
      notes: |
        ⚠️ The book previously printed the adult HSV dose as **400 mg PO TID** — that is
        **aciclovir's** regimen, not valaciclovir's — and put a flat adult **1 g PO BD** in
        the children's row. The two rows were crossed with the aciclovir entry.
        **The two drugs are not interchangeable at one dose.**

    - id: "valganciclovir"
      name: "Valganciclovir"
      class: ""
      page: 156
      dose: |
        Adults: 900 mg PO BD

    - id: "sulfadiazine"
      name: "Sulfadiazine"
      class: ""
      page: 156
      dose: |
        - Children: 40 mg/kg/dose QID
        - Adults: 1.5 g PO q6hrs
      notes: |
        Given with leucovorin and pyrimethamine for toxoplasmosis.

    # ═══════════════════════ PAGE 157 ═══════════════════════
    - id: "valproic-acid"
      name: "Valproic Acid / Sodium Valproate"
      class: ""
      page: 157
      dose: |
        **Children:**
        - Initial: 10–15 mg/kg/day PO ÷ q8–12hrs
        - Maintenance: 30–60 mg/kg/day ÷ q8–12 hrs

        **Adults:**
        - Initial: 15 mg/kg/day PO ÷ q8–12hrs
        - Maintenance: 60 mg/kg/day ÷ q8–12 hrs

    - id: "vitamin-a"
      name: "Vitamin A"
      class: ""
      page: 157
      dose: |
        **Routine supplementation:**
        - < 6 months: not recommended
        - 6–12 months: 100,000 units PO stat
        - > 12 months: 200,000 units PO stat

        **Treatment of deficiency (eye signs, or recent measles):** days 1, 2 and 14
        - < 6 months: 50,000 units
        - 6–12 months: 100,000 units
        - > 12 months: 200,000 units
      notes: |
        For ROUTINE supplementation: once on admission; should not be given twice within 1 month.

        The 1-month rule does **not** apply to the 3-dose deficiency-treatment course above — that schedule is deliberate. In severe acute malnutrition, give high-dose vitamin A only if there are eye signs or a recent history of measles: F-75, F-100 and RUTF already contain enough for everyone else.

    - id: "vitamin-d"
      name: "Vitamin D"
      class: ""
      page: 157
      dose: |
        **Infants:**
        - Rickets: 2000 IU/day × 6–12 wks
        - Maintenance: 400 IU/day

        **Children:**
        - Rickets: 2000 IU/day × 6–12 wks
        - Maintenance: 600–1000 IU/day

        **Adults:**
        - Deficiency: 6000 IU/day × 8 wks
        - Maintenance: 2000 IU/day
      notes: |
        Children may also take 50,000 IU/week × 6 weeks.

    - id: "vitamin-k"
      name: "Vitamin K"
      class: ""
      page: 157
      dose: |
        **Neonate:**
        - Preterm ≤ 1500 g: 0.3–0.5 mg/kg IM stat — a single IV dose is not recommended in a preterm infant
        - Preterm > 1500 g: 1 mg IM stat, the same as a term infant
        - Term: 1 mg IM stat

        **Supratherapeutic INR:**
        - Children: 0.03 mg/kg/dose IV (max dose 1 mg)
        - Adult:
          - INR 4.5–10, no bleeding: may consider 1–2.5 mg PO
          - INR > 10: 2.5–5 mg PO
          - Minor bleeding & elevated INR: 2.5–5 mg PO
          - Major bleeding & elevated INR: 10 mg PO
      notes: |
        **Adequate standard intake daily:**
        - 0–1 yrs: 2.5 mcg
        - 1–3 yrs: 30 mcg
        - 4–13 yrs: 60 mcg
        - 9–13 yrs: 60 mcg
        - > 14 yrs female: 90 mcg/day
        - > 14 yrs male: 120 mcg/day

    # ═══════════════════════ PAGE 158 ═══════════════════════
    - id: "vitamin-b12"
      name: "Vitamin B12"
      class: ""
      page: 158
      dose: |
        **Infants dietary deficiency:** 1 mg IM/day × 5 days, then weekly × 3 more doses

        **Infants / Children malabsorption:** 1 mg IM every other day × 6 days, then weekly for 6 weeks

        **Adults:**
        - Deficiency: 1 mg PO QD
        - Severe deficiency or pernicious anemia: 1 mg IM every other day × 6 days, then weekly for 6 weeks
      notes: |
        Also known as cyanocobalamin.

    - id: "warfarin"
      name: "Warfarin"
      class: ""
      page: 158
      dose: |
        - **Do NOT load.** Routine loading increases bleeding without faster protection
        - Adults: **start 5 mg PO OD; 2.5 mg or less if older, frail, malnourished, or with liver disease**
        - Children: 0.2 mg/kg (max 10 mg) as a single first dose, then by INR
        - **For VTE, overlap with LMWH or UFH for ≥ 5 days AND until INR ≥ 2 for 24 h** — warfarin alone from day 1 is inadequate
        - First INR at 3–5 days, then at least weekly until stable. Goal 2–3
      notes: |
        Max 10 mg/dose.

    - id: "zinc-sulfate"
      name: "Zinc Sulfate"
      class: ""
      page: 158
      dose: |
        - Age ≤ 6 m: 10 mg daily for 10–14 days
        - Age > 6 m: 20 mg daily for 10–14 days
