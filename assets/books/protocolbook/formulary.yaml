# ============================================================
# ProtocolBook pp.146–158 — Essential Medications Formulary.
#
# Built as a faceted `collection` (Grey's decision 2026-07-19): NOT a
# page-by-page printed list. The book's alphabetical Medications | Dose and
# Route | Notes/Contraindications table is modelled as drug records and
# rendered by the existing DrugIndexScreen (A–Z + search). These drugs are
# PROSE-dosed (by population/indication), so each uses the `dose` markdown
# field (added to the Drug model for this formulary) rather than the WHO
# weight-band grid. `intro` carries the book's front-matter dosing notes.
#
# Source-verified against pp.146–158 @150/300 dpi (RULE #0). p.145 is the
# section divider.
#
# SILENT CORRECTIONS of clear typos (Grey to fix the source PDF):
#   - p.148 Ceftriaxone adults "Other: 2 g IV q23hr" → "q24hr" (once-daily
#     ceftriaxone; q23hr is a clear typo).
#   - p.149 Cloxacillin adults "Severe infection: q4hr5" → "q4hr" (stray 5);
#     "Flush line ... will if given" → "well".
#   - p.153 Morphine adults "2–10 mg/kg/dose PO" → "2–10 mg/dose PO". The
#     "/kg" is a DANGEROUS typo (2–10 mg/kg in an adult ≈ lethal); same fix
#     as the p.80 pain-ladder morphine row. Child /kg rows are correct.
#   - p.153 Lorazepam agitation "0.5–2 mg IV 12–4hrs" → "q2–4hrs".
#   - p.156 Sulfadiazine notes "for PCP" → "for toxoplasmosis" (sulfadiazine
#     + pyrimethamine + leucovorin is the toxoplasmosis regimen, matching the
#     book's own p.136; sulfadiazine has no role in PCP).
#
# DRUG-NAME SPELLING normalised to the correct INN (better for search; no
# dose change): "Gancyclovir"→"Ganciclovir", "Valgancyclovir"→
# "Valganciclovir", "Paramomycin"→"Paromomycin".
#
# OE CURRENCY FLAG (transcribed faithfully, NOT edited — for the OE pass):
#   - p.156 Ranitidine was withdrawn globally in 2020 (NDMA contamination);
#     a modern formulary would substitute an alternative H2 blocker / PPI.
#
# ✅ FULL VERIFICATION SWEEP 2026-07-20: every drug on pp.146–158 re-checked
#   against a 300-dpi render — ZERO dose-transcription errors; the only
#   deviations from the source are the intentional corrections listed above.
# OpenEvidence-applied 2026-08-28 (WHO full advance pass):
#   Dextrose/Glucose: paediatric D10% 5 -> 2 mL/kg (0.2 g/kg) (flag 1-2).
# Cross-book pass 2026-08-28: IV diazepam 0.3 -> 0.2 mg/kg, to match the
#   resuscitation page (p.20) and the FDA label. The formulary and p.20
#   had disagreed. Added the never-confuse-IV-with-rectal rule and the
#   age-banded rectal doses.
# Cross-book pass 2026-08-28: vitamin K preterm threshold 1 kg -> 1500 g
#   (AAP). Above it, 1 mg IM flat, not 0.5 mg; at or below it, 0.3-0.5
#   mg/kg. The two books had split at different weights.
# Cross-book pass 2026-08-28: calcium gluconate doses now LABELLED BY
#   INDICATION. The two books differed 2-3x only because one was dosing
#   neonatal hypocalcaemia (2 mL/kg) and the other child tetany (0.6-1)
#   and hyperkalaemic membrane stabilisation (0.5). All three are correct
#   in context; the defect was that none of them said which.
# Cross-book durations pass 2026-08-28: the PCP co-trimoxazole dose in this
#   formulary entry was still the withdrawn 8 mg/kg/dose TID (= 24 mg/kg/day)
#   after OE flag 4-1 capped it at 15-20 mg/kg/day.
# ============================================================

formulary:
  id: "pb_formulary"
  title: "Essential Medications"
  subtitle: "ProtocolBook formulary · pp.146–158"

  # Prose-dose formulary — no weight-band axes (kept minimal to satisfy the
  # loader; no drug uses bands).
  bands:
    label: ""
    columns: []
  bands_art:
    label: ""
    columns: []

  facets:
    - key: "alpha"
      label: "A–Z"
      mode: "alpha"
      tap: "detail"

  classes: []
  indications: []

  intro: |
    **Age designations**
    - Neonates: ≤ 28 days old
    - Infants: ≤ 1 year old (includes neonates unless specified)
    - Children: ≤ 12 years old (includes infants & neonates unless specified)
    - Adult: > 12 years old

    **Dosing regimens**
    - "dose BD" = that dose given twice daily, not divided
    - "dose ÷ BD" = the dose is the total for the day, divided into two separate equal doses

    **Note:** these are the most common regimens for commonly encountered conditions; the specific patient or condition may require different dosing.

  drugs:

    # ═══════════════════════ PAGE 146 ═══════════════════════
    - id: "acyclovir"
      name: "Acyclovir"
      class: ""
      page: 146
      dose: |
        **Children:**
        - HSV: 20 mg/kg/dose PO TID
        - VZV: 20 mg/kg/dose PO QID

        **Adults:**
        - HSV: 400 mg PO TID
        - VZV (zoster): **800 mg PO five times daily** — aciclovir's poor oral bioavailability is why it is not dosed like valaciclovir

    - id: "adenosine"
      name: "Adenosine"
      class: "antiarrhythmic"
      dose: |
        **Stable** regular narrow-complex SVT — after vagal manoeuvres.

        **Children:** 0.1 mg/kg rapid IV push (max 6 mg); if no response 0.2 mg/kg (max 12 mg)

        **Adults:** 6 mg rapid IV push + 20 mL flush; if no response 12 mg; may repeat 12 mg. **Max 3 doses**
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        Give as fast as possible into a proximal vein with an immediate flush; warn the
        patient about transient chest tightness and flushing.
        🛑 **For an UNSTABLE patient, synchronised cardioversion — not adenosine.**
        Caution in asthma (bronchospasm) and in known WPW with an irregular wide-complex rhythm.

    - id: "albendazole"
      name: "Albendazole"
      class: ""
      page: 146
      dose: |
        - Age < 2 yrs: 200 mg PO × 1 dose
        - Age ≥ 2 yr: 400 mg PO × 1 dose

    - id: "alteplase"
      name: "Alteplase (rt-PA)"
      class: "thrombolytic"
      dose: |
        **High-risk (massive) PE — adults:** **100 mg IV over 2 hours**
        - Peri-arrest / cardiac arrest: **0.6 mg/kg over ~15 min (max 50 mg)**
        - A 50 mg regimen has similar efficacy with less bleeding (evidence for full equivalence is limited)

        ⚠️ **The PE regimen is NOT the STEMI regimen** — do not carry a STEMI infusion schedule across.
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        Same absolute contraindications as the other lytics. **Unfractionated heparin may
        run during the alteplase infusion** (unlike streptokinase).
        Often unavailable or unaffordable at district level — **streptokinase or
        tenecteplase are the realistic substitutes.**

    - id: "aminophylline"
      name: "Aminophylline"
      class: ""
      page: 146
      dose: |
        **Infants** (only < 32 weeks or 1.5 kg with apnea of prematurity):
        - Loading: 6 mg/kg IV/PO over 1 hr
        - Maintenance dose (IV or oral):
          - Age ≤ 6 days: 2.5 mg/kg 12 hrly
          - Age 7–28 days: 4 mg/kg 12 hrly
      notes: |
        **Not compatible with phenobarbital.**

        IV infusion: give over 20–30 minutes. Oral preparation: mix 10 mL aminophylline (250 mg vial) with 40 mL sterile water = 5 mg/1 mL.

    - id: "amoxicillin-clavulanate"
      name: "Amoxicillin / Amoxiclav (Amoxicillin-Clavulanic acid)"
      class: ""
      page: 146
      dose: |
        **Children:**
        - 25 mg/kg/dose BD for simple infections
        - 40–45 mg/kg/dose BD for pneumonia / otitis media

        **Adults:** 875 mg PO BD

    - id: "amlodipine"
      name: "Amlodipine"
      class: ""
      page: 146
      dose: |
        - Children: 0.05 mg/kg/dose OD
        - Adults: 5–10 mg/dose PO daily
      notes: |
        Max dose 5 mg/dose, 10 mg/24 hr.

    # ═══════════════════════ PAGE 147 ═══════════════════════
    - id: "amphotericin"
      name: "Amphotericin"
      class: ""
      page: 147
      dose: |
        **Children / Adults:**
        - **Cryptococcal meningitis, preferred: liposomal amphotericin B 10 mg/kg IV as a SINGLE dose**, with flucytosine 100 mg/kg/day + fluconazole 1200 mg/day × 14 days
        - Liposomal amphotericin B: 4 mg/kg/day IV (other indications)
        - Amphotericin B deoxycholate: 1 mg/kg/day IV
      notes: |
        Used with flucytosine.

    - id: "ampicillin"
      name: "Ampicillin"
      class: ""
      page: 147
      dose: |
        **Neonate:** 50 mg/kg/dose IV or IM
        - < 7 days: 12 hourly
        - 8–28 days: 8 hourly

        **Infants / Children:** 50 mg/kg/dose (max 500 mg) 6 hourly IV/IM

        **Adults:** 2 g 6 hourly IV/IM
      notes: |
        **DO NOT MIX WITH GENTAMICIN.** Flush line or burette if given at the same time as gentamicin.

        - IV push: over 3–5 min
        - IV infusion: over 15–30 min

    - id: "apixaban"
      name: "Apixaban"
      class: "anticoagulant"
      dose: |
        **VTE treatment — adults:** 10 mg PO BD × 7 days, then **5 mg PO BD**
        - Extended prophylaxis after ≥ 6 months, if continued: 2.5 mg BD
        - **No parenteral lead-in required**

        **Children:** specialist-directed only
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        Duration ≥ 3 months. Preferred DOAC where bleeding risk is a concern (lowest GI
        bleeding of the DOACs). Avoid in pregnancy and severe hepatic impairment.
        Availability variable at district level.

    - id: "artesunate"
      name: "Artesunate"
      class: ""
      page: 147
      dose: |
        - < 5 kg: treat as though 5 kg
        - < 20 kg: 3 mg/kg IV/IM at 0, 12 & 24 hrs
        - > 20 kg: 2.4 mg/kg IV/IM at 0, 12 & 24 hrs

    - id: "azithromycin"
      name: "Azithromycin"
      class: ""
      page: 147
      dose: |
        - Infants / Children: 10 mg/kg PO × 1 day, then 5 mg/kg PO × 4 days
        - Adults: 500 mg PO × 1 day, then 250 mg PO × 4 days
      notes: |
        MAC: the first-day dose is continued as the maintenance dose.

    - id: "benzyl-penicillin"
      name: "Benzyl Penicillin (Crystalline Penicillin, PenG)"
      class: ""
      page: 147
      dose: |
        - < 7 days: 50,000 IU/kg/dose q12hrs IV/IM
        - ≥ 7 days: 50,000 IU/kg/dose q6hrs IV/IM

        **Group A streptococcal pharyngitis:**
        - ≤ 27 kg: 600,000 IU IM single dose
        - > 27 kg: 1.2 million IU IM single dose

    - id: "calcium"
      name: "Calcium"
      class: ""
      page: 147
      dose: |
        **Children:**
        - Replacement: 10 mg/kg/day
        - Symptomatic hypocalcaemia / tetany / hypocalcaemic convulsions: **0.5–1 mL/kg** of 10% solution (≈50–100 mg/kg) slow IV over 5–10 min, with cardiac monitoring
        - **Neonate: 1–2 mL/kg** of 10% solution (100–200 mg/kg) slow IV — the neonatal repletion dose is higher
        - **Hyperkalaemia is a different indication: 0.5 mL/kg** (adults 10 mL) over 2–3 min. It stabilises the myocardium and does **not** lower the potassium
        - Do not exceed **100 mg/min** in a child (200 mg/min adult); watch the ECG for bradycardia and arrhythmia

        **Adults:**
        - Tetany / convulsions: 2 g IV calcium gluconate
        - Replacement: 10 mg/kg/day
      notes: |
        - 20 mg = 1 mEq
        - 100 mg Ca carbonate = 40 mg elemental Ca = 2 mEq Ca
        - **Ca gluconate 10%:** max dose 20 mL/kg, max dose 2 g

    - id: "calcium-gluconate"
      name: "Calcium Gluconate 10%"
      class: "electrolyte"
      dose: |
        **Hyperkalaemia with ECG changes.**

        **Children:** 0.5 mL/kg slow IV over 2–3 min with cardiac monitoring; repeat every 5 min until the ECG improves

        **Adults:** 10 mL of 10% IV over 2–3 min; repeat every 5 min until the ECG improves
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        🛑 **It does NOT lower serum potassium** — it stabilises the myocardium for
        30–60 min. **Always give alongside insulin/glucose ± salbutamol.**
        Extravasation causes tissue necrosis. Give slowly and diluted in digoxin toxicity.
        **Do not mix with bicarbonate** (precipitates).

    - id: "captopril"
      name: "Captopril"
      class: ""
      page: 147
      dose: |
        - Neonate: 0.01–0.05 mg/kg/dose PO Q8–12hr
        - Infants < 6 mo: 0.01–0.5 mg/kg/dose PO BID-TID
        - Children: 0.3–0.5 mg/kg/dose PO BID-TID
        - Adults: 12.5–25 mg PO BID-TID; titrate qweek by 25 mg/dose
      notes: |
        Max dose 450 mg/24 hr.

    # ═══════════════════════ PAGE 148 ═══════════════════════
    - id: "carbamazepine"
      name: "Carbamazepine"
      class: ""
      page: 148
      dose: |
        **< 12 years:**
        - Initial: 10–20 mg/kg/24hr PO ÷ q12hr
        - Titrate qweek

        **> 12 yr:**
        - Initial: 200 mg PO BD
        - Titrate qweek by 200 mg/24hr
      notes: |
        Avoid abrupt withdrawal and watch carefully for side effects.

        **Max dose:**
        - < 12 yrs: 1 g/day, 35 mg/kg/day, 100 mg/dose BD
        - 12–15 yrs: 1 g/24hr
        - > 15 yrs: 1.2 g/24hr
        - Adult: 1.6–2.4 g/24hr

    - id: "carvedilol"
      name: "Carvedilol"
      class: ""
      page: 148
      dose: |
        - Infants / Children: 0.025 mg/kg/dose PO q12hr
        - Adults: 3.125 mg PO q12hr, max 25 mg PO q12hr
      notes: |
        Titrate every 2 weeks.

    - id: "cefixime"
      name: "Cefixime"
      class: "antibiotic"
      dose: |
        **Gonorrhoea — only where ceftriaxone is unavailable.**

        **Adults:** 800 mg PO single dose (urogenital or rectal only)

        **Children:** 8 mg/kg/day PO; ≥ 45 kg use the adult 800 mg single dose
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        🛑 **Unreliable for pharyngeal gonorrhoea — only ceftriaxone covers the pharynx.**
        Arrange a test of cure if it is used. Second-line only, because of declining
        cephalosporin susceptibility. If neither ceftriaxone nor cefixime is available:
        gentamicin 240 mg IM + azithromycin 2 g PO.

    - id: "cefotaxime"
      name: "Cefotaxime"
      class: ""
      page: 148
      dose: |
        **Neonates:**
        - < 7 days: 50 mg/kg/dose IV/IM 12 hourly
        - 8–28 days: 50 mg/kg/dose IV/IM 8 hourly

        **Infants / Children:**
        - 50 mg/kg/dose q8hr
        - Meningitis: 50 mg/kg/dose q6hr
        - Max: 2000 mg/dose

        **Adults:**
        - Meningitis / sepsis: 2 g IV 6 hrly
        - Other: 1 g IV 12 hrly
      notes: |
        Flush line or burette well if given at the same time as gentamicin.

        - IV push: over 5 minutes
        - IV infusion: over 30 min

    - id: "ceftriaxone"
      name: "Ceftriaxone"
      class: ""
      page: 148
      dose: |
        **Infants:**
        - Meningitis: 100 mg/kg IV OD
        - Sepsis / pneumonia: 80 mg/kg IV OD

        **Children:**
        - 50 mg/kg/dose IV/IM q24hr
        - Meningitis: 100 mg/kg/dose q24hr
        - Max: 2 g/dose

        **Adults:**
        - Meningitis: 2 g IV q12hr
        - Other: 2 g IV q24hr
      notes: |
        Contraindicated in neonates if severe jaundice. Do not mix with RL.

        - IV push: 10 minutes
        - IV infusion: give over 30–60 minutes

    - id: "ciprofloxacin"
      name: "Ciprofloxacin"
      class: ""
      page: 148
      dose: |
        **Children:**
        - 10–15 mg/kg/dose PO BD
        - Max: 1000 mg/dose

        **Adults:**
        - Mild / moderate infection: 500 mg PO BD
        - Severe infection: 750 mg PO BD
        - UTI (uncomplicated): 250 mg PO BD × 3 days

    # ═══════════════════════ PAGE 149 ═══════════════════════
    - id: "clarithromycin"
      name: "Clarithromycin"
      class: ""
      page: 149
      dose: |
        - Children: 10 mg/kg/dose BD
        - Adults: 500 mg PO BD

    - id: "clopidogrel"
      name: "Clopidogrel"
      class: "antiplatelet"
      dose: |
        **ACS with fibrinolysis:**
        - **Age ≤ 75: 300 mg PO loading, then 75 mg daily**
        - **Age > 75: NO loading dose — 75 mg daily** (excess intracranial haemorrhage)

        **ACS without fibrinolysis:** 300–600 mg loading, then 75 mg daily
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        Typically 12 months of dual antiplatelet therapy. The age-75 no-load rule is
        **specific to fibrinolysis-treated patients**. Hold ~5 days before major surgery
        or CABG. **This is the only evidence-based P2Y₁₂ inhibitor to combine with a
        fibrinolytic.**

    - id: "clotrimazole"
      name: "Clotrimazole"
      class: ""
      page: 149
      dose: |
        - Children: paint for oral thrush — apply BD-TID until cleared
        - Children / Adults: apply to the infected area BD-TID until cleared

    - id: "cloxacillin"
      name: "Cloxacillin"
      class: ""
      page: 149
      dose: |
        **Neonates:** 25–50 mg/kg/dose
        - < 7 days: every 12 hours
        - 8–28 days: every 8 hours

        **Infants / Children:** 25–50 mg/kg/dose IV/IM q6hr

        **Adults:**
        - 2 g IV/IM
        - Mild / moderate infection: q6hr
        - Severe infection: q4hr
      notes: |
        Flush line or burette well if given at the same time as gentamicin.

    - id: "co-trimoxazole"
      name: "Co-trimoxazole (Trimethoprim–Sulfamethoxazole, TMP-SMX)"
      class: ""
      page: 149
      dose: |
        **Children:**
        - Dosage: 4 mg/kg/dose TMP + 20 mg/kg/dose SMX/dose BD
        - For interstitial pneumonia (PCP) in children with HIV: TMP 15–20 mg/kg/day + SMZ 75–100 mg/kg/day, in 3–4 divided doses, × 21 days (max TMP 960 mg/day). **Not** 8 mg/kg/dose TID — that is 24 mg/kg/day and above the ceiling

        **Adults:**
        - TMP 160 mg / SMX 800 mg PO every 12 hrs
        - PCP pneumonia: TMP 15–20 mg/kg/day, SMX 75–100 mg/kg/day, divided in 4 equal doses
      notes: |
        - Syrup: 40 mg TMP / 200 mg SMZ per 5 mL
        - Paediatric tab: 20 mg TMP / 100 mg SMZ
        - **Max dose:** TMP 160 mg / SMX 800 mg PO q12hrs
        - **Tablets:** Single Strength (SS) = TMP 80 mg / SMX 400 mg; Double Strength (DS) = TMP 160 mg / SMX 800 mg

    - id: "dapsone"
      name: "Dapsone"
      class: ""
      page: 149
      dose: |
        Prophylaxis CD4 < 200:
        - Children: 2 mg/kg PO QD
        - Adults: 100 mg PO QD

    - id: "dexamethasone"
      name: "Dexamethasone"
      class: ""
      page: 149
      dose: |
        **Children:**
        - Extubation / upper airway swelling: 0.25–0.5 mg/kg/dose IV q6hr (max 8 mg/dose)
        - Asthma / croup: 0.6 mg/kg/dose IV/IM/PO × 1 dose

        **Adults:**
        - Cerebral edema: 2 mg PO TID

    # ═══════════════════════ PAGE 150 ═══════════════════════
    - id: "dextrose-glucose"
      name: "Dextrose / Glucose"
      class: ""
      page: 150
      dose: |
        - Neonates / infants / children: D10% 2 mL/kg (0.2 g/kg) IV push (if no D10 immediately available, use D5)
        - Adults: 25–50 mL D50 IV push
      notes: |
        **How to make D10:**
        - 1 mL of D50% + 9 mL D5%, OR
        - 2 mL of D50% + 8 mL NS

    - id: "diazepam"
      name: "Diazepam"
      class: ""
      page: 150
      dose: |
        **Rectal diazepam 2.5 mg suppository:**
        - < 10 kg: 1 suppository
        - 10–15 kg: 2 suppositories
        - 15–20 kg: 3 suppositories
        - 20–25 kg: 4 suppositories

        **IV diazepam:** 0.2 mg/kg slowly over 1 minute, max 10 mg. A second dose may be given at 0.1 mg/kg. **Maximum two benzodiazepine doses**, then a second-line agent — a third adds respiratory depression without added seizure control.

        🛑 **The IV dose is NOT the rectal dose.** Rectal diazepam is higher (0.5 mg/kg at 2–5 y, 0.3 mg/kg at 6–11 y, 0.2 mg/kg at ≥12 y, max 20 mg) because rectal absorption is incomplete.
      notes: |
        Do not give to a neonate. Do not give IM.

    - id: "digoxin"
      name: "Digoxin"
      class: ""
      page: 150
      dose: |
        **Age 2–5 yrs:**
        - Loading: 35 mcg/kg ÷ TID × 24hr
        - Maintenance: 5 mcg/kg/dose BD

        **Age 5–10 yrs:**
        - Loading: 25 mcg/kg ÷ TID × 24hr
        - Maintenance: 3 mcg/kg/dose BD

        **Age 10–12 yrs:**
        - Loading: 0.75–1.5 mg ÷ TID × 24hr
        - Maintenance: 30–125 mcg BD

        **Adults:**
        - Rapid digitalization:
          - IV/IM: 5 mcg/kg × 1 dose, followed by 2.5 mcg/kg q8hr × 2 doses
          - PO: 7 mcg/kg × 1 dose, followed by 3 mcg/kg q8hr × 2 doses
        - Maintenance:
          - IV/IM: 2.4–3.6 mcg/kg/day
          - PO: 3.4–5.1 mcg/kg/day
      notes: |
        Titrate maintenance dose every 2 weeks.

    - id: "dobutamine"
      name: "Dobutamine"
      class: "vasoactive"
      dose: |
        **Pump failure with volume overload / cardiogenic shock.**

        **Children and adults:** 2–20 mcg/kg/min IV, titrated — often combined with
        norepinephrine when the patient is hypotensive
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        Can **worsen** hypotension (β₂ vasodilatation) and provoke tachyarrhythmia —
        monitor rhythm and blood pressure. Not a sole agent in frank hypotension.
        Availability variable at district level.

    - id: "dopamine"
      name: "Dopamine"
      class: "vasoactive"
      dose: |
        🛑 **Fallback only — use norepinephrine first.**

        **Children and adults:** 5–20 mcg/kg/min IV

        ⚠️ 2–5 mcg/kg/min is the old "renal dose" and is **not** a pressor dose — do not
        rely on it for hypotension. **Always per kilogram.**
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        More arrhythmia and higher mortality than norepinephrine. Keep only as the
        substitute where norepinephrine is out of stock, and **transition as soon as it is
        available**. Widely available, which is why it persists.

    - id: "doxycycline"
      name: "Doxycycline"
      class: "antibiotic"
      dose: |
        **Chlamydia — adults:** 100 mg PO BD × 7 days (21 days for LGV / proctitis)

        **Pelvic inflammatory disease — adults:** 100 mg PO/IV BD × 14 days, with
        ceftriaxone + metronidazole

        **Children ≥ 8 y or > 45 kg:** 100 mg PO BD. Under 8 y — prefer azithromycin
        where an alternative exists
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        🛑 **Contraindicated in pregnancy** — use azithromycin for chlamydia and an
        alternative PID regimen. Take with water, sitting upright, to avoid oesophagitis.
        **First-line for chlamydia in non-pregnant patients.**

    - id: "enoxaparin"
      name: "Enoxaparin"
      class: ""
      page: 150
      dose: |
        **Children / Adults:**
        - DVT / PE treatment: 1 mg/kg SC q12hrs

        **Adults:**
        - DVT prophylaxis: 40 mg SC OD
        - Acute coronary syndrome treatment: 1 mg/kg SC q12hrs (**under age 75**)
        - **ACS at age ≥ 75 with fibrinolysis: NO IV bolus, 0.75 mg/kg SC q12hrs (max 75 mg for the first 2 doses)**
      notes: |
        Should not be given if CrCl < 30. For ACS: a 30 mg IV bolus is given 15 minutes before starting SC.

    - id: "epinephrine"
      name: "Epinephrine (Adrenaline)"
      class: ""
      page: 150
      dose: |
        **Resuscitation:**
        - Children: 0.1 mL/kg IV of 1:10,000
        - Adults: 1 mg or 10 mL 1:10,000

        **Viral croup:**
        - Children: 2 mL of 1:1000 nebulized, may repeat if effective
      notes: |
        To make 1:10,000: mix 1 mL of 1:1000 epinephrine in 9 mLs NS.

    # ═══════════════════════ PAGE 151 ═══════════════════════
    - id: "ethambutol"
      name: "Ethambutol"
      class: ""
      page: 151
      dose: |
        - Children: 20 mg/kg/dose PO QD
        - Adults: 15 mg/kg/dose PO QD

    - id: "erythromycin"
      name: "Erythromycin (Estolate)"
      class: ""
      page: 151
      dose: |
        **Infants / Children:**
        - 50 mg/kg/day PO ÷ q6–8hrs
        - 20 mg/kg/day IV ÷ q6hrs

        **Adults:** 500 mg PO q6hr

    - id: "fluconazole"
      name: "Fluconazole"
      class: ""
      page: 151
      dose: |
        **Oropharyngeal candidiasis:**
        - Children: 3–6 mg/kg/dose daily × 7–14 days
        - Adult: 100 mg PO QD × 7–14 days

        **Oesophageal candidiasis:**
        - Children: 6 mg/kg/dose PO × 1, then 3–6 mg/kg/dose PO daily × 14–21 days
        - Adult: 400 mg PO × 1, then 150–200 mg PO QD × 14–21 days

    - id: "flucytosine"
      name: "Flucytosine (5-FC)"
      class: "antifungal"
      dose: |
        **Cryptococcal meningitis induction**, with amphotericin B and fluconazole.

        **Children and adults:** **25 mg/kg/dose PO four times daily (100 mg/kg/day)**

        Duration: **14 days** with the single-dose liposomal amphotericin B 10 mg/kg
        regimen, or **7 days** with the amphotericin B deoxycholate 1-week regimen
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        **Dose-dependent bone-marrow suppression** — check FBC; interrupt or reduce for
        neutropenia or thrombocytopenia. Renally cleared — reduce in renal impairment.
        Historically scarce in sub-Saharan Africa but increasingly available through
        cryptococcal-meningitis access programmes — **it should be actively procured**,
        because induction without it is inferior.

    - id: "folic-acid"
      name: "Folic Acid / Folate"
      class: ""
      page: 151
      dose: |
        **Infants / Children maintenance:**
        - Infant: 0.1 mg PO/day
        - < 4 years: 0.3 mg PO/day
        - ≥ 4 years: 0.4 mg PO/day

        **Adults:**
        - Deficiency: 1 mg PO/day
        - Maintenance: 0.4 mg PO/day

        **Pregnant women:** 0.8 mg PO/day
      notes: |
        Megaloblastic / macrocytic anemia all receive 1 mg PO/IM/IV daily regardless of age.

        **NEVER LESS THAN 0.1 MG PO/DAY IN PREGNANCY.**

    - id: "foscarnet"
      name: "Foscarnet"
      class: ""
      page: 151
      dose: |
        Everyone: 90 mg/kg/dose IV q12hrs

    - id: "furosemide"
      name: "Furosemide / Lasix"
      class: ""
      page: 151
      dose: |
        **Children:** 1–2 mg/kg IV/PO q12hrs

        **Adults:**
        - Heart failure exacerbation: 40 mg IV/IM (or double the maintenance dose) q2hrs
        - Heart failure maintenance: 20–40 mg PO OD-BD
        - Other: 20–40 mg IV/IM/PO
      notes: |
        **Not compatible with gentamicin.**

        - IV push: max rate 0.5 mg/kg/min
        - IV infusion: 10–15 min

        See the heart failure protocol for specific details.

    - id: "ganciclovir"
      name: "Ganciclovir"
      class: ""
      page: 151
      dose: |
        Everyone: 5 mg/kg/dose IV q12hrs

    - id: "gentamicin"
      name: "Gentamicin"
      class: ""
      page: 151
      dose: |
        **Neonates** (if LBW < 2.5 kg and term with birth asphyxia):
        - < 7 days: 3 mg/kg/day OD
        - 8–28 days: 5 mg/kg/day OD

        **Term neonates / children / adults:** 5–7.5 mg/kg/day OD
      notes: |
        **Do not mix with ampicillin.** Flush line or burette well if given at the same time as ampicillin.

        - IV push: no
        - IV infusion: give over 30 minutes; flush line well

    # ═══════════════════════ PAGE 152 ═══════════════════════
    - id: "heparin"
      name: "Heparin (unfractionated)"
      class: ""
      page: 152
      dose: |
        **Children:**
        - DVT / PE treatment: 75 units/kg IV bolus; 20 units/kg/hr IV infusion

        **Adults:**
        - DVT prophylaxis: 5000 units SC q12hrs
        - DVT / PE treatment: 80 units/kg IV bolus; 18 units/kg/hr IV infusion
        - Acute coronary syndrome: 60 units/kg IV bolus; 12 units/kg/hr IV infusion
      notes: |
        Treatment is given as an IV bolus followed by a continuous IV infusion.

        - Maximum bolus for DVT/PE: 5,000 units
        - Maximum bolus for ACS: 4,000 units
        - Maximum infusion rate: 1,000 units/hr

    - id: "hctz"
      name: "HCTZ (Hydrochlorothiazide)"
      class: ""
      page: 152
      dose: |
        - Children: 0.5–1 mg/kg/dose OD or BD
        - Adults: 12.5–50 mg OD
      notes: |
        **Max dose:**
        - < 2 years: 37.5 mg OD
        - 2–12 years: 100 mg OD
        - > 12 years: 200 mg OD

    - id: "hydroxyurea"
      name: "Hydroxyurea"
      class: ""
      page: 152
      dose: |
        Child 2–12 years: initially 20 mg/kg once daily, increased every 12 weeks in steps of 2.5–5 mg/kg daily according to response; usual dose 20–30 mg/kg daily (max 35 mg/kg daily).
      notes: |
        For use in SCD with stroke, admission for acute chest syndrome, > 3 admissions/yr for pain, or requiring ≥ 2 transfusions yearly.

    - id: "ibuprofen"
      name: "Ibuprofen"
      class: ""
      page: 152
      dose: |
        **Neonates (PDA closure):**
        - Dose 1 at 0 hours: 10 mg/kg PO
        - Dose 2 & 3: 5 mg/kg PO at 24 & 48 hours

        **Children:** 10 mg/kg PO q6hrs

        **Adults:** 400–800 mg PO q6–8hrs
      notes: |
        **Max:** 800 mg/dose, 2400 mg/day.

        Do not give in cases of renal disease. Give with food when possible.

    - id: "insulin-soluble"
      name: "Insulin (soluble / regular)"
      class: "endocrine"
      dose: |
        **DKA — children:** 0.05–0.1 unit/kg/hr IV infusion (**no bolus in children**)
        **DKA — adults:** 0.1 unit/kg/hr IV infusion (a 0.1 unit/kg bolus is optional)
        - Once glucose ~11–14 mmol/L, **reduce to 0.02–0.05 unit/kg/hr and add dextrose**; continue until the anion gap closes

        **Hyperkalaemia — children:** 0.05–0.1 unit/kg IV with glucose 0.5 g/kg
        **Hyperkalaemia — adults:** 10 units IV with 25 g glucose (50 mL of 50%)
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        🛑 **Delayed hypoglycaemia** — check glucose **at least hourly for 6 hours** after
        a hyperkalaemia dose.
        In DKA, **do not stop the infusion for hyperglycaemia correction alone** — add
        dextrose instead — and **replace potassium first if K⁺ < 3.3**.
        Requires a cold chain.

    - id: "iron"
      name: "Iron"
      class: ""
      page: 152
      dose: |
        **Pre-term infant:** 2–4 mg elemental Fe/kg/day

        **Iron deficiency:**
        - Children: 3–6 mg elemental Fe/kg/day
        - Adults: 60–120 mg elemental iron daily
      notes: |
        - Max dose: 15 mg elemental Fe/kg/day
        - Hemaforte syrup: 5 mg elemental iron/mL
        - 325 mg ferrous sulfate tablet contains 65 mg elemental iron

    - id: "isoniazid"
      name: "Isoniazid"
      class: ""
      page: 152
      dose: |
        - Children: 10 mg/kg PO QD
        - Adults: 5 mg/kg PO QD

    - id: "itraconazole"
      name: "Itraconazole"
      class: "antifungal"
      dose: |
        **Disseminated histoplasmosis.**

        **Adults:** 200 mg PO TID × 3 days (loading), then **200 mg PO BD**
        **Children:** 5 mg/kg/dose PO TID × 3 days, then 5 mg/kg/dose BD (max 400 mg/day)

        Duration **≥ 12 months** — stop only with > 12 months of therapy, ≥ 6 months on ART
        with **CD4 ≥ 150**, negative fungal cultures, undetectable viral load, and
        *Histoplasma* antigen below threshold
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        **Erratic absorption** — give capsules with food or an acidic drink; avoid acid
        suppressants. Check the level where possible (**target 1–2 µg/mL**).
        Strong CYP3A4 interactions (efavirenz, rilpivirine, rifampicin) — 🛑 **rifabutin
        lowers itraconazole levels and has no role in histoplasmosis.**
        **Negative inotrope — avoid in heart failure.**

    - id: "lactulose"
      name: "Lactulose"
      class: ""
      page: 152
      dose: |
        - Infants (hepatic encephalopathy): 2.5–10 mL ÷ TID-QID
        - Children: 1–3 mL/kg/day ÷ q8–12hrs
        - Adults: 30 mL PO q6hr
      notes: |
        - Children max dose: 60 mL/day
        - Formulation: 10 g/15 mL
        - Goal: at least 3–4 soft stools daily

    # ═══════════════════════ PAGE 153 ═══════════════════════
    - id: "leucovorin"
      name: "Leucovorin"
      class: ""
      page: 153
      dose: |
        - Children: 5 mg PO QD
        - Adults: 10–25 mg PO QD

    - id: "lisinopril"
      name: "Lisinopril"
      class: ""
      page: 153
      dose: |
        - Infants / Children: 0.1 mg/kg PO OD
        - Adults: 5 mg PO OD
      notes: |
        **Max dose:**
        - Children: 0.6 mg/kg/day or the adult dose
        - Adults: 40 mg/day

    - id: "lorazepam"
      name: "Lorazepam"
      class: ""
      page: 153
      dose: |
        **Adults / Children (> 12 yr):**
        - Anxiety (acute): 2 mg PO q8hr
        - Agitation: 0.5–2 mg IV q2–4hrs
      notes: |
        Use with caution in the elderly.

    - id: "losartan"
      name: "Losartan"
      class: ""
      page: 153
      dose: |
        **Infants / Children:**
        - Initial: 0.5 mg/kg/day
        - Maintenance: up to 1.4 mg/kg/day

        **Adults:** 25 mg PO daily
      notes: |
        - Infants / Children max: initial 12.5 mg/day, maintenance 150 mg/day
        - Adult max: 150 mg/day

    - id: "magnesium-sulfate"
      name: "Magnesium Sulfate"
      class: "electrolyte"
      dose: |
        **Symptomatic hypomagnesaemia — children:** 25–50 mg/kg IV (max 2 g) over 15–60 min
        **Symptomatic hypomagnesaemia — adults:** 1–2 g IV over 15–60 min, then a slower
        continuous infusion

        **Severe asthma — children:** 25–50 mg/kg IV (max 2 g) over 20 min
        **Severe asthma — adults:** 1.2–2 g IV over 20 min, single dose

        **Eclampsia — adults:** loading 4–6 g IV over 15–20 min, then 1–2 g/hr; continue
        24 h after the last seizure or delivery
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        **Repeat on the level, not the clock.** Before each further dose check **deep
        tendon reflexes** (loss = toxicity), **respiratory rate, blood pressure, urine
        output and renal function**.
        **IV rate ≤ 150 mg/min except in eclamptic seizures.**
        Max ~30–40 g/24 h with normal renal function; ~20 g/48 h in renal impairment.

    - id: "metronidazole"
      name: "Metronidazole"
      class: ""
      page: 153
      dose: |
        **Neonates:** 7.5 mg/kg/dose IV
        - First week of life:
          - < 1.2 kg: every 48 hours
          - 1.2–2 kg: every 24 hours
          - > 2 kg: every 12 hours
        - Weeks 2–4:
          - < 1.2 kg: every 24 hours
          - > 1.2 kg: every 12 hours

        **Mild infections:**
        - Infants / Children: 7.5 mg/kg/dose PO q8hrs
        - Adults: 500 mg PO q6hrs

        **Moderate–severe infections:**
        - Infants / Children: 10 mg/kg/dose IV q8hrs
        - Adults: 500 mg IV q6hrs
      notes: |
        **Not compatible with phenobarbital or Ringers Lactate.** Administer separately. Discontinue the primary IV.

        - IV push: no
        - IV infusion: give over 60 minutes in D10 or NS

    - id: "morphine"
      name: "Morphine"
      class: ""
      page: 153
      dose: |
        **Neonate:** 0.05–0.2 mg/kg/dose IM/SC/slow IV q4hr prn

        **Children:**
        - 0.1–0.2 mg/kg/dose IV q2–4hrs prn
        - 0.2–0.5 mg/kg/dose PO q4–6hrs prn

        **Adults:**
        - 1–2 mg/dose IV q2–4hrs prn
        - 2–10 mg/dose PO q2–4hrs prn
      notes: |
        Ensure a high enough dose for pain control — but monitor frequently (at least q1hr to start) to avoid respiratory depression.

    # ═══════════════════════ PAGE 154 ═══════════════════════
    - id: "nifedipine"
      name: "Nifedipine"
      class: ""
      page: 154
      dose: |
        **Children (> 1 yr):**
        - Initial: 0.125 mg/kg BD
        - Maintenance: up to 3 mg/kg/day or 120 mg/day

        **Adults:**
        - Initial (XR): 30 mg PO OD
        - Maintenance (XR): up to 120 mg/day
        - Immediate release (IR): 10–30 mg PO q8hr
      notes: |
        Only use extended release (XR) with children. Ideally adults would only use XR for HTN. Immediate release (IR) should really only be used for angina.

    - id: "nitazoxanide"
      name: "Nitazoxanide"
      class: ""
      page: 154
      dose: |
