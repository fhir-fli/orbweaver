  - id: potassium
    name: Potassium
    class: ''
    page: 155
    dose: '**Children:** 1 mEq/kg/dose

      - **IV rate: 0.2 mEq/kg/hr without continuous cardiac monitoring.** 0.5–1 mEq/kg/hr is an ICU rate needing continuous ECG; 1 mEq/kg/hr is the absolute ceiling

      - **Concentration: peripheral max 40 mEq/L; central up to 400 mEq/L** — above 40 must be central, and only for urgent life-threatening hypokalaemia under ICU-level care

      - **Never give as a bolus**


      **Adults:**

      - Dose based on the level of hypokalemia

      - 10 mEq raises potassium approximately 0.1

      - PO preferred to IV

      '
    notes: '- 1 mEq = 75 mg (KCl)

      - Frequency based on the level of deficiency

      '
  - id: potassium-chloride
