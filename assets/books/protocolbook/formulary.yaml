      - DVT prophylaxis: 40 mg SC OD

      - Acute coronary syndrome treatment: 1 mg/kg SC q12hrs (**under age 75**)

      - **ACS at age ≥ 75 with fibrinolysis: NO IV bolus, 0.75 mg/kg SC q12hrs (max 75 mg for the first 2 doses)**

      '
    notes: 'Should not be given if CrCl < 30. For ACS: a 30 mg IV bolus is given 15 minutes before starting SC.

      '
  - id: epinephrine
    name: Epinephrine (Adrenaline)
    class: ''
    page: 150
    dose: '**Resuscitation:**

