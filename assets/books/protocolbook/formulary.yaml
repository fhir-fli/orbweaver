    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the upper GI bleed page, p.104; no new clinical claim is introduced.
  - id: flucloxacillin
    name: Flucloxacillin
    class: antibiotic
    dose: '**50 mg/kg IV 6-hourly** — staphylococcal cover, e.g. mastoiditis. Use cloxacillin **or** flucloxacillin, not both.

