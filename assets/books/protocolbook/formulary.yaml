    notes: '⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.

      🛑 **Hold heparin during the streptokinase infusion**; start or resume once the

      aPTT falls.

      **Do not repeat** from about 5 days to 12 months after a previous dose

      (neutralising antibodies). Hypotension during the infusion is common — slow the rate.

      Usually the most commonly stocked lytic in this setting.

