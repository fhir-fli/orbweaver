    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the agitation page, pp.112–113; no new clinical claim is introduced.
  - id: hctz
    name: HCTZ (Hydrochlorothiazide)
    class: ''
    page: 152
    dose: '- Children: 0.5–1 mg/kg/dose OD or BD

      - Adults: 12.5–50 mg OD

