    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the mastoiditis page, p.69; no new clinical claim is introduced.
  - id: fluconazole
    name: Fluconazole
    class: ''
    page: 151
    dose: '**Oropharyngeal candidiasis:**

      - Children: 3–6 mg/kg/dose daily × 7–14 days

      - Adult: 100 mg PO QD × 7–14 days


      **Oesophageal candidiasis:**

      - Children: 6 mg/kg/dose PO × 1, then 3–6 mg/kg/dose PO daily × 14–21 days

      - Adult: 400 mg PO × 1, then 150–200 mg PO QD × 14–21 days

      '
  - id: flucytosine
    name: Flucytosine (5-FC)
    class: antifungal
    dose: '**Cryptococcal meningitis induction**, with amphotericin B and fluconazole.


      **Children and adults:** **25 mg/kg/dose PO four times daily (100 mg/kg/day)**


      Duration: **14 days** with the single-dose liposomal amphotericin B 10 mg/kg

      regimen, or **7 days** with the amphotericin B deoxycholate 1-week regimen

      '
    notes: '⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.

      **Dose-dependent bone-marrow suppression** — check FBC; interrupt or reduce for

      neutropenia or thrombocytopenia. Renally cleared — reduce in renal impairment.

      Historically scarce in sub-Saharan Africa but increasingly available through

      cryptococcal-meningitis access programmes — **it should be actively procured**,

      because induction without it is inferior.

      '
  - id: folic-acid
    name: Folic Acid / Folate
    class: ''
    page: 151
    dose: '**Infants / Children maintenance:**

      - Infant: 0.1 mg PO/day

      - < 4 years: 0.3 mg PO/day

      - ≥ 4 years: 0.4 mg PO/day


      **Adults:**

      - Deficiency: 1 mg PO/day

      - Maintenance: 0.4 mg PO/day


      **Pregnant women:** 0.8 mg PO/day

      '
    notes: 'Megaloblastic / macrocytic anemia all receive 1 mg PO/IM/IV daily regardless of age.


      **NEVER LESS THAN 0.1 MG PO/DAY IN PREGNANCY.**

      '
  - id: foscarnet
    name: Foscarnet
    class: ''
    page: 151
    dose: 'Everyone: 90 mg/kg/dose IV q12hrs

      '
  - id: furosemide
    name: Furosemide / Lasix
    class: ''
    page: 151
    dose: '**Children:** 1–2 mg/kg IV/PO q12hrs


      **Adults:**

      - Heart failure exacerbation: 40 mg IV/IM (or double the maintenance dose) q2hrs

      - Heart failure maintenance: 20–40 mg PO OD-BD

      - Other: 20–40 mg IV/IM/PO

      '
    notes: '**Not compatible with gentamicin.**


      - IV push: max rate 0.5 mg/kg/min

      - IV infusion: 10–15 min


      See the heart failure protocol for specific details.

      '
  - id: ganciclovir
    name: Ganciclovir
    class: ''
    page: 151
    dose: 'Everyone: 5 mg/kg/dose IV q12hrs

      '
  - id: gentamicin
    name: Gentamicin
    class: ''
    page: 151
    dose: '**Neonates** (if LBW < 2.5 kg and term with birth asphyxia):

      - < 7 days: 3 mg/kg/day OD

      - 8–28 days: 5 mg/kg/day OD


      **Term neonates / children / adults:** 5–7.5 mg/kg/day OD

      '
    notes: '**Do not mix with ampicillin.** Flush line or burette well if given at the same time as ampicillin.


      - IV push: no

      - IV infusion: give over 30 minutes; flush line well

      '
  - id: haloperidol
    name: Haloperidol
    class: psychiatric
    dose: '**Acute agitation — 2.5–5 mg IV/IM**, alone or with midazolam 2.5–5 mg.


