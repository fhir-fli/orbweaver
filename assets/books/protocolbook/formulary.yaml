  - id: losartan
    name: Losartan
    class: ''
    page: 153
    dose: '**Infants / Children:**

      - Initial: 0.5 mg/kg/day

      - Maintenance: up to 1.4 mg/kg/day


      **Adults:** 25 mg PO daily

      '
    notes: '- Infants / Children max: initial 12.5 mg/day, maintenance 150 mg/day

      - Adult max: 150 mg/day

      '
  - id: magnesium-sulfate
    name: Magnesium Sulfate
    class: electrolyte
    dose: '**Symptomatic hypomagnesaemia — children:** 25–50 mg/kg IV (max 2 g) over 15–60 min

      **Symptomatic hypomagnesaemia — adults:** 1–2 g IV over 15–60 min, then a slower

      continuous infusion


      **Severe asthma — children:** 25–50 mg/kg IV (max 2 g) over 20 min

      **Severe asthma — adults:** 1.2–2 g IV over 20 min, single dose


      **Eclampsia — adults:** loading 4–6 g IV over 15–20 min, then 1–2 g/hr; continue

      24 h after the last seizure or delivery

      '
    notes: '⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.

      **Repeat on the level, not the clock.** Before each further dose check **deep

      tendon reflexes** (loss = toxicity), **respiratory rate, blood pressure, urine

      output and renal function**.

      **IV rate ≤ 150 mg/min except in eclamptic seizures.**

      Max ~30–40 g/24 h with normal renal function; ~20 g/48 h in renal impairment.

      '
  - id: mannitol
    name: Mannitol
    class: neurology
    dose: '**Raised intracranial pressure — 0.5–1 g/kg IV.** Hypertonic saline is the alternative.

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the DKA pages, pp.47 and 105; no new clinical claim is introduced.
  - id: meropenem
    name: Meropenem
    class: antibiotic
    dose: '**Dose depends on the site — the generic figure underdoses the CNS.**\n\n- **Sepsis / intra-abdominal: 1 g IV 8-hourly**\n- **Meningitis or other CNS infection: adults 2 g IV 8-hourly (6 g/day); children ≥ 3 months 40 mg/kg IV 8-hourly, max 2 g per dose.** Infuse over 15–30 min\n- Skin and soft tissue: 500 mg IV 8-hourly\n\nCovers gram-positives as well as gram-negatives, but **not MRSA**.

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the adult sepsis page, p.99; no new clinical claim is introduced.
  - id: metformin
    name: Metformin
    class: endocrine
    dose: '**500 mg PO BD with meals**, once the patient is eating and DKA has resolved.

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the adult DKA page, p.105; no new clinical claim is introduced.
  - id: metoprolol
    name: Metoprolol
    class: cardiac
    dose: '- **Metoprolol tartrate 25 mg PO BD**

      - **Metoprolol succinate (ER) 25 mg PO daily**


      Post-ACS. Do not start a beta-blocker in cardiogenic shock or acute decompensated heart failure.

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the ACS treatment pages, pp.123–124; no new clinical claim is introduced.
  - id: metronidazole
    name: Metronidazole
    class: ''
    page: 153
    dose: "**Neonates:** 7.5 mg/kg/dose IV\n- First week of life:\n  - < 1.2 kg: every 48 hours\n  - 1.2–2 kg: every 24 hours\n  - > 2 kg: every 12 hours\n- Weeks 2–4:\n  - < 1.2 kg: every 24 hours\n  - > 1.2 kg: every 12 hours\n\n**Mild infections:**\n- Infants / Children: 7.5 mg/kg/dose PO q8hrs\n- Adults: 500 mg PO q6hrs\n\n**Moderate–severe infections:**\n- Infants / Children: 10 mg/kg/dose IV q8hrs\n- Adults: 500 mg IV q6hrs\n"
    notes: '**Not compatible with phenobarbital or Ringers Lactate.** Administer separately. Discontinue the primary IV.


      - IV push: no

      - IV infusion: give over 60 minutes in D10 or NS

      '
  - id: midazolam
    name: Midazolam
    class: benzodiazepine
    dose: '- **Status epilepticus, no IV access: 10 mg IM** — as effective as IV lorazepam and faster to give

      - **Buccal or intranasal: 0.3–0.5 mg/kg (max 10 mg)** — more effective than rectal diazepam

      - **Acute agitation: 2.5–5 mg IV/IM**, alone or with haloperidol

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the adult convulsions and agitation pages; no new clinical claim is introduced.
  - id: morphine
    name: Morphine
    class: ''
    page: 153
    dose: '**Neonate:** 0.05–0.2 mg/kg/dose IM/SC/slow IV q4hr prn


      **Children:**

      - 0.1–0.2 mg/kg/dose IV q2–4hrs prn

      - 0.2–0.5 mg/kg/dose PO q4–6hrs prn


      **Adults:**

      - 1–2 mg/dose IV q2–4hrs prn

      - 2–10 mg/dose PO q2–4hrs prn

      '
    notes: 'Ensure a high enough dose for pain control — but monitor frequently (at least q1hr to start) to avoid respiratory depression.

      '
  - id: acetylcysteine
    name: N-acetylcysteine (NAC)
    class: antidote
    dose: '**Paracetamol poisoning — two-bag, all weights down to 5 kg. Total 300mg/kg over 20 hrs.**


      - **Child ≤ 40kg:** 200mg/kg in 7mL/kg diluent (max 500mL) over 4 hrs, then 100mg/kg in 14mL/kg (max 1L) over 16 hrs

      - **> 40kg:** 200mg/kg (max 22g) in 500mL over 4 hrs, then 100mg/kg (max 11g) in 1L over 16 hrs

      - Diluent D5W, ½NS or sterile water. If wt > 100kg, dose as 100kg

      - **Under 5kg:** take toxicology advice

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the paracetamol pages, pp.32–33; no new clinical claim is introduced.
  - id: naloxone
    name: Naloxone
    class: antidote
    dose: '**Opioid overdose — titrate to respiration, not to consciousness.**


      - **Children < 5 yr or < 20 kg: 0.1 mg/kg IV · Children > 5 yr or > 20 kg: 2 mg IV**

      - **Adults: 0.4 mg IV, titrate up to 2 mg**

      - **No IV?** Same dose IM (onset ~5 min; do not re-dose faster than q3min; unreliable in shock)

      - Lasts ~1 hour — **may need repeating 20–60 min later**

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the benzodiazepine and opioid ingestion page, p.31; no new clinical claim is introduced.
  - id: nicardipine
    name: Nicardipine
    class: antihypertensive
    dose: '- **IV, hypertensive emergency: 5 mg/hr initially**, increase 2.5 mg/hr q5min to a **maximum 15 mg/hr**. Needs an infusion pump

      - **Oral: 20–40 mg PO q8–12h**

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the hypertension pages, pp.106–107; no new clinical claim is introduced.
  - id: nifedipine
    name: Nifedipine
    class: ''
    page: 154
    dose: '**Children (> 1 yr):**

      - Initial: 0.125 mg/kg BD

      - Maintenance: up to 3 mg/kg/day or 120 mg/day


      **Adults:**

      - Initial (XR): 30 mg PO OD

      - Maintenance (XR): up to 120 mg/day

      - Immediate release (IR): 10–30 mg PO q8hr

      '
    notes: 'Only use extended release (XR) with children. Ideally adults would only use XR for HTN. Immediate release (IR) should really only be used for angina.

      '
  - id: nitazoxanide
