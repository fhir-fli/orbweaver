        - Treatment: 10–20 mg/kg PO QD — **maximum 300 mg/day**
        - Prophylaxis: 5 mg/kg PO QD

        **Adults:** 300 mg PO QD
      notes: |
        In severe MAC.

    - id: "rifampicin"
      name: "Rifampicin"
      class: ""
      page: 156
      dose: |
        - Children: 15 mg/kg PO QD
        - Adults: 10 mg/kg PO QD

    - id: "rivaroxaban"
      name: "Rivaroxaban"
      class: "anticoagulant"
      dose: |
        **VTE treatment — adults:** 15 mg PO BD × 21 days, then **20 mg PO once daily
        (with food)**
        - **No parenteral lead-in required**

        **Children:** specialist-directed only
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        Duration ≥ 3 months; longer if unprovoked or the risk persists. Avoid if
        CrCl < 15 mL/min, in significant liver disease, and in pregnancy. No routine
        monitoring — but **no reversal agent locally**.
        If unavailable, warfarin **with mandatory LMWH overlap** is the fallback.

    - id: "salbutamol"
      name: "Salbutamol"
      class: ""
      page: 156
      dose: |
