      - **Variceal bleeding prophylaxis: 20 mg PO BD**, and only if carvedilol is unavailable — carvedilol 6.25 mg daily titrating to 12.5 mg lowers portal pressure better. Titrate to resting HR 55–60, or a 25% fall from baseline. **Hold if SBP < 90** or in refractory ascites

