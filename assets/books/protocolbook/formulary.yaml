      dose: |
        **Children:**
        - Loading: 15–20 mg/kg IV
        - Maintenance: 2.5–4 mg/kg IV/PO q12hrs

        **Adults:**
        - Loading: 20 mg/kg IV
        - Maintenance: 100 mg IV/PO q6–8hrs
      notes: |
