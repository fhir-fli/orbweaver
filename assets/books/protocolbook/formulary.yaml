  - id: phenobarbital
    name: Phenobarbitone / Phenobarbital
    class: ''
    page: 154
    dose: '**Neonates:**

      - Loading: 20 mg/kg IV/IM

      - Maintenance: 3–5 mg/kg IV/IM/PO OD, from 12–24 h after the load (OE 2026-08-30)


      **Infants / Children / Adults — same dose as neonates:**

      - Loading: **20 mg/kg IV/IM, all ages. There is no milligram cap.** Give over
      20 min — **not faster than 1 mg/kg/min in a child, ~50–75 mg/min in an adult**

      - If still fitting after 15 min: a further **10–20 mg/kg**, to a **cumulative
      maximum of 40 mg/kg**

      - Maintenance: 3–5 mg/kg IV/IM/PO OD, starting 12–24 h after the load


      🛑 **Only go past the first load where airway support and respiratory monitoring
      are available.** The second load carries a high risk of respiratory depression and
      hypotension. Have respiratory and blood-pressure support to hand before giving it.


      Phenobarbital comes **after** a benzodiazepine has failed, not before it.

      '
    notes: '**Not compatible with aminophylline, metronidazole.**


