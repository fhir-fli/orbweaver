# ============================================================
# ProtocolBook pp.146–158 — Essential Medications Formulary.
#
# Built as a faceted `collection` (Grey's decision 2026-07-19): NOT a
# page-by-page printed list. The book's alphabetical Medications | Dose and
# Route | Notes/Contraindications table is modelled as drug records and
# rendered by the existing DrugIndexScreen (A–Z + search). These drugs are
# PROSE-dosed (by population/indication), so each uses the `dose` markdown
# field (added to the Drug model for this formulary) rather than the WHO
# weight-band grid. `intro` carries the book's front-matter dosing notes.
#
# Source-verified against pp.146–158 @150/300 dpi (RULE #0). p.145 is the
# section divider.
#
# SILENT CORRECTIONS of clear typos (Grey to fix the source PDF):
#   - p.148 Ceftriaxone adults "Other: 2 g IV q23hr" → "q24hr" (once-daily
#     ceftriaxone; q23hr is a clear typo).
#   - p.149 Cloxacillin adults "Severe infection: q4hr5" → "q4hr" (stray 5);
#     "Flush line ... will if given" → "well".
#   - p.153 Morphine adults "2–10 mg/kg/dose PO" → "2–10 mg/dose PO". The
#     "/kg" is a DANGEROUS typo (2–10 mg/kg in an adult ≈ lethal); same fix
#     as the p.80 pain-ladder morphine row. Child /kg rows are correct.
#   - p.153 Lorazepam agitation "0.5–2 mg IV 12–4hrs" → "q2–4hrs".
#   - p.156 Sulfadiazine notes "for PCP" → "for toxoplasmosis" (sulfadiazine
#     + pyrimethamine + leucovorin is the toxoplasmosis regimen, matching the
#     book's own p.136; sulfadiazine has no role in PCP).
#
# DRUG-NAME SPELLING normalised to the correct INN (better for search; no
# dose change): "Gancyclovir"→"Ganciclovir", "Valgancyclovir"→
# "Valganciclovir", "Paramomycin"→"Paromomycin".
#
# OE CURRENCY FLAG (transcribed faithfully, NOT edited — for the OE pass):
#   - p.156 Ranitidine was withdrawn globally in 2020 (NDMA contamination);
#     a modern formulary would substitute an alternative H2 blocker / PPI.
#
# ✅ FULL VERIFICATION SWEEP 2026-07-20: every drug on pp.146–158 re-checked
#   against a 300-dpi render — ZERO dose-transcription errors; the only
#   deviations from the source are the intentional corrections listed above.
# OpenEvidence-applied 2026-08-28 (WHO full advance pass):
#   Dextrose/Glucose: paediatric D10% 5 -> 2 mL/kg (0.2 g/kg) (flag 1-2).
# Cross-book pass 2026-08-28: IV diazepam 0.3 -> 0.2 mg/kg, to match the
#   resuscitation page (p.20) and the FDA label. The formulary and p.20
#   had disagreed. Added the never-confuse-IV-with-rectal rule and the
#   age-banded rectal doses.
# Cross-book pass 2026-08-28: vitamin K preterm threshold 1 kg -> 1500 g
#   (AAP). Above it, 1 mg IM flat, not 0.5 mg; at or below it, 0.3-0.5
#   mg/kg. The two books had split at different weights.
# Cross-book pass 2026-08-28: calcium gluconate doses now LABELLED BY
#   INDICATION. The two books differed 2-3x only because one was dosing
#   neonatal hypocalcaemia (2 mL/kg) and the other child tetany (0.6-1)
#   and hyperkalaemic membrane stabilisation (0.5). All three are correct
#   in context; the defect was that none of them said which.
# Cross-book durations pass 2026-08-28: the PCP co-trimoxazole dose in this
#   formulary entry was still the withdrawn 8 mg/kg/dose TID (= 24 mg/kg/day)
#   after OE flag 4-1 capped it at 15-20 mg/kg/day.
# 2026-08-29: three doses the PROTOCOLS prescribe were missing from their own
#   formulary entries - the upper-GI-bleed PPI regimen, the adult bacterial-
#   meningitis dexamethasone dose, and the variceal-prophylaxis propranolol
#   starting dose. Copied from the pages that already carry them, with their
#   qualifiers, so no new clinical claim is introduced. Found by diffing every
#   formulary entry against every page dose.
# 2026-08-29: RIFAXIMIN had NO DOSE OF ITS OWN - the entry printed only the
#   lactulose regimen, because it was written from a page fragment in which
#   lactulose was the subject and rifaximin the add-on. Someone looking up
#   rifaximin found no rifaximin dose. Now 550 mg PO twice daily.
#   Octreotide maintenance widened to 25-50 mcg/hr (AASLD) and the 1-day
#   non-inferiority noted, which matters where supply is short.
# ============================================================

formulary:
  id: pb_formulary
  title: Essential Medications
  subtitle: ProtocolBook formulary · pp.146–158
  bands:
    label: ''
    columns: []
  bands_art:
    label: ''
    columns: []
  facets:
  - key: alpha
    label: A–Z
    mode: alpha
    tap: detail
  classes: []
  indications: []
  intro: '**Age designations**

    - Neonates: ≤ 28 days old

    - Infants: ≤ 1 year old (includes neonates unless specified)

    - Children: ≤ 12 years old (includes infants & neonates unless specified)

    - Adult: > 12 years old


    **Dosing regimens**

    - "dose BD" = that dose given twice daily, not divided

    - "dose ÷ BD" = the dose is the total for the day, divided into two separate equal doses


    **Note:** these are the most common regimens for commonly encountered conditions; the specific patient or condition may require different dosing.

    '
  drugs:
  - id: activated-charcoal
    name: Activated Charcoal
    class: antidote
    dose: '**Single dose 1 g/kg PO or by NGT, within 1 hour of ingestion** (up to 4 hrs for a large ingestion), for substances known to be adsorbed.


      Do **not** give to a patient who is not fully awake, and **never intubate solely in order to give it**.

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the poisoning page, p.28; no new clinical claim is introduced.
  - id: acyclovir
    name: Acyclovir
    class: ''
    page: 146
    dose: '**Children:**

      - HSV: 20 mg/kg/dose PO TID

      - VZV: 20 mg/kg/dose PO QID


      **Adults:**

      - HSV: 400 mg PO TID

      - VZV (zoster): **800 mg PO five times daily** — aciclovir''s poor oral bioavailability is why it is not dosed like valaciclovir

      '
  - id: adenosine
    name: Adenosine
    class: antiarrhythmic
    dose: '**Stable** regular narrow-complex SVT — after vagal manoeuvres.


      **Children:** 0.1 mg/kg rapid IV push (max 6 mg); if no response 0.2 mg/kg (max 12 mg)


      **Adults:** 6 mg rapid IV push + 20 mL flush; if no response 12 mg; may repeat 12 mg. **Max 3 doses**

      '
    notes: '⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.

      Give as fast as possible into a proximal vein with an immediate flush; warn the

      patient about transient chest tightness and flushing.

      🛑 **For an UNSTABLE patient, synchronised cardioversion — not adenosine.**

      Caution in asthma (bronchospasm) and in known WPW with an irregular wide-complex rhythm.

      '
  - id: albendazole
    name: Albendazole
    class: ''
    page: 146
    dose: '- Age < 2 yrs: 200 mg PO × 1 dose

      - Age ≥ 2 yr: 400 mg PO × 1 dose

      '
  - id: alteplase
    name: Alteplase (rt-PA)
    class: thrombolytic
    dose: '**High-risk (massive) PE — adults:** **100 mg IV over 2 hours**

      - Peri-arrest / cardiac arrest: **0.6 mg/kg over ~15 min (max 50 mg)**

      - A 50 mg regimen has similar efficacy with less bleeding (evidence for full equivalence is limited)


      **Ischaemic stroke — adults:** **0.9 mg/kg, max 90 mg** (10% as a bolus, the rest
      over 60 min), within 4.5 hours.


      **STEMI:** this book''s STEMI lytics are **tenecteplase** and **streptokinase** —
      see their entries for the weight bands. The accelerated alteplase STEMI schedule is
      not printed in this book, so do not reconstruct it from the PE or stroke doses.


      ⚠️ **The three regimens are different drugs'' worth of risk.** Giving the coronary
      dose to a stroke markedly increases haemorrhagic transformation. Never carry one
      indication''s schedule across to another.

      '
    notes: '⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.

      Same absolute contraindications as the other lytics. **Unfractionated heparin may

      run during the alteplase infusion** (unlike streptokinase).

      Often unavailable or unaffordable at district level — **streptokinase or

      tenecteplase are the realistic substitutes.**

      '
  - id: aminophylline
    name: Aminophylline
    class: ''
    page: 146
    dose: "**Infants** (only < 32 weeks or 1.5 kg with apnea of prematurity):\n- Loading: 6 mg/kg IV/PO over 1 hr\n- Maintenance dose (IV or oral):\n  - Age ≤ 6 days: 2.5 mg/kg 12 hrly\n  - Age 7–28 days: 4 mg/kg 12 hrly\n"
    notes: '**Not compatible with phenobarbital.**


      IV infusion: give over 20–30 minutes. Oral preparation: mix 10 mL aminophylline (250 mg vial) with 40 mL sterile water = 5 mg/1 mL.

      '
  - id: amlodipine
    name: Amlodipine
    class: ''
    page: 146
    dose: '- Children: 0.05 mg/kg/dose OD

      - Adults: 5–10 mg/dose PO daily

      '
    notes: 'Max dose 5 mg/dose, 10 mg/24 hr.

      '
  - id: amoxicillin-clavulanate
    name: Amoxicillin / Amoxiclav (Amoxicillin-Clavulanic acid)
    class: ''
    page: 146
    dose: '**Children:**

      - 25 mg/kg/dose BD for simple infections

      - 40–45 mg/kg/dose BD for pneumonia / otitis media


      **Adults:** 875 mg PO BD

      '
  - id: amphotericin
    name: Amphotericin
    class: ''
    page: 147
    dose: '**Children / Adults:**

      - **Cryptococcal meningitis, preferred: liposomal amphotericin B 10 mg/kg IV as a SINGLE dose**, with flucytosine 100 mg/kg/day + fluconazole 1200 mg/day × 14 days

      - Liposomal amphotericin B: 4 mg/kg/day IV (other indications)

      - Amphotericin B deoxycholate: 1 mg/kg/day IV

      '
    notes: 'Used with flucytosine.

      '
  - id: ampicillin
    name: Ampicillin
    class: ''
    page: 147
    dose: '**Neonate:** 50 mg/kg/dose IV or IM

      - < 7 days: 12 hourly

      - 8–28 days: 8 hourly


      **Infants / Children:** 50 mg/kg/dose (max 500 mg) 6 hourly IV/IM


      **Adults:** 2 g 6 hourly IV/IM

      '
    notes: '**DO NOT MIX WITH GENTAMICIN.** Flush line or burette if given at the same time as gentamicin.


      - IV push: over 3–5 min

      - IV infusion: over 15–30 min

      '
  - id: apixaban
    name: Apixaban
    class: anticoagulant
    dose: '**VTE treatment — adults:** 10 mg PO BD × 7 days, then **5 mg PO BD**

      - Extended prophylaxis after ≥ 6 months, if continued: 2.5 mg BD

      - **No parenteral lead-in required**


      **Children:** specialist-directed only

      '
    notes: '⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.

      Duration ≥ 3 months. Preferred DOAC where bleeding risk is a concern (lowest GI

      bleeding of the DOACs). Avoid in pregnancy and severe hepatic impairment.

      Availability variable at district level.

      '
  - id: artemether
    name: Artemether
    class: antimalarial
    dose: '**Severe malaria, 2nd line — only if artesunate is unavailable.**


      - **3.2 mg/kg IM** on admission

      - then **1.6 mg/kg IM daily** until able to take oral → switch to a full oral ACT course

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the severe malaria page, p.23; no new clinical claim is introduced.
  - id: artesunate
    name: Artesunate
    class: ''
    page: 147
    dose: '- < 5 kg: treat as though 5 kg

      - < 20 kg: 3 mg/kg IV/IM at 0, 12 & 24 hrs

      - > 20 kg: 2.4 mg/kg IV/IM at 0, 12 & 24 hrs

      '
  - id: aspirin
    name: Aspirin
    class: antiplatelet
    dose: '- **ACS: 300–325 mg PO × 1 dose**, chewed, as early as possible

      - **Ischaemic stroke: 300 mg PO stat**, then **75–100 mg daily**

      - **Acute rheumatic fever arthritis: 20–25 mg/kg/dose PO q6h**

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the ACS, stroke and rheumatic fever pages; no new clinical claim is introduced.
  - id: atropine
    name: Atropine
    class: antidote
    dose: '**Organophosphate / carbamate poisoning — titrate to atropinisation.**


      - **Children 0.02 mg/kg IV · Adults 2 mg IV**, then **DOUBLE the previous dose every 5 min** until the endpoints are met

      - **Endpoints:** chest clear of secretions, pulse > 80/min, SBP > 80 mmHg

      - **Maintenance:** mix the total bolus dose into NS or D5% — < 25 kg 250 mL at 50 mL/hr; > 25 kg 500 mL at 100 mL/hr; adjust hourly


      **Snake bite, before neostigmine:** adults 0.6 mg slow IV; children 50 mcg/kg slow IV

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the organophosphate and snake bite pages; no new clinical claim is introduced.
  - id: azithromycin
    name: Azithromycin
    class: ''
    page: 147
    dose: '- Infants / Children: 10 mg/kg PO × 1 day, then 5 mg/kg PO × 4 days

      - Adults: 500 mg PO × 1 day, then 250 mg PO × 4 days

      '
    notes: 'MAC: the first-day dose is continued as the maintenance dose.

      '
  - id: benzyl-penicillin
    name: Benzyl Penicillin (Crystalline Penicillin, PenG)
    class: ''
    page: 147
    dose: '- < 7 days: 50,000 IU/kg/dose q12hrs IV/IM

      - ≥ 7 days: 50,000 IU/kg/dose q6hrs IV/IM


      **Group A streptococcal pharyngitis:**

      - ≤ 27 kg: 600,000 IU IM single dose

      - > 27 kg: 1.2 million IU IM single dose

      '
  - id: calcium
    name: Calcium
    class: ''
    page: 147
    dose: '**Children:**

      - Replacement: 10 mg/kg/day

      - Symptomatic hypocalcaemia / tetany / hypocalcaemic convulsions: **0.5–1 mL/kg** of 10% solution (≈50–100 mg/kg) slow IV over 5–10 min, with cardiac monitoring

      - **Neonate: 1–2 mL/kg** of 10% solution (100–200 mg/kg) slow IV — the neonatal repletion dose is higher

      - **Hyperkalaemia is a different indication: 0.5 mL/kg** (adults 10 mL) over 2–3 min. It stabilises the myocardium and does **not** lower the potassium

      - Do not exceed **100 mg/min** in a child (200 mg/min adult); watch the ECG for bradycardia and arrhythmia


      **Adults:**

      - Tetany / convulsions: 2 g IV calcium gluconate

      - Replacement: 10 mg/kg/day

      '
    notes: '- 20 mg = 1 mEq

      - 100 mg Ca carbonate = 40 mg elemental Ca = 2 mEq Ca

      - **Ca gluconate 10%:** max dose 20 mL/kg, max dose 2 g

      '
  - id: calcium-gluconate
    name: Calcium Gluconate 10%
    class: electrolyte
    dose: '**Hyperkalaemia with ECG changes.**


      **Children:** 0.5 mL/kg slow IV over 2–3 min with cardiac monitoring; repeat every 5 min until the ECG improves


      **Adults:** 10 mL of 10% IV over 2–3 min; repeat every 5 min until the ECG improves

      '
    notes: '⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.

      🛑 **It does NOT lower serum potassium** — it stabilises the myocardium for

      30–60 min. **Always give alongside insulin/glucose ± salbutamol.**

      Extravasation causes tissue necrosis. Give slowly and diluted in digoxin toxicity.

      **Do not mix with bicarbonate** (precipitates).

      '
  - id: captopril
    name: Captopril
    class: ''
    page: 147
    dose: '- Neonate: 0.01–0.05 mg/kg/dose PO Q8–12hr

      - Infants < 6 mo: 0.01–0.5 mg/kg/dose PO BID-TID

      - Children: 0.3–0.5 mg/kg/dose PO BID-TID

      - Adults: 12.5–25 mg PO BID-TID; titrate qweek by 25 mg/dose

      '
    notes: 'Max dose 450 mg/24 hr.

      '
  - id: carbamazepine
    name: Carbamazepine
    class: ''
    page: 148
    dose: '**< 12 years:**

      - Initial: 10–20 mg/kg/24hr PO ÷ q12hr

      - Titrate qweek


      **> 12 yr:**

      - Initial: 200 mg PO BD

      - Titrate qweek by 200 mg/24hr

      '
    notes: 'Avoid abrupt withdrawal and watch carefully for side effects.


      **Max dose:**

      - < 12 yrs: 1 g/day, 35 mg/kg/day, 100 mg/dose BD

      - 12–15 yrs: 1 g/24hr

      - > 15 yrs: 1.2 g/24hr

      - Adult: 1.6–2.4 g/24hr

      '
  - id: carvedilol
    name: Carvedilol
    class: ''
    page: 148
    dose: '- Infants / Children: 0.025 mg/kg/dose PO q12hr

      - Adults: 3.125 mg PO q12hr, max 25 mg PO q12hr

      '
    notes: 'Titrate every 2 weeks.

      '
  - id: cefixime
    name: Cefixime
    class: antibiotic
    dose: '**Gonorrhoea — only where ceftriaxone is unavailable.**


      **Adults:** 800 mg PO single dose (urogenital or rectal only)


      **Children:** 8 mg/kg PO as a **single dose**; ≥ 45 kg use the adult 800 mg single dose

      '
    notes: '⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.

      🛑 **Unreliable for pharyngeal gonorrhoea — only ceftriaxone covers the pharynx.**

      Arrange a test of cure if it is used. Second-line only, because of declining

      cephalosporin susceptibility. If neither ceftriaxone nor cefixime is available:

      gentamicin 240 mg IM + azithromycin 2 g PO.

      '
  - id: cefotaxime
    name: Cefotaxime
    class: ''
    page: 148
    dose: '**Neonates:**

      - < 7 days: 50 mg/kg/dose IV/IM 12 hourly

      - 8–28 days: 50 mg/kg/dose IV/IM 8 hourly


      **Infants / Children:**

      - 50 mg/kg/dose q8hr

      - Meningitis: 50 mg/kg/dose q6hr

      - Max: 2000 mg/dose


      **Adults:**

      - Meningitis / sepsis: 2 g IV 6 hrly

      - Other: 1 g IV 12 hrly

      '
    notes: 'Flush line or burette well if given at the same time as gentamicin.


      - IV push: over 5 minutes

      - IV infusion: over 30 min

      '
  - id: ceftriaxone
    name: Ceftriaxone
    class: ''
    page: 148
    dose: '**Infants:**

      - Meningitis: 100 mg/kg IV OD

      - Sepsis / pneumonia: 80 mg/kg IV OD


      **Children:**

      - 50 mg/kg/dose IV/IM q24hr

      - Meningitis: 100 mg/kg/dose q24hr

      - Max: 2 g/dose


      **Adults:**

      - Meningitis: 2 g IV q12hr

      - Other: 2 g IV q24hr

      '
    notes: 'Contraindicated in neonates if severe jaundice. Do not mix with RL.


      - IV push: 10 minutes

      - IV infusion: give over 30–60 minutes

      '
  - id: ciprofloxacin
    name: Ciprofloxacin
    class: ''
    page: 148
    dose: '**Children:**

      - 10–15 mg/kg/dose PO BD

      - Max: 1000 mg/dose


      **Adults:**

      - Mild / moderate infection: 500 mg PO BD

      - Severe infection: 750 mg PO BD

      - UTI (uncomplicated): 250 mg PO BD × 3 days

      '
  - id: clarithromycin
    name: Clarithromycin
    class: ''
    page: 149
    dose: '- Children: 10 mg/kg/dose BD

      - Adults: 500 mg PO BD

      '
  - id: clindamycin
    name: Clindamycin
    class: antibiotic
    dose: '- **Children: 7 mg/kg/dose PO 8-hourly (max 300 mg)** × 10 days — streptococcal pharyngitis in penicillin allergy

      - **Adults: 600 mg IV 8-hourly** — sepsis; also covers anaerobes

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the pharyngitis and adult sepsis pages; no new clinical claim is introduced.
  - id: clopidogrel
    name: Clopidogrel
    class: antiplatelet
    dose: '**ACS with fibrinolysis:**

      - **Age ≤ 75: 300 mg PO loading, then 75 mg daily**

      - **Age > 75: NO loading dose — 75 mg daily** (excess intracranial haemorrhage)


      **ACS without fibrinolysis:** 300–600 mg loading, then 75 mg daily

      '
    notes: '⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.

      Typically 12 months of dual antiplatelet therapy. The age-75 no-load rule is

      **specific to fibrinolysis-treated patients**. Hold ~5 days before major surgery

      or CABG. **This is the only evidence-based P2Y₁₂ inhibitor to combine with a

      fibrinolytic.**

      '
  - id: clotrimazole
    name: Clotrimazole
    class: ''
    page: 149
    dose: '- Children: paint for oral thrush — apply BD-TID until cleared

      - Children / Adults: apply to the infected area BD-TID until cleared

      '
  - id: cloxacillin
    name: Cloxacillin
    class: ''
    page: 149
    dose: '**Neonates:** 25–50 mg/kg/dose

      - < 7 days: every 12 hours

      - 8–28 days: every 8 hours


      **Infants / Children:** 25–50 mg/kg/dose IV/IM q6hr


      **Adults:**

      - 2 g IV/IM

      - Mild / moderate infection: q6hr

      - Severe infection: q4hr

      '
    notes: 'Flush line or burette well if given at the same time as gentamicin.

      '
  - id: co-trimoxazole
    name: Co-trimoxazole (Trimethoprim–Sulfamethoxazole, TMP-SMX)
    class: ''
    page: 149
    dose: '**Children:**

      - Dosage: 4 mg/kg/dose TMP + 20 mg/kg/dose SMX/dose BD

      - For interstitial pneumonia (PCP) in children with HIV: TMP 15–20 mg/kg/day + SMZ 75–100 mg/kg/day, in 3–4 divided doses, × 21 days (max TMP 960 mg/day). **Not** 8 mg/kg/dose TID — that is 24 mg/kg/day and above the ceiling


      **Adults:**

      - TMP 160 mg / SMX 800 mg PO every 12 hrs

      - PCP pneumonia: TMP 15–20 mg/kg/day, SMX 75–100 mg/kg/day, divided in 4 equal doses

      '
    notes: '- Syrup: 40 mg TMP / 200 mg SMZ per 5 mL

      - Paediatric tab: 20 mg TMP / 100 mg SMZ

      - **Max dose:** TMP 160 mg / SMX 800 mg PO q12hrs

      - **Tablets:** Single Strength (SS) = TMP 80 mg / SMX 400 mg; Double Strength (DS) = TMP 160 mg / SMX 800 mg

      '
  - id: dapagliflozin
    name: Dapagliflozin
    class: cardiac
    dose: '**Heart failure with reduced ejection fraction — 10 mg PO once daily, where available.**


      A fourth pillar alongside an ACE-inhibitor, a beta-blocker and spironolactone.

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the adult heart failure page, pp.94–95; no new clinical claim is introduced.
  - id: dapsone
    name: Dapsone
    class: ''
    page: 149
    dose: 'Prophylaxis CD4 < 200:

      - Children: 2 mg/kg PO QD

      - Adults: 100 mg PO QD

      '
  - id: dexamethasone
    name: Dexamethasone
    class: ''
    page: 149
    dose: '**Children:**

      - Extubation / upper airway swelling: 0.25–0.5 mg/kg/dose IV q6hr (max 8 mg/dose)

      - Asthma / croup: 0.6 mg/kg/dose IV/IM/PO × 1 dose


      **Adults:**

      - Cerebral edema: 2 mg PO TID

      - **Bacterial meningitis: 10 mg IV q6h × 4 days** — with or just before the first antibiotic dose. **Not routine here:** no benefit in low-income, high-HIV-prevalence settings; consider only if HIV-negative and presenting early

      '
  - id: dextrose-glucose
    name: Dextrose / Glucose
    class: ''
    page: 150
    dose: '- Neonates / infants / children: D10% 2 mL/kg (0.2 g/kg) IV push (if no D10 immediately available, use D5)

      - Adults: 25–50 mL D50 IV push

      '
    notes: '**How to make D10:**

      - 1 mL of D50% + 9 mL D5%, OR

      - 2 mL of D50% + 8 mL NS

      '
  - id: diazepam
    name: Diazepam
    class: ''
    page: 150
    dose: '**Rectal diazepam 2.5 mg suppository:**

      - < 10 kg: 1 suppository

      - 10–15 kg: 2 suppositories

      - 15–20 kg: 3 suppositories

      - 20–25 kg: 4 suppositories


      **IV diazepam:** 0.2 mg/kg slowly over 1 minute, max 10 mg. A second dose may be given at 0.1 mg/kg. **Maximum two benzodiazepine doses**, then a second-line agent — a third adds respiratory depression without added seizure control.


      🛑 **The IV dose is NOT the rectal dose.** Rectal diazepam is higher (0.5 mg/kg at 2–5 y, 0.3 mg/kg at 6–11 y, 0.2 mg/kg at ≥12 y, max 20 mg) because rectal absorption is incomplete.

      '
    notes: 'Do not give to a neonate. Do not give IM.

      '
  - id: digoxin
    name: Digoxin
    class: ''
    page: 150
    dose: "**Age 2–5 yrs:**\n- Loading: 35 mcg/kg ÷ TID × 24hr\n- Maintenance: 5 mcg/kg/dose BD\n\n**Age 5–10 yrs:**\n- Loading: 25 mcg/kg ÷ TID × 24hr\n- Maintenance: 3 mcg/kg/dose BD\n\n**Age 10–12 yrs:**\n- Loading: 0.75–1.5 mg ÷ TID × 24hr\n- Maintenance: 30–125 mcg BD\n\n**Adults:**\n- Rapid digitalization:\n  - IV/IM: 5 mcg/kg × 1 dose, followed by 2.5 mcg/kg q8hr × 2 doses\n  - PO: 7 mcg/kg × 1 dose, followed by 3 mcg/kg q8hr × 2 doses\n- Maintenance:\n  - IV/IM: 2.4–3.6 mcg/kg/day\n  - PO: 3.4–5.1 mcg/kg/day\n"
    notes: 'Titrate maintenance dose every 2 weeks.

      '
  - id: diphenhydramine
    name: Diphenhydramine
    class: antihistamine
    dose: '**Anaphylaxis adjunct only — 1 mg/kg IV or PO, max 50 mg.**


      🛑 Does **not** treat airway, breathing or circulation. **Never let it delay or replace epinephrine.**

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the anaphylaxis page, p.37; no new clinical claim is introduced.
  - id: dobutamine
    name: Dobutamine
    class: vasoactive
    dose: '**Pump failure with volume overload / cardiogenic shock.**


      **Children and adults:** 2–20 mcg/kg/min IV, titrated — often combined with

      norepinephrine when the patient is hypotensive

      '
    notes: '⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.

      Can **worsen** hypotension (β₂ vasodilatation) and provoke tachyarrhythmia —

      monitor rhythm and blood pressure. Not a sole agent in frank hypotension.

      Availability variable at district level.

      '
  - id: dopamine
    name: Dopamine
    class: vasoactive
    dose: '🛑 **Fallback only — use norepinephrine first.**


      **Children and adults:** 5–20 mcg/kg/min IV


      ⚠️ 2–5 mcg/kg/min is the old "renal dose" and is **not** a pressor dose — do not

      rely on it for hypotension. **Always per kilogram.**

      '
    notes: '⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.

      More arrhythmia and higher mortality than norepinephrine. Keep only as the

      substitute where norepinephrine is out of stock, and **transition as soon as it is

      available**. Widely available, which is why it persists.

      '
  - id: doxycycline
    name: Doxycycline
    class: antibiotic
    dose: '**Chlamydia — adults:** 100 mg PO BD × 7 days (21 days for LGV / proctitis)


      **Pelvic inflammatory disease — adults:** 100 mg PO/IV BD × 14 days, with

      ceftriaxone + metronidazole


      **Children ≥ 8 y or > 45 kg:** 100 mg PO BD. Under 8 y — prefer azithromycin

      where an alternative exists

      '
    notes: '⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.

      🛑 **Contraindicated in pregnancy** — use azithromycin for chlamydia and an

      alternative PID regimen. Take with water, sitting upright, to avoid oesophagitis.

      **First-line for chlamydia in non-pregnant patients.**

      '
  - id: empagliflozin
    name: Empagliflozin
    class: cardiac
    dose: '**Heart failure with reduced ejection fraction — 10 mg PO once daily, where available.**


      A fourth pillar alongside an ACE-inhibitor, a beta-blocker and spironolactone.

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the adult heart failure page, pp.94–95; no new clinical claim is introduced.
  - id: enoxaparin
    name: Enoxaparin
    class: ''
    page: 150
    dose: '**Children / Adults:**

