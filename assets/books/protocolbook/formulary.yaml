      '
  - id: phenylephrine
    name: Phenylephrine
    class: vasopressor
    dose: '**Priapism, if aspiration alone fails — 100–500 mcg intracavernosal**, repeated every 5 min to a **maximum 1 mg total**.


      Dilute 1 mg in 19 mL NS to give 50 mcg/mL.


      **Combine with corporal aspiration** — aspiration plus phenylephrine achieves
      detumescence in about 93%, well above either alone.


      **Monitor blood pressure and pulse** through the injections: reflex hypertension
      and bradycardia are expected, and myocardial infarction is a rare complication.
      Hold if systolic BP is above 180 mmHg.

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the sickle cell page, p.59; no new clinical claim is introduced.
  - id: phenytoin
    name: Phenytoin
    class: ''
    page: 155
    dose: '**Children:**

