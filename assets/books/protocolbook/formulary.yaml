      - Maintenance: 60 mg/kg/day ÷ q8–12 hrs

      '
  - id: vancomycin
    name: Vancomycin
    class: antibiotic
    dose: '**15 mg/kg IV 6-hourly (max 2 g/dose)** for serious MRSA and for CNS infection — **not 8-hourly**. Monitor levels where available; consult pharmacy.\n\nTarget trough **15–20 mg/L** (AUC/MIC ≥ 400) for the intracranial indication.


      Used for MRSA cover in sepsis, and with ceftriaxone where mastoiditis has intracranial complications.

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the mastoiditis and adult sepsis pages; no new clinical claim is introduced.
  - id: vitamin-a
    name: Vitamin A
    class: ''
    page: 157
    dose: '**Routine supplementation:**

      - < 6 months: not recommended

      - 6–12 months: 100,000 units PO stat

      - > 12 months: 200,000 units PO stat


      **Treatment of deficiency — days 1, 2 and 15.** Only for eye signs of deficiency,
      measles, or severe/persistent diarrhoea. A child with no deficiency signs who is
      on F-75, F-100 or RUTF gets the low daily dose only — those feeds already contain
      vitamin A, and high-dose supplementation in an adequately fed child causes more
      respiratory and diarrhoeal illness. If the first dose was given at a referring
      centre, give days 2 and 15.

      - < 6 months: 50,000 units

      - 6–12 months: 100,000 units

      - > 12 months: 200,000 units

      '
    notes: 'For ROUTINE supplementation: once on admission; should not be given twice within 1 month.


      The 1-month rule does **not** apply to the 3-dose deficiency-treatment course above — that schedule is deliberate, and neither does the "< 6 months: not recommended" line, which is a routine-supplementation rule. In severe acute malnutrition, give high-dose vitamin A only for **eye signs, measles, or severe/persistent diarrhoea**: F-75, F-100 and RUTF already contain enough for everyone else.

      '
  - id: vitamin-b12
    name: Vitamin B12
    class: ''
    page: 158
    dose: '**Infants dietary deficiency:** 1 mg IM/day × 5 days, then weekly × 3 more doses


      **Infants / Children malabsorption:** 1 mg IM every other day × 6 days, then weekly for 6 weeks


      **Adults:**

      - Deficiency: 1 mg PO QD

      - Severe deficiency or pernicious anemia: 1 mg IM every other day × 6 days, then weekly for 6 weeks

      '
    notes: 'Also known as cyanocobalamin.

      '
  - id: vitamin-d
    name: Vitamin D
    class: ''
    page: 157
    dose: '**Infants:**

      - Rickets: 2000 IU/day × 6–12 wks

      - Maintenance: 400 IU/day


      **Children:**

      - Rickets: 2000 IU/day × 6–12 wks

      - Maintenance: 600–1000 IU/day


      **Adults:**

      - Deficiency: 6000 IU/day × 8 wks

      - Maintenance: 2000 IU/day

      '
    notes: 'Children may also take 50,000 IU/week × 6 weeks.

      '
  - id: vitamin-k
    name: Vitamin K
    class: ''
    page: 157
    dose: "**Neonate:**\n- Preterm ≤ 1500 g: 0.3–0.5 mg/kg IM stat — a single IV dose is not recommended in a preterm infant\n- Preterm > 1500 g: 1 mg IM stat, the same as a term infant\n- Term: 1 mg IM stat\n\n**Supratherapeutic INR:**\n- Children: 0.03 mg/kg/dose IV (max dose 1 mg)\n- Adult:\n  - INR 4.5–10, no bleeding: may consider 1–2.5 mg PO\n  - INR > 10: 2.5–5 mg PO\n  - Minor bleeding & elevated INR: 2.5–5 mg PO\n  - Major bleeding & elevated INR: 10 mg PO\n"
    notes: '**Adequate standard intake daily:**

      - 0–1 yrs: 2.5 mcg

      - 1–3 yrs: 30 mcg

      - 4–13 yrs: 60 mcg

      - 9–13 yrs: 60 mcg

      - > 14 yrs female: 90 mcg/day

      - > 14 yrs male: 120 mcg/day

      '
  - id: warfarin
    name: Warfarin
    class: ''
    page: 158
    dose: '- **Do NOT load.** Routine loading increases bleeding without faster protection

      - Adults: **start 5 mg PO OD; 2.5 mg or less if older, frail, malnourished, or with liver disease**

      - Children: 0.2 mg/kg (max 10 mg) as a single first dose, then by INR

      - **For VTE, overlap with LMWH or UFH for ≥ 5 days AND until INR ≥ 2 for 24 h** — warfarin alone from day 1 is inadequate

      - First INR at 3–5 days, then at least weekly until stable. Goal 2–3

      '
    notes: 'Max 10 mg/dose.

