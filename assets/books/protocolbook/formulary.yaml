      - < 2 years: 37.5 mg OD

      - 2–12 years: 100 mg OD

      - > 12 years: 200 mg OD

      '
  - id: heparin
    name: Heparin (unfractionated)
    class: ''
    page: 152
    dose: '**Children:**

      - DVT / PE treatment: 75 units/kg IV bolus; 20 units/kg/hr IV infusion


      **Adults:**

      - DVT prophylaxis: 5000 units SC q12hrs

      - DVT / PE treatment: 80 units/kg IV bolus; 18 units/kg/hr IV infusion

      - Acute coronary syndrome: 60 units/kg IV bolus; 12 units/kg/hr IV infusion

      '
    notes: 'Treatment is given as an IV bolus followed by a continuous IV infusion.


      - Maximum bolus for DVT/PE: 5,000 units

      - Maximum bolus for ACS: 4,000 units

      - Maximum infusion rate: 1,000 units/hr

      '
  - id: hydrocortisone
    name: Hydrocortisone
    class: steroid
    dose: '- **Anaphylaxis adjunct: 2–4 mg/kg IM or slow IV, max 100 mg in a child (200 mg adult).** An adjunct of unproven benefit — it must never delay epinephrine

      - **Paediatric septic shock: 2 mg/kg IV bolus, then 1 mg/kg IV q6h.** Do **not** use routinely

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the anaphylaxis and paediatric sepsis pages; no new clinical claim is introduced.
  - id: hydroxyurea
    name: Hydroxyurea
    class: ''
    page: 152
    dose: 'Child 2–12 years: initially 20 mg/kg once daily, increased every 12 weeks in steps of 2.5–5 mg/kg daily according to response; usual dose 20–30 mg/kg daily (max 35 mg/kg daily).

      '
    notes: 'For use in SCD with stroke, admission for acute chest syndrome, > 3 admissions/yr for pain, or requiring ≥ 2 transfusions yearly.

      '
  - id: hypertonic-saline
    name: Hypertonic Saline 3%
    class: fluid
    dose: '**Severely symptomatic hyponatraemia — bolus, not a slow infusion.**


      - **Children: 4 mL/kg (max 100 mL) · Adults: 100 mL**, repeat until symptoms improve

      - Predictive formulas systematically underestimate the rise and **must never replace serial sodium measurement**


      Also used for raised intracranial pressure as an alternative to mannitol.

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the sodium page, p.140; no new clinical claim is introduced.
  - id: ibuprofen
    name: Ibuprofen
    class: ''
    page: 152
    dose: '**Neonates (PDA closure):**

      - Dose 1 at 0 hours: 10 mg/kg PO

      - Dose 2 & 3: 5 mg/kg PO at 24 & 48 hours


      **Children:** 10 mg/kg PO q6hrs


      **Adults:** 400–800 mg PO q6–8hrs

      '
    notes: '**Max:** 800 mg/dose, 2400 mg/day.


      Do not give in cases of renal disease. Give with food when possible.

      '
  - id: insulin-soluble
    name: Insulin (soluble / regular)
    class: endocrine
    dose: '**DKA — children:** 0.05–0.1 unit/kg/hr IV infusion (**no bolus in children**)

      **DKA — adults:** 0.1 unit/kg/hr IV infusion (a 0.1 unit/kg bolus is optional)

      - Once glucose ~11–14 mmol/L, **reduce to 0.02–0.05 unit/kg/hr and add dextrose**; continue until the anion gap closes


      **Hyperkalaemia — children:** 0.05–0.1 unit/kg IV with glucose 0.5 g/kg

      **Hyperkalaemia — adults:** 10 units IV with 25 g glucose (50 mL of 50%)

      '
    notes: '⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.

      🛑 **Delayed hypoglycaemia** — check glucose **at least hourly for 6 hours** after

      a hyperkalaemia dose.

      In DKA, **do not stop the infusion for hyperglycaemia correction alone** — add

      dextrose instead — and **replace potassium first if K⁺ < 3.3**.

      Requires a cold chain.

      '
  - id: ipratropium
    name: Ipratropium
    class: respiratory
    dose: '**0.5 mg nebulised with salbutamol, every 20 min × 3 doses**, or 8 puffs by MDI with spacer.

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the COPD and asthma page, p.127; no new clinical claim is introduced.
  - id: iron
    name: Iron
    class: ''
    page: 152
    dose: '**Pre-term infant:** 2–4 mg elemental Fe/kg/day


      **Iron deficiency:**

      - Children: 3–6 mg elemental Fe/kg/day

      - Adults: 60–120 mg elemental iron daily

      '
    notes: '- Max dose: 15 mg elemental Fe/kg/day

      - Hemaforte syrup: 5 mg elemental iron/mL

      - **Prescribe by elemental iron, not salt weight.** A **325 mg dried (exsiccated)** ferrous sulfate tablet contains **65 mg** elemental iron (~30% iron). The **heptahydrate is only ~20% iron**, so a 200 mg tablet of it carries about **40 mg**, and 300 mg about 60 mg (OE 2026-08-30)

      '
  - id: isoniazid
    name: Isoniazid
    class: ''
    page: 152
    dose: '- Children: 10 mg/kg PO QD

      - Adults: 5 mg/kg PO QD

      '
  - id: itraconazole
    name: Itraconazole
    class: antifungal
    dose: '**Disseminated histoplasmosis.**


      **Adults:** 200 mg PO TID × 3 days (loading), then **200 mg PO BD**

      **Children:** 5 mg/kg/dose PO TID × 3 days, then 5 mg/kg/dose BD (max 400 mg/day)


      Duration **≥ 12 months** — stop only with > 12 months of therapy, ≥ 6 months on ART

      with **CD4 ≥ 150**, negative fungal cultures, undetectable viral load, and

      *Histoplasma* antigen below threshold

      '
    notes: '⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.

      **Erratic absorption** — give capsules with food or an acidic drink; avoid acid

      suppressants. Check the level where possible (**target 1–2 µg/mL**).

      Strong CYP3A4 interactions (efavirenz, rilpivirine, rifampicin) — 🛑 **rifabutin

      lowers itraconazole levels and has no role in histoplasmosis.**

      **Negative inotrope — avoid in heart failure.**

      '
  - id: labetalol
    name: Labetalol
    class: antihypertensive
    dose: '**First choice in hypertensive emergency here — it needs no infusion pump.**


      - **10–20 mg IV** over 1–2 min, then **20–80 mg q10min** until at target, to a **300 mg** total

      - **Oral: 200 mg PO, then 200–400 mg q6–12h PRN**

      - **Acute stroke:** 10–20 mg IV over 1–2 min, may repeat once; lower BP by no more than 15% in the first 24 hrs

      - **Aortic dissection:** give the beta-blocker BEFORE any vasodilator

      '
    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the hypertension and stroke pages; no new clinical claim is introduced.
  - id: lactulose
    name: Lactulose
    class: ''
    page: 152
    dose: '- Infants (hepatic encephalopathy): 2.5–10 mL ÷ TID-QID

      - Children: 1–3 mL/kg/day ÷ q8–12hrs

      - Adults: 30 mL PO q6hr

      '
    notes: '- Children max dose: 60 mL/day

      - Formulation: 10 g/15 mL

      - Goal: at least 3–4 soft stools daily

      '
  - id: leucovorin
    name: Leucovorin
    class: ''
    page: 153
    dose: '- Children: 5 mg PO QD

      - Adults: 10–25 mg PO QD

      '
  - id: lisinopril
    name: Lisinopril
    class: ''
    page: 153
    dose: '- Infants / Children: 0.1 mg/kg PO OD

      - Adults: 5 mg PO OD

      '
    notes: '**Max dose:**

      - Children: 0.6 mg/kg/day or the adult dose

      - Adults: 40 mg/day

      '
  - id: lorazepam
    name: Lorazepam
    class: ''
    page: 153
    dose: '**Adults / Children (> 12 yr):**

      - Anxiety (acute): 2 mg PO q8hr

      - Agitation: 0.5–2 mg IV q2–4hrs

      '
    notes: 'Use with caution in the elderly.

