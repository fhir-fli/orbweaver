  - id: rifaximin
    name: Rifaximin
    class: gastrointestinal
    dose: '**Recurrent hepatic encephalopathy — 550 mg PO twice daily.**\n\nAdded to lactulose, not instead of it. Lactulose stays first line at 30–45 mL PO every 1–2 hrs until two bowel movements, then 15–30 mL 2–4 times daily to keep 2–3 soft stools a day.

