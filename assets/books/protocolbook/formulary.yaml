    notes: 'To make 1:10,000: mix 1 mL of 1:1000 epinephrine in 9 mLs NS.

      '
  - id: erythromycin
    name: Erythromycin (Estolate)
    class: ''
    page: 151
    dose: '**Infants / Children:**

