    notes: ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it. Dose taken from the DKA and SAM pages; no new clinical claim is introduced.
  - id: prednisone
    name: Prednisone / Prednisolone
    class: ''
    page: 155
    dose: "- Children: 1–2 mg/kg PO OD\n- Adults: 40 mg PO OD\n\n**Suggested tapering schedule:**\n- Children: decrease dose by ~10% every 2 weeks\n- Adults:\n  - Dose ≥ 20 mg/day: decrease by 5 mg/day every week\n  - Dose 10–20 mg/day: decrease by 2.5 mg/day every 2 weeks\n  - Dose ≤ 10 mg/day: decrease by 1 mg/day every 2 weeks\n"
    notes: 'Max for asthma: 60 mg/day. Tapering is only required if used for **> 3 weeks**.


      If any symptoms of adrenal insufficiency, return to the previous dose. Symptoms of adrenal insufficiency: abd pain, vomiting, unusual sweating, dehydration, confusion, fatigue, weakness, low BP, high HR, shock.

      '
