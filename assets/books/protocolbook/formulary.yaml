        - 4–11 yo: 200 mg PO BD × 14 days
        - ≥ 12 yo and adults: 500–1000 mg PO BD × 14 days
      notes: |
        Give with food.

    - id: "nitrofurantoin"
      name: "Nitrofurantoin"
      class: ""
      page: 154
      dose: |
        - Children (> 1 yr): 1.5 mg/kg PO q6hr (total 6 mg/kg/day)
        - Adults: 100 mg PO q6hr
      notes: |
        Full course for UTI in children and adults is 7 days.

    - id: "nitroglycerine"
      name: "Nitroglycerine"
      class: ""
      page: 154
      dose: |
        Adults: 0.4 mg SL q5min × 3 doses
      notes: |
        prn anginal pain.

    - id: "norepinephrine"
      name: "Norepinephrine (Noradrenaline)"
      class: "vasoactive"
      dose: |
        **First-line vasopressor** for septic shock, cardiogenic shock, and hypotension in
        acute hyponatraemia.

        **Children:** 0.05–0.1 mcg/kg/min IV, titrated (up to ~1 mcg/kg/min)
        **Adults:** 0.05–0.5 mcg/kg/min IV, titrated to MAP ≥ 65 (up to 1 mcg/kg/min)
      notes: |
        ⚠️ **Not on the printed Essential Medications list** — added because the protocols prescribe it.
        Central line preferred; **may be run peripherally short-term** through a
        well-sited cannula with vigilance for extravasation, which causes tissue necrosis.
        **It can be delivered on a drop counter where there is no pump.**
        Preferred over dopamine — less arrhythmia, lower mortality.

    - id: "nystatin"
      name: "Nystatin"
      class: ""
      page: 154
      dose: |
        - Preterm infants: 0.5 mL to each side of mouth q6hrs
        - Term infant: 1 mL to each side of mouth q6hrs
        - Children / Adults — oropharyngeal candidiasis: 4–6 mL PO q6hr
      notes: |
        - PO suspension = 100,000 units/mL
        - Two weeks if HIV+ve
        - Swish in mouth as long as possible before swallowing

    - id: "omeprazole"
      name: "Omeprazole"
      class: ""
      page: 154
      dose: |
        - Children: 0.5–1 mg/kg/dose PO OD or BD
        - Adults: 20–40 mg PO OD
      notes: |
        May reduce the serum concentration of clopidogrel.

    - id: "paracetamol"
      name: "Paracetamol / Panadol"
      class: ""
      page: 154
      dose: |
        - Children: 10–15 mg/kg PO q4–6hr
        - Adults: 650 mg PO q4–6hr
      notes: |
        Max dose: 4 g/day. Not given in liver failure.

    - id: "paromomycin"
      name: "Paromomycin"
      class: ""
      page: 154
      dose: |
        ≥ 12 yo and adults: 500 mg PO QID × 14–21 days

    - id: "pentamidine"
      name: "Pentamidine"
      class: ""
      page: 154
      dose: |
        Adults / Children: 4 mg/kg IV QD

    - id: "pethidine"
      name: "Pethidine (Demerol)"
      class: ""
      page: 154
      dose: |
        - Children: 0.5–1 mg/kg q4hrs
        - Adults: IM/PO/SQ 50 mg q3hrs
      notes: |
        Morphine is almost always preferred if available (including for biliary issues).

    - id: "phenobarbital"
      name: "Phenobarbitone / Phenobarbital"
      class: ""
      page: 154
      dose: |
        **Neonates:**
        - Loading: 20 mg/kg IV/IM
        - Maintenance: 5 mg/kg IV/IM/PO OD

        **Infants / Children / Adults:**
        - Loading: 15 mg/kg IV/IM (max initial loading dose 320 mg)
        - Maintenance: 5 mg/kg IV/IM/PO OD
      notes: |
        **Not compatible with aminophylline, metronidazole.**

        Give over 20 minutes if IV (not faster than 1 mg/kg/min).

    # ═══════════════════════ PAGE 155 ═══════════════════════
    - id: "phenytoin"
      name: "Phenytoin"
      class: ""
