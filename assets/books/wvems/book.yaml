    - title: "About & Credits"
      appendix: true
      palette:
        accent: "0xFF455A64"
        accent_fill: "0xFFECEFF1"
        accent_branch: "0xFF607D8B"
      children:
        - topic: "topics/wvems_2026_003.yaml"
        - topic: "topics/wvems_2026_about.yaml"
