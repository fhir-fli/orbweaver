book:
  id: "wvems"
  title: "WVEMS Protocols"
  subtitle: "2026 Edition · Prehospital"
  cover: "cover.png"
  spine_color: "0xFF1E4E8C"
  # Single-page directory of every protocol (like the printed cover index),
  # instead of the default drill-down TOC. Auto-built from the contents tree.
  view: "index"
  # The printed book uses colour in two registers: a CHAPTER register (the
  # page-number circles, title bar, edge rail and page wash) and a SEMANTIC
  # register that is fixed across all 166 pages (peds pink, Critical-Care
  # lavender, the red octagon, the purple trapezoid, the dose-table zebra).
  # Everything structural in between — section brackets, section titles, box
  # outlines — is NEUTRAL on every chapter, and that is precisely what lets
  # the pink paediatric bracket carry meaning. The app's default is to tint
  # that chrome with the chapter accent, which is right for the other books
  # and wrong here, so WVEMS overrides it at the book level.
  #
  # Measured in tool/wvems_audit_colour.md: bracket #666666 on all 117
  # bracketed pages; black borders on every solid box, flow node and card;
  # #999999 dashes on 79 pages; and no amber anywhere in the book — the
  # nearest colour to the app's `alert` is 36 points away, so the amber
  # callout was outshouting the red octagon it is supposed to defer to.
  palette:
    node_border: "0xFF000000"
    section_rule: "0xFF666666"
    section_title: "0xFF000000"
    box_border: "0xFF000000"
    # Firm ("Concept") box: neutral grey card, black outline and title chip.
    alert: "0xFF000000"
    alert_fill: "0xFFEFEFEF"
    alert_text: "0xFF000000"
    # Conditional box: near-white card, #999999 dashes.
    dash_rule: "0xFF999999"
    dash_fill: "0xFFFDFAFA"
    # The note pill inside a flowchart, same neutral treatment.
    note_fill: "0xFFEFEFEF"
    note_border: "0xFF000000"
    note_text: "0xFF000000"
  # contents tree — the 4 PDF index sections as explicit groups
  # (Universal / Medical / Trauma / Critical Care) + a drug-reference
  # appendix. Topic+map model; section structure is declared, not derived.
  # The print sets its body in Barlow *Condensed*, which is what makes its
  # 68-73 character measure possible. Roboto is 28% wider per character, and
  # the app was buying the print's line length back by shrinking 24 of 45
  # prose pages to 0.90 or 0.85. Roboto Condensed ships in Flutter's
  # material_fonts cache (no new asset) and recovers 12% of that, so type gets
  # *larger* on screen rather than smaller. Book-scoped: the other three books
  # have their own sources.
  font_family: "RobotoCondensed"

  contents:
    - title: "Universal"
      palette:
        accent: "0xFF1E4E8C"
        accent_fill: "0xFFE8F0FA"
        accent_branch: "0xFF2C6BB5"
        page_wash: "0xFFF5F8FD"
      children:
        - topic: "topics/wvems_2026_004.yaml"
        - topic: "topics/wvems_2026_006.yaml"
        - topic: "topics/wvems_2026_008.yaml"
        - topic: "topics/wvems_2026_010.yaml"
        - topic: "topics/wvems_2026_012.yaml"
        - topic: "topics/wvems_2026_016.yaml"
        - topic: "topics/wvems_2026_018.yaml"
        - topic: "topics/wvems_2026_020.yaml"
        - topic: "topics/wvems_2026_014.yaml"
        - topic: "topics/wvems_2026_022.yaml"
    - title: "Medical"
      palette:
        accent: "0xFF2E7D32"
        accent_fill: "0xFFEAF4EB"
        accent_branch: "0xFF43A047"
        page_wash: "0xFFF5F9F3"
      children:
        - topic: "topics/wvems_2026_024.yaml"
        - topic: "topics/wvems_2026_026.yaml"
        - topic: "topics/wvems_2026_028.yaml"
        - topic: "topics/wvems_2026_030.yaml"
        - topic: "topics/wvems_2026_032.yaml"
        - topic: "topics/wvems_2026_034.yaml"
        - topic: "topics/wvems_2026_036.yaml"
        - topic: "topics/wvems_2026_038.yaml"
        - topic: "topics/wvems_2026_040.yaml"
        - topic: "topics/wvems_2026_042.yaml"
        - topic: "topics/wvems_2026_044.yaml"
        - topic: "topics/wvems_2026_046.yaml"
        - topic: "topics/wvems_2026_048.yaml"
        - topic: "topics/wvems_2026_050.yaml"
    - title: "Trauma"
