    - title: "Policies"
      appendix: true
      # Print runs Procedures and Policies as one orange section; the app
      # splits them for navigation but keeps the section's page wash.
      palette:
        accent: "0xFF455A64"
        accent_fill: "0xFFECEFF1"
        accent_branch: "0xFF607D8B"
        page_wash: "0xFFFDF8F2"
      children:
