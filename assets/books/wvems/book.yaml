    - title: "Peds Reference"
      appendix: true
      palette:
        accent: "0xFFAD1457"
        accent_fill: "0xFFFDE7F0"
        accent_branch: "0xFFD81B60"
        page_wash: "0xFFFFFBFB"
      children:
