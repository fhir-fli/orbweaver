        - topic: "topics/wvems_2026_084.yaml"
        - topic: "topics/wvems_2026_086.yaml"
        - topic: "topics/wvems_2026_088.yaml"
        - topic: "topics/wvems_2026_090.yaml"
        - topic: "topics/wvems_2026_092.yaml"
        - topic: "topics/wvems_2026_094.yaml"
    - title: "Drug Reference"
      # Reference appendices — rendered as footer bars in the index directory,
      # not protocol columns.
      appendix: true
      # Print gives the Drug Reference its own teal accent (#76A5AF), the only
      # cue that says "drug card, not protocol" at a glance; #3A5D64 is the
      # dark form of the same hue and is what the card headers are drawn in,
      # so it carries the print's identity while staying legible under white
      # AppBar text.
      palette:
        accent: "0xFF3A5D64"
        accent_fill: "0xFFE6EEF0"
        accent_branch: "0xFF5E8F99"
        page_wash: "0xFFF6F9F9"
      children:
        - topic: "topics/wvems_2026_drug_reference.yaml"
    - title: "Procedures"
      appendix: true
      palette:
        accent: "0xFFC55A11"
        accent_fill: "0xFFFBEEE4"
        accent_branch: "0xFFE57324"
        page_wash: "0xFFFDF8F2"
      children:
