  - page_number: 23
    blocks:

    - type: "prose"
      title: "Nausea / Vomiting Imperatives"
      highlight: true
      markdown: |
        - It is appropriate to **pre-treat for nausea** before symptoms start.
          - Consider before any intervention (or meds) that cause nausea.
          - Especially if vomiting would cause serious complications.
          - Strongly consider **[Zofran](topic:wvems-2026-drug-reference#zofran)** with any invasive airway device.
        - **Avoid oral** food and fluids. (Oral meds are OK.)
          - Keep patients **NPO** (Nil Per Os: Lat. “nothing through the mouth”)

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Zofran®](topic:wvems-2026-drug-reference#zofran)** (Ondansetron): Use for all causes of nausea & vomiting.
          - Use caution with [Bradycardia](topic:wvems-2026-012), and [Overdose / Tox](topic:wvems-2026-040).
          - Consider **[12-Lead](topic:wvems-2026-096#12-lead)** if hx/risk of **Long QT** or electrolyte imbalance.
          - {E} May only give PO - use **Orally Disintegrating Tabs** (ODTs)

    - type: "band_callout"
      band: "peds"
      title: ""
      markdown: |
        - {A} Alternate 4–10 y/o dose: break ODT in half and give 2 mg PO

    - type: "prose"
      title: "Notes"
      markdown: |
        - Consider an atypical [Cardiac](topic:wvems-2026-028) cause in diabetics and the elderly.
        - Sniffing an alcohol prep may also provide minor nausea relief.
        - Vomiting is a protective mechanism in [overdose](topic:wvems-2026-040) (such as EtOH).
          - But intentionally inducing vomiting (i.e. ipecac) is not indicated.
          - May consider **[Zofran](topic:wvems-2026-drug-reference#zofran)** for dry heaving after stomach is empty.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.

