  - page_number: 41
    blocks:

    - type: "prose"
      title: "Overdose / Tox Imperatives"
      highlight: true
      markdown: |
        - Collect a detailed history and **SDS** (Safety Data Sheet) if able:
          - Substance, quantity and **time** of ingestion or exposure
        - Consider an **[Antidote](topic:wvems-2026-096#administer-antidote)** for critical symptoms from a **known toxin**.
          - Minor exposures with few symptoms do not require an **[Antidote](topic:wvems-2026-096#administer-antidote)**.
          - Stable patients should be monitored and transported.
          - Supportive care is sufficient for **alcohol** (ethanol) intoxication.
        - Monitor [Airway](topic:wvems-2026-004) closely with all **caustic ingestions**.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Narcan®](topic:wvems-2026-drug-reference#narcan)** (Naloxone): Should only be used to treat **[Hypoxia](topic:wvems-2026-006)**.
          - May try for any substance OD or exposure w/ dyspnea or shock.
          - Call **Medical Control** for any refusal after **[Narcan](topic:wvems-2026-drug-reference#narcan)**.
          - {} May provide premeasured **intranasal** doses only.
          - {A} Titrate dose to resps & SpO₂; May start as low as **0.04** mg.
        - **[NS Bolus](topic:wvems-2026-drug-reference#ns-bolus)** (0.9% Saline): Fluids may help dilute toxins.
          - Consider even without [Hypotension](topic:wvems-2026-008). Avoid with [CHF](topic:wvems-2026-030) or [dialysis](topic:wvems-2026-018).

    - type: "prose"
      title: "Notes"
      markdown: |
        - If poison is known, consider **Poison Control**: 800-222-1222.
          - Most **[Antidotes](topic:wvems-2026-096#administer-antidote)** require **online orders** (and dosing instructions).
        - This protocol includes **poisoning** and toxic ingestions.
          - For **chemical burns** and skin exposures, refer to [Burns](topic:wvems-2026-070).
          - For **gasses** and smoke inhalation, refer to [Inhalation](topic:wvems-2026-072).

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Just a **single pill** of some adult meds can cause profound [shock](topic:wvems-2026-008).
          - Ingested **cigarettes or vape fluid** (nicotine) can be **fatal**.
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.

