    blocks:

    # ────────────────────────────────────────────────
    # Flowchart block (severity variant — 2 branches)
    # ────────────────────────────────────────────────
    - type: "flowchart"
      variant: "severity"

      warnings:
        - type: "safety"
          text: "Ensure Provider SAFETY"

      entry_chain:
        - text: "Heat, Chemical, or Electric Injury"
          shape: "stadium"
        - text: "Stop the Burning"
          shape: "rounded_rectangle"

      decision:
        text: "Severity?"
        shape: "diamond"

      branches:

        - id: "minor"
          label: "Minor"
          criteria:
            - "Superficial"
            - "Less than 5% BSA"
          actions:
            - text: "Position of Comfort"
              kind: "procedure"

        - id: "major"
          label: "Major"
          criteria:
            - "Deep or Blistering"
            - "Face or Airway"
          actions:
