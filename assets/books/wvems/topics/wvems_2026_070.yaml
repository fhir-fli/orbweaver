              kind: "procedure"
            - provider_level: "A"
              text: "NS Bolus"
              kind: "medication_administration"

      convergence:
        text: "Consider"
        shape: "stadium"
        warnings:
          - type: "safety"
            text: "Ensure Patient DECON"
          - type: "caution"
            text: "[Consider Destination Triage](topic:wvems-2026-109#destination-triage)"
        bullets:
          - text: "[Breathing](topic:wvems-2026-006)"
          - text: "Circulation / [Shock](topic:wvems-2026-008)"
