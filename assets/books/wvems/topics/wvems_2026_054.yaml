  - page_number: 55
    blocks:

    - type: "prose"
      title: "Trauma ROSC Imperatives"
      highlight: true
      markdown: |
        - Most important aspect is to prioritize emergent transport.
          - **Get the patient to the hospital.**
        - Reassess and repeat **[Pleural Decompression](topic:wvems-2026-096#pleural-decompress)** as needed.
          - Repeat immediately if decompression after initial success.
        - Reassess and apply additional **[Tourniquets](topic:wvems-2026-096#tourniquet)** as needed.
          - Apply pressure and **[pack wounds](topic:wvems-2026-096#wound-packing)** for junctional bleeding.
        - Consider a concurrent medical cause preceding the trauma.

    - type: "row"
      blocks:
        - type: "prose"
          flex: 6
          title: "TRAUMA Alert"
          callout: true
          dashed: true
          call_er: true
          markdown: |
            - If Any Trauma CPR
            - Or Unstable Vitals
            - Call a **TRAUMA** Alert
        - type: "prose"
          flex: 5
          title: "Poor Perfusion"
          callout: true
          markdown: |
            Suspect if **several** of these:
            - **Altered Mental Status**
            - Skin Pale, Cool, Diaphoretic
            - Tachycardia, Hypotension
            - Dyspnea, Tachypnea

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Ketamine](topic:wvems-2026-drug-reference#ketamine)** (Ketalar®): Dilute in NS and **give slowly over 10 min**.
          - Use [weight-based peds dosing](topic:wvems-2026-144) for adults under 110 lbs (50 kg).

    - type: "prose"
      title: "Notes"
      markdown: |
        - Keep **normothermic** (hypothermia causes coagulopathy & bleeding).

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Consider [Intubation](topic:wvems-2026-078) and/or [Vent](topic:wvems-2026-080) if indicated and credentialed for CC.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.

