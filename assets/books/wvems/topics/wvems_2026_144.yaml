    - type: "prose"
      markdown: |
        - Epi (mg): CODE/Brady; = 0.1 mL/kg of 0.1 mg/mL; max 1 mg
        - Adenosine 1st (mg): rapid push + flush; max 6 mg
        - Adenosine 2nd (mg): max 12 mg
        - Amiodarone (mg): CODE; max 300 mg; Q5min x3
        - Atropine (mg): no minimum (PALS 2020); max 0.5 mg
        - Calcium (mg): over 10 min (bolus in CODE)
        - Bicarb (mEq): max 50 mEq
        - D10 (mL): = 0.5 g/kg
        - NS bolus (mL): limit x3 (60 mL/kg)
        - 3% Saline (mL): TBI; over 10 min
        - Magnesium (mg): over 10 min; max 2 g
        - Narcan (mg): FDA initial 0.01 mg/kg, titrate; max ~2 mg

