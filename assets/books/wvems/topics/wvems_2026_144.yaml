      markdown: |
        - Fentanyl (mcg): max ~100 mcg
        - Morphine (mg): max ~4 mg
        - Toradol (mg): ketorolac; 2+ y/o; max 15 mg
        - Zofran (mg): ondansetron; max 4 mg
        - Benadryl (mg): diphenhydramine; max 50 mg
        - Decadron (mg): dexamethasone; croup; max 12 mg
        - Lasix (mg): furosemide; max 40 mg
        - TXA (mg): over 10 min; max 1 g (then 2 mg/kg/hr)
        - Ibuprofen (mg): 6+ mo; max ~600 mg
        - Tylenol (mg): acetaminophen; max ~1 g

