  blocks:

    - type: "prose"
      title: "Peds Reference"
      highlight: true
      markdown: |
        - **Age** is the primary reference — it allows preparation en route.
        - Use a **length/colour tape** if the age is unknown (or if the child is very small/large).
        - **Weight-based** dosing is tertiary — estimating weight is less accurate.
        - Use the **same route & frequency** as the adult protocol.
          - Limit **NS Bolus** to **×3** (60 mL/kg).

    - type: "prose"
      title: "⚠️ Verify every dose"
      callout: true
      palette:
        alert: "0xFFD32F2F"
        alert_fill: "0xFFFDECEA"
        alert_text: "0xFFB71C1C"
      markdown: |
        These age tables are **COMPUTED** (**mg/kg** × **estimated
        weight-for-age**) and reviewed against **PALS 2025 / OpenEvidence**, but
        remain a **cross-check** pending **medical-director sign-off** — not a
        substitute for it. **Confirm every dose** against a current reference
        (and a length/colour tape) before administration. Max doses & caveats
        are in the notes under each table (**\*** = capped at max).

    - type: "prose"
      title: "Seizure / RSI doses (evidence-based)"
      boxed: true
      markdown: |
        These follow **PALS / status-epilepticus evidence** — **higher than
        sedation doses**:
        - **Ativan** (lorazepam) **0.1 mg/kg** SE (max 4 mg)
        - **Versed** (midazolam) **0.1–0.2 mg/kg** SE (max 10 mg)
        - **Keppra** **40–60 mg/kg** SE loading (3+ mo)
        - **Rocuronium** **1 mg/kg** RSI
        - **Atropine** — no 0.1 mg minimum (removed in PALS 2020)
        For **sedation**, use the lower doses shown on the Drug Reference cards.

