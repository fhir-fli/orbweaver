    - type: "prose"
      title: "Peds Reference"
      highlight: true
      markdown: |
        - **Age** is the primary reference — it allows preparation en route.
        - Use a **length/colour tape** if the age is unknown (or if the child is very small/large).
        - **Weight-based** dosing is tertiary — estimating weight is less accurate.
        - Use the **same route & frequency** as the adult protocol.
          - Limit **NS Bolus** to **×3** (60 mL/kg).

    - type: "prose"
      title: "EMT Peds Dosing"
      markdown: |
        - Paediatric med math is **not in EMT scope**.
        - EMTs may give the regular **adult dose** for these, at/above the listed age:
          - **Afrin** (oxymetazoline): ≥ 6 y/o
          - **Albuterol** (Ventolin): ≥ 2 y/o
          - **Atrovent** (ipratropium): ≥ 5 y/o
          - **Baqsimi** (glucagon IN): ≥ 1 y/o
          - **Glucagon** (IM): ≥ 5 y/o
          - **Oral Glucose** (Glutose): ≥ 2 y/o
          - **Narcan** (naloxone): ≥ 1 y/o
          - **Tetracaine** (ophthalmic): all ages
          - **Zofran ODT** (ondansetron): ≥ 11 y/o
        - May give an **EpiPen Jr** for 3–8 y/o, or an adult **EpiPen** for ≥ 9 y/o.
        - May give **OTC** doses of Benadryl, Ibuprofen, and Tylenol — follow the directions on the OTC box for age/weight.
          - May **not** give doses labelled "ask (or as directed by) a physician".

    - type: "prose"
      title: "Age-based dose tables — coming soon"
      callout: true
      markdown: |
        Per-age emergency drug dosing (Premie → 13 years) for the WVEMS
        formulary is being rebuilt from current paediatric guidelines and
        clinically verified, rather than reproduced from the licensed source.

        **Until then:** use your approved paediatric length/colour tape or an
        approved dosing reference.

