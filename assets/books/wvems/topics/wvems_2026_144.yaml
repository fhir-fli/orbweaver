    - type: "prose"
      markdown: |
        Approximate **50th-percentile** weight-for-age (PALS/Broselow-aligned).
        **This is the key assumption** — swap in your preferred standard (e.g.
        a length/colour tape estimate) and the doses scale accordingly.

