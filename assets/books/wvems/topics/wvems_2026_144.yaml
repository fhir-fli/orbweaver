    - type: "prose"
      markdown: |
        - Ativan (mg): lorazepam SE 0.1 mg/kg; max 4 mg [OE]
        - Versed (mg): midazolam SE 0.1-0.2 mg/kg; max 10 mg [OE]
        - Ketamine (mg): pain; higher for Critical Care
        - Keppra (mg): levetiracetam SE loading 40-60 mg/kg; 3+ mo; max 4.5 g [OE]

