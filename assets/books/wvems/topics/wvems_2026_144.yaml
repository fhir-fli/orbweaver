        - cells: ["Levophed (mcg/min)", "0.05–0.5 mcg/kg/min", "0.2–1.8", "0.4–4", "0.5–5", "0.6–6", "0.8–8", "1–10", "1.2–12.5", "1.6–16", "2–20"]
        - cells: ["Lopressor (mcg/min)", "0.5 mcg/kg/min", "2", "4", "5", "6", "8", "10", "12.5", "16", "20"]
    - type: "prose"
      markdown: |
        - Dopamine (mcg/min): 5-20 mcg/kg/min; titrate
        - Levophed (mcg/min): norepi 0.05-0.5 mcg/kg/min; 4 mg in 250 mL
        - Lopressor (mcg/min): metoprolol 0.5 mcg/kg/min
    - type: "prose"
      title: "Not in the tables (infusions & fixed doses)"
      markdown: |
        - **Epinephrine drip / Dopamine / Norepinephrine (Levophed) / Metoprolol (Lopressor)** — weight-based **infusions** (mcg/kg/min); titrate to effect, not a single dose.
        - **Glucagon** — **0.5 mg** IM if **< 6 y/o (< 20 kg)**, otherwise 1 mg.
        - **Albuterol / Atrovent / Epi Neb** — nebulised; use the standard neb dose (Albuterol **2.5 mg**, Atrovent **0.5 mg**, Epi Neb **0.5 mg/kg** max 5 mg).
        - **DuoDote** — safety not established **≤ 40 kg**.
        - **Aspirin / Afrin / Heparin / Nitro** — adult indications; not routine peds.

    - type: "prose"
      title: "{E} EMT Peds Dosing"
      markdown: |
        - Paediatric med math is **not in EMT scope**.
        - EMTs may give the regular **adult dose** for these, at/above the listed age:
          - **Afrin** (oxymetazoline): ≥ 6 y/o
          - **Albuterol** (Ventolin): ≥ 2 y/o
          - **Atrovent** (ipratropium): ≥ 5 y/o
          - **Baqsimi** (glucagon IN): ≥ 1 y/o
          - **Glucagon** (IM): ≥ 5 y/o
          - **Oral Glucose** (Glutose): ≥ 2 y/o
          - **Narcan** (naloxone): ≥ 1 y/o
          - **Tetracaine** (ophthalmic): all ages
          - **Zofran ODT** (ondansetron): ≥ 11 y/o
        - May give an **EpiPen Jr** for 3–8 y/o, or an adult **EpiPen** for ≥ 9 y/o.
        - May give **OTC** doses of Benadryl, Ibuprofen, and Tylenol — follow the directions on the OTC box for age/weight.
          - May **not** give doses labelled "ask (or as directed by) a physician".

