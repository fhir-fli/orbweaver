      layout: "scroll"
      sticky_header: true
      sticky_first_column: true
      zebra: true
      columns: ["Drug", "Dose/kg", "Newborn", "6 mo", "1 yr", "2 yr", "4 yr", "6 yr", "8 yr", "10 yr", "12 yr"]
