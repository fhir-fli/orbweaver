    # ────────────────────────────────────────────────
    - type: "flowchart"
      variant: "severity"

      warnings:
        - type: "caution"
          text: "[Use Caution if Patient Refusal](topic:wvems-2026-109#patient-refusals)"

      entry_chain:
        - text: "Infant Under 1 Month Old (≤30 days)"
