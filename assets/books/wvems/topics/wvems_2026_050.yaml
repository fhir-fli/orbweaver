          population: "peds"

  - page_number: 51
    blocks:

    - type: "prose"
      title: "Neonate Imperatives"
      highlight: true
      markdown: |
        - Most respond to simple stimulation.
          - **Dry off** & place on mom’s chest.
          - Wait 60 sec before clamping cord.
          - Leave 6–10 inches of viable cord.
        - **SpO₂ rises slowly** after birth.
          - Consider a sensor on **right hand**.
        - May **try 30 sec of ventilation** before starting compressions.
          - If **T-piece Resuscitator** is unavailable: use neonatal **[BVM](topic:wvems-2026-096#bvm)**.
          - **EKG** can provide rapid & reliable pulse rate & response.
        - Less common causes of distress: [PTX](topic:wvems-2026-006), [Hypoglycemia](topic:wvems-2026-038), [Shock](topic:wvems-2026-008).

    - type: "row"
      blocks:
        - type: "prose"
          title: "Compressions"
          callout: true
          markdown: |
            - Neonate: **120** /min
            - OPA/NPA: **3 : 1** w/ BVM
            - BIAD: **Continuous**
        - type: "prose"
          title: "BVM Rate"
          callout: true
          markdown: |
            Neonate: **Q 2 sec** (30 /min)

    - type: "row"
      blocks:
        - type: "table"
          title: "APGAR"
          flex: 9
          columns: ["", "2", "1", "0"]
          column_flex: [2, 1, 1, 1]
          rows:
            - cells: ["Appearance", "pink", "blue", "gray"]
            - cells: ["Pulse", "100+", "99-1", "0"]
            - cells: ["Grimace", "good", "poor", "none"]
            - cells: ["Activity", "kicks", "weak", "limp"]
            - cells: ["Respiration", "cry", "gasp", "0"]
        - type: "prose"
          title: "Normal SpO₂"
          flex: 5
          callout: true
          markdown: |
            - 1 min: **60–65%**
            - 2 min: **65–70%**
            - 3 min: **70–75%**
            - 4 min: **75–80%**
            - 5 min: **80–85%**
            - 10 min: **85–95%**

    - type: "prose"
      title: "Notes"
      markdown: |
        - Document **1 and 5 minute APGAR** scores — add up the total points.
        - May place newborn directly on mom’s chest to **keep warm**.
          - Encourage breastfeeding. Place mom & baby **ID bands** if avail.
        - **Meconium suction** is not included in this protocol.
        - Avoid high flow O₂ into a newborn’s eyes.
        - This protocol is for infants under 1 month (≤ 30 days) old only.

    - type: "prose"
      title: "References"
      text_scale: 0.8
      markdown: |
