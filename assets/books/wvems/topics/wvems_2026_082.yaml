  - page_number: 83
    blocks:

    - type: "prose"
      title: "Vasopressors Mandatory Prerequisites"
      highlight: true
      markdown: |
        - In the last 12 months: pass a critical-care in-service training.

    - type: "prose"
      title: "Imperatives"
      markdown: |
        - Anticipate & be ready for **repeat hypotension** if using push dose.
        - Inappropriate use of pressors can **cause harm**.
          - Double check dose calculation (beware multiple concentrations).

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Levophed®](topic:wvems-2026-drug-reference#levophed)** (Norepinephrine): Good for **septic shock**.
          - **Requires a pump** — it is inappropriate to dose by gravity gtt.
        - **[Epi Push](topic:wvems-2026-drug-reference#epi-drip-epi-push)** (Epinephrine): Good for **anaphylactic shock**.
          - Be prepared to repeat dosing; avoid in STEMI.
        - **[Neo Push](topic:wvems-2026-drug-reference#neo-push)** (Phenylephrine): Good for elevated **shock index**.

    - type: "row"
      blocks:
        - type: "prose"
          title: "Shock Index"
          callout: true
          markdown: |
            SI = **Pulse / SBP**
        - type: "prose"
          title: "Poor Perfusion"
          callout: true
          markdown: |
            Suspect if **several** of these:
            - **Altered Mental Status**
            - Skin Pale, Cool, Diaphoretic
            - Tachycardia, Hypotension
            - Dyspnea, Tachypnea

    - type: "prose"
      title: "Notes"
      markdown: |
        - **Shock Index** is a good predictor of hypotension from RSI.
          - Be ready with push dose pressors if **Shock Index is above 0.8**.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.
        - Titrate to age-adjusted BP (vitals also listed in [Peds Reference](topic:wvems-2026-144)).

