  - page_number: 47
    blocks:

    - type: "prose"
      title: "Behavioral Imperatives"
      highlight: true
      markdown: |
        - **Do not assume** psychosis. Evaluate and treat for other causes.
        - Behavioral patients may not have the [capacity to refuse](topic:wvems-2026-109#patient-refusals).
          - Involve Police and call **Medical Control** for any SI / HI refusal.
        - Use of any restraint presents significant medical (and legal) risk.
          - **Attempt de-escalation first**. Restraint should be a **last resort**.
          - Use **only to ensure safety** of patient and providers.
          - Use only when risk of harm is greater than risk of restraint.
          - Peds, elderly or frail patients are **unlikely** to need restraint.
        - Physical restraint should only be used in conjunction **with Police**.
          - **Ask for Police** help if the patient is physically combative.
          - Beware any physical or verbal threats, aggression, or agitation.
          - Never use hobble restraints. Never restrain a patient prone.
        - **Use caution with needles** - increased risk of provider injury.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Versed®](topic:wvems-2026-drug-reference#versed)** (Midazolam): Use with caution with peds and elderly.
          - Start lower if IV and/or smaller patient. Total dose: **10 mg max**.
        - **[Haldol®](topic:wvems-2026-drug-reference#haldol)** (Haloperidol): Requires transport and **ALS** monitoring.
          - May potentiate dystonic muscle jerking & spasms (not seizure).
          - Consider treatment with **[Benadryl](topic:wvems-2026-drug-reference#benadryl)** if spasms are severe.
          - {I} **[Benadryl®](topic:wvems-2026-drug-reference#benadryl)** (diphenhydramine): 25 mg PO, IV/IO, IM x1

    - type: "prose"
      title: "Notes"
      markdown: |
        - SI / HI: Suicidal or Homicidal Ideation (any recent thoughts or acts)

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.
          - {I} **[Versed](topic:wvems-2026-drug-reference#versed)**: max peds dose is Q 2 min **x4 doses**

