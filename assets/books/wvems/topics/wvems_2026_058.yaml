  - page_number: 59
    blocks:

    - type: "prose"
      title: "Bleeding Imperatives"
      highlight: true
      markdown: |
        - Advance to a **[Tourniquet](topic:wvems-2026-096#tourniquet) rapidly** for any major arm / leg bleeding.
          - Write the time of **[Tourniquet](topic:wvems-2026-096#tourniquet)** application on the patient.
        - **[Packing](topic:wvems-2026-096#wound-packing)** may also help (especially junctional bleeds). **Do not** pack:
          - Unstable, depressed or open skull fractures; chest wounds.
          - Bleeding from body orifices: vagina, rectum, ear, mouth, etc.

    - type: "row"
      blocks:
        - type: "prose"
          flex: 6
          title: "TRAUMA Alert"
          callout: true
          dashed: true
          call_er: true
          markdown: |
            - If Major Intervention
            - Or Major Mechanism
            - Call a **TRAUMA** Alert
        - type: "prose"
          flex: 5
          title: "Poor Perfusion"
          callout: true
          markdown: |
            Suspect if **several** of these:
            - **Altered Mental Status**
            - Skin Pale, Cool, Diaphoretic
            - Tachycardia, Hypotension
            - Dyspnea, Tachypnea

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[TXA](topic:wvems-2026-drug-reference#txa)** (Tranexamic Acid): Avoid if injury 3+ hours old or known PE.
          - Use for any major **external traumatic bleeding**.
          - Use for suspected **intra-abd / thorax bleed** w/ poor perfusion.
          - May also use for severe [postpartum](topic:wvems-2026-048) (non-traumatic) bleeding.
          - Avoid for other forms of suspected internal or medical bleeding.

    - type: "prose"
      title: "Notes"
      markdown: |
        - [Anticoagulation](topic:wvems-2026-076) meds (**blood thinners**) increase bleeding risk.
        - Consider removing bystander dressings to investigate severity.
        - **[Bandage wounds](topic:wvems-2026-096#wound-care)** after bleeding is controlled.

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Consider [Blood](topic:wvems-2026-084) if indicated and credentialed for Critical Care.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Hypotension is a late sign of hemorrhagic [Shock](topic:wvems-2026-008) in peds.
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.

