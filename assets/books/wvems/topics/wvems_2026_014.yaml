  - page_number: 15
    blocks:

    - type: "prose"
      title: "Tachycardia Imperatives"
      highlight: true
      markdown: |
        - **Simple Tachycardias** (e.g. Sinus Tach) occur for many reasons.
          - **Reactive** causes like: [Shock](topic:wvems-2025-008), [Pain](topic:wvems-2026-020), [Fever](topic:wvems-2026-016), [Bleeding](topic:wvems-2026-058).
          - **Hidden** causes like: [OD / Tox](topic:wvems-2026-040), [Behavioral](topic:wvems-2026-046), [Anaphylaxis](topic:wvems-2026-032).
          - **Cardiac** causes like: SSS, A-Flutter, A-Fib w/ RVR.
        - Treat the **underlying cause** before targeting the rate itself.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **Adenosine** (Adenocard®): only for narrow-complex SVT (QRS ≤ 120 ms).
          - Push fast through a proximal IV with saline flush.
          - Warn the patient about the brief sense of impending doom.
        - **[Amiodarone](topic:wvems-2026-drug-reference#amiodarone)** (Pacerone®): for wide-complex tachycardia (QRS > 120 ms).
          - Give over **10 min** for stable patients.
        - **Magnesium** (Sulfate): for **Torsades** (polymorphic VT).
        - **NS Bolus**: useful in shock states or rate from hypovolemia.

    - type: "prose"
      title: "Notes"
      markdown: |
        - Synchronized **Cardioversion** for unstable patients with a pulse.
          - Sedate first if time and patient stability allow.
        - Reassess rate and rhythm after every intervention.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Use **PALS** rate thresholds and weight-based dosing.
        - Vagal manoeuvres (ice to face) may convert SVT in stable peds.

