  # Sticky: flowchart page + prose page each snap to a full screen.
  layout: "paged"

  pages:

  - page_number: 14
    blocks:

    # ────────────────────────────────────────────────
    # Flowchart block (severity variant — 3 branches)
    # Conditional meds: Adenosine, Amio, Magnesium each gated by criteria
    # ────────────────────────────────────────────────
    - type: "flowchart"
      variant: "severity"

      entry:
        text: "Pulse Over"
        shape: "stadium"
        bands:
          - label: "Adult (14+)"
            value: "100 /min"
          - label: "Child (1–13)"
            value: "130 /min"
          - label: "Infant (< 1)"
            value: "160 /min"


      decision:
        text: "Severity?"
        shape: "diamond"

      branches:

        - id: "mild"
          label: "Mild"
          criteria:
            - "Adequate Perfusion"
            - "Simple Tachycardia"
          actions:
            - provider_level: "E"
              text: "12-Lead"
              kind: "diagnostic"
            - provider_level: "A"
              text: "NS Bolus"
              kind: "medication_administration"

        - id: "moderate"
          label: "Moderate"
          criteria:
            - "Adequate Perfusion"
            - "Critical Arrhythmia"
          actions:
            - provider_level: "E"
              text: "12-Lead"
              kind: "diagnostic"
            - provider_level: "A"
              text: "NS Bolus"
              kind: "medication_administration"
            - provider_level: "I"
              text: "Adenosine"
              kind: "medication_administration"
              condition: "If QRS ≤ 120 ms"
            - provider_level: "I"
              text: "Amio"
              kind: "medication_administration"
              condition: "If QRS > 120 ms"

        - id: "severe"
          label: "Severe"
          criteria:
            - "Poor Perfusion"
            - "Critical Arrhythmia"
          actions:
            - provider_level: "I"
              text: "Cardiovert"
              kind: "procedure"
            - provider_level: "E"
              text: "12-Lead"
              kind: "diagnostic"
            - provider_level: "I"
              text: "Magnesium"
              kind: "medication_administration"
              condition: "If Torsades"
            - provider_level: "A"
              text: "NS Bolus"
              kind: "medication_administration"

      convergence:
        text: "Consider"
        shape: "stadium"
        bullets:
          - text: "[Circulation](topic:wvems-2026-008), [Pain](topic:wvems-2026-020)"
          - text: "[Fever](topic:wvems-2026-016), [Bleeding](topic:wvems-2026-058)"

      dose_table:
        - drug: "[NS Bolus](topic:wvems-2026-drug-reference#ns-bolus)"
          dose: "500 mL"
          route: "IV/IO"
          frequency: "x4"
          population: "adult"
        - drug: "[Adenosine](topic:wvems-2026-drug-reference#adenosine)"
          dose: "12 mg"
          route: "IV/IO"
          frequency: "Q 5 min x2"
          population: "adult"
        - drug: "[Amiodarone](topic:wvems-2026-drug-reference#amiodarone)"
          dose: "150 mg"
          route: "IV/IO"
          frequency: "over 10 min"
          population: "adult"
        - drug: "[Magnesium](topic:wvems-2026-drug-reference#magnesium)"
          dose: "2 grams"
          route: "IV/IO"
          frequency: "x1"
          population: "adult"

  - page_number: 15
    blocks:

    - type: "prose"
      title: "Tachycardia Imperatives"
      highlight: true
      markdown: |
        - **Simple Tachycardias** (e.g. Sinus Tach) occur for many reasons.
          - Reactive causes like: [Shock](topic:wvems-2026-008), [Pain](topic:wvems-2026-020), [Fever](topic:wvems-2026-016) or [Bleeding](topic:wvems-2026-058), etc.
          - Hidden causes like: [OD / Tox](topic:wvems-2026-040), [Behavioral](topic:wvems-2026-046) or [Anaphylaxis](topic:wvems-2026-032), etc.
          - Cardiac causes like: SSS, A-Flutter or A-Fib w/ RVR, etc.
          - Treat the cause. Avoid anti-arrhythmics or cardioversion.
        - **Critical Arrhythmias** (e.g. SVT, V-Tach w/pulse) are usually **faster**.
          - But a fast pulse is not always critical. Judgement is necessary.
          - {I} May try vagal maneuvers (e.g. modified valsalva).

    - type: "row"
      blocks:
        - type: "prose"
          title: "Critical Arrhythmia"
          callout: true
          markdown: |
            Suspect if pulse over:
            - Adult (14+): **150** /min
            - Child (1–13): **180** /min
            - Infant (< 1): **220** /min
        - type: "prose"
          title: "Poor Perfusion"
          callout: true
          markdown: |
            Suspect if **several** of these:
            - **Altered Mental Status**
            - Skin Pale, Cool, Diaphoretic
            - Tachycardia, Hypotension
            - Dyspnea, Tachypnea

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Adenosine](topic:wvems-2026-drug-reference#adenosine)** (Adenocard®): Give **rapid IV push**.
          - Use caution in patients with a history of WPW, COPD or asthma.
        - **[Amiodarone](topic:wvems-2026-drug-reference#amiodarone)** (Pacerone®): Give **over 10 min** IV drip.

    - type: "band_callout"
      band: "peds"
      title: ""
      markdown: |
        - Prehospital **Amio** is **not indicated** for pediatric tachycardia.

    - type: "prose"
      title: "Notes"
      markdown: |
        - Consider placing cardioversion (defib) **pads** on any unstable pt.
        - **[Cardiovert](topic:wvems-2026-096#cardiovert)**: Enable **SYNC**. Start at **200 J**. Defib if unable to SYNC.
          - Alternative: follow manufacturer’s or OMD’s dosing guidance.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.

