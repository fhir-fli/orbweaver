  # Sticky: flowchart page + prose page each snap to a full screen.
  layout: "paged"

  pages:

  - page_number: 86
    blocks:

    # ────────────────────────────────────────────────
    # Flowchart block (severity variant — 2 branches by GCS)
    # ────────────────────────────────────────────────
    - type: "flowchart"
      variant: "severity"

      entry_chain:
        - text: "Significant Traumatic Brain Injury"
          shape: "stadium"

      decision:
        text: "GCS?"
        shape: "diamond"

      branches:

        - id: "high_gcs"
          label: "8 or above"
          criteria:
            - "Headache, Dazed"
            - "Awake & Confused"
          actions:
            - text: "Treat as [Head Injury](topic:wvems-2026-062)"
              kind: "referral"

        - id: "low_gcs"
          label: "7 or less"
          criteria:
            - "One Pupil Dilated"
            - "Cushing’s Triad"
          actions:
            - provider_level: "P(CC)"
              text: "3% Saline"
              kind: "medication_administration"
            - provider_level: "P(CC)"
              text: "Keppra"
              kind: "medication_administration"

      convergence:
        text: "Consider"
        shape: "stadium"
        warnings:
          - type: "caution"
            text: "[Consider Destination Triage](topic:wvems-2026-109#destination-triage)"
        bullets:
          - text: "[Major Trauma](topic:wvems-2026-056)"
          - text: "[Altered LOC](topic:wvems-2026-036), [Seizure](topic:wvems-2026-042)"
          - text: "[Intubation](topic:wvems-2026-078)"

      critical_care_link:
        text: "[Intubation](topic:wvems-2026-078)"

      dose_table:
        - drug: "[3% Saline](topic:wvems-2026-drug-reference#3-saline)"
          dose: "250 mL"
          route: "IV/IO"
          frequency: "over 10 min"
          population: "adult"
        - drug: "[Keppra](topic:wvems-2026-drug-reference#keppra)"
          dose: "3,000 mg"
          route: "IV/IO"
          frequency: "over 10 min"
          population: "adult"

  - page_number: 87
    blocks:

    - type: "prose"
      title: "Elevated ICP Mandatory Prerequisites"
      highlight: true
      markdown: |
        - In the last 12 months: pass a critical-care in-service training.
        - Prioritize emergent transport to a Level 1 or 2 trauma center.

    - type: "prose"
      title: "Imperatives"
      markdown: |
        - Critical to avoid [Hypoxia](topic:wvems-2026-006) and [Hypotension](topic:wvems-2026-008). Treat aggressively.
          - Target **SBP > 110 mmHg** and **SpO₂ 96–99%** and **EtCO₂ 35–45 mmHg**.
        - Use cot to **sit patient up at 30°** if lower spine injury unlikely.
        - One dilated pupil suggests herniation. Bilateral dilation is ominous.

    - type: "row"
      blocks:
        - type: "prose"
          title: "Cushing’s Triad"
          callout: true
          markdown: |
            - Hypertension
            - Bradycardia
            - Irregular Resps
        - type: "table"
          title: "Glasgow Coma Scale"
          columns: ["Eyes", "Verbal", "Motor", ""]
          column_flex: [3, 3, 3, 1]
          rows:
            - cells: ["none", "none", "none", "1"]
            - cells: ["pain", "moaning", "extensor", "2"]
            - cells: ["verbal", "words", "flexor", "3"]
            - cells: ["normal", "confused", "withdraw", "4"]
            - cells: ["", "normal", "localizes", "5"]
            - cells: ["", "", "normal", "6"]

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[3% Saline](topic:wvems-2026-drug-reference#3-saline)** (Hypertonic): **Inform the ED** after use.
        - **[Keppra®](topic:wvems-2026-drug-reference#keppra)** (Levetiracetam): May give even before any [seizures](topic:wvems-2026-042).

    - type: "prose"
      title: "Notes"
      markdown: |
        - [Seizures](topic:wvems-2026-042), [Pain](topic:wvems-2026-020), [Vomiting](topic:wvems-2026-022), [Agitation](topic:wvems-2026-046) and [Fever](topic:wvems-2026-016) can all increase ICP.
          - Consider symptomatic treatment but **do not delay transport**.
        - Steroids, **TXA**, and/or hyperventilation are **not indicated**.
        - Increased risk of intracranial hemorrhage if any [anti-coagulation](topic:wvems-2026-076).

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.
        - Target **upper end** of age-adjusted SBP (also in [Peds Reference](topic:wvems-2026-144)).

    - type: "prose"
      title: "References"
      text_scale: 0.8
      markdown: |
        - Medscape Head Injury — https://emedicine.medscape.com/article/251834 [Ver: 5/22]
        - ACS TBI Guidelines — https://www.facs.org/search?searchTerm=TBI+Guideline [Ver: 2020]
        - Limmer D, O’Keefe MF. **Emergency Care** 15th ed. Chapter 33, 34

        NEMSIS: 9914101, 9914105
