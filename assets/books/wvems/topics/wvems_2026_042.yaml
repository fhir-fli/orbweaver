    - type: "prose"
      title: "Seizure Imperatives"
      highlight: true
      markdown: |
        - Active convulsions with **Altered LOC** should be treated promptly.
          - Meds are **contraindicated without active convulsions**.
          - Aggressively treat seizures due to **alcohol or benzo withdrawal**.
        - Shaking while awake and responsive is unlikely to be a seizure.
          - Consider other causes such as [Behavioral](topic:wvems-2026-046) or **OD / Tox**.
          - Non-epileptic pseudoseizures do not require EMS intervention.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **Versed®** (Midazolam): only appropriate for active convulsions.
          - Start lower if IV and/or smaller patient. Total dose: **10 mg max**.
          - Use caution with IM — increased risk of provider injury.
        - **Keppra®** (Levetiracetam): second line if seizures continue.
          - Use weight-based peds dosing for adults under 110 lbs (50 kg).
        - **Magnesium** (Sulfate): may cause **Hypotension** and [Dyspnea](topic:wvems-2026-030).
          - Only useful for seizures in late **Pregnancy** (20 weeks & over).
          - Do **not** provide in early pregnancy. Eclampsia is unlikely.
          - Consider **Preeclampsia** if indicated and credentialed for CC.

    - type: "prose"
      title: "Notes"
      markdown: |
        - Obtain details of patient's seizure meds if immediately available.
        - Seizures can come in groups — **be prepared to treat another seizure**.
        - Confusion after seizure is common and may last over 30 min.
          - Transient stroke-like paralysis is also possible but is **not a CVA**.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Peds under 5 y/o may have a seizure caused by [Fever](topic:wvems-2026-016).
          - It is usually self-limiting; consider meds if **>5 min** or multiple.
          - Aggressively treat any peds seizure not associated with Fever.
        - Use **Peds Reference** or other approved source for peds dosing.
          - **A** Versed: max peds dose is **Q 2 min x4 doses**.

    - type: "prose"
      title: "References"
