  - page_number: 77
    blocks:

    - type: "prose"
      title: "Epistaxis Imperatives"
      highlight: true
      markdown: |
        - Have the patient lean forward & **squeeze soft part of nose** firmly.
        - **If still bleeding** — instruct patient to blow clots out before meds.
        - Apply meds **into affected nostril** and squeeze nose firmly again.
        - **May repeat doses** of meds in other nostril if bleeding continues.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Afrin®](topic:wvems-2026-drug-reference#afrin)** (Oxymetazoline): Do not use if any cardiac [chest pain](topic:wvems-2026-028).
        - **[TXA](topic:wvems-2026-drug-reference#txa)** (Tranexamic Acid): Use **atomizer**. Avoid if known PE or DVT.

    - type: "prose"
      title: "Notes"
      markdown: |
        - Not all nose bleeds are traumatic. The treatment is the same.
        - Check pharynx for possible **posterior bleeding**.
          - Bleeding may be **significant**.
          - More common in the elderly.
          - Anticoagulants increase risk.
          - Be ready to treat for [shock](topic:wvems-2026-008).
        - Anticoagulants (**blood thinners**) also increase risk in:
          - [Major Trauma](topic:wvems-2026-056)
          - [Bleeding](topic:wvems-2026-058)
          - [Head Injury](topic:wvems-2026-062)

    # NOT converted to a `row`, deliberately. Print p.77 does set the Anticoag
    # Meds box beside these bullets, but measured at 393x852 the row costs
    # +126 px and drops the page’s fit scale from 0.74 to 0.70: nine drug names
    # up to 22 chars wrap once the box is confined to a slot. See
    # tool/wvems_sidebyside_audit.md.
    - type: "prose"
      title: "Anticoag Meds"
      callout: true
      markdown: |
        - Aspirin (ASA)
        - Coumadin® (Warfarin)
        - Eliquis® (Apixaban)
        - Plavix® (Clopidogrel)
        - Xarelto® (Rivaroxaban)
        - Effient® (Prasugrel)
        - Pradaxa® (Dabigatran)
        - Brilinta® (Ticagrelor)
        - Lovenox® (Enoxaparin)

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Nose bleeds are usually from minor trauma (nose picking).
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.

