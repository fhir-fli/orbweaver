  - page_number: 69
    blocks:

    - type: "prose"
      title: "Cold / Heat Imperatives"
      highlight: true
      markdown: |
        - **Hyperthermia** is **not** the same as a [Fever](topic:wvems-2026-016) from infection.
          - Meds for [Fever](topic:wvems-2026-016) worsen **hyperthermia** and are contraindicated.
        - **Confusion** is the hallmark of major **hyperthermic** emergencies.
          - Aggressively & actively cool anyone that is **hot & confused**.
          - {A} If shivering from active cooling: **[Versed®](topic:wvems-2026-drug-reference#versed)** 2.5 mg IV/IO x1.
        - **Resuscitation** of major **hypothermia** is a special case:
          - Most important intervention is **active rewarming**.
          - Check carefully for pulse. If present, it will be **very faint**.
          - Provide **defib** and **ACLS meds** as per normal [Medical Code](topic:wvems-2026-024).
          - Call **Medical Control** before termination of resuscitation.
        - **Pad** heat & ice packs. Do not place directly against the skin.

    - type: "prose"
      title: "Notes"
      markdown: |
        - **Passive techniques** include clothing and environment changes.
        - Special thermometers or **core temp** monitors may be helpful:
          - Major **hyper**thermia is likely above 104°F (40°C).
          - Major **hypo**thermia is likely below 88°F (30°C).
        - Some drugs may also cause **hyperthermia**. Treatment is the same.
        - Excessive movement of **hypothermic** patients can cause **V-Fib**.
        - Splint any extremity with **frostbite** to limit movement (do not rub).
          - Delay rewarming **frostbite** if there is potential for re-freezing.
        - {E} **[Ibuprofen](topic:wvems-2026-drug-reference#ibuprofen)** (Motrin®): Give 600 mg PO x1 for **frostbite**.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Small children (and the elderly/frail) will decompensate faster.
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.

