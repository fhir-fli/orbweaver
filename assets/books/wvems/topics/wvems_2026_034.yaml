    - type: "prose"
      title: "Abdominal Pain Imperatives"
      highlight: true
      markdown: |
        - This protocol is for **medical** causes of abdominal pain.
          - For traumatic abdominal pain, refer to **Trunk Injury**.
        - Prepare for **Hypotension** if any reported blood loss, or suspected:
          - **AAA**: Midline "pulsatile mass" in the elderly
          - **GI Bleeding**: Black stool (melena) or "coffee ground" emesis
        - Inquire about **Pregnancy** and consider complications.
          - Consider **ectopic** in any pregnant female, watch for **shock**.
        - **Avoid oral** food and fluids. (Oral meds are OK.)
          - Keep patients **NPO** (**Nil Per Os**: Lat. "nothing through the mouth")

    - type: "prose"
      title: "Notes"
      markdown: |
        - Consider an atypical **Cardiac** cause in diabetics and the elderly.
        - Many common causes do not require specific EMS intervention.
          - E.g. gastroenteritis, gallbladder, appendix, colitis, SBO, etc.
          - Do consider treatment of the symptoms: **Fever**, **Pain**, **Nausea**
        - Consider **Sepsis** if indicated and credentialed for Critical Care.

    - type: "prose"
      title: "Pediatrics"
      highlight: true
      markdown: |
        - Simple constipation is a common cause in peds.
          - It does not require aggressive EMS intervention.

    - type: "prose"
      title: "References"
