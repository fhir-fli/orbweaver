    # Prose blocks (notes page)
    # ────────────────────────────────────────────────

    - type: "prose"
      title: "Pain Imperatives"
      highlight: true
      markdown: |
        - EMS pain control is indicated for **recent injury** or **sudden pain** like:
          - Major trauma, obvious fractures, acute abdominal or chest pain
        - Pain meds (even PO) are **beneficial despite short transport times**.
        - Use **weight-based peds dosing** for small adults under 110 lbs (50 kg).

    - type: "prose"
      title: "Medications"
      markdown: |
        - **Tylenol®** (Acetaminophen): avoid if end-stage liver disease.
          - **E** may only give PO — use OTC tabs, caps, powder, or liquid.
          - **A** may give PO or IV/IO — for IV/IO, give slowly over 10 min.
        - **Ibuprofen** (Advil®, Motrin®): avoid if active GI bleeding.
        - **Toradol®** (Ketorolac): avoid if active GI bleeding.
        - **Fentanyl** (Sublimaze®): use judgement, target **0.5–1 mcg/kg**.
          - Start lower (50 mcg) for narcotic-naive and/or smaller patients.
        - **Ketamine** (Ketalar®):
          - IM/IN use: give as undiluted bolus.
          - IV/IO use: dilute in NS and give slowly over 10 min.
        - May give eye drops for abrasions or welder's flash (UV keratitis):
          - **E** Tetracaine (0.5 % Ophthalmic) — 1–2 gtt into affected eye.

    - type: "prose"
      title: "Notes"
      markdown: |
        - Tylenol and Ibuprofen are good for **sub-acute pain** like:
          - Toothache, headache (migraine), sciatica, fibromyalgia, etc.
          - Avoid **Fentanyl** and **Ketamine** for sub-acute pain.
        - Pain is subjective. May try another medication if pain continues.
          - Do **not** use Toradol with Ibuprofen (choose one or the other).
        - Max daily dose: **Tylenol 3,000 mg** · **Ibuprofen 2,400 mg**.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        Use **Peds Reference** or other approved source for peds dosing.

    - type: "prose"
      title: "References"
      markdown: |
        - EBG for Prehospital Pain — https://pubmed.ncbi.nlm.nih.gov/34928760/ [Ver: 1/22]
        - Medscape Pain — https://emedicine.medscape.com/article/310834 [Ver: 7/24]
        - Limmer D, O'Keefe MF. Emergency Care 15th ed. Chapter 14, 16.

