  - page_number: 21
    blocks:

    # ────────────────────────────────────────────────
    # Prose blocks (notes page)
    # ────────────────────────────────────────────────

    - type: "prose"
      title: "Pain Imperatives"
      highlight: true
      markdown: |
        - EMS pain control is indicated for **recent injury** or **sudden pain** like:
          - [Major trauma](topic:wvems-2026-056), obvious [fractures](topic:wvems-2026-066), acute [abdominal](topic:wvems-2026-034) or [chest pain](topic:wvems-2026-028)
        - Pain meds (even PO) are **beneficial despite short transport times**.
        - Use [weight-based peds dosing](topic:wvems-2026-144) for small adults under 110 lbs (50 kg).

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Tylenol®](topic:wvems-2026-drug-reference#tylenol)** (Acetaminophen): avoid if end-stage liver disease.
          - {E} may only give PO — use OTC tabs, caps, powder, or liquid.
          - {A} may give PO or IV/IO — for IV/IO, give slowly over 10 min.
        - **[Ibuprofen](topic:wvems-2026-drug-reference#ibuprofen)** (Advil®, Motrin®): avoid if active GI bleeding.
        - **[Toradol®](topic:wvems-2026-drug-reference#toradol)** (Ketorolac): avoid if active GI bleeding.
        - **[Fentanyl](topic:wvems-2026-drug-reference#fentanyl)** (Sublimaze®): use judgement, target **0.5–1 mcg/kg**.
          - Start lower (50 mcg) for narcotic-naive and/or smaller patients.
        - **[Ketamine](topic:wvems-2026-drug-reference#ketamine)** (Ketalar®):
          - IM/IN use: give as undiluted bolus.
          - IV/IO use: dilute in NS and give slowly over 10 min.
        - May give eye drops for abrasions or welder’s flash (UV keratitis):
          - {E} **[Tetracaine](topic:wvems-2026-drug-reference#tetracaine)** (0.5 % Ophthalmic) — 1–2 gtt into affected eye.

    - type: "prose"
      title: "Notes"
      markdown: |
        - Tylenol and Ibuprofen are good for **sub-acute pain** like:
          - Toothache, headache (migraine), sciatica, fibromyalgia, etc.
          - Avoid **Fentanyl** and **Ketamine** for sub-acute pain.
        - Pain is subjective. May try another medication if pain continues.
          - Do **not** use Toradol with Ibuprofen (choose one or the other).
        - Max daily dose: **[Tylenol](topic:wvems-2026-drug-reference#tylenol) 3,000 mg** · **Ibuprofen 2,400 mg**.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.

