  - page_number: 89
    blocks:

    - type: "prose"
      title: "STEMI Mandatory Prerequisites"
      highlight: true
      markdown: |
        - In the last 12 months: pass a critical-care in-service training.

    - type: "prose"
      title: "Imperatives"
      markdown: |
        - Don’t forget [the basics](topic:wvems-2026-028): **O₂**, **ASA** & **Nitro**. Start **IV in left hand**.
        - Perform **15-Lead EKG** if: inferior STEMI or septal ST depressions.
          - ST elevation in V4R is right sided MI — **Nitro** may cause [shock](topic:wvems-2026-008).
          - ST elevations in V8 and V9 indicates a **posterior STEMI**.
        - If V-pace or LBBB: any of **Sgarbossa’s** criteria suggests a STEMI.

    - type: "row"
      blocks:
        - type: "prose"
          flex: 6
          title: "STEMI Alert"
          callout: true
          dashed: true
          call_er: true
          markdown: |
            - If **V-pace** or **LBBB**
            - w/ any **Sgarbossa**
            - Call a **STEMI** Alert
        - type: "prose"
          flex: 5
          title: "Sgarbossa’s (modified)"
          callout: true
          markdown: |
            - **+ST** > 25% of QRS size (any lead)
            - **+ST** with **+QRS** (concordant)
            - **−ST** with **−QRS** in V1, V2 or V3

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Heparin](topic:wvems-2026-drug-reference#heparin)** (Sodium): Verify dose/concentration, give slow IV push.
          - Avoid if any suspected life-threatening bleeding (UGIB, ICH, etc.).

    - type: "prose"
      title: "Notes"
      markdown: |
        - Notify ED **ASAP**. Prepare to **go straight to cath lab** if time allows.
          - **Shave** from belt to knees, place **defib pads**, change into a gown.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - May have early repolarization on EKG that mimics ST elevations.
          - But early repolarization **does not require** EMS intervention.
        - True STEMI is very unlikely in peds — search for alternate causes.

    - type: "prose"
      title: "References"
