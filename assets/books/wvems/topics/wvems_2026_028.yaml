  - page_number: 29
    blocks:

    - type: "prose"
      title: "Chest Pain Imperatives"
      highlight: true
      markdown: |
        - This protocol is for suspected **cardiac (ACS)** emergencies only.
          - For pain resulting from chest trauma, refer to [Trunk Injury](topic:wvems-2026-064).
          - For palpitations refer to [Tachycardia](topic:wvems-2026-014) or [Bradycardia](topic:wvems-2026-012).
        - For all patients with an identified [STEMI](topic:wvems-2026-088): place defib pads on.
          - Also expose and shave groin during transport if time allows.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Aspirin](topic:wvems-2026-drug-reference#aspirin)** (Baby ASA): contraindicated with active GI bleeding.
          - Have patient chew **four (4) 81 mg** tabs (not enteric coated).
        - **[Nitro](topic:wvems-2026-drug-reference#nitro-nitro-drip)** (Nitroglycerin): may cause [Hypotension](topic:wvems-2026-008).
          - Hold for SBP < 100 mmHg or HR < 50 / > 100.
          - Do **not** give within 24 h of PDE5 inhibitors (sildenafil, etc).

    - type: "prose"
      title: "PDE5 Inhibitors"
      callout: true
      markdown: |
        - Sildenafil (Viagra®)
        - Tadalafil (Cialis®)
        - Vardenafil (Levitra®)
        - Avanafil (Stendra®)

    - type: "prose"
      title: "STEMI Alert"
      callout: true
      dashed: true
      call_er: true
      markdown: |
        - If you see a [STEMI](topic:wvems-2026-088)
        - Or EKG says \*\***AMI**\*\*
        - Call a **STEMI** Alert

    - type: "prose"
      title: "Notes"
      markdown: |
        - 12-Lead within **10 min** of patient contact when feasible.
        - Transmit STEMI ECG to the receiving facility before arrival if possible.
        - Atypical presentations are common in **diabetics**, **women**, and the **elderly**.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Cardiac chest pain is uncommon in peds — investigate other causes
          (musculoskeletal, anxiety, GERD, costochondritis).

    - type: "prose"
      title: "References"
      text_scale: 0.8
