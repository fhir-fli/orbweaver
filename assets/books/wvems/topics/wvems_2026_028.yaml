  - page_number: 29
    blocks:

    - type: "prose"
      title: "Chest Pain Imperatives"
      highlight: true
      markdown: |
        - This protocol is for suspected **cardiac (ACS)** emergencies only.
          - For pain resulting from chest trauma, refer to **Trunk Injury**.
          - For palpitations refer to **Tachycardia** or **Bradycardia**.
        - For all patients with an identified **STEMI**: place defib pads on.
          - Also expose and shave groin during transport if time allows.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **Aspirin** (Baby ASA): contraindicated with active GI bleeding.
          - Have patient chew **four (4) 81 mg** tabs (not enteric coated).
        - **Nitro** (Nitroglycerin): may cause **Hypotension**.
          - Hold for SBP < 100 mmHg or HR < 50 / > 100.
          - Do **not** give within 24 h of PDE5 inhibitors (sildenafil, etc).

    - type: "prose"
      title: "Notes"
      markdown: |
        - 12-Lead within **10 min** of patient contact when feasible.
        - Transmit STEMI ECG to the receiving facility before arrival if possible.
        - Atypical presentations are common in **diabetics**, **women**, and the **elderly**.

    - type: "prose"
      title: "Pediatrics"
      highlight: true
      markdown: |
        - Cardiac chest pain is uncommon in peds — investigate other causes
          (musculoskeletal, anxiety, GERD, costochondritis).

    - type: "prose"
      title: "References"
      markdown: |
