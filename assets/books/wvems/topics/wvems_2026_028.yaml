  - page_number: 29
    blocks:

    - type: "prose"
      title: "Chest Pain Imperatives"
      highlight: true
      markdown: |
        - This protocol is for suspected **cardiac** (ACS) emergencies only.
          - For pain resulting from chest trauma, refer to [Trunk Injury](topic:wvems-2026-064).
          - For palpitations refer to [Tachycardia](topic:wvems-2026-014) or [Bradycardia](topic:wvems-2026-012).
        - For all patients with an identified **STEMI**: place **defib pads** on.
          - Also expose and shave groin during transport if time allows.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Aspirin](topic:wvems-2026-drug-reference#aspirin)** (Baby ASA): Contraindicated with **active** GI bleeding
          - Have patient **chew four** (4) 81 mg tabs (not enteric coated).
        - **[Nitro](topic:wvems-2026-drug-reference#nitro-nitro-drip)** (Nitroglycerin): May cause [Hypotension](topic:wvems-2026-008).
          - Use caution if [Hypotensive](topic:wvems-2026-008) or suspected inferior/right STEMI.
          - Contraindicated if SBP under 110 mmHg **without IV/IO** access.
          - Contraindicated if recent (36 h) use of any **PDE5 inhibitors**:

    - type: "row"
      blocks:
        - type: "prose"
          flex: 6
          title: "STEMI Alert"
          callout: true
          dashed: true
          call_er: true
          markdown: |
            - If you see a [STEMI](topic:wvems-2026-088)
            - Or EKG says \*\***AMI**\*\*
            - Call a **STEMI** Alert
        - type: "prose"
          flex: 5
          title: "PDE5 Inhibitors"
          callout: true
          markdown: |
            - Sildenafil (Viagra®)
            - Tadalafil (Cialis®)
            - Vardenafil (Levitra®)
            - Avanafil (Stendra®)

    - type: "prose"
      title: "Notes"
      markdown: |
        - Consider an atypical cardiac presentation in **diabetics** & **elderly**.
          - Actual chest pain is not always present. Ask about cardiac hx.
          - May have SOB or "discomfort" or nausea or be weak & sweaty.

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Consider advanced [STEMI](topic:wvems-2026-088) care if indicated & credentialed for CC.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Cardiac chest pain is unlikely in peds. Consider other causes.
        - **[Aspirin](topic:wvems-2026-drug-reference#aspirin)** and **[Nitro](topic:wvems-2026-drug-reference#nitro-nitro-drip)** are contraindicated in peds chest pain.

