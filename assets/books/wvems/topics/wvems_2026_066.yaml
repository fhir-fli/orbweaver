  - page_number: 67
    blocks:

    - type: "prose"
      title: "Extremity Injury Imperatives"
      highlight: true
      markdown: |
        - Advance to a **[Tourniquet](topic:wvems-2026-096#tourniquet) rapidly** for any major arm / leg bleeding.
          - Write the time of **[Tourniquet](topic:wvems-2026-096#tourniquet)** application on the patient.
        - **Pulseless extremities** and **amputations** are true emergencies.
          - Record time of injury. Reduce any deformity. Transport ASAP.
          - Wrap amputated parts in saline gauze and place in a sealed bag.
          - Place bag on ice if available. Record time placed on ice.
        - Beware [Hyperkalemia](topic:wvems-2026-018) in any **limb crush** or **suspension** injury.
          - Limb crush: may start tx (if rapidly available) before release.
          - **Harness hang**: immediately extricate & place supine.
        - **Lacerations** benefit from repair within the first few hours.
        - **Mechanism** is an important indicator of injury severity.

    - type: "prose"
      title: "TRAUMA Alert"
      callout: true
      dashed: true
      call_er: true
      markdown: |
        - If Major Intervention
        - Or Major Mechanism
        - Call a **TRAUMA** Alert

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Ancef®](topic:wvems-2026-drug-reference#ancef)** (Cefazolin): Provide if an **open fracture** is suspected.
          - Monitor closely if PCN allergy; avoid if cephalosporin allergy.
          - Reconstitute powder with normal saline and **shake well** to mix.

    - type: "prose"
      title: "Notes"
      markdown: |
        - Remove adjacent and distal jewelry if able.
        - High **pressure injections** may cause subtle but devastating injury.
        - A **[traction splint](topic:wvems-2026-096#splint)** may help pain & bleeding from isolated **femur fx**.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Consider [Child Abuse](topic:wvems-2026-109#patient-abuse-and-neglect) for injuries that do not match the history.

