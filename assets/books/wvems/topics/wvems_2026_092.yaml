  - page_number: 93
    blocks:

    - type: "prose"
      title: "Malignant HTN Mandatory Prerequisites"
      highlight: true
      markdown: |
        - In the last 12 months: pass a critical-care in-service training.

    - type: "prose"
      title: "Imperatives"
      markdown: |
        - Inappropriate use of antihypertensives can **cause harm**.
          - Consider & investigate for **underlying causes** of [Hypertension](topic:wvems-2026-010).
        - Focal neurologic deficits are more likely to be a [Stroke](topic:wvems-2026-044).
          - Lowering BP during a stroke can **cause harm**.
        - Use antihypertensives **only if organ damage** from HTN is likely.
          - Focus on underlying causes if organ damage is unlikely.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **Lopressor®** (Metoprolol):
          - Aim for **10–20% reduction** in systolic BP. Do not exceed **25%**.
          - Contraindicated if SBP under 190 mmHg or pulse under 60 /min.
          - Call **Medical Control** if SBP remains elevated after two doses.
        - **Magnesium** (Sulfate): Only use for severe **preeclampsia**.
          - Severe symptoms include: HTN, HA, confusion, dyspnea, edema.
          - Consider providing for **seizure prophylaxis** if SBP > 160 mmHg.
          - Monitor **deep tendon reflexes** for toxicity — d/c if reflexes lost.

    - type: "prose"
      title: "Notes"
      markdown: |
        - Signs of **organ damage** from HTN may include:
          - Obvious global weakness, paralysis, seizure, encephalopathy.
          - Severe headache and vomiting, mental status changes.
          - Vision **loss** or blurred (not simple flashes or double vision).

    - type: "prose"
      title: "Pediatrics"
      highlight: true
      markdown: |
        - Malignant HTN is unlikely in peds. Treat **underlying causes** of HTN.

    - type: "prose"
