    - type: "prose"
      title: "Sting / Bite Imperatives"
      highlight: true
      markdown: |
        - **Don’t bring** animals, snakes or bugs with you to the ED.
          - May photograph from a **safe distance**, but do not try to catch.
          - Law enforcement can assist with animal control if needed.
          - Inquire about the **rabies status** of any domestic mammal.
        - Remove adjacent & distal jewelry; circumscribe any erythema.
        - Venous tourniquets and wound suction are **not** indicated.
        - Serious or deep bites (especially human & cat) need physician eval.

    - type: "prose"
      title: "Notes"
      markdown: |
        - Consider **ice** for animal bites & insect stings, but avoid for snakes.
        - Venomous **bites in VA**: Rattlesnake, Copperhead, and Black Widow.
          - May also encounter venomous bites from **exotic pets**.
          - **Tick** bites do not usually require EMS intervention.
          - This protocol does not apply to **marine** stings or bites.
        - If animal is known, consider calling **Poison Control**: 800-222-1222.

