topic:

  id: "wvems-2026-012"
  version: "v260101"
  title: "Bradycardia"
  list_subtitle: "2026-012 · Atropine / Pacing"
  last_reviewed: "Dec 2025"
  tags: ["bradycardia", "brady", "atropine", "pacing", "heart block"]
  aliases:
    - "Heart Block"
    - "Junctional"
    - "IVR"
  category: "universal"

  # Sticky: flowchart page + prose page each snap to a full screen.
  layout: "paged"

  pages:

  - page_number: 12
    blocks:

    - type: "flowchart"
      variant: "severity"

      entry:
        text: "Pulse Under"
        shape: "stadium"
        bands:
          - label: "Adult (14+)"
            value: "60 /min"
          - label: "Child (1–13)"
            value: "70 /min"
          - label: "Infant (< 1)"
            value: "80 /min"


      decision:
        text: "Severity?"
        shape: "diamond"

      branches:

        - id: "mild"
          label: "Mild"
          criteria:
            - "Adequate Perfusion"
            - "Minimal Symptoms"
          actions:
            - provider_level: "E"
              text: "12-Lead"
              kind: "diagnostic"
            - provider_level: "A"
              text: "Saline Lock"
              kind: "procedure"

        - id: "moderate"
          label: "Moderate"
          criteria:
            - "Adequate Perfusion"
            - "Chest Pain, Weak"
          actions:
            - provider_level: "E"
              text: "12-Lead"
              kind: "diagnostic"
            - provider_level: "I"
              text: "Atropine"
              kind: "medication_administration"

        - id: "severe"
          label: "Severe"
          criteria:
            - "Poor Perfusion"
            - "Unresponsive"
          actions:
            - provider_level: "I"
              text: "Pacing"
              kind: "procedure"
            - provider_level: "I"
              text: "Epi"
              kind: "medication_administration"
              peds_only: true
            - provider_level: "E"
              text: "12-Lead"
              kind: "diagnostic"

      convergence:
        text: "Consider"
        shape: "stadium"
        bullets:
          - text: "[Pain](topic:wvems-2026-020), [Breathing](topic:wvems-2026-006), [Hyper K+](topic:wvems-2026-018)"
          - text: "[Shock](topic:wvems-2026-008), [N/V](topic:wvems-2026-022), [OD / Tox](topic:wvems-2026-040)"

      dose_table:
        - drug: "[Atropine](topic:wvems-2026-drug-reference#atropine)"
          dose: "1 mg"
          route: "IV/IO"
          frequency: "Q 5 min x3"
          population: "adult"
        - drug: "[Epi](topic:wvems-2026-drug-reference#epi-epi-neb)"
          dose: "Use [Peds Reference](topic:wvems-2026-144)"
          route: "IV/IO"
          frequency: "Q 5 min"
          population: "peds"

  - page_number: 13
    blocks:

    - type: "prose"
      title: "Bradycardia Imperatives"
      highlight: true
      markdown: |
        - Investigate & consider tx of underlying causes, like [Hypothermia](topic:wvems-2026-068).
          - Consider [Overdose](topic:wvems-2026-040) if appropriate (many meds cause brady).
          - Slow, wide complex bradycardia may be due to [Hyperkalemia](topic:wvems-2026-018).
        - {I} May try **pacer magnet** to improve rate. Do **not** use on AICD.

    - type: "prose"
      title: "Poor Perfusion"
      callout: true
      markdown: |
        Suspect if **several** of these:
        - **Altered Mental Status**
        - Skin Pale, Cool, Diaphoretic
        - Hypotension, Orthostasis
        - Dyspnea, Tachypnea

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Atropine](topic:wvems-2026-drug-reference#atropine)**: less effective with: heart transplant, 3° heart block

    - type: "band_callout"
      band: "peds"
      title: ""
      markdown: |
        - **[Epi](topic:wvems-2026-drug-reference#epi-epi-neb)** (Epinephrine): Preferred agent over **[Atropine](topic:wvems-2026-drug-reference#atropine)** in peds.

    - type: "prose"
      title: "Notes"
      markdown: |
        - Consider placing pacing (defib) **pads** on any unstable patient.
        - **[Pacing](topic:wvems-2026-096#pacing)**: Can start at **80 bpm / 80 mA**. Escalate mA as needed.
          - Treat [Pain](topic:wvems-2026-020) and/or [Anxiety](topic:wvems-2026-046) from pacing as soon as appropriate.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Refer to [Neonate](topic:wvems-2026-050) for any peds **under 1 month** (≤ 30 days) old.
        - Frequently a [Breathing](topic:wvems-2026-006) problem: **don’t forget O₂ and BVM**.
        - Even a **single pill** of some meds can cause severe bradycardia.
          - Consider opiate, Ca²⁺ or ß-blocker [Overdose](topic:wvems-2026-040).
        - Consider effects of maternal medication in breast milk.
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.

    - type: "prose"
      title: "References"
      text_scale: 0.8
