    # ────────────────────────────────────────────────

  - page_number: 95
    blocks:

    # Print p.95 sets the SEPSIS Alert to the RIGHT of the Prerequisites, above
    # the Organ Dysfunction / Suspect Infection band. Both halves are short
    # (one bullet, and a 3-line alert triad).
    - type: "row"
      blocks:
        - type: "prose"
          flex: 5
          title: "Sepsis Mandatory Prerequisites"
          highlight: true
          markdown: |
            - In the last 12 months: pass a critical-care in-service training.
        - type: "prose"
          flex: 6
          title: "SEPSIS Alert"
          callout: true
          dashed: true
          call_er: true
          markdown: |
            - **Organ Dysfunction**
            - **Suspected Infection**
            - Call a **SEPSIS** Alert

    - type: "row"
      blocks:
        - type: "prose"
          title: "Organ Dysfunction"
          callout: true
          markdown: |
            Suspect if **several** of these:
            - Pulse > 90 /min, Lactic > 2 mmol/L
            - Resp > 20 /min, EtCO₂ < 25 mmHg
            - Temp > 100.4°F (> 38°C)
            - Temp < 96.8°F (< 36°C)
            - Decrease in mental status
            - Increased O₂ requirement
        - type: "prose"
          title: "Suspect Infection"
          callout: true
          markdown: |
            With any **recent history** of:
            - Fever, cough, antibiotic use
            - Indwelling line / catheter
            - Open wound / decub ulcer
            - Surgery / major procedure

    - type: "prose"
      title: "Imperatives"
      markdown: |
        - Sepsis is life-threatening organ dysfunction caused by infection.
        - For possible sepsis, we suggest measuring **blood lactate**.
        - For **sepsis without shock**, we recommend rapid assessment of the
          likelihood of infectious versus non-infectious causes.
        - For a **low likelihood** of infection **without shock**, we suggest
          deferring antimicrobials while continuing to closely monitor.
        - For **septic shock** or a **high likelihood** for sepsis, we
          recommend administering antimicrobials immediately.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Rocephin®](topic:wvems-2026-drug-reference#rocephin)** (Ceftriaxone): First line for undifferentiated sepsis.
          - Monitor closely if PCN allergy; avoid if cephalosporin allergy.
          - Reconstitute with **[NS](topic:wvems-2026-drug-reference#ns-bolus)** for IV/IO, and **[Lidocaine](topic:wvems-2026-drug-reference#lidocaine)** for IM.
          - **Do not** use with **[Calcium](topic:wvems-2026-drug-reference#calcium)** — potentially fatal.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - It is appropriate to **defer antibiotics** (minimal evidence for peds).

    - type: "prose"
      title: "References"
      text_scale: 0.8
      markdown: |
        - Surviving Sepsis Campaign — International Guidelines 2021 [Ver: 11/21]
        - Limmer D, O’Keefe MF. **Emergency Care** 15th ed. Chapter 24

