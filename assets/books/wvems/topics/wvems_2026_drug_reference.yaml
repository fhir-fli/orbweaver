topic:
  id: "wvems-2026-drug-reference"
  version: "v260101"
  title: "Drug Reference"
  list_subtitle: "pp.119–143 · protocol medications"
  last_reviewed: "Dec 2025"
  tags: ["drug", "medication", "reference", "formulary", "dosing"]
  aliases:
    - "Drugs"
    - "Medications"
    - "Formulary"
  category: "universal"
  page_number: 119

  blocks:

    - type: "drug_card"
      name: "3% Saline"
      critical_care: true
      class: "Hypertonic Saline"
      image: "assets/books/wvems/images/form_ivbag.jpg"
      indications:
        - "Traumatic Brain Injury"
      doses:
        - population: "adult"
          text: "**250 mL** IV/IO"
        - population: "peds"
          text: "2–5 mL/kg"
        - population: "both"
          text: "**Give over 10 min**"
      warnings:
        - "PMH: CHF, CKD, hypernatremia"
        - "May cause: hypernatremia, seizure"
        - "**Pregnancy Category C**: safety not established"
      pearls:
        - "Protocol: [Elevated ICP](topic:wvems-2026-086)"
        - "Osmotic diuretic · Onset: minutes · Duration: hours"
        - "https://www.medscape.com/viewarticle/548015"

    - type: "drug_card"
      name: "Adenosine"
      class: "Adenocard® — antiarrhythmic (Class V)"
      image: "assets/books/wvems/images/form_vial.jpg"
      indications:
        - "Supraventricular Tachycardia (SVT)"
      doses:
        - population: "adult"
          text: "**6 mg**, then **12 mg** IV/IO"
        - population: "peds"
          text: "0.1–0.2 mg/kg"
      warnings:
        - "**Beware asthma**: can cause an attack"
        - "PMH: WPW, bradycardia, AV block"
        - "PMH: COPD, theophylline, digoxin"
        - "May cause: palpitations"
        - "**Pregnancy Category C**: safety not established"
      pearls:
        - "Give **rapid IV push** followed by a **rapid saline flush**"
        - "Protocol: [Tachycardia](topic:wvems-2026-014)"
        - "Onset: seconds · Duration: ~10 s"
        - "https://reference.medscape.com/drug/342295"

    - type: "drug_card"
      name: "Afrin®"
      class: "Oxymetazoline"
      image: "assets/books/wvems/images/form_nasalspray.jpg"
      indications:
        - "Nosebleeds"
      doses:
        - population: "adult"
          text: "**1 spray** IN"
        - population: "peds"
          text: "6 y/o and above only"
      warnings:
        - "PMH: CAD, HTN"
        - "May cause: HA, nose discomfort"
        - "**Pregnancy Category C**: safety not established"
      pearls:
        - "Protocol: [Epistaxis](topic:wvems-2026-076)"
        - "Adrenergic α-agonist · Onset: seconds · Duration: 6 hr"
        - "https://reference.medscape.com/drug/343408"

    - type: "drug_card"
      name: "Albuterol"
      class: "Ventolin®"
      image: "assets/books/wvems/images/form_nebule.jpg"
      indications:
        - "Wheezing, Hyperkalemia"
      doses:
        - population: "adult"
          text: "**2.5 mg** Neb"
        - population: "peds"
          text: "**2.5 mg** neb (1.25 mg if <15 kg)"
      warnings:
        - "PMH: antiretroviral therapy"
        - "PMH: hypokalemia"
        - "May cause: tremor, anxiety"
        - "May cause: palpitation, tachycardia"
        - "**Pregnancy Category C**: safety not established"
      pearls:
        - "Protocols: [Dyspnea](topic:wvems-2026-030), [Allergic Reaction](topic:wvems-2026-032)"
        - "Four (4×) nebs back-to-back for [Hyperkalemia](topic:wvems-2026-018)"
        - "Adrenergic β-agonist · Onset: 30 min · Duration: 2 hr"
        - "https://reference.medscape.com/drug/343426"

    - type: "drug_card"
      name: "Amiodarone"
      class: "Pacerone®"
      image: "assets/books/wvems/images/form_vial.jpg"
      indications:
        - "V-Tach / V-Fib"
      doses:
        - population: "adult"
          text: "CODE: **300**, then **150 mg** IV/IO"
        - population: "peds"
          text: "CODE: 5 mg/kg, Q 5 min ×3"
        - population: "both"
          text: "Gtt: over 10 min (peds over 30 min)"
      warnings:
        - "PMH: antiretroviral therapy"
        - "PMH: bradycardia, hyperkalemia"
        - "May cause: bradycardia, HA"
        - "May cause: hypotension, dizzy"
        - "**Pregnancy Category D**: known risks"
      pearls:
        - "Protocols: [Tachycardia](topic:wvems-2026-014), [Med CODE](topic:wvems-2026-024)/[ROSC](topic:wvems-2026-026), [Trauma CODE](topic:wvems-2026-052)"
        - "Dilute in NS and **give over 10 min if non-emergent**"
        - "Antiarrhythmic Class III · Onset: mins · Duration: hours"
        - "https://reference.medscape.com/drug/342296"

    - type: "drug_card"
      name: "Ancef®"
      class: "Cefazolin"
      image: "assets/books/wvems/images/form_vial.jpg"
      indications:
        - "Major Wounds, Open Fractures"
      doses:
        - population: "adult"
          text: "**2 grams** IV/IO, IM"
        - population: "peds"
          text: "**25–30 mg/kg** IV/IO, IM (max 2 g)"
      warnings:
        - "Monitor closely if PCN allergy"
        - "Avoid if cephalosporin allergy"
        - "May cause: rash/hives, dyspnea"
        - "**Pregnancy Category B**: likely safe"
      pearls:
        - "Protocols: [Major Trauma](topic:wvems-2026-056), [Extremity Injury](topic:wvems-2026-066)"
        - "**Reconstitute**: w/ 3 mL NS for IM; dilute in 10 mL for IV/IO"
        - "Antibiotic (1st-gen cephalosporin) · Onset: minutes · Duration: hours"
        - "https://reference.medscape.com/drug/342492"

    - type: "drug_card"
      name: "Aspirin"
      class: "Baby ASA"
      image: "assets/books/wvems/images/form_tablet.jpg"
      indications:
        - "Angina"
      doses:
        - population: "adult"
          text: "**81 mg** ×4 PO (chew)"
        - population: "peds"
          text: "*do not use*"
      warnings:
        - "PMH: GI bleeding, low platelets"
        - "May cause: GERD, bleeding"
        - "**Pregnancy Category D**: known risks"
      pearls:
        - "Protocol: [Chest Pain](topic:wvems-2026-028)"
        - "Antiplatelet (and NSAID) · Onset: 5 min · Duration: 4 hrs"
        - "https://reference.medscape.com/drug/343279"

    - type: "drug_card"
      name: "Ativan®"
      class: "Lorazepam"
      image: "assets/books/wvems/images/form_vial.jpg"
      indications:
        - "Seizure, Delirium, Sedation"
      doses:
        - population: "adult"
          text: "**4 mg** IV/IO (seizure); 1 mg sedation/delirium"
        - population: "peds"
          text: "**0.1 mg/kg** seizure (max 4 mg); 0.025–0.05 mg/kg sedation"
      warnings:
        - "PMH: glaucoma"
        - "May cause: **respiratory depression**"
        - "May cause: hypotension"
        - "**Pregnancy Category D**: known risks"
        - "**Do not use** for premature babies"
      pearls:
        - "Alternate substitute for **[Versed](topic:wvems-2026-drug-reference#versed)** (only with OMD approval)"
        - "Benzo (GABA agonist) · Onset: 1 min · Duration: 8 hours"
        - "https://reference.medscape.com/drug/342906"

    - type: "drug_card"
      name: "Atropine"
      class: "AtroPen®"
      image: "assets/books/wvems/images/form_vial.jpg"
      indications:
        - "Bradycardia, Organophosphate OD"
      doses:
        - population: "adult"
          text: "**1 mg** IV/IO (brady); **2 mg** double q5 min (organophosphate, no max)"
        - population: "peds"
          text: "0.02 mg/kg (brady); 0.05 mg/kg double q5 min (organophosphate)"
      warnings:
        - "PMH: glaucoma, AV block"
        - "May cause: palpitations"
        - "May cause: dry mouth, HA"
        - "**Pregnancy Category C**: safety not established"
      pearls:
        - "**Organophosphate OD** may require massive doses"
        - "Protocols: [Bradycardia](topic:wvems-2026-012), **[Administer Antidote](topic:wvems-2026-096#administer-antidote)**"
        - "Anticholinergic · Onset: seconds · Duration: minutes"
        - "https://reference.medscape.com/drug/343093"

    - type: "drug_card"
      name: "Atrovent®"
      class: "Ipratropium Bromide"
      image: "assets/books/wvems/images/form_nebule.jpg"
      indications:
        - "Wheezing"
      doses:
        - population: "adult"
          text: "**0.5 mg** Neb"
        - population: "peds"
          text: "0.25 mg if <6 y/o (<20 kg)"
      warnings:
        - "PMH: glaucoma"
        - "May cause: HA, cough"
        - "**Pregnancy Category B**: likely safe"
      pearls:
        - "Protocols: [Dyspnea](topic:wvems-2026-030), [Allergic Reaction](topic:wvems-2026-032)"
        - "Anticholinergic · Onset: 15 min · Duration: 3 hours"
        - "https://reference.medscape.com/drug/343416"

    - type: "drug_card"
      name: "Benadryl®"
      class: "Diphenhydramine"
      image: "assets/books/wvems/images/form_vial.jpg"
      indications:
        - "Allergic Reactions, Dystonia"
      doses:
        - population: "adult"
          text: "**25 mg** IV/IO, IM, PO (may give 50 mg PO)"
        - population: "peds"
          text: "1 mg/kg"
      warnings:
        - "PMH: glaucoma, elderly"
        - "May cause: **sedation**, delirium"
        - "May cause: dry mouth"
        - "**Pregnancy Category B**: likely safe"
      pearls:
        - "Protocols: [Allergic Reaction](topic:wvems-2026-032), [Behavioral](topic:wvems-2026-046), **[Antidote](topic:wvems-2026-096#administer-antidote)**"
        - "Antihistamine · Onset: 15 min · Duration: 4 hours"
        - "https://reference.medscape.com/drug/343392"

    - type: "drug_card"
      name: "Bicarb"
      class: "Sodium Bicarbonate"
      image: "assets/books/wvems/images/form_vial.jpg"
      indications:
        - "Acidosis, Arrhythmia"
      doses:
        - population: "adult"
          text: "**50 mEq** IV/IO"
        - population: "peds"
          text: "1 mEq/kg"
      warnings:
        - "**Beware extravasation**"
        - "Do not mix: **Calcium**"
        - "May cause: alkalosis, CHF"
        - "May cause: hypokalemia"
        - "**Pregnancy Category C**: safety not established"
      pearls:
        - "Protocols: [Hyperkalemia](topic:wvems-2026-018), **[Administer Antidote](topic:wvems-2026-096#administer-antidote)**"
        - "Electrolyte: alkali · Onset: 15 min · Duration: 1 hour"
        - "https://reference.medscape.com/drug/342305"

    - type: "drug_card"
      name: "Calcium"
      class: "Calcium Chloride"
      image: "assets/books/wvems/images/form_vial.jpg"
      indications:
        - "Hyperkalemia, Ca-blocker OD"
      doses:
        - population: "adult"
          text: "**1 gram** IV/IO"
        - population: "peds"
          text: "20 mg/kg"
        - population: "both"
          text: "Give **over 10 min** (or bolus in CODE)"
      warnings:
        - "**Beware extravasation**"
        - "Do not mix: **Rocephin®, Digoxin®**"
        - "Do not mix: **Bicarbonate**"
        - "May cause: tachy, brady, N/V, HA"
        - "**Pregnancy Category C**: safety not established"
      pearls:
        - "Protocols: [Hyperkalemia](topic:wvems-2026-018), **[Administer Antidote](topic:wvems-2026-096#administer-antidote)**"
        - "Dilute in NS and **give over 10 min if non-emergent**"
        - "Electrolyte: cofactor · Onset: minutes · Duration: hours"
        - "https://reference.medscape.com/drug/344432"

    - type: "drug_card"
      name: "Charcoal"
      image: "assets/books/wvems/images/form_oralbottle.jpg"
      class: "Activated"
      indications:
        - "Poisoning, Overdose"
      doses:
        - population: "adult"
          text: "**50 g** PO (1 g/kg)"
        - population: "peds"
          text: "1 gram/kg"
        - population: "both"
          text: "May give over ice to improve taste"
      warnings:
        - "May cause: vomiting, black stools"
        - "May cause: diarrhea (w/ sorbitol)"
        - "Do not use: caustic ingestions"
        - "**Pregnancy N/A**: not categorized"
      pearls:
        - "Protocol: **[Administer Antidote](topic:wvems-2026-096#administer-antidote)**"
        - "Antidote: physical binder, not metabolized"
        - "https://reference.medscape.com/drug/343714"

    - type: "drug_card"
      name: "CyanoKit®"
      class: "Hydroxocobalamin"
      image: "assets/books/wvems/images/form_vial.jpg"
      indications:
        - "Cyanide Poisoning / Exposure"
      doses:
        - population: "adult"
          text: "**5 grams** IV/IO over 10 min"
        - population: "peds"
          text: "70 mg/kg"
      warnings:
        - "May cause: HA, flushing, HTN"
        - "PMH: CKD, renal failure"
        - "**Pregnancy Category C**: safety not established"
      pearls:
        - "Protocol: **[Administer Antidote](topic:wvems-2026-096#administer-antidote)**"
        - "Follow kit instructions and **give over 10 min**"
        - "Antidote: protein binding to cyanide · Half-life: 30 hrs"
        - "https://reference.medscape.com/drug/343734"

    - type: "drug_card"
      name: "D10"
      class: "Dextrose 10%"
      image: "assets/books/wvems/images/form_ivbag.jpg"
      indications:
        - "Hypoglycemia"
      doses:
        - population: "adult"
          text: "**100 mL** IV/IO"
        - population: "peds"
          text: "5 mL/kg"
      warnings:
        - "**Beware extravasation**"
        - "May cause: edema"
        - "May cause: hyperglycemia"
        - "**Pregnancy Category C**: safety not established"
      pearls:
        - "Protocols: [Diabetic](topic:wvems-2026-038), **[Administer Antidote](topic:wvems-2026-096#administer-antidote)**"
        - "Glucose monosaccharide · Onset: mins · Duration: 40 min"
        - "https://reference.medscape.com/drug/342705"

    - type: "drug_card"
      name: "Decadron®"
      class: "Dexamethasone"
      image: "assets/books/wvems/images/form_vial.jpg"
      indications:
        - "Inflammation"
      doses:
        - population: "adult"
          text: "**10 mg** IV/IO, IM (alt 8 mg)"
        - population: "peds"
          text: "**0.6 mg/kg** (croup; max 12 mg)"
      warnings:
        - "PMH: antivirals, anticoagulants"
        - "PMH: **diabetics**, birth control"
        - "May cause: hyperglycemia"
        - "May cause: delirium"
        - "**Pregnancy Category C**: safety not established"
      pearls:
        - "Protocols: [Dyspnea](topic:wvems-2026-030), [Allergic Reaction](topic:wvems-2026-032)"
        - "Steroid: glucocorticoid · Onset: minutes · Duration: hours"
        - "https://reference.medscape.com/drug/342741"

    - type: "drug_card"
      name: "Dopamine"
      class: "Intropin®"
      image: "assets/books/wvems/images/form_vial.jpg"
      indications:
        - "Shock, Hypotension"
      doses:
        - population: "adult"
          text: "**5 mcg/kg/min** IV/IO"
        - population: "peds"
          text: "5 mcg/kg/min"
        - population: "both"
          text: "Titrate rate (up to 4×) to effect"
      warnings:
        - "PMH: tachycardia"
        - "PMH: antidepressants"
        - "May cause: arrhythmia"
        - "May cause: HA, N/V"
        - "**Pregnancy Category C**: safety not established"
      pearls:
        - "Protocol: [Circulation / Shock](topic:wvems-2026-008)"
        - "Catecholamine · Onset: 5 minutes · Duration: 10 minutes"
        - "https://reference.medscape.com/drug/342435"

    - type: "drug_card"
      name: "DuoDote®"
      class: "Atropine & Pralidoxime"
      image: "assets/books/wvems/images/form_autoinjector.jpg"
      indications:
        - "Organophosphate poisoning"
      doses:
        - population: "adult"
          text: "**auto-inj** IM (2.1 mg / 600 mg)"
        - population: "peds"
          text: "safety not established ≤ 40 kg"
      warnings:
        - "May require **multiple doses**"
        - "PMH: chronic renal or liver disease"
        - "Do not mix: **Glucagon**"
        - "May cause: vision changes, HTN"
        - "**Pregnancy Category C**: safety not established"
      pearls:
        - "Protocol: **[Administer Antidote](topic:wvems-2026-096#administer-antidote)**"
        - "Antidote: anticholinergic, reactivates esterase · Peak: 30 m"
        - "https://reference.medscape.com/drug/343745"

    - type: "drug_card"
      name: "Epi, Epi Neb"
      class: "Epinephrine, EpiPen®"
      image: "assets/books/wvems/images/form_ampoule.jpg"
      indications:
        - "Bradycardia, CODE, Dyspnea, Allergy"
      doses:
        - population: "adult"
          text: "**1 mg** IV/IO (CODE); **0.3 mg IM** (anaphylaxis)"
        - population: "peds"
          text: "0.01 mg/kg IV (Brady/CODE); 0.01 mg/kg IM, max 0.3 mg (anaphylaxis)"
        - population: "both"
          text: "Epi Neb: 0.5 mg/kg, max 5 mg (SOB)"
      warnings:
        - "PMH: CAD, HTN"
        - "May cause: **palpitations**"
        - "May cause: anxiety, arrhythmia"
        - "May cause: HTN, flushing"
        - "**Pregnancy Category C**: safety not established"
      pearls:
        - "Protocols: [Bradycardia](topic:wvems-2026-012), [CODE](topic:wvems-2026-024), [Dyspnea](topic:wvems-2026-030), [Allergy](topic:wvems-2026-032), [Neonate](topic:wvems-2026-050)"
        - "See also **Epi Drip** (below) for Circulation / Shock"
        - "Adrenergic α, β agonist · Onset: 1 min · Duration: varies"
        - "https://reference.medscape.com/drug/342437"

    - type: "drug_card"
      name: "Epi Drip, Epi Push"
      class: "Epinephrine, Adrenalin"
      image: "assets/books/wvems/images/form_vial.jpg"
      indications:
        - "Hypotension, Shock"
      doses:
        - population: "adult"
          text: "**1 gtt/sec macro** drip set"
        - population: "peds"
          text: "1 gtt/sec micro drip set"
        - population: "both"
          text: "**Drip**: 1 mg in 1 L NS (1 mcg/mL)"
        - population: "both"
          text: "**Push-dose**: 10 mcg/mL (1 mg in 100 mL); 10 mcg (0.5–2 mL) q2–5 min"
      warnings:
        - "PMH: CAD, HTN"
        - "May cause: **palpitations**"
        - "May cause: anxiety, arrhythmia"
        - "May cause: HTN, flushing"
        - "**Pregnancy Category C**: safety not established"
      pearls:
        - "Protocols: [Circulation / Shock](topic:wvems-2026-008), [Vasopressors](topic:wvems-2026-082)"
        - "See also **Epi** (above) for Brady, CODE, Dyspnea, Allergy"
        - "Adrenergic α, β agonist · Onset: 1 min"
        - "https://reference.medscape.com/drug/342437"

    - type: "drug_card"
      name: "Etomidate"
      critical_care: true
      class: "Amidate®"
      image: "assets/books/wvems/images/form_vial.jpg"
      indications:
        - "RSI / RSA induction"
      doses:
        - population: "adult"
          text: "**0.3 mg/kg** IV/IO"
        - population: "peds"
          text: "0.3 mg/kg (10+ y/o only)"
        - population: "both"
          text: "0–9 y/o: safety not established"
      warnings:
        - "PMH: adrenal insufficiency"
        - "May cause: **limb jerking**"
        - "May cause: **eye twitching**"
        - "**Pregnancy Category C**: safety not established"
      pearls:
        - "Protocol: [Intubation / RSI](topic:wvems-2026-078)"
        - "Central hypnotic · Onset: seconds · Duration: minutes"
        - "https://reference.medscape.com/drug/343098"

    - type: "drug_card"
      name: "Fentanyl"
      class: "Sublimaze®"
      image: "assets/books/wvems/images/form_ampoule.jpg"
      indications:
        - "Acute Pain, Sedation"
      doses:
        - population: "adult"
          text: "**50–100 mcg** IV/IO, IM/IN"
        - population: "peds"
          text: "0.5–2 mcg/kg"
      warnings:
        - "PMH: MAOIs (antidepressant)"
        - "May cause: **respiratory depression**"
        - "May cause: **hypotension**"
        - "May cause: delirium, N/V"
        - "**Pregnancy Category C**: safety not established"
      pearls:
        - "Protocol: [Pain](topic:wvems-2026-020)"
        - "Critical Care: [Sedation / Vent](topic:wvems-2026-080)"
        - "Opioid: μ-agonist · Onset: seconds · Duration: 45 min"
        - "https://reference.medscape.com/drug/343311"

    - type: "drug_card"
      name: "Glucagon"
      class: "Baqsimi®, Glucagen®"
      image: "assets/books/wvems/images/form_vial.jpg"
      indications:
        - "Hypoglycemia, β-blocker OD"
      doses:
        - population: "adult"
          text: "**1 mg** IM hypoglycemia; **2–10 mg** IV (β-blocker/CCB OD)"
        - population: "peds"
          text: "0.5 mg if <25 kg (hypoglycemia); 0.05–0.15 mg/kg IV (OD)"
      warnings:
        - "PMH: pheochromocytoma"
        - "PMH: starvation, **Coumadin**"
        - "May cause: nausea / vomiting"
        - "Beware: **refractory hypoglycemia**"
        - "**Pregnancy Category B**: likely safe"
      pearls:
        - "**β-blocker OD** may require multiple doses"
        - "Protocols: [Diabetic](topic:wvems-2026-038), **[Administer Antidote](topic:wvems-2026-096#administer-antidote)**"
        - "Hepatic glycogenolysis · Onset: 10 min · Duration: 30 min"
        - "https://reference.medscape.com/drug/342712"

    - type: "drug_card"
      name: "Glucose"
      class: "Oral Glucose, Glutose 15™"
      image: "assets/books/wvems/images/form_glucosegel.jpg"
      indications:
        - "Hypoglycemia"
      doses:
        - population: "adult"
          text: "**15 grams** PO"
        - population: "peds"
          text: "0.5 g/kg"
      warnings:
        - "PMH: hyperglycemia"
        - "May cause: hyperactivity"
        - "**Pregnancy Category A**: demonstrated safe"
      pearls:
        - "Protocol: [Diabetic](topic:wvems-2026-038)"
        - "Monosaccharide · Onset: mins · Duration: 40 min"
        - "https://reference.medscape.com/drug/342705"

    - type: "drug_card"
      name: "Haldol®"
      class: "Haloperidol"
      image: "assets/books/wvems/images/form_vial.jpg"
      indications:
        - "Severe Psychosis"
      doses:
        - population: "adult"
          text: "**5 mg** IM"
        - population: "peds"
