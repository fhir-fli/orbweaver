    blocks:

    # ────────────────────────────────────────────────
    # Flowchart block (severity variant — 2 branches)
    # Asymmetric: Minor branch has 1 action, Major has 3
    # ────────────────────────────────────────────────
    - type: "flowchart"
      variant: "severity"

      entry:
        text: "Temp above 100.4 °F (38.0 °C)"
        shape: "stadium"

      decision:
        text: "Severity?"
        shape: "diamond"

      branches:

        - id: "minor"
          label: "Minor"
          criteria:
            - "Adequate Perfusion"
            - "Fatigue, Chills"
          actions:
            - text: "Position of Comfort"
              kind: "procedure"

        - id: "major"
          label: "Major"
          criteria:
            - "Poor Perfusion"
            - "Tachy, Dyspnea"
          actions:
            - provider_level: "A"
              text: "NS Bolus"
              kind: "medication_administration"
            - provider_level: "E"
              text: "Tylenol"
              kind: "medication_administration"
            - provider_level: "E"
              text: "Ibuprofen"
              kind: "medication_administration"

      convergence:
        text: "Consider"
        shape: "stadium"
        bullets:
          - text: "[Circulation](topic:wvems-2026-008), [Tachy](topic:wvems-2026-014)"
          - text: "[Cold / Heat](topic:wvems-2026-068)"
          - text: "[Sepsis](topic:wvems-2026-094)"

      critical_care_link:
        text: "[Sepsis](topic:wvems-2026-094)"

      dose_table:
        - drug: "[NS Bolus](topic:wvems-2026-drug-reference#ns-bolus)"
          dose: "500 mL"
          route: "IV/IO"
          frequency: "x4"
