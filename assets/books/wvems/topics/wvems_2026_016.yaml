        - drug: "[Tylenol](topic:wvems-2026-drug-reference#tylenol)"
          dose: "1,000 mg"
          route: "PO, IV/IO"
          frequency: "x1"
          population: "adult"
        - drug: "[Ibuprofen](topic:wvems-2026-drug-reference#ibuprofen)"
          dose: "600 mg"
          route: "PO"
          frequency: "x1"
          population: "adult"

  - page_number: 17
    blocks:

    # ────────────────────────────────────────────────
    # Prose blocks (notes page)
    # ────────────────────────────────────────────────

    - type: "prose"
      title: "Fever Imperatives"
      highlight: true
      markdown: |
        - Use a **mask** for any cough or respiratory disease (URI, Flu, etc).
          - Consider enhanced PPE for known pathogens (COVID, Ebola, etc).
        - Fever is a response to an infection. **[Hyperthermia](topic:wvems-2026-068) is different**.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Tylenol®](topic:wvems-2026-drug-reference#tylenol)** (Acetaminophen): avoid if end-stage liver disease.
          - {E} may only give PO — use OTC tabs, caps, powder, or liquid.
          - {A} may give PO or IV/IO — for IV/IO, give slowly over 10 min.
        - **[Ibuprofen](topic:wvems-2026-drug-reference#ibuprofen)** (Advil®, Motrin®): avoid if active GI bleeding.
        - Max daily dose of **[Tylenol](topic:wvems-2026-drug-reference#tylenol)** is **3,000 mg** & **Ibuprofen** is **2,400 mg**.

    - type: "prose"
      title: "Poor Perfusion"
      highlight: true
      markdown: |
        Suspect if several of these:
        - Altered Mental Status
        - Skin Pale, Cool, Diaphoretic
        - Tachycardia, Hypotension
        - Dyspnea, Tachypnea

    - type: "prose"
      title: "Notes"
      markdown: |
        - Temporal thermometers are inaccurate on sweaty skin.

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Consider [Sepsis](topic:wvems-2026-094) if indicated and credentialed for CC.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Peds under 5 y/o may have a [Seizure](topic:wvems-2026-042) caused by fever.
          - It is usually self-limiting and does not require intervention.
          - Consider intervention if longer than **5 min** or [Seizure](topic:wvems-2026-042) reoccurs.
        - Breaking tablets in half is appropriate. **Do not break capsules**.
        - Consider removing excessive clothing. **Dress children normally**.
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.

