  - page_number: 31
    blocks:

    - type: "prose"
      title: "Dyspnea Imperatives"
      highlight: true
      markdown: |
        - [Breathing](topic:wvems-2026-006) (O2 and NIPPV) should take precedence over meds.
          - **SpO2** and **EtCO2** should be used extensively for dyspnea.
        - Identify the **cause** before reaching for medications.
          - The wrong med for the wrong cause may cause harm.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **Albuterol** (Proventil®): bronchodilator for reactive disease.
        - **Atrovent** (Ipratropium): give once with first Albuterol.
        - **Epi Neb**: nebulised for upper airway swelling (croup, anaphylaxis).
        - **[Decadron](topic:wvems-2026-drug-reference#decadron)** (Dexamethasone): single steroid dose to delay rebound.
        - **[Nitro](topic:wvems-2026-drug-reference#nitro-nitro-drip)** (Nitroglycerin): for pulmonary edema / heart failure dyspnea.
          - Hold for SBP < 100 mmHg.
          - Do **not** give within 24 h of PDE5 inhibitors.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Stridor and barking cough → **croup** — give **Epi Neb** + Decadron.
        - Wheezing → **asthma/RAD** — Albuterol + Atrovent.
        - Use [Peds Reference](topic:wvems-2026-144) for weight-based dosing.

