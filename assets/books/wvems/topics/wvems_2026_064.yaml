  - page_number: 65
    blocks:

    - type: "prose"
      title: "Trunk Injury Imperatives"
      highlight: true
      markdown: |
        - Splint **impaled objects** as found (cut wreckage to free patient).
          - May remove only if interfering with airway or resuscitation.
        - **Lacerations** benefit from repair within the first few hours.
        - **Mechanism** is an important indicator of injury severity.

    - type: "prose"
      title: "TRAUMA Alert"
      callout: true
      dashed: true
      call_er: true
      markdown: |
        - If Major Intervention
        - Or Major Mechanism
        - Call a **TRAUMA** Alert

    - type: "prose"
      title: "Notes"
      markdown: |
        - **Penetration**: All penetrations should have a [chest seal](topic:wvems-2026-006).
          - Remove chest seal if using positive pressure (e.g. BVM, NIPPV).
        - **Evisceration**: Cover with saline gauze and vapor barrier.
        - **Spine**: Monitor for neuro deficits and provide [Immobilization](topic:wvems-2026-060).
        - **Impaled**: Cut object free of wreckage. Do not remove from patient.
        - **Flail Chest**: Monitor for [Pneumothorax](topic:wvems-2026-006). Use BVM for [Dyspnea](topic:wvems-2026-030).
        - **Unstable Pelvis**: Assess **only once** (with gentle compression).
          - Consider a **pelvic binder**:
            - Place **BELOW the belt line**.
            - Over greater trochanters.
            - Internally rotate the feet.
            - Secure feet & legs together.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Trunk injury is more likely in peds struck by a car.

    - type: "prose"
      title: "References"
      text_scale: 0.8
