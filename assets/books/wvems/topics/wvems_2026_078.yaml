  - page_number: 79
    blocks:

    - type: "prose"
      title: "RSI Mandatory Prerequisites"
      markdown: |
        - In the last 12 months: pass a critical care in-service training.
          - Including **12 high fidelity** (or human) airway sims.
        - In the last three months: practice **three low fidelity** airway sims.
        - Ongoing **physician quality review** of all training & live attempts.
        - At least two years of experience as cleared and **active ALS**.

    - type: "prose"
      title: "Imperatives"
      highlight: true
      markdown: |
        - **Two (2) CC/RSI Medics** must be on scene and work together.
          - **Maximum** of two (2) attempts per provider & max three (3) **total**.
        - Monitor BP, SpO₂ and EtCO₂ with waveform. Try to maintain:
          - SpO₂ **above 90%**, EtCO₂ of **35-45** mmHg, SBP above 90 mmHg
        - [Preoxygenate](topic:wvems-2026-006) while predicting airway difficulty. Utilize **apneic O₂**.
        - Utilize an **[RSI Prep Checklist](topic:wvems-2026-096#rsi-prep-checklist)** and drug/vent reference materials.
        - May use adjunct meds (e.g. push [pressors](topic:wvems-2026-082) if [shock index](topic:wvems-2026-082) > 0.8).
        - **Video Laryngoscopy** is the standard of care; **record every case**.
          - Record the monitor/vitals and your face prior to each attempt.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Etomidate](topic:wvems-2026-drug-reference#etomidate)** (Amidate®) or **[Ketamine](topic:wvems-2026-drug-reference#ketamine)** (Ketalar®): Choose one.
          - Beware (uncommon) laryngospasm with **[Ketamine](topic:wvems-2026-drug-reference#ketamine)**.
          - May give **[Ketamine](topic:wvems-2026-drug-reference#ketamine)** & then pause for more oxygenation (**DSI**).
        - **[Etomidate](topic:wvems-2026-drug-reference#etomidate)** is not appropriate for patients under 10 y/o.
        - **[Rocuronium](topic:wvems-2026-drug-reference#rocuronium)** (Zemuron®): Onset - 1 min; Duration - 30 min
          - Consider a detailed **neuro exam** before paralysis

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Induction & paralytics w/ a BIAD (**RSA**) is superior to ETI for peds.

