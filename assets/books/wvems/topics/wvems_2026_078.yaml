  - page_number: 79
    blocks:

    - type: "prose"
      title: "RSI Mandatory Prerequisites"
      markdown: |
        - In the last 12 months: pass a critical care in-service training.
          - Including **12 high fidelity** (or human) airway sims.
        - In the last three months: practice **three low fidelity** airway sims.
        - Ongoing **physician quality review** of all training & live attempts.
        - At least two years of experience as cleared and **active ALS**.

    - type: "prose"
      title: "Imperatives"
      highlight: true
      markdown: |
        - **Two (2) CC/RSI Medics** must be on scene and work together.
          - **Maximum** of two (2) attempts per provider & max three (3) **total**.
        - Monitor BP, SpO2 and EtCO2 with waveform. Try to maintain:
          - SpO2 **above 90%**, EtCO2 of **35-45** mmHg, SBP above 90 mmHg
        - **Preoxygenate** while predicting airway difficulty. Utilize **apneic O2**.
        - Utilize an **RSI Prep Checklist** and drug/vent reference materials.
        - May use adjunct meds (e.g. push pressors if **shock index** > 0.8).
        - **Video Laryngoscopy** is the standard of care; **record every case**.
          - Record the monitor/vitals and your face prior to each attempt.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **Etomidate** (Amidate®) or **Ketamine** (Ketalar®): Choose one.
          - Beware (uncommon) laryngospasm with **Ketamine**.
          - May give **Ketamine** & then pause for more oxygenation (**DSI**).
        - **Etomidate** is not appropriate for patients under 10 y/o.
        - **Rocuronium** (Zemuron®): Onset - 1 min; Duration - 30 min
          - Consider a detailed **neuro exam** before paralysis

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Induction & paralytics w/ a BIAD (**RSA**) is superior to ETI for peds.

