  - page_number: 19
    blocks:

    - type: "prose"
      title: "Hyperkalemia Imperatives"
      highlight: true
      markdown: |
        - Be aggressive with treatment and transport if any **EKG changes**.
        - Consider hyperkalemia during any **crushing** type [extremity injury](topic:wvems-2026-066).

    - type: "prose"
      title: "K+ EKG Changes"
      markdown: |
        From minor to life threat:
        - Peaked T-waves
        - Long PRI / Loss of P-wave
        - Wide QRS (over 120 ms)
        - Slow IVR (then **sine wave**)

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Albuterol](topic:wvems-2026-drug-reference#albuterol)** (Ventolin®): Appropriate even if EKG unavailable.
          - Give **four** (4x) standard nebulizer treatments back-to-back.
        - **[NS Bolus](topic:wvems-2026-drug-reference#ns-bolus)** (0.9% Saline): Aggressive fluids help dilute potassium.
          - Consider aggressive fluids even without [Hypotension](topic:wvems-2026-008).
          - Avoid aggressive/prophylactic fluids for **dialysis** patients.
        - **[Calcium](topic:wvems-2026-drug-reference#calcium)** (Chloride): **Avoid** with **[Rocephin®](topic:wvems-2026-drug-reference#rocephin)** or Digoxin® (fatal).
        - Consider **[Bicarb](topic:wvems-2026-drug-reference#bicarb)** if acidotic and/or wide QRS (>120 ms) on EKG.
          - {I} **[Bicarb](topic:wvems-2026-drug-reference#bicarb)** (Sodium Bicarbonate): give 50 mEq IV/IO x1

    - type: "prose"
      title: "Notes"
      markdown: |
        - Consider hyperkalemia in any **dialysis** or renal failure patient.
          - If called to a dialysis center, inquire about the last K+ level.
          - Avoid NIBP or IVs in the same extremity as dialysis access.
          - Consider transport to a hospital with **dialysis capability**.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.

