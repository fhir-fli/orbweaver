  - page_number: 73
    blocks:

    - type: "prose"
      title: "Inhalation Imperatives"
      highlight: true
      markdown: |
        - Monitor [Airway](topic:wvems-2026-004) closely with any facial, nasal or oral burns.
          - Check the mouth for **soot** and the nose/face for **singed hairs**.
        - Provide **100%** oxygen by NRB for carbon monoxide (CO) exposure.
          - SpO₂ may read **false normal** (CO can fool the SpO₂ monitor).
          - Symptoms may include: headache, confusion, red skin, N/V.
          - Oxygen is critical for **pregnant females** exposed to CO.
        - Some industrial gas (e.g. **Cyanide**) may benefit from an **[Antidote](topic:wvems-2026-096#administer-antidote)**.
        - WMD nerve gas (e.g. **Sarin**, **VX**) may benefit from an **[Antidote](topic:wvems-2026-096#administer-antidote)**.
        - Even non-toxic gases can produce [Hypoxia](topic:wvems-2026-006) & [Dyspnea](topic:wvems-2026-030). Give O₂.

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Consider [Intubation](topic:wvems-2026-078) if indicated and credentialed for CC.

    - type: "prose"
      title: "Notes"
      markdown: |
        - SpCO monitors are available and work like SpO₂ monitors.
          - Normal: less than 3% (may be up to 6% in heavy smokers).
          - Exposure: 3% – 10%.
          - Toxic: above 10%.
        - Most law enforcement **riot agents** are potent respiratory irritants.
          - Common agents include **tear gas** (CS) and **pepper spray** (OC).
          - Flush eyes and move to fresh air. Beware cross-contamination.
          - There are no specific antidotes. Provide supportive care.
        - This protocol includes **gasses** and smoke inhalation.
          - For **chemical [burns](topic:wvems-2026-070)** and skin exposures, refer to [Burns](topic:wvems-2026-070).
          - For **poisoning** and toxic ingestions, refer to [OD / Tox](topic:wvems-2026-040).

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Small children (and the elderly/frail) may exhibit symptoms faster.

