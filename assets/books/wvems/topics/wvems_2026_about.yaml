    - type: "prose"
      title: "About this digital edition"
      boxed: true
      markdown: |
        Transcribed into Orbweaver from the WVEMS 2026 protocols. Where dosing
        was **updated to current evidence** (PALS 2025 / OpenEvidence), it is
        noted on the affected cards. The proprietary **Handtevy** per-age
        pediatric dose tables were **not reproduced** — the Peds Reference here
        is an independent, evidence-based computed equivalent (verify locally).
        Medication/equipment images are **representative** (generic), not the
        specific products. **Confirm all doses against current references and
        your medical director before use.**
