    - "La **sobredosis de organofosforados** puede requerir dosis masivas"
    - "Protocolos: [bradicardia](topic:wvems-2026-012), **[administración de antídotos](topic:wvems-2026-096#administer-antidote)**"
    - "Anticolinérgico · Inicio: segundos · Duración: minutos"
    - "https://reference.medscape.com/drug/343093"
