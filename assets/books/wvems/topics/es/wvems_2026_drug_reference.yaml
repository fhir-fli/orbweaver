  - type: "drug_card"
    name: "Salino al 3%"
    critical_care: true
    class: "Hypertonic Saline"
    image: "assets/books/wvems/images/form_ivbag.jpg"
    indications:
    - "Traumatic Brain Injury"
    doses:
    - population: "adult"
      text: "**250 mL** IV/IO"
    - population: "peds"
      text: "2–5 mL/kg"
    - population: "both"
      text: "**Adminístrelo en 10 min**"
    warnings:
    - "APP: ICC, ERC, hipernatremia"
    - "Puede causar: hipernatremia, convulsiones"
    - "**Categoría C en el embarazo**: seguridad no establecida"
    pearls:
    - "Protocolo: [PIC elevada](topic:wvems-2026-086)"
    - "Diurético osmótico · Inicio: minutos · Duración: horas"
    - "https://www.medscape.com/viewarticle/548015"
  - type: "drug_card"
    name: "Adenosina"
    class: "Adenocard® — antiarrhythmic (Class V)"
    image: "assets/books/wvems/images/form_vial.jpg"
    indications:
    - "Supraventricular Tachycardia (SVT)"
    doses:
    - population: "adult"
      text: "**6 mg**, luego **12 mg** IV/IO"
    - population: "peds"
      text: "0.1–0.2 mg/kg"
    warnings:
    - "**Cuidado con el asma**: puede provocar una crisis"
    - "APP: WPW, bradicardia, bloqueo AV"
    - "APP: EPOC, teofilina, digoxina"
    - "Puede causar: palpitaciones"
    - "**Categoría C en el embarazo**: seguridad no establecida"
    pearls:
    - "Adminístrelo en **bolo IV rápido** seguido de un **lavado rápido con suero salino**"
    - "Protocolo: [taquicardia](topic:wvems-2026-014)"
    - "Inicio: segundos · Duración: ~10 s"
    - "https://reference.medscape.com/drug/342295"
  - type: "drug_card"
    name: "Afrin®"
    class: "Oxymetazoline"
    image: "assets/books/wvems/images/form_nasalspray.jpg"
    indications:
    - "Nosebleeds"
    doses:
    - population: "adult"
      text: "**1 pulverización** IN"
    - population: "peds"
      text: "Solo a partir de 6 años"
    warnings:
    - "APP: cardiopatía coronaria, HTA"
    - "Puede causar: cefalea, molestias nasales"
    - "**Categoría C en el embarazo**: seguridad no establecida"
    pearls:
    - "Protocolo: [epistaxis](topic:wvems-2026-076)"
    - "Agonista adrenérgico α · Inicio: segundos · Duración: 6 h"
    - "https://reference.medscape.com/drug/343408"
  - type: "drug_card"
    name: "Salbutamol (albuterol)"
    class: "Ventolin®"
    image: "assets/books/wvems/images/form_nebule.jpg"
    indications:
    - "Wheezing, Hyperkalemia"
    doses:
    - population: "adult"
      text: "**2.5 mg** nebulizado"
    - population: "peds"
      text: "**2.5 mg** nebulizado (1.25 mg si <15 kg)"
    warnings:
    - "APP: tratamiento antirretroviral"
    - "APP: hipopotasemia"
    - "Puede causar: temblor, ansiedad"
    - "Puede causar: palpitaciones, taquicardia"
    - "**Categoría C en el embarazo**: seguridad no establecida"
    pearls:
    - "Protocolos: [disnea](topic:wvems-2026-030), [reacción alérgica](topic:wvems-2026-032)"
    - "Cuatro (4×) nebulizaciones seguidas en la [hiperpotasemia](topic:wvems-2026-018)"
    - "Agonista adrenérgico β · Inicio: 30 min · Duración: 2 h"
    - "https://reference.medscape.com/drug/343426"
  - type: "drug_card"
    name: "Amiodarona"
    class: "Pacerone®"
    image: "assets/books/wvems/images/form_vial.jpg"
    indications:
    - "V-Tach / V-Fib"
    doses:
    - population: "adult"
      text: "Paro: **300**, luego **150 mg** IV/IO"
    - population: "peds"
      text: "Paro: 5 mg/kg, cada 5 min ×3"
    - population: "both"
      text: "Goteo: en 10 min (pediatría en 30 min)"
    warnings:
    - "APP: tratamiento antirretroviral"
    - "APP: bradicardia, hiperpotasemia"
    - "Puede causar: bradicardia, cefalea"
    - "Puede causar: hipotensión, mareo"
    - "**Categoría D en el embarazo**: riesgos conocidos"
    pearls:
    - "Protocolos: [taquicardia](topic:wvems-2026-014), [paro médico](topic:wvems-2026-024)/[RCE](topic:wvems-2026-026), [paro traumático](topic:wvems-2026-052)"
    - "Diluya en SSN y **adminístrelo en 10 min si no es urgente**"
    - "Antiarrítmico de clase III · Inicio: minutos · Duración: horas"
    - "https://reference.medscape.com/drug/342296"
  - type: "drug_card"
    name: "Ancef®"
    class: "Cefazolin"
    image: "assets/books/wvems/images/form_vial.jpg"
    indications:
    - "Major Wounds, Open Fractures"
    doses:
    - population: "adult"
      text: "**2 gramos** IV/IO, IM"
    - population: "peds"
      text: "**25–30 mg/kg** IV/IO, IM (máx. 2 g)"
    warnings:
    - "Vigile de cerca si hay alergia a la penicilina"
    - "Evítelo si hay alergia a cefalosporinas"
    - "Puede causar: exantema/urticaria, disnea"
    - "**Categoría B en el embarazo**: probablemente seguro"
    pearls:
    - "Protocolos: [traumatismo grave](topic:wvems-2026-056), [lesión de extremidad](topic:wvems-2026-066)"
    - "**Reconstituya**: con 3 mL de SSN para IM; diluya en 10 mL para IV/IO"
    - "Antibiótico (cefalosporina de 1.ª generación) · Inicio: minutos · Duración: horas"
    - "https://reference.medscape.com/drug/342492"
  - type: "drug_card"
    name: "Ácido acetilsalicílico (aspirina)"
    class: "Baby ASA"
    image: "assets/books/wvems/images/form_tablet.jpg"
    indications:
    - "Angina"
    doses:
    - population: "adult"
      text: "**81 mg** ×4 VO (masticado)"
    - population: "peds"
      text: "*no usar*"
    warnings:
    - "APP: sangrado GI, plaquetas bajas"
    - "Puede causar: ERGE, sangrado"
    - "**Categoría D en el embarazo**: riesgos conocidos"
    pearls:
    - "Protocolo: [dolor torácico](topic:wvems-2026-028)"
    - "Antiagregante (y AINE) · Inicio: 5 min · Duración: 4 h"
    - "https://reference.medscape.com/drug/343279"
  - type: "drug_card"
    name: "Ativan®"
    class: "Lorazepam"
    image: "assets/books/wvems/images/form_vial.jpg"
    indications:
    - "Seizure, Delirium, Sedation"
    doses:
    - population: "adult"
      text: "**4 mg** IV/IO (convulsiones); 1 mg sedación/delirio"
    - population: "peds"
      text: "**0.1 mg/kg** convulsiones (máx. 4 mg); 0.025–0.05 mg/kg sedación"
    warnings:
    - "APP: glaucoma"
    - "Puede causar: **depresión respiratoria**"
    - "Puede causar: hipotensión"
    - "**Categoría D en el embarazo**: riesgos conocidos"
    - "**No lo use** en prematuros"
    pearls:
    - "Sustituto alternativo del **[Versed](topic:wvems-2026-drug-reference#versed)** (solo con aprobación del director médico)"
    - "Benzodiacepina (agonista GABA) · Inicio: 1 min · Duración: 8 horas"
    - "https://reference.medscape.com/drug/342906"
  - type: "drug_card"
    name: "Atropina"
    class: "AtroPen®"
    image: "assets/books/wvems/images/form_vial.jpg"
    indications:
    - "Bradycardia, Organophosphate OD"
    doses:
    - population: "adult"
      text: "**1 mg** IV/IO (bradicardia); **2 mg** duplicando cada 5 min (organofosforados, sin máximo)"
    - population: "peds"
      text: "0.02 mg/kg (bradicardia); 0.05 mg/kg duplicando cada 5 min (organofosforados)"
    warnings:
    - "APP: glaucoma, bloqueo AV"
    - "Puede causar: palpitaciones"
    - "Puede causar: boca seca, cefalea"
    - "**Categoría C en el embarazo**: seguridad no establecida"
