  - page_number: 51
    blocks:
    - type: "prose"
      title: "Imperativos del neonato"
      highlight: true
      markdown: |
        - La mayoría responde a una estimulación simple.
          - **Séquelo** y colóquelo sobre el pecho de la madre.
          - Espere 60 seg antes de pinzar el cordón.
          - Deje 6–10 pulgadas de cordón viable.
        - **La SpO₂ sube despacio** tras el nacimiento.
          - Considere un sensor en la **mano derecha**.
        - Puede **probar 30 seg de ventilación** antes de empezar las compresiones.
          - Si no hay **reanimador con pieza en T**: use una **[BVM](topic:wvems-2026-096#bvm)** neonatal.
          - El **ECG** puede dar una frecuencia del pulso y una respuesta rápidas y fiables.
        - Causas menos frecuentes de dificultad: [PTX](topic:wvems-2026-006), [hipoglucemia](topic:wvems-2026-038), [choque](topic:wvems-2026-008).
    - type: "row"
      blocks:
      - type: "prose"
        title: "Compresiones"
        callout: true
        markdown: |
          - Neonato: **120** /min
          - OPA/NPA: **3 : 1** con BVM
          - BIAD: **continuas**
      - type: "prose"
        title: "Frecuencia con BVM"
        callout: true
        markdown: |
          Neonato: **cada 2 seg** (30 /min)
    - type: "row"
      blocks:
      - type: "table"
        title: "APGAR"
        flex: 9
        columns: ["", "2", "1", "0"]
        column_flex: [2, 1, 1, 1]
        rows:
        - cells: ["Apariencia", "rosado", "azul", "gris"]
        - cells: ["Pulso", "100+", "99-1", "0"]
        - cells: ["Gesticulación", "buena", "escasa", "ninguna"]
        - cells: ["Actividad", "patalea", "débil", "flácido"]
        - cells: ["Respiración", "llanto", "boqueo", "0"]
      - type: "prose"
        title: "SpO₂ normal"
        flex: 5
        callout: true
        markdown: |
          - 1 min: **60–65%**
          - 2 min: **65–70%**
          - 3 min: **70–75%**
          - 4 min: **75–80%**
          - 5 min: **80–85%**
          - 10 min: **85–95%**
    - type: "prose"
      title: "Notas"
      markdown: |
        - Documente las puntuaciones **APGAR al 1 y a los 5 minutos** — sume los puntos totales.
        - Puede colocar al recién nacido directamente sobre el pecho de la madre para **mantenerlo caliente**.
          - Fomente la lactancia materna. Coloque las **pulseras de identificación** de la madre y el bebé si las hay.
        - La **aspiración de meconio** no está incluida en este protocolo.
        - Evite el O₂ a alto flujo sobre los ojos del recién nacido.
        - Este protocolo es solo para lactantes menores de 1 mes (≤ 30 días).
