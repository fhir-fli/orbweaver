  - page_number: 37
    blocks:
    - type: "prose"
      title: "Imperativos de la alteración de la conciencia"
      highlight: true
      markdown: |
        - La alteración de la conciencia y el síncope son problemas **complejos**.
          - El paso más importante es considerar y **buscar la causa**.
          - Investigue el caso y haga una **historia cuidadosa**.
        - Los pacientes inestables deben tratarse de forma enérgica.
          - Esté preparado para un [paro médico (CODE)](topic:wvems-2026-024).
        - El alcohol y las drogas pueden enmascarar otras causas de alteración de la conciencia.
          - **No suponga que la [intoxicación](topic:wvems-2026-040)** es el único problema.
        - El síncope puede deberse a un **traumatismo** o causarlo.
          - Mantenga un alto índice de sospecha.
    - type: "prose"
      title: "Notas"
      markdown: |
        - Considere una causa [cardíaca](topic:wvems-2026-028) atípica en diabéticos y ancianos.
        - Busque **joyas de alerta médica**.
    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considere la [sepsis](topic:wvems-2026-094) si está indicado y está acreditado para cuidados críticos.
    - type: "row"
      blocks:
      - type: "prose"
        flex: 4
        markdown: |
          Puede valorar la GCS del paciente:
          - Compruebe cada respuesta
          - Repita **según necesidad**
          - Anote la **mejor respuesta**
          - Sume los tres números
          - La puntuación normal es **15**
          - La peor puntuación es **3**
      - type: "table"
        flex: 6
        title: "Escala de coma de Glasgow"
        columns: ["Ojos", "Verbal", "Motora", ""]
        column_flex: [3, 3, 3, 1]
        rows:
        - cells: ["ninguna", "ninguna", "ninguna", "1"]
        - cells: ["al dolor", "quejidos", "extensión", "2"]
        - cells: ["a la voz", "palabras", "flexión", "3"]
        - cells: ["normal", "confusa", "retirada", "4"]
        - cells: ["", "normal", "localiza", "5"]
        - cells: ["", "", "normal", "6"]
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Muchas causas de síncope transitorio son benignas, pero:
          - Una alteración prolongada de la conciencia indica una patología potencialmente grave.
          - El síncope **durante el esfuerzo** puede ser una verdadera urgencia cardíaca.
