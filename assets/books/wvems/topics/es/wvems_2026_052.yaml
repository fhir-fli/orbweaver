  - page_number: 53
    blocks:
    - type: "prose"
      title: "Imperativos del paro"
      highlight: true
      markdown: |
        - Coloque **[torniquetes](topic:wvems-2026-096#tourniquet)** si es necesario.
          - Limitar la pérdida de sangre es crucial.
        - Pruebe la **[descompresión pleural](topic:wvems-2026-096#pleural-decompress)** bilateral.
          - Un neumotórax a tensión oculto puede causar el paro traumático.
        - Este protocolo se aplica al paro cardíaco causado por un **traumatismo grave**.
          - Remítase a [paro médico (CODE)](topic:wvems-2026-024) en el paro con lesiones solo incidentales.
        - El tratamiento definitivo del paro traumático es el quirófano.
          - Priorice las compresiones, los torniquetes y el **traslado cuanto antes**.
    - type: "prose"
      title: "Compresiones"
      markdown: |
        - Adulto/pediátrico: **120 /min**
        - OPA/NPA: **30:2** con BVM
        - BIAD/TET: **continuas**
    - type: "row"
      blocks:
      - type: "prose"
        flex: 6
        title: "Alerta de TRAUMA"
        callout: true
        dashed: true
        call_er: true
        markdown: |
          - Si hay cualquier RCP por trauma
          - O signos vitales inestables
          - Active una alerta de **TRAUMA**
      - type: "prose"
        flex: 5
        title: "Lesiones mortales"
        markdown: |
          - Decapitación o cerebro expuesto
          - Destrucción del tronco o de órganos
          - Carbonización irreconocible
          - Traumatismo contuso masivo, explosión
          - Más de 30 min desde el paro
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Bolo de SSN](topic:wvems-2026-drug-reference#ns-bolus)** (salino al 0.9%): **PAS objetivo de 90** mmHg
          - Use una reanimación **equilibrada** en el choque hemorrágico
          - Busque un objetivo más alto si hay lesión de **cabeza/columna** o **embarazo**.
        - **[Amiodarona](topic:wvems-2026-drug-reference#amiodarone)**: en adultos administre dos veces (x2) cada 5 min, 300 → 150 mg
          - En pediatría, administre 5 mg/kg tres veces (x3) cada 5 min
    - type: "prose"
      title: "Notas"
      markdown: |
        - Tenga precaución con las **compresiones** y la **desfibrilación** en un vehículo en movimiento.
        - El **EtCo2** puede ayudar a identificar el RCE y a orientar la decisión de terminar.
        - Un paro bien llevado debe funcionar como un **equipo de boxes**. Céntrese en su tarea.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
