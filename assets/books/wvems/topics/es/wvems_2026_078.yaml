  - page_number: 79
    blocks:
    - type: "prose"
      title: "Requisitos previos obligatorios de SRI"
      markdown: |
        - En los últimos 12 meses: aprobar una formación interna de cuidados críticos.
          - Incluidas **12 simulaciones de vía aérea de alta fidelidad** (o en humanos).
        - En los últimos tres meses: practicar **tres simulaciones de vía aérea de baja fidelidad**.
        - **Revisión de calidad médica** continua de toda la formación y de los intentos reales.
        - Al menos dos años de experiencia como **ALS activo** y habilitado.
    - type: "prose"
      title: "Imperativos"
      highlight: true
      markdown: |
        - **Dos (2) paramédicos de CC/SRI** deben estar en la escena y trabajar juntos.
          - **Máximo** de dos (2) intentos por proveedor y máx. tres (3) **en total**.
        - Vigile PA, SpO₂ y EtCO₂ con onda. Intente mantener:
          - SpO₂ **por encima del 90%**, EtCO₂ de **35-45** mmHg, PAS por encima de 90 mmHg
        - [Preoxigene](topic:wvems-2026-006) mientras predice la dificultad de la vía aérea. Use **O₂ apneico**.
        - Use una **[lista de verificación de preparación para SRI](topic:wvems-2026-096#rsi-prep-checklist)** y materiales de referencia de fármacos/ventilador.
        - Puede usar fármacos complementarios (p. ej., [vasopresores](topic:wvems-2026-082) en bolo si el [índice de choque](topic:wvems-2026-082) > 0.8).
        - La **videolaringoscopia** es el estándar de atención; **grabe cada caso**.
          - Grabe el monitor/signos vitales y su cara antes de cada intento.
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Etomidato](topic:wvems-2026-drug-reference#etomidate)** (Amidate®) o **[ketamina](topic:wvems-2026-drug-reference#ketamine)** (Ketalar®): elija uno.
          - Tenga cuidado con el laringoespasmo (poco frecuente) con la **[ketamina](topic:wvems-2026-drug-reference#ketamine)**.
          - Puede dar **[ketamina](topic:wvems-2026-drug-reference#ketamine)** y luego hacer una pausa para oxigenar más (**DSI**).
        - El **[etomidato](topic:wvems-2026-drug-reference#etomidate)** no es apropiado en pacientes menores de 10 años.
        - **[Rocuronio](topic:wvems-2026-drug-reference#rocuronium)** (Zemuron®): inicio - 1 min; duración - 30 min
          - Considere una **exploración neurológica** detallada antes de la parálisis
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - La inducción y los paralizantes con un BIAD (**RSA**) son superiores a la intubación endotraqueal en pediatría.
