  - page_number: 47
    blocks:
    - type: "prose"
      title: "Imperativos conductuales"
      highlight: true
      markdown: |
        - **No suponga** una psicosis. Evalúe y trate otras causas.
        - Los pacientes conductuales pueden no tener [capacidad para rechazar](topic:wvems-2026-109#patient-refusals).
          - Involucre a la policía y llame a **control médico** ante cualquier rechazo con SI / HI.
        - El uso de cualquier contención conlleva un riesgo médico (y legal) importante.
          - **Intente primero la desescalada**. La contención debe ser el **último recurso**.
          - Úsela **solo para garantizar la seguridad** del paciente y de los proveedores.
          - Úsela solo cuando el riesgo de daño sea mayor que el riesgo de la contención.
          - Es **improbable** que los pacientes pediátricos, ancianos o frágiles necesiten contención.
        - La contención física solo debe usarse junto **con la policía**.
          - **Pida ayuda a la policía** si el paciente está físicamente agresivo.
          - Tenga cuidado con cualquier amenaza física o verbal, agresión o agitación.
          - Nunca use contenciones tipo hobble. Nunca contenga a un paciente en decúbito prono.
        - **Tenga precaución con las agujas** — mayor riesgo de lesión del proveedor.
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Versed®](topic:wvems-2026-drug-reference#versed)** (midazolam): úselo con precaución en pediatría y ancianos.
          - Empiece más bajo si es IV y/o el paciente es pequeño. Dosis total: **máx. 10 mg**.
        - **[Haldol®](topic:wvems-2026-drug-reference#haldol)** (haloperidol): requiere traslado y monitorización **ALS**.
          - Puede potenciar sacudidas musculares distónicas y espasmos (no convulsiones).
          - Considere tratar con **[Benadryl](topic:wvems-2026-drug-reference#benadryl)** si los espasmos son intensos.
          - {I} **[Benadryl®](topic:wvems-2026-drug-reference#benadryl)** (difenhidramina): 25 mg VO, IV/IO, IM x1
    - type: "prose"
      title: "Notas"
      markdown: |
        - SI / HI: ideación suicida u homicida (cualquier pensamiento o acto reciente)
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
          - {I} **[Versed](topic:wvems-2026-drug-reference#versed)**: la dosis pediátrica máxima es cada 2 min **x4 dosis**
