  - page_number: 59
    blocks:
    - type: "prose"
      title: "Imperativos de la hemorragia"
      highlight: true
      markdown: |
        - Pase **rápidamente a un [torniquete](topic:wvems-2026-096#tourniquet)** ante cualquier sangrado mayor de brazo / pierna.
          - Escriba en el paciente la hora de colocación del **[torniquete](topic:wvems-2026-096#tourniquet)**.
        - El **[taponamiento](topic:wvems-2026-096#wound-packing)** también puede ayudar (sobre todo en la hemorragia de unión). **No** tapone:
          - Fracturas de cráneo inestables, deprimidas o abiertas; heridas torácicas.
          - Sangrado por orificios corporales: vagina, recto, oído, boca, etc.
    - type: "row"
      blocks:
      - type: "prose"
        flex: 6
        title: "Alerta de TRAUMA"
        callout: true
        dashed: true
        call_er: true
        markdown: |
          - Si hay intervención mayor
          - O mecanismo mayor
          - Active una alerta de **TRAUMA**
      - type: "prose"
        flex: 5
        title: "Mala perfusión"
        callout: true
        markdown: |
          Sospéchela si hay **varios** de estos:
          - **Alteración del estado mental**
          - Piel pálida, fría, sudorosa
          - Taquicardia, hipotensión
          - Disnea, taquipnea
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[TXA](topic:wvems-2026-drug-reference#txa)** (ácido tranexámico): evítelo si la lesión tiene 3+ horas o hay EP conocida.
          - Úselo ante cualquier **sangrado traumático externo** mayor.
          - Úselo ante sospecha de **sangrado intraabdominal / torácico** con mala perfusión.
          - También puede usarse en el sangrado [posparto](topic:wvems-2026-048) grave (no traumático).
          - Evítelo en otras formas de sospecha de sangrado interno o médico.
    - type: "prose"
      title: "Notas"
      markdown: |
        - Los fármacos [anticoagulantes](topic:wvems-2026-076) (**que adelgazan la sangre**) aumentan el riesgo de sangrado.
        - Considere retirar los apósitos puestos por los testigos para valorar la gravedad.
        - **[Vende las heridas](topic:wvems-2026-096#wound-care)** una vez controlado el sangrado.
    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considere [sangre](topic:wvems-2026-084) si está indicado y está acreditado para cuidados críticos.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - La hipotensión es un signo tardío del [choque](topic:wvems-2026-008) hemorrágico en pediatría.
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
