  - page_number: 41
    blocks:
    - type: "prose"
      title: "Imperativos de sobredosis / tóxicos"
      highlight: true
      markdown: |
        - Obtenga una historia detallada y la **SDS** (ficha de datos de seguridad) si es posible:
          - Sustancia, cantidad y **hora** de la ingestión o exposición
        - Considere un **[antídoto](topic:wvems-2026-096#administer-antidote)** ante síntomas críticos por un **tóxico conocido**.
          - Las exposiciones menores con pocos síntomas no requieren **[antídoto](topic:wvems-2026-096#administer-antidote)**.
          - Los pacientes estables deben vigilarse y trasladarse.
          - El tratamiento de soporte basta en la intoxicación por **alcohol** (etanol).
        - Vigile de cerca la [vía aérea](topic:wvems-2026-004) en todas las **ingestiones de cáusticos**.
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Narcan®](topic:wvems-2026-drug-reference#narcan)** (naloxona): solo debe usarse para tratar la **[hipoxia](topic:wvems-2026-006)**.
          - Puede probarse ante cualquier sobredosis o exposición con disnea o choque.
          - Llame a **control médico** ante cualquier rechazo tras el **[Narcan](topic:wvems-2026-drug-reference#narcan)**.
          - {} Solo puede dar dosis **intranasales** premedidas.
          - {A} Ajuste la dosis a las respiraciones y la SpO₂; puede empezar con tan solo **0.04** mg.
        - **[Bolo de SSN](topic:wvems-2026-drug-reference#ns-bolus)** (salino al 0.9%): los líquidos pueden ayudar a diluir los tóxicos.
          - Considérelo aun sin [hipotensión](topic:wvems-2026-008). Evítelo con [ICC](topic:wvems-2026-030) o [diálisis](topic:wvems-2026-018).
    - type: "prose"
      title: "Notas"
      markdown: |
        - Si se conoce el tóxico, considere llamar al **centro de toxicología**: 800-222-1222.
          - La mayoría de los **[antídotos](topic:wvems-2026-096#administer-antidote)** requieren **órdenes en línea** (e instrucciones de dosis).
        - Este protocolo incluye el **envenenamiento** y las ingestiones tóxicas.
          - Para **quemaduras químicas** y exposiciones cutáneas, remítase a [quemaduras](topic:wvems-2026-070).
          - Para **gases** e inhalación de humo, remítase a [inhalación](topic:wvems-2026-072).
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Solo **una pastilla** de algunos fármacos de adulto puede causar un [choque](topic:wvems-2026-008) profundo.
          - La ingestión de **cigarrillos o líquido de vapeo** (nicotina) puede ser **mortal**.
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
