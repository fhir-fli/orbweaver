  - page_number: 5
    blocks:
    - type: "prose"
      title: "Imperativos de la vía aérea"
      markdown: |
        - Mantenga la vía aérea eficaz más sencilla. **Escale solo si es necesario.**
          - Considere **elevar la cabecera** de la camilla para reducir el riesgo de aspiración.
        - Si el **[BIAD](topic:wvems-2026-096#biad)** falla, **inténtelo de nuevo con otro tamaño.**
          - El fallo más frecuente de un **[BIAD](topic:wvems-2026-096#biad)** es el tamaño inadecuado.
        - Use varias técnicas para confirmar la vía aérea:
          - Exploración física: ruidos pulmonares, color de la piel, elevación del tórax, etc.
          - Signos vitales: SpO₂ en ascenso, EtCO₂, capnografía de onda (el patrón de referencia)
        - Esté preparado para escalar la vía aérea si hay signos de **mala perfusión**.
    - type: "prose"
      title: "Mala perfusión"
      callout: true
      markdown: |
        Sospéchela si hay **varios** de estos:
        - **Alteración del estado mental**
        - Piel pálida, fría, sudorosa
        - Taquicardia, hipotensión
        - Disnea, taquipnea
    - type: "prose"
      title: "Notas"
      markdown: |
        - Anime a toser. Use **[golpes en la espalda y compresiones abdominales](topic:wvems-2026-096#back-blows-thrusts)** en el atragantamiento.
          - Use **compresiones torácicas** si está embarazada o no puede rodear el abdomen.
        - Recoloque la vía aérea con **tracción mandibular** si hay cualquier sospecha de lesión espinal.
          - Use **inclinación de la cabeza / elevación del mentón** si la causa es médica (o si falla la tracción mandibular).
        - Tenga precaución con la **[NPA](topic:wvems-2026-096#npa-opa)** si hay cualquier signo de fx. de cráneo o traumatismo facial.
        - Asegure bien el **[BIAD](topic:wvems-2026-096#biad)**. Use cinta o un dispositivo de fijación comercial.
          - Puede colocar un collarín cervical (aun sin traumatismo) para ayudar a estabilizar el BIAD.
          - {A} Considere colocar una **[sonda OG](topic:wvems-2026-096#og-tube)** si el BIAD lo permite.
    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considere la [intubación](topic:wvems-2026-078) si está indicada y está acreditado para cuidados críticos.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Sospeche una obstrucción de la vía aérea, sobre todo si hay **estridor**.
        - Use **compresiones torácicas** (en lugar de compresiones abdominales) en lactantes (< 1 año).
