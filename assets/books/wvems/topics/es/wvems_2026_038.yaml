  - page_number: 39
    blocks:
    - type: "prose"
      title: "Imperativos del diabético"
      highlight: true
      markdown: |
        - No se requiere intervención del SEM en pacientes leves y asintomáticos.
        - Considere una urgencia [cardíaca](topic:wvems-2026-028) concomitante en el anciano.
          - Muchas urgencias diabéticas se benefician de un **ECG de 12 derivaciones si es posible**.
        - Considere otras causas de [alteración de la conciencia](topic:wvems-2026-036) aun con hipoglucemia.
        - La hipoglucemia por **sulfonilureas** puede ser refractaria y profunda.
          - P. ej., glipizida (Glucotrol®), glibenclamida, glimepirida (Amaryl®)
          - **Llame a control médico** ante cualquier rechazo si toma **sulfonilureas**.
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Glucosa oral](topic:wvems-2026-drug-reference#glucose)** (Glutose 15™): evítela si el paciente no puede tragar.
          - Considere **comida normal** como alternativa si la hay.
          - Priorice comida y bebida con **azúcar simple** (como jugo y caramelos).
          - Dé también carbohidratos complejos/proteínas (como **mantequilla de maní**).
        - **[D10](topic:wvems-2026-drug-reference#d10)** (dextrosa al 10%): vuelva a medir la glucosa antes de repetir la dosis.
          - Puede intentarse sin glucómetro si la hipoglucemia es probable.
        - **[Glucagón](topic:wvems-2026-drug-reference#glucagon)** (Glucagen®): precaución — ¡la mejoría es temporal!
          - **Debe dar más glucosa** o **[D10](topic:wvems-2026-drug-reference#d10)** tras administrarlo.
          - **Llame a control médico** ante cualquier rechazo tras el **[glucagón](topic:wvems-2026-drug-reference#glucagon)**.
          - Puede sustituirse por un dispositivo intranasal precargado (en lugar de la dosis IM):
          - † {E} **[Baqsimi®](topic:wvems-2026-drug-reference#glucagon)** (glucagón IN precargado): **3** mg IN x1 a partir de **≥ 1 año**
    - type: "prose"
      title: "Notas"
      markdown: |
        - Evite canalizar una vía IV en las **piernas o los pies** de un paciente diabético.
        - La hiperglucemia con olor afrutado puede ser una **CAD** — priorice los líquidos IV.
        - Busque una **bomba de insulina**. Puede desconectar el tubo si hay **hipoglucemia**.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Use el **bolo de SSN** solo en el [choque](topic:wvems-2026-008). La hipervolemia puede **causar daño**.
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
