  - page_number: 45
    blocks:
    - type: "prose"
      title: "Imperativos del ictus"
      highlight: true
      markdown: |
        - El tratamiento depende del tiempo. No retrase el traslado por procedimientos.
        - **La última vez que estuvo normal** no es necesariamente cuando empezaron los síntomas.
          - Si se notó al despertar: la última vez normal es cuando se acostó.
          - Si hay alteración de la conciencia: la última vez normal es cuando alguien lo vio normal.
        - **Valoración del ictus**: empiece con la exploración FAST de **Cincinnati**.
          - Considere un cribado adicional si es posible (Stroke VAN o NIHSS).
        - **Eleve** la cabecera aproximadamente 30° (ayuda a prevenir la aspiración).
        - Intente una **[vía salinizada](topic:wvems-2026-096#saline-lock)** solo una vez. Deje los demás sitios para el personal de urgencias.
    - type: "row"
      blocks:
      - type: "prose"
        title: "Ictus de Cincinnati"
        callout: true
        markdown: |
          - ¿**F**acial droop (asimetría facial)?
          - ¿**A**rm drift (caída del brazo)?
          - ¿**S**lurred speech (habla arrastrada)?
          - ¿**T**iempo desde la última vez normal?
      - type: "prose"
        title: "Stroke VAN"
        callout: true
        markdown: |
          Debe haber **caída del brazo**.
          - **V**isión: ¿pérdida parcial / total?
          - **A**fasia: ¿dificultad para hablar?
          - **N**egligencia: ¿ignora un lado?
    - type: "prose"
      title: "Alerta de ICTUS"
      callout: true
      dashed: true
      call_er: true
      markdown: |
        - Si sospecha un ACV
        - y la última vez normal fue **< 6 h**
        - Active una alerta de **ICTUS**
    - type: "prose"
      title: "Notas"
      markdown: |
        - La trombólisis sistémica (**tPA**, **TNK**) debe hacerse en **3–6 horas**.
          - La neurointervención vascular puede ser posible hasta las 24 horas.
        - Anime a la familia o al tutor a acompañar al paciente.
          - Hay decisiones importantes que tomar rápido en urgencias.
          - Anote el número de teléfono de la familia o el tutor si es posible.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - El ictus es improbable en pediatría. Considere otras causas de [alteración de la conciencia](topic:wvems-2026-036).
