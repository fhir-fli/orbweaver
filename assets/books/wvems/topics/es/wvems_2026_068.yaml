  - page_number: 69
    blocks:
    - type: "prose"
      title: "Imperativos de frío / calor"
      highlight: true
      markdown: |
        - La **hipertermia** **no** es lo mismo que la [fiebre](topic:wvems-2026-016) por infección.
          - Los fármacos para la [fiebre](topic:wvems-2026-016) empeoran la **hipertermia** y están contraindicados.
        - La **confusión** es el sello de las urgencias **hipertérmicas** mayores.
          - Enfríe de forma enérgica y activa a cualquiera que esté **caliente y confuso**.
          - {A} Si tirita por el enfriamiento activo: **[Versed®](topic:wvems-2026-drug-reference#versed)** 2.5 mg IV/IO x1.
        - La **reanimación** en la **hipotermia** mayor es un caso especial:
          - La intervención más importante es el **recalentamiento activo**.
          - Busque el pulso con cuidado. Si lo hay, será **muy débil**.
          - Aplique **desfibrilación** y **fármacos de ACLS** como en el [paro médico](topic:wvems-2026-024) habitual.
          - Llame a **control médico** antes de terminar la reanimación.
        - **Proteja** las compresas calientes y de hielo. No las ponga directamente sobre la piel.
    - type: "prose"
      title: "Notas"
      markdown: |
        - Las **técnicas pasivas** incluyen cambios de ropa y de entorno.
        - Los termómetros especiales o los monitores de **temperatura central** pueden ayudar:
          - La **hiper**termia mayor es probable por encima de 104°F (40°C).
          - La **hipo**termia mayor es probable por debajo de 88°F (30°C).
        - Algunas drogas también pueden causar **hipertermia**. El tratamiento es el mismo.
        - Mover en exceso a los pacientes **hipotérmicos** puede causar **FV**.
        - Inmovilice cualquier extremidad con **congelación** para limitar el movimiento (no la frote).
          - Retrase el recalentamiento de la **congelación** si puede volver a congelarse.
        - {E} **[Ibuprofeno](topic:wvems-2026-drug-reference#ibuprofen)** (Motrin®): dé 600 mg VO x1 en la **congelación**.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Los niños pequeños (y los ancianos/frágiles) se descompensan más rápido.
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
