  - page_number: 81
    blocks:
    - type: "prose"
      title: "Requisitos previos obligatorios de sedación / ventilador"
      markdown: |
        - En los últimos 12 meses: aprobar una formación interna de cuidados críticos.
    - type: "prose"
      title: "Imperativos"
      highlight: true
      markdown: |
        - Vigile a los pacientes **de cerca**. La sedación y los **[ventiladores](topic:wvems-2026-096#ventilator)** son un equilibrio delicado.
          - Use el criterio clínico y los signos vitales, **incluidas la SpO₂ y el EtCO₂**.
          - Esté preparado para **ajustar los parámetros** y ayudar con la **[aspiración](topic:wvems-2026-096#suction)** y la [vía aérea](topic:wvems-2026-004).
        - Use volúmenes de protección pulmonar con el **[ventilador](topic:wvems-2026-096#ventilator)**. Empiece con 4-8 mL/kg de peso ideal.
        - Eleve la **cabecera a 30°** para ayudar a la ventilación y limitar la aspiración.
        - Puede **aumentar la relación I:E** (1:5) en la enfermedad obstructiva (EPOC, asma).
    - type: "prose"
      title: "Parámetros típicos del ventilador en el adulto"
      markdown: |
        - Modo: **AC (V)** · Vt: **350 mL** (o 450 mL si mide más de 6')
        - RPM: **12-16** /min · FiO₂: **100%** (puede bajarse a 40-60%)
        - PEEP: **5 mmHg** · límite de PIP: **35 mmHg** · I:E **1:3**
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Fentanilo](topic:wvems-2026-drug-reference#fentanyl)** (Sublimaze®), **[Versed](topic:wvems-2026-drug-reference#versed)** (Midazolam®): úselos juntos.
          - Uno sin el otro difícilmente produce una sedación adecuada.
        - **[Ketamina](topic:wvems-2026-drug-reference#ketamine)** (Ketalar®): útil en pediatría y en asmáticos.
          - Duplique la dosis por vía IM (vigile la concentración: máx. 3 mL por inyección IM.)
        - **[Propofol](topic:wvems-2026-drug-reference#propofol)** (Diprivan®): inicie el goteo hacia 150 mcg/kg/min.
          - **Úselo solo con bomba IV** y un peso del paciente preciso.
          - Ajuste según efecto, busque una **reducción** del 30-50% en los primeros 30 min.
          - En ancianos o debilitados: empiece más bajo (100 mcg/kg/min).
          - En pediatría: empiece más alto (200 mcg/kg/min).
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
