  - page_number: 91
    blocks:
    - type: "prose"
      title: "Requisitos previos obligatorios de edema pulmonar"
      highlight: true
      markdown: |
        - En los últimos 12 meses: aprobar una formación interna de cuidados críticos.
    - type: "prose"
      title: "Imperativos"
      markdown: |
        - El edema agudo suele asociarse a [disnea](topic:wvems-2026-030) y PAS elevada.
        - Use [O₂ y NIPPV](topic:wvems-2026-006) de forma enérgica. Esté preparado para escalar la [vía aérea](topic:wvems-2026-004).
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Goteo de nitroglicerina](topic:wvems-2026-drug-reference#nitro-nitro-drip)** (nitroglicerina): vigile muy de cerca la [hipotensión](topic:wvems-2026-008).
          - **Requiere bomba** — no es apropiado dosificarla por goteo por gravedad.
          - **Baje** rápidamente para mantener la **PAS por encima de 90 mmHg**.
          - Puede **empezar con dos tabletas SL** (0.4 mg SL x2) mientras prepara el goteo.
          - Precaución con antecedente de estenosis aórtica o HTA pulmonar.
          - Contraindicada si hubo uso reciente (36 h) de cualquier [inhibidor de la PDE5](topic:wvems-2026-028).
          - Pare el goteo y considere [vasopresores](topic:wvems-2026-082) si la [hipotensión](topic:wvems-2026-008) persiste.
        - **[Lasix®](topic:wvems-2026-drug-reference#lasix)** (furosemida): el efecto es tardío, pero puede ser beneficioso.
    - type: "prose"
      title: "Notas"
      markdown: |
        - Este protocolo se centra en las causas **cardíacas** frecuentes de edema.
          - Las causas no cardíacas también se benefician de **O₂ y NIPPV** enérgicos.
        - Considere el **fentanilo** para el [dolor torácico o la cefalea](topic:wvems-2026-020) (o la sensación de falta de aire).
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
        - La ICC típica es improbable. Considere una enfermedad estructural o una [arritmia](topic:wvems-2026-014).
