  - page_number: 27
    blocks:
    - type: "prose"
      title: "Imperativos del RCE médico"
      highlight: true
      markdown: |
        - Asegure una reanimación adecuada **antes** de intentar el traslado.
          - Muévase con rapidez pero con precaución. **No sacrifique la estabilidad.**
        - Vigile de cerca la [hipotensión](topic:wvems-2026-008). Tenga listos líquidos y vasopresores.
        - Evite la hiperventilación. Puede causar [hipotensión](topic:wvems-2026-008) y un nuevo paro.
        - Vigile la temperatura corporal y trate cualquier [fiebre](topic:wvems-2026-016) de forma enérgica con fármacos.
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Ketamina](topic:wvems-2026-drug-reference#ketamine)** (Ketalar®): diluya en SSN y **adminístrela despacio en 10 min**.
          - Use la [dosificación pediátrica por peso](topic:wvems-2026-144) en adultos de menos de 110 lbs (50 kg).
        - Considere un goteo de mantenimiento si hubo **TV/FV previa** y el **traslado dura > 30 min**:
          - {I} **[Amiodarona](topic:wvems-2026-drug-reference#amiodarone)** (Pacerone®): 1 mg/min IV/IO, solo adultos.
    - type: "prose"
      title: "Notas"
      markdown: |
        - El **EtCO₂** puede ayudar a identificar el RCE. Vigílelo durante la reanimación.
        - La hipotermia terapéutica **no está incluida** en este protocolo.
          - También llamada "manejo dirigido de la temperatura".
    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considere la [intubación](topic:wvems-2026-078) y/o el [ventilador](topic:wvems-2026-080) si están indicados y está acreditado para CC.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Las arritmias son frecuentes tras el RCE, pero suelen ser autolimitadas.
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
