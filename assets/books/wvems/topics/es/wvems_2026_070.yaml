  - page_number: 71
    blocks:
    - type: "prose"
      title: "Imperativos de las quemaduras"
      highlight: true
      markdown: |
        - Use la **velocidad de líquidos de ABLS** (puede usar **SSN** o **RL**). Vigile la [hipotermia](topic:wvems-2026-068).
        - Vigile de cerca la [vía aérea](topic:wvems-2026-004) ante cualquier quemadura facial, nasal u oral.
        - Algunas quemaduras químicas (p. ej., **ácido fluorhídrico**) pueden beneficiarse de un **[antídoto](topic:wvems-2026-096#administer-antidote)**.
        - Vigile el **[ECG](topic:wvems-2026-096#12-lead)** en las quemaduras eléctricas > **1,000 v**.
        - Retire las joyas adyacentes y distales si es posible.
    - type: "row"
      blocks:
      - type: "prose"
        title: "Velocidad ABLS"
        callout: true
        markdown: |
          - 14+ años: **500 mL/h**
          - 6–13 años: **250 mL/h**
          - 0–5 años: **125 mL/h**
      - type: "image"
        path: "assets/books/wvems/images/bsa_rule_of_nines.png"
        size: "full"
        caption: "Regla de los 9 (SCT del adulto) — palma (con los dedos) ≈ 1%, periné 1%."
    - type: "prose"
      title: "Alerta de TRAUMA"
      callout: true
      dashed: true
      call_er: true
      markdown: |
        - Si hay intervención mayor
        - O mecanismo mayor
        - Active una alerta de **TRAUMA**
    - type: "prose"
      title: "Notas"
      markdown: |
        - La **regla de los 9** permite estimar la SCT en adultos.
          - La palma del paciente (**con los dedos**) es aproximadamente el 1% de la SCT.
          - Considere solo el espesor parcial y total al calcular la SCT.
        - Este protocolo incluye las **quemaduras químicas** y las exposiciones cutáneas.
          - Para **gases** e [inhalación](topic:wvems-2026-072) de humo, remítase a [inhalación](topic:wvems-2026-072).
          - Para **envenenamiento** e ingestiones tóxicas, remítase a [sobredosis / tóxicos](topic:wvems-2026-040).
        - Si se conoce el producto químico, considere llamar a **CHEMTREC**: 800-424-9300.
        - Esto **no** incluye la exposición a **radiación** (llame a **control médico**).
        - Considere el [triaje de destino](topic:wvems-2026-109#destination-triage) aeromédico si la quemadura mayor es > 20% de SCT.
          - No hay centros de quemados verificados por la ABA cerca de la región de WVEMS.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
