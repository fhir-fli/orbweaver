  - page_number: 77
    blocks:
    - type: "prose"
      title: "Imperativos de la epistaxis"
      highlight: true
      markdown: |
        - Haga que el paciente se incline hacia delante y **apriete con firmeza la parte blanda de la nariz**.
        - **Si sigue sangrando** — indique al paciente que se suene los coágulos antes de los fármacos.
        - Aplique los fármacos **en la fosa nasal afectada** y vuelva a apretar la nariz con firmeza.
        - **Puede repetir las dosis** en la otra fosa nasal si el sangrado continúa.
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Afrin®](topic:wvems-2026-drug-reference#afrin)** (oximetazolina): no la use si hay cualquier [dolor torácico](topic:wvems-2026-028) cardíaco.
        - **[TXA](topic:wvems-2026-drug-reference#txa)** (ácido tranexámico): use un **atomizador**. Evítelo si hay EP o TVP conocida.
    - type: "prose"
      title: "Notas"
      markdown: |
        - No todos los sangrados nasales son traumáticos. El tratamiento es el mismo.
        - Revise la faringe por un posible **sangrado posterior**.
          - El sangrado puede ser **importante**.
          - Más frecuente en los ancianos.
          - Los anticoagulantes aumentan el riesgo.
          - Esté preparado para tratar el [choque](topic:wvems-2026-008).
        - Los anticoagulantes (**que adelgazan la sangre**) también aumentan el riesgo en:
          - [Traumatismo grave](topic:wvems-2026-056)
          - [Hemorragia](topic:wvems-2026-058)
          - [Traumatismo craneal](topic:wvems-2026-062)
    - type: "prose"
      title: "Fármacos anticoagulantes"
      callout: true
      markdown: |
        - Ácido acetilsalicílico (AAS)
        - Coumadin® (warfarina)
        - Eliquis® (apixabán)
        - Plavix® (clopidogrel)
        - Xarelto® (rivaroxabán)
        - Effient® (prasugrel)
        - Pradaxa® (dabigatrán)
        - Brilinta® (ticagrelor)
        - Lovenox® (enoxaparina)
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Los sangrados nasales suelen deberse a traumatismos menores (hurgarse la nariz).
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
