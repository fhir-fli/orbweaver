  - page_number: 15
    blocks:
    - type: "prose"
      title: "Imperativos de la taquicardia"
      highlight: true
      markdown: |
        - Las **taquicardias simples** (p. ej., taquicardia sinusal) ocurren por muchas razones.
          - Causas reactivas como: [choque](topic:wvems-2026-008), [dolor](topic:wvems-2026-020), [fiebre](topic:wvems-2026-016) o [hemorragia](topic:wvems-2026-058), etc.
          - Causas ocultas como: [sobredosis / tóxicos](topic:wvems-2026-040), [conductual](topic:wvems-2026-046) o [anafilaxia](topic:wvems-2026-032), etc.
          - Causas cardíacas como: enfermedad del seno, flutter auricular o FA con RVR, etc.
          - Trate la causa. Evite los antiarrítmicos y la cardioversión.
        - Las **arritmias críticas** (p. ej., TSV, TV con pulso) suelen ser **más rápidas**.
          - Pero un pulso rápido no siempre es crítico. Hace falta criterio.
          - {I} Puede probar maniobras vagales (p. ej., Valsalva modificada).
    - type: "row"
      blocks:
      - type: "prose"
        title: "Arritmia crítica"
        callout: true
        markdown: |
          Sospéchela si el pulso supera:
          - Adulto (14+): **150** /min
          - Niño (1–13): **180** /min
          - Lactante (< 1): **220** /min
      - type: "prose"
        title: "Mala perfusión"
        callout: true
        markdown: |
          Sospéchela si hay **varios** de estos:
          - **Alteración del estado mental**
          - Piel pálida, fría, sudorosa
          - Taquicardia, hipotensión
          - Disnea, taquipnea
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Adenosina](topic:wvems-2026-drug-reference#adenosine)** (Adenocard®): administre en **bolo IV rápido**.
          - Precaución en pacientes con antecedente de WPW, EPOC o asma.
        - **[Amiodarona](topic:wvems-2026-drug-reference#amiodarone)** (Pacerone®): administre en goteo IV **en 10 min**.
    - type: "band_callout"
      band: "peds"
      title: ""
      markdown: |
        - La **amiodarona** prehospitalaria **no está indicada** en la taquicardia pediátrica.
    - type: "prose"
      title: "Notas"
      markdown: |
        - Considere colocar **parches** de cardioversión (desfibrilación) en cualquier paciente inestable.
        - **[Cardioversión](topic:wvems-2026-096#cardiovert)**: active **SYNC**. Empiece con **200 J**. Desfibrile si no puede sincronizar.
          - Alternativa: siga la pauta de dosis del fabricante o del OMD.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
