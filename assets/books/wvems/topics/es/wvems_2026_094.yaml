  - page_number: 95
    blocks:
    - type: "row"
      blocks:
      - type: "prose"
        flex: 5
        title: "Requisitos previos obligatorios de sepsis"
        highlight: true
        markdown: |
          - En los últimos 12 meses: aprobar una formación interna de cuidados críticos.
      - type: "prose"
        flex: 6
        title: "Alerta de SEPSIS"
        callout: true
        dashed: true
        call_er: true
        markdown: |
          - **Disfunción orgánica**
          - **Sospecha de infección**
          - Active una alerta de **SEPSIS**
    - type: "row"
      blocks:
      - type: "prose"
        title: "Disfunción orgánica"
        callout: true
        markdown: |
          Sospéchela si hay **varios** de estos:
          - Pulso > 90 /min, lactato > 2 mmol/L
          - Resp. > 20 /min, EtCO₂ < 25 mmHg
          - Temp. > 100.4°F (> 38°C)
          - Temp. < 96.8°F (< 36°C)
          - Disminución del estado mental
          - Mayor necesidad de O₂
      - type: "prose"
        title: "Sospecha de infección"
        callout: true
        markdown: |
          Con cualquier **antecedente reciente** de:
          - Fiebre, tos, uso de antibióticos
          - Vía / catéter permanente
          - Herida abierta / úlcera por presión
          - Cirugía / procedimiento mayor
    - type: "prose"
      title: "Imperativos"
      markdown: |
        - La sepsis es una disfunción orgánica potencialmente mortal causada por una infección.
        - Ante una posible sepsis, sugerimos medir el **lactato en sangre**.
        - En la **sepsis sin choque**, recomendamos valorar rápidamente la
          probabilidad de causas infecciosas frente a no infecciosas.
        - Ante una **baja probabilidad** de infección **sin choque**, sugerimos
          aplazar los antimicrobianos mientras se sigue vigilando de cerca.
        - En el **choque séptico** o con **alta probabilidad** de sepsis,
          recomendamos administrar antimicrobianos de inmediato.
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Rocephin®](topic:wvems-2026-drug-reference#rocephin)** (ceftriaxona): primera línea en la sepsis no diferenciada.
          - Vigile de cerca si hay alergia a la penicilina; evítela si hay alergia a cefalosporinas.
          - Reconstituya con **[SSN](topic:wvems-2026-drug-reference#ns-bolus)** para IV/IO, y con **[lidocaína](topic:wvems-2026-drug-reference#lidocaine)** para IM.
          - **No** la use con **[calcio](topic:wvems-2026-drug-reference#calcium)** — potencialmente mortal.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Es apropiado **aplazar los antibióticos** (evidencia mínima en pediatría).
