  - type: "prose"
    title: "No incluidos en las tablas (infusiones y dosis fijas)"
    markdown: |
      - **Goteo de epinefrina / dopamina / noradrenalina (Levophed) / metoprolol (Lopressor)** — **infusiones** por peso (mcg/kg/min); ajuste según efecto, no es una dosis única.
      - **Glucagón** — **0.5 mg** IM si **< 6 años (< 20 kg)**, si no 1 mg.
      - **Salbutamol / Atrovent / epinefrina nebulizada** — nebulizados; use la dosis estándar de nebulización (salbutamol **2.5 mg**, Atrovent **0.5 mg**, epinefrina nebulizada **0.5 mg/kg** máx. 5 mg).
      - **DuoDote** — seguridad no establecida **≤ 40 kg**.
      - **Ácido acetilsalicílico / Afrin / heparina / nitroglicerina** — indicaciones del adulto; no de rutina en pediatría.
  - type: "prose"
    title: "{E} Dosificación pediátrica para EMT"
    markdown: |
      - El cálculo de dosis pediátricas **no está en la competencia del EMT**.
      - Los EMT pueden dar la **dosis habitual del adulto** de estos fármacos, a partir de la edad indicada:
        - **Afrin** (oximetazolina): ≥ 6 años
        - **Salbutamol** (Ventolin): ≥ 2 años
        - **Atrovent** (ipratropio): ≥ 5 años
        - **Baqsimi** (glucagón IN): ≥ 1 año
        - **Glucagón** (IM): ≥ 5 años
        - **Glucosa oral** (Glutose): ≥ 2 años
        - **Narcan** (naloxona): ≥ 1 año
        - **Tetracaína** (oftálmica): todas las edades
        - **Zofran ODT** (ondansetrón): ≥ 11 años
      - Pueden dar un **EpiPen Jr** de 3–8 años, o un **EpiPen** de adulto a partir de ≥ 9 años.
      - Pueden dar las dosis **de venta libre** de Benadryl, ibuprofeno y Tylenol — siga las indicaciones de la caja según edad/peso.
        - **No** pueden dar las dosis rotuladas "consulte a un médico (o según indicación médica)".
