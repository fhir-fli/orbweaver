  blocks:
  - type: "prose"
    title: "Referencia pediátrica"
    highlight: true
    markdown: |
      - La **edad** es la referencia principal — permite prepararse durante el trayecto.
      - Use una **cinta de longitud/color** si se desconoce la edad (o si el niño es muy pequeño/grande).
      - La dosificación **por peso** es terciaria — estimar el peso es menos preciso.
      - Use la **misma vía y frecuencia** que en el protocolo del adulto.
        - Limite el **bolo de SSN** a **×3** (60 mL/kg).
  - type: "prose"
    title: "⚠️ Verifique cada dosis"
    callout: true
    palette:
      alert: "0xFFD32F2F"
      alert_fill: "0xFFFDECEA"
      alert_text: "0xFFB71C1C"
    markdown: |
      Estas tablas por edad están **CALCULADAS** (**mg/kg** × **peso estimado
      para la edad**) y revisadas frente a **PALS 2025 / OpenEvidence**, pero
      siguen siendo una **comprobación cruzada** pendiente de **aprobación del director médico** — no
      la sustituyen. **Confirme cada dosis** con una referencia actual
      (y una cinta de longitud/color) antes de administrarla. Las dosis máximas y las salvedades
      figuran en las notas bajo cada tabla (**\*** = limitada al máximo).
  - type: "prose"
    title: "Dosis para convulsiones / SRI (basadas en la evidencia)"
    boxed: true
    markdown: |
      Siguen la **evidencia de PALS / estado epiléptico** — **más altas que
      las dosis de sedación**:
      - **Ativan** (lorazepam) **0.1 mg/kg** EE (máx. 4 mg)
      - **Versed** (midazolam) **0.1–0.2 mg/kg** EE (máx. 10 mg)
      - **Keppra** **40–60 mg/kg** carga en EE (3+ meses)
      - **Rocuronio** **1 mg/kg** SRI
      - **Atropina** — sin mínimo de 0.1 mg (eliminado en PALS 2020)
      Para la **sedación**, use las dosis más bajas de las tarjetas de la referencia de fármacos.
