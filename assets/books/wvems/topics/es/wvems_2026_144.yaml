  - type: "prose"
    markdown: |
      - Epinefrina (mg): paro/bradicardia; = 0.1 mL/kg de 0.1 mg/mL; máx. 1 mg
      - Adenosina 1.ª (mg): bolo rápido + lavado; máx. 6 mg
      - Adenosina 2.ª (mg): máx. 12 mg
      - Amiodarona (mg): paro; máx. 300 mg; cada 5 min x3
      - Atropina (mg): sin mínimo (PALS 2020); máx. 0.5 mg
      - Calcio (mg): en 10 min (en bolo en el paro)
      - Bicarbonato (mEq): máx. 50 mEq
      - D10 (mL): = 0.5 g/kg
      - Bolo de SSN (mL): límite x3 (60 mL/kg)
      - Salino al 3% (mL): TCE; en 10 min
      - Magnesio (mg): en 10 min; máx. 2 g
      - Narcan (mg): dosis inicial de la FDA 0.01 mg/kg, ajuste; máx. ~2 mg
