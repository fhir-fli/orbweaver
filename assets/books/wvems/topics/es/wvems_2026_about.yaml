  - type: "prose"
    title: "Acerca de esta edición digital"
    boxed: true
    markdown: |
      Transcrita a Orbweaver a partir de los protocolos WVEMS 2026. Donde la dosificación
      se **actualizó a la evidencia actual** (PALS 2025 / OpenEvidence), se
      indica en las tarjetas afectadas. Las tablas propietarias de dosis pediátricas por edad de **Handtevy**
      **no se reprodujeron** — la referencia pediátrica de aquí
      es un equivalente calculado, independiente y basado en la evidencia (verifíquelo localmente).
      Las imágenes de medicamentos/equipos son **representativas** (genéricas), no los
      productos concretos. **Confirme todas las dosis con referencias actuales y
      con su director médico antes de usarlas.**
