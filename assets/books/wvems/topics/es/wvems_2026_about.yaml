  - type: "prose"
    title: "Leyenda de niveles de proveedor"
    markdown: |
      Las insignias marcan el **nivel mínimo de proveedor** habilitado para una habilidad o dosis.
      Puede usar cualquier intervención marcada para **su nivel o inferior** — vea
      [Cómo usar](topic:wvems-2026-003).
      - {} — **EMR** (todos los niveles; la versión impresa deja esta insignia en blanco)
      - {E} — EMT
      - {A} — AEMT
      - {I} — Intermediate
      - {P} — Paramédico
      - {P(CC)} — Paramédico de cuidados críticos (solo paramédicos acreditados)

      Soporte vital básico (SVB): EMR, EMT, AEMT · Soporte vital avanzado (SVA):
      Intermediate, paramédico, paramédico de cuidados críticos.
  - type: "prose"
    title: "Símbolos de flujo e intervención"
    markdown: |
      - **Indicaciones** (azul redondeado) — cuándo usar
      - **Use su criterio** (rombo) — un punto de decisión
      - **No olvide** (verde redondeado) — recordatorios
      - **Nota importante** (trapecio) — salvedad clave
      - **Concepto** (recuadro) — contexto y detalles
      - **ADVERTENCIA** (octógono rojo) — alto de seguridad
