  - page_number: 33
    blocks:
    - type: "prose"
      title: "Imperativos de la reacción alérgica"
      highlight: true
      markdown: |
        - Los síntomas de vía aérea y la hinchazón facial indican una **reacción mayor**.
          - La hinchazón de labios y lengua puede ser una amenaza inmediata para la vida.
        - {A} **Use fármacos IM** (o IV/IO si se dispone) en cualquier paciente in extremis.
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Epinefrina](topic:wvems-2026-drug-reference#epi-epi-neb)** (epinefrina): **úsela IM**. Trate las reacciones mayores de forma **enérgica**.
          - Úsela ante cualquier problema mayor de [vía aérea](topic:wvems-2026-004), [respiración](topic:wvems-2026-006) o [circulación](topic:wvems-2026-008).
          - **Tenga precaución** en pacientes mayores de 50 años o con EC o dolor torácico.
    - type: "band_callout"
      band: "peds"
      title: ""
      markdown: |
        - **EpiPen Jr.®**: úsela de 3–8 años.  **EpiPen®**: úsela a partir de 9+ años.
    - type: "prose"
      title: ""
      markdown: |
        - {E} Solo puede usar autoinyector o un sistema de administración por código de colores.
        - {I} Considere un **[goteo de epinefrina](topic:wvems-2026-drug-reference#epi-drip-epi-push)** ante [disnea](topic:wvems-2026-030) o [choque](topic:wvems-2026-008) persistentes.
        - **[Salbutamol](topic:wvems-2026-drug-reference#albuterol)** (Ventolin®): úselo ante cualquier disnea o sibilancia.
          - Es improbable que ayude con el exantema o el picor. Puede causar palpitaciones.
        - **[Decadron®](topic:wvems-2026-drug-reference#decadron)** (dexametasona): dosis alternativa: 8 mg IV/IO, IM x1
        - **[Benadryl®](topic:wvems-2026-drug-reference#benadryl)** (difenhidramina): puede dar a los adultos **50 mg VO x1**.
          - {E} Solo puede darse VO (puede usar la formulación y la dosis de venta libre).
    - type: "prose"
      title: "Mala perfusión"
      callout: true
      markdown: |
        Sospéchela si hay **varios** de estos:
        - **Alteración del estado mental**
        - Piel pálida, fría, sudorosa
        - Taquicardia, hipotensión
        - Disnea, taquipnea
    - type: "prose"
      title: "Notas"
      markdown: |
        - El inicio rápido de los síntomas indica una reacción más grave.
        - Las alergias alimentarias graves también pueden causar N/V y dolor abdominal.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
