  - page_number: 31
    blocks:
    - type: "prose"
      title: "Imperativos de la disnea"
      highlight: true
      markdown: |
        - La [respiración](topic:wvems-2026-006) (O₂ y [NIPPV](topic:wvems-2026-096#nippv)) tiene prioridad sobre los fármacos.
          - La SpO₂ y el EtCO₂ deben usarse **ampliamente** en la disnea.
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Salbutamol](topic:wvems-2026-drug-reference#albuterol)** (Ventolin®) y **[Atrovent®](topic:wvems-2026-drug-reference#atrovent)** (bromuro de ipratropio):
          - Pueden combinarse en el mismo nebulizador. Pueden causar palpitaciones.
        - **[Epinefrina nebulizada](topic:wvems-2026-drug-reference#epi-epi-neb)** (epinefrina): use el **vial de 1 mg/mL** (no la jeringa precargada de 0.1 mg/mL).
        - **[Decadron®](topic:wvems-2026-drug-reference#decadron)** (dexametasona): dosis alternativa: 8 mg IV/IO, IM x1
        - **[Nitroglicerina](topic:wvems-2026-drug-reference#nitro-nitro-drip)** (nitroglicerina): puede causar [hipotensión](topic:wvems-2026-008).
          - Puede usar **dosis doble** (0.8 mg) si está hipertenso y requiere [NIPPV](topic:wvems-2026-096#nippv).
          - Contraindicada si hubo uso reciente (36 h) de cualquier [inhibidor de la PDE5](topic:wvems-2026-028).
        - Puede considerar el **[magnesio](topic:wvems-2026-drug-reference#magnesium)** en el asma grave y/o las sibilancias.
          - {I} **[Magnesio](topic:wvems-2026-drug-reference#magnesium)** (sulfato): **1** gramo IV/IO en 10 min
    - type: "band_callout"
      band: "peds"
      title: ""
      markdown: |
        - Buena opción en el crup grave, la bronquiolitis o el asma en pediatría.
    - type: "prose"
      title: "Notas"
      markdown: |
        - Considere una causa [cardíaca](topic:wvems-2026-028) atípica en diabéticos y ancianos.
        - La [ansiedad](topic:wvems-2026-046) también puede causar disnea e hiperventilación.
          - Considere simplemente tranquilizar ante una ansiedad benigna evidente.
    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considere el [edema pulmonar](topic:wvems-2026-090) si está indicado y está acreditado para CC.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Aplace una evaluación agresiva si hay cualquier sospecha de **epiglotitis**.
          - La agitación puede empeorarla mucho. (Improbable si está vacunado.)
        - El **crup** es una infección que se trata mejor como una causa reactiva.
          - Puede haber **estridor** (pero el [atragantamiento](topic:wvems-2026-004) también puede causarlo).
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
