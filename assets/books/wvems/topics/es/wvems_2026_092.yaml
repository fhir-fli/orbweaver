  - page_number: 93
    blocks:
    - type: "prose"
      title: "Requisitos previos obligatorios de HTA maligna"
      highlight: true
      markdown: |
        - En los últimos 12 meses: aprobar una formación interna de cuidados críticos.
    - type: "prose"
      title: "Imperativos"
      markdown: |
        - El uso inadecuado de antihipertensivos puede **causar daño**.
          - Considere e investigue las **causas subyacentes** de la [hipertensión](topic:wvems-2026-010).
        - Los déficits neurológicos focales son más probablemente un [ictus](topic:wvems-2026-044).
          - Bajar la PA durante un ictus puede **causar daño**.
        - Use antihipertensivos **solo si es probable un daño orgánico** por la HTA.
          - Céntrese en las causas subyacentes si el daño orgánico es improbable.
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Lopressor®](topic:wvems-2026-drug-reference#lopressor)** (metoprolol):
          - Busque una **reducción del 10–20%** de la PA sistólica. No supere el **25%**.
          - Contraindicado si la PAS es menor de 190 mmHg o el pulso menor de 60 /min.
          - Llame a **control médico** si la PAS sigue elevada tras dos dosis.
        - **[Magnesio](topic:wvems-2026-drug-reference#magnesium)** (sulfato): úselo solo en la **preeclampsia** grave.
          - Los síntomas graves incluyen: HTA, cefalea, confusión, disnea, edema.
          - Considere darlo como **profilaxis de convulsiones** si la PAS > 160 mmHg.
          - Vigile los **reflejos osteotendinosos** por toxicidad — suspéndalo si se pierden.
    - type: "prose"
      title: "Notas"
      markdown: |
        - Los signos de **daño orgánico** por HTA pueden incluir:
          - Debilidad global evidente, parálisis, convulsiones, encefalopatía.
          - Cefalea intensa y vómitos, cambios del estado mental.
          - **Pérdida** de visión o visión borrosa (no simples destellos ni visión doble).
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - La HTA maligna es improbable en pediatría. Trate las [causas subyacentes](topic:wvems-2026-010) de la HTA.
