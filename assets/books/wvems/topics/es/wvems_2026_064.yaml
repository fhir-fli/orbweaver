  - page_number: 65
    blocks:
    - type: "prose"
      title: "Imperativos de la lesión del tronco"
      highlight: true
      markdown: |
        - Inmovilice los **objetos empalados** tal como estén (corte los restos para liberar al paciente).
          - Puede retirarlos solo si interfieren con la vía aérea o la reanimación.
        - Las **laceraciones** se benefician de reparación en las primeras horas.
        - El **mecanismo** es un indicador importante de la gravedad de la lesión.
    - type: "prose"
      title: "Alerta de TRAUMA"
      callout: true
      dashed: true
      call_er: true
      markdown: |
        - Si hay intervención mayor
        - O mecanismo mayor
        - Active una alerta de **TRAUMA**
    - type: "prose"
      title: "Notas"
      markdown: |
        - **Penetrante**: toda herida penetrante debe tener un [sello torácico](topic:wvems-2026-006).
          - Retire el sello torácico si usa presión positiva (p. ej., BVM, NIPPV).
        - **Evisceración**: cúbrala con gasa con suero salino y una barrera impermeable.
        - **Columna**: vigile los déficits neurológicos y aplique [inmovilización](topic:wvems-2026-060).
        - **Empalado**: corte el objeto para liberarlo de los restos. No lo retire del paciente.
        - **Tórax inestable**: vigile el [neumotórax](topic:wvems-2026-006). Use BVM ante [disnea](topic:wvems-2026-030).
        - **Pelvis inestable**: valórela **solo una vez** (con compresión suave).
          - Considere un **cinturón pélvico**:
            - Colóquelo **POR DEBAJO de la línea del cinturón**.
            - Sobre los trocánteres mayores.
            - Rote los pies hacia dentro.
            - Sujete juntos pies y piernas.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - La lesión del tronco es más probable en niños atropellados.
