  - page_number: 29
    blocks:
    - type: "prose"
      title: "Imperativos del dolor torácico"
      highlight: true
      markdown: |
        - Este protocolo es solo para urgencias **cardíacas** sospechadas (SCA).
          - Para el dolor por traumatismo torácico, remítase a [lesión del tronco](topic:wvems-2026-064).
          - Para las palpitaciones, remítase a [taquicardia](topic:wvems-2026-014) o [bradicardia](topic:wvems-2026-012).
        - En todo paciente con un **IAMCEST** identificado: coloque los **parches de desfibrilación**.
          - Además, descubra y rasure la ingle durante el traslado si hay tiempo.
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Ácido acetilsalicílico](topic:wvems-2026-drug-reference#aspirin)** (AAS infantil): contraindicado con sangrado GI **activo**
          - Haga que el paciente **mastique cuatro** (4) tabletas de 81 mg (sin cubierta entérica).
        - **[Nitroglicerina](topic:wvems-2026-drug-reference#nitro-nitro-drip)** (nitroglicerina): puede causar [hipotensión](topic:wvems-2026-008).
          - Precaución si está [hipotenso](topic:wvems-2026-008) o si se sospecha IAMCEST inferior/derecho.
          - Contraindicada si la PAS es menor de 110 mmHg **sin acceso IV/IO**.
          - Contraindicada si hubo uso reciente (36 h) de cualquier **inhibidor de la PDE5**:
    - type: "row"
      blocks:
      - type: "prose"
        flex: 6
        title: "Alerta IAMCEST"
        callout: true
        dashed: true
        call_er: true
        markdown: |
          - Si ve un [IAMCEST](topic:wvems-2026-088)
          - O el ECG dice \*\***AMI**\*\*
          - Active una alerta de **IAMCEST**
      - type: "prose"
        flex: 5
        title: "Inhibidores de la PDE5"
        callout: true
        markdown: |
          - Sildenafilo (Viagra®)
          - Tadalafilo (Cialis®)
          - Vardenafilo (Levitra®)
          - Avanafilo (Stendra®)
    - type: "prose"
      title: "Notas"
      markdown: |
        - Considere una presentación cardíaca atípica en **diabéticos** y **ancianos**.
          - No siempre hay dolor torácico real. Pregunte por antecedentes cardíacos.
          - Puede haber disnea o "molestia" o náuseas, o estar débil y sudoroso.
    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considere los cuidados avanzados del [IAMCEST](topic:wvems-2026-088) si están indicados y está acreditado para CC.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - El dolor torácico cardíaco es improbable en pediatría. Considere otras causas.
        - El **[ácido acetilsalicílico](topic:wvems-2026-drug-reference#aspirin)** y la **[nitroglicerina](topic:wvems-2026-drug-reference#nitro-nitro-drip)** están contraindicados en el dolor torácico pediátrico.
