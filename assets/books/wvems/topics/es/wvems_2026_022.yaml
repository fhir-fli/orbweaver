  - page_number: 23
    blocks:
    - type: "prose"
      title: "Imperativos de náuseas / vómitos"
      highlight: true
      markdown: |
        - Es apropiado **tratar las náuseas de forma preventiva** antes de que empiecen los síntomas.
          - Considérelo antes de cualquier intervención (o fármaco) que cause náuseas.
          - Sobre todo si el vómito causaría complicaciones graves.
          - Considere seriamente el **[Zofran](topic:wvems-2026-drug-reference#zofran)** con cualquier dispositivo invasivo de vía aérea.
        - **Evite por boca** alimentos y líquidos. (Los fármacos orales están bien.)
          - Mantenga a los pacientes en **NPO** (Nil Per Os: lat. “nada por la boca”)
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Zofran®](topic:wvems-2026-drug-reference#zofran)** (ondansetrón): úselo para todas las causas de náuseas y vómitos.
          - Precaución con [bradicardia](topic:wvems-2026-012) y [sobredosis / tóxicos](topic:wvems-2026-040).
          - Considere el **[ECG de 12 derivaciones](topic:wvems-2026-096#12-lead)** si hay antecedente/riesgo de **QT largo** o alteración electrolítica.
          - {E} Solo puede darse VO - use **tabletas bucodispersables** (ODT)
    - type: "band_callout"
      band: "peds"
      title: ""
      markdown: |
        - {A} Dosis alternativa de 4–10 años: parta la ODT por la mitad y dé 2 mg VO
    - type: "prose"
      title: "Notas"
      markdown: |
        - Considere una causa [cardíaca](topic:wvems-2026-028) atípica en diabéticos y ancianos.
        - Oler una toallita con alcohol también puede aliviar un poco las náuseas.
        - El vómito es un mecanismo protector en la [sobredosis](topic:wvems-2026-040) (como el EtOH).
          - Pero inducir el vómito a propósito (p. ej., ipecacuana) no está indicado.
          - Puede considerar el **[Zofran](topic:wvems-2026-drug-reference#zofran)** para las arcadas cuando el estómago esté vacío.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
