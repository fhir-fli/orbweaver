  - page_number: 35
    blocks:
    - type: "prose"
      title: "Imperativos del dolor abdominal"
      highlight: true
      markdown: |
        - Este protocolo es para las causas **médicas** de dolor abdominal.
          - Para el dolor abdominal traumático, remítase a [lesión del tronco](topic:wvems-2026-064).
        - Prepárese para la [hipotensión](topic:wvems-2026-008) si se refiere pérdida de sangre, o si se sospecha:
          - **AAA**: "masa pulsátil" en la línea media en el anciano
          - **Hemorragia GI**: heces negras (melena) o vómito en "posos de café"
        - Pregunte por [embarazo](topic:wvems-2026-048) y considere las complicaciones.
          - Considere un **ectópico** en cualquier mujer embarazada, vigile el [choque](topic:wvems-2026-008).
        - **Evite por boca** alimentos y líquidos. (Los fármacos orales están bien.)
          - Mantenga a los pacientes en **NPO** (**Nil Per Os**: lat. "nada por la boca")
    - type: "prose"
      title: "Notas"
      markdown: |
        - Considere una causa [cardíaca](topic:wvems-2026-028) atípica en diabéticos y ancianos.
        - Muchas causas frecuentes no requieren una intervención específica del SEM.
          - P. ej., gastroenteritis, vesícula, apéndice, colitis, obstrucción intestinal, etc.
          - Sí considere tratar los síntomas: [fiebre](topic:wvems-2026-016), [dolor](topic:wvems-2026-020), [náuseas](topic:wvems-2026-022)
    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considere la [sepsis](topic:wvems-2026-094) si está indicado y está acreditado para cuidados críticos.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - El estreñimiento simple es una causa frecuente en pediatría.
          - No requiere una intervención agresiva del SEM.
