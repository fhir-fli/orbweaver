  - page_number: 73
    blocks:
    - type: "prose"
      title: "Imperativos de la inhalación"
      highlight: true
      markdown: |
        - Vigile de cerca la [vía aérea](topic:wvems-2026-004) ante cualquier quemadura facial, nasal u oral.
          - Busque **hollín** en la boca y **pelos chamuscados** en la nariz/cara.
        - Administre oxígeno al **100%** con NRB en la exposición al monóxido de carbono (CO).
          - La SpO₂ puede dar un **falso normal** (el CO puede engañar al monitor de SpO₂).
          - Los síntomas pueden incluir: cefalea, confusión, piel roja, N/V.
          - El oxígeno es crucial en las **mujeres embarazadas** expuestas al CO.
        - Algunos gases industriales (p. ej., **cianuro**) pueden beneficiarse de un **[antídoto](topic:wvems-2026-096#administer-antidote)**.
        - Los gases nerviosos de armas de destrucción masiva (p. ej., **sarín**, **VX**) pueden beneficiarse de un **[antídoto](topic:wvems-2026-096#administer-antidote)**.
        - Incluso los gases no tóxicos pueden producir [hipoxia](topic:wvems-2026-006) y [disnea](topic:wvems-2026-030). Dé O₂.
    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considere la [intubación](topic:wvems-2026-078) si está indicada y está acreditado para CC.
    - type: "prose"
      title: "Notas"
      markdown: |
        - Hay monitores de SpCO que funcionan como los de SpO₂.
          - Normal: menos del 3% (puede llegar al 6% en grandes fumadores).
          - Exposición: 3% – 10%.
          - Tóxico: por encima del 10%.
        - La mayoría de los **agentes antidisturbios** policiales son irritantes respiratorios potentes.
          - Entre los más comunes están el **gas lacrimógeno** (CS) y el **spray de pimienta** (OC).
          - Lave los ojos y lleve al aire libre. Cuidado con la contaminación cruzada.
          - No hay antídotos específicos. Dé tratamiento de soporte.
        - Este protocolo incluye los **gases** y la inhalación de humo.
          - Para **[quemaduras](topic:wvems-2026-070) químicas** y exposiciones cutáneas, remítase a [quemaduras](topic:wvems-2026-070).
          - Para **envenenamiento** e ingestiones tóxicas, remítase a [sobredosis / tóxicos](topic:wvems-2026-040).
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Los niños pequeños (y los ancianos/frágiles) pueden presentar síntomas antes.
