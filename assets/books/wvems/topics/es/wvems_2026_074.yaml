  - page_number: 75
    blocks:
    - type: "prose"
      title: "Imperativos de picaduras / mordeduras"
      highlight: true
      markdown: |
        - **No lleve** animales, serpientes ni insectos a urgencias.
          - Puede fotografiarlos desde una **distancia segura**, pero no intente atraparlos.
          - La policía puede ayudar con el control de animales si es necesario.
          - Pregunte por el **estado de vacunación antirrábica** de cualquier mamífero doméstico.
        - Retire las joyas adyacentes y distales; marque el contorno de cualquier eritema.
        - Los torniquetes venosos y la succión de la herida **no** están indicados.
        - Las mordeduras graves o profundas (sobre todo humanas y de gato) necesitan valoración médica.
    - type: "prose"
      title: "Notas"
      markdown: |
        - Considere el **hielo** para las mordeduras de animales y las picaduras de insectos, pero evítelo en las serpientes.
        - **Mordeduras venenosas en VA**: serpiente de cascabel, cabeza de cobre (copperhead) y viuda negra.
          - También puede haber mordeduras venenosas de **mascotas exóticas**.
          - Las mordeduras de **garrapata** no suelen requerir intervención del SEM.
          - Este protocolo no se aplica a picaduras ni mordeduras **marinas**.
        - Si se conoce el animal, considere llamar al **centro de toxicología**: 800-222-1222.
