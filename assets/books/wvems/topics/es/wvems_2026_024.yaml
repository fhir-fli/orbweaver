  - page_number: 25
    blocks:
    - type: "prose"
      title: "Imperativos del paro"
      highlight: true
      markdown: |
        - Empiece las compresiones en el sitio.
          - Traslade cuanto antes si hay **RCE**, o es **pediátrico**, o **embarazada**, o cualquier [caso especial](topic:wvems-2026-109#termination-of-resuscitation).
        - {E} **BLS**: pida ALS cuanto antes. [Traslade](topic:wvems-2026-109#termination-of-resuscitation) si lo presenció el SEM o hubo alguna descarga.
        - {I} **ALS**: intente durante **30 min**. Si no hay RCE: [solicite la terminación](topic:wvems-2026-109#termination-of-resuscitation).
    - type: "row"
      blocks:
      - type: "prose"
        title: "Compresiones"
        markdown: |
          - Adulto/pediátrico: **120 /min**
          - OPA/NPA: **30:2** con BVM
          - BIAD/TET: **continuas**
      - type: "prose"
        title: "Muerte evidente"
        markdown: |
          - Livideces declives
          - Rigidez cadavérica
          - Descomposición del cuerpo
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Amiodarona](topic:wvems-2026-drug-reference#amiodarone)** (Pacerone®):
          - En adultos, administre dos veces (x2) cada 5 min
            - (1) 300 mg → (2) 150 mg
          - En pediatría, administre 5 mg/kg tres veces (x3) cada 5 min
        - Considere fármacos complementarios en el paro por TV polimorfa sin pulso:
          - {I} **[Magnesio](topic:wvems-2026-drug-reference#magnesium)** (sulfato): 2 gramos IV/IO x1 para torsades
    - type: "prose"
      title: "Notas"
      markdown: |
        - Tenga precaución con las **[compresiones](topic:wvems-2026-096#chest-compression)** y la **[desfibrilación](topic:wvems-2026-096#defib)** en un vehículo en movimiento.
        - El **EtCo2** puede ayudar a identificar el RCE y a orientar la decisión de terminar.
        - Un paro bien llevado debe funcionar como un **equipo de boxes**. Céntrese en su tarea.
        - Considere las causas: [choque](topic:wvems-2026-008), [sobredosis/tóxicos](topic:wvems-2026-040), [hipoglucemia](topic:wvems-2026-038), [hiperpotasemia](topic:wvems-2026-018), etc.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Use una relación de compresiones 15:2 en la reanimación BLS con dos reanimadores.
        - Remítase a [neonato](topic:wvems-2026-050) para cualquier paciente pediátrico de **menos de 1 mes** (≤ 30 días).
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
