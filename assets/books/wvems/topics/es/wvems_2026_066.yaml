  - page_number: 67
    blocks:
    - type: "prose"
      title: "Imperativos de la lesión de extremidad"
      highlight: true
      markdown: |
        - Pase **rápidamente a un [torniquete](topic:wvems-2026-096#tourniquet)** ante cualquier sangrado mayor de brazo / pierna.
          - Escriba en el paciente la hora de colocación del **[torniquete](topic:wvems-2026-096#tourniquet)**.
        - Las **extremidades sin pulso** y las **amputaciones** son verdaderas urgencias.
          - Anote la hora de la lesión. Reduzca cualquier deformidad. Traslade cuanto antes.
          - Envuelva las partes amputadas en gasa con suero salino y colóquelas en una bolsa cerrada.
          - Ponga la bolsa sobre hielo si lo hay. Anote la hora en que se puso en hielo.
        - Tenga cuidado con la [hiperpotasemia](topic:wvems-2026-018) en cualquier lesión por **aplastamiento de un miembro** o por **suspensión**.
          - Aplastamiento de un miembro: puede iniciar el tratamiento (si está disponible rápido) antes de liberarlo.
          - **Suspendido del arnés**: extraiga de inmediato y coloque en decúbito supino.
        - Las **laceraciones** se benefician de reparación en las primeras horas.
        - El **mecanismo** es un indicador importante de la gravedad de la lesión.
    - type: "prose"
      title: "Alerta de TRAUMA"
      callout: true
      dashed: true
      call_er: true
      markdown: |
        - Si hay intervención mayor
        - O mecanismo mayor
        - Active una alerta de **TRAUMA**
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Ancef®](topic:wvems-2026-drug-reference#ancef)** (cefazolina): adminístrela si se sospecha una **fractura abierta**.
          - Vigile de cerca si hay alergia a la penicilina; evítela si hay alergia a cefalosporinas.
          - Reconstituya el polvo con suero salino normal y **agite bien** para mezclar.
    - type: "prose"
      title: "Notas"
      markdown: |
        - Retire las joyas adyacentes y distales si es posible.
        - Las **inyecciones a alta presión** pueden causar lesiones sutiles pero devastadoras.
        - Una **[férula de tracción](topic:wvems-2026-096#splint)** puede ayudar con el dolor y el sangrado de una **fx de fémur** aislada.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Considere el [maltrato infantil](topic:wvems-2026-109#patient-abuse-and-neglect) ante lesiones que no concuerdan con la historia.
