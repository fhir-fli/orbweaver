  - page_number: 87
    blocks:
    - type: "prose"
      title: "Requisitos previos obligatorios de PIC elevada"
      highlight: true
      markdown: |
        - En los últimos 12 meses: aprobar una formación interna de cuidados críticos.
        - Priorice el traslado urgente a un centro de trauma de nivel 1 o 2.
    - type: "prose"
      title: "Imperativos"
      markdown: |
        - Es crucial evitar la [hipoxia](topic:wvems-2026-006) y la [hipotensión](topic:wvems-2026-008). Trátelas de forma enérgica.
          - Objetivo **PAS > 110 mmHg** y **SpO₂ 96–99%** y **EtCO₂ 35–45 mmHg**.
        - Use la camilla para **incorporar al paciente a 30°** si es improbable una lesión de columna baja.
        - Una pupila dilatada sugiere herniación. La dilatación bilateral es ominosa.
    - type: "row"
      blocks:
      - type: "prose"
        title: "Tríada de Cushing"
        callout: true
        markdown: |
          - Hipertensión
          - Bradicardia
          - Respiración irregular
      - type: "table"
        title: "Escala de coma de Glasgow"
        columns: ["Ojos", "Verbal", "Motora", ""]
        column_flex: [3, 3, 3, 1]
        rows:
        - cells: ["ninguna", "ninguna", "ninguna", "1"]
        - cells: ["al dolor", "quejidos", "extensión", "2"]
        - cells: ["a la voz", "palabras", "flexión", "3"]
        - cells: ["normal", "confusa", "retirada", "4"]
        - cells: ["", "normal", "localiza", "5"]
        - cells: ["", "", "normal", "6"]
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Salino al 3%](topic:wvems-2026-drug-reference#3-saline)** (hipertónico): **informe a urgencias** tras usarlo.
        - **[Keppra®](topic:wvems-2026-drug-reference#keppra)** (levetiracetam): puede darse incluso antes de cualquier [convulsión](topic:wvems-2026-042).
    - type: "prose"
      title: "Notas"
      markdown: |
        - Las [convulsiones](topic:wvems-2026-042), el [dolor](topic:wvems-2026-020), los [vómitos](topic:wvems-2026-022), la [agitación](topic:wvems-2026-046) y la [fiebre](topic:wvems-2026-016) pueden aumentar la PIC.
          - Considere el tratamiento sintomático pero **no retrase el traslado**.
        - Los corticoides, el **TXA** y/o la hiperventilación **no están indicados**.
        - Mayor riesgo de hemorragia intracraneal si hay cualquier [anticoagulación](topic:wvems-2026-076).
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
        - Busque el **extremo superior** de la PAS según la edad (también en la [referencia pediátrica](topic:wvems-2026-144)).
