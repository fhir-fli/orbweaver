  - page_number: 57
    blocks:
    - type: "prose"
      title: "Imperativos del traumatismo grave"
      highlight: true
      markdown: |
        - El traslado rápido es **crucial** ante lesiones masivas potencialmente mortales.
          - **Lleve al paciente al hospital**. El tratamiento definitivo está **en el quirófano**.
          - Retrase el traslado solo para atender amenazas vitales mayores.
          - La valoración secundaria y el tratamiento pueden hacerse durante el traslado.
        - Es apropiado empezar solo con una **inmovilización manual** rápida.
          - Puede dejar la colocación del [collarín cervical](topic:wvems-2026-060) para la valoración secundaria.
          - Debe dejar la inmovilización de las extremidades para la valoración secundaria.
    - type: "row"
      blocks:
      - type: "prose"
        flex: 6
        title: "Alerta de TRAUMA"
        callout: true
        dashed: true
        call_er: true
        markdown: |
          - Si hay intervención mayor
          - O mecanismo mayor
          - Active una alerta de **TRAUMA**
      - type: "prose"
        flex: 5
        title: "Mala perfusión"
        callout: true
        markdown: |
          Sospéchela si hay **varios** de estos:
          - **Alteración del estado mental**
          - Piel pálida, fría, sudorosa
          - Taquicardia, hipotensión
          - Disnea, taquipnea
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Bolo de SSN](topic:wvems-2026-drug-reference#ns-bolus)** (salino al 0.9%): **PAS objetivo de 90 mmHg**.
          - Use una reanimación **equilibrada** en el choque hemorrágico (objetivo más alto
            si hay lesión de **cabeza / columna** o **embarazo**).
        - **[Ancef®](topic:wvems-2026-drug-reference#ancef)** (cefazolina): adminístrela ante cualquier **herida abierta** importante.
          - Vigile de cerca si hay alergia a la penicilina; evítela si hay alergia a cefalosporinas.
          - Reconstituya el polvo con suero salino normal y **agite bien** para mezclar.
    - type: "prose"
      title: "Notas"
      markdown: |
        - Considere **calentadores de líquidos** IV y/o **infusores rápidos** si los hay.
        - Inmovilice los **objetos empalados** tal como estén (corte los restos para liberar al paciente).
          - Puede retirarlos solo si interfieren con la vía aérea o la reanimación.
    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considere [sangre](topic:wvems-2026-084) si está indicado y está acreditado para cuidados críticos.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
