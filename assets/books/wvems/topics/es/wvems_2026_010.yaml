  - page_number: 11
    blocks:
    - type: "prose"
      title: "Imperativos de la hipertensión"
      highlight: true
      markdown: |
        - Confirme la PA sistólica elevada con dos tomas de presión fiables.
        - La HTA es una reacción frecuente al [dolor](topic:wvems-2026-020) y a una agresión fisiológica aguda.
          - Investigue y **trate primero el dolor** y las **causas subyacentes**.
        - Incluso una HTA leve (PAS > 160 mmHg) al final del [embarazo](topic:wvems-2026-048) puede ser patológica.
          - Puede progresar a **eclampsia**. Esté preparado para tratar [convulsiones](topic:wvems-2026-042).
    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considere la [preeclampsia](topic:wvems-2026-092) si está indicado y está acreditado para CC.
    - type: "prose"
      title: ""
      markdown: |
        - El uso inadecuado de antihipertensivos puede **causar daño**.
          - Bajar la PA durante un ictus puede **causar daño**.
    - type: "prose"
      title: "Notas"
      markdown: |
        - Muchas otras **causas subyacentes** pueden producir una HTA importante.
          - Considere patología [cardíaca](topic:wvems-2026-028) si hay cualquier dolor torácico.
          - Considere [disnea](topic:wvems-2026-030) e ICC si hay estertores o edema en los pies.
          - Considere [sobredosis/tóxicos](topic:wvems-2026-040) si hay consumo reciente de estimulantes o drogas ilícitas.
          - Considere [ictus](topic:wvems-2026-044) si hay cualquier déficit neurológico focal agudo.
          - Considere [conductual](topic:wvems-2026-046) si hay ansiedad por desencadenantes emocionales recientes.
          - Considere [traumatismo craneal](topic:wvems-2026-062) si hay antecedente de traumatismo o signos de lesión.
        - Pregunte por cambios nuevos o recientes en la medicación cardíaca o **antihipertensiva**.
    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considere la [HTA maligna](topic:wvems-2026-092) si está indicado y está acreditado para CC.
        - Considere el [edema pulmonar](topic:wvems-2026-090) si está indicado y está acreditado para CC.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - La HTA patológica es improbable en pediatría. Trate las causas subyacentes.
