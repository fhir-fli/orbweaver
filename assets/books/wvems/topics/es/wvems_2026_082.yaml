  - page_number: 83
    blocks:
    - type: "prose"
      title: "Requisitos previos obligatorios de vasopresores"
      highlight: true
      markdown: |
        - En los últimos 12 meses: aprobar una formación interna de cuidados críticos.
    - type: "prose"
      title: "Imperativos"
      markdown: |
        - Anticipe y esté preparado para una **nueva hipotensión** si usa dosis en bolo.
        - El uso inadecuado de vasopresores puede **causar daño**.
          - Compruebe dos veces el cálculo de la dosis (cuidado con las distintas concentraciones).
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Levophed®](topic:wvems-2026-drug-reference#levophed)** (noradrenalina): bueno para el **choque séptico**.
          - **Requiere bomba** — no es apropiado dosificarlo por goteo por gravedad.
        - **[Epinefrina en bolo](topic:wvems-2026-drug-reference#epi-drip-epi-push)** (epinefrina): buena para el **choque anafiláctico**.
          - Esté preparado para repetir la dosis; evítela en el IAMCEST.
        - **[Fenilefrina en bolo](topic:wvems-2026-drug-reference#neo-push)** (fenilefrina): buena para un **índice de choque** elevado.
    - type: "row"
      blocks:
      - type: "prose"
        title: "Índice de choque"
        callout: true
        markdown: |
          IC = **pulso / PAS**
      - type: "prose"
        title: "Mala perfusión"
        callout: true
        markdown: |
          Sospéchela si hay **varios** de estos:
          - **Alteración del estado mental**
          - Piel pálida, fría, sudorosa
          - Taquicardia, hipotensión
          - Disnea, taquipnea
    - type: "prose"
      title: "Notas"
      markdown: |
        - El **índice de choque** predice bien la hipotensión por la SRI.
          - Tenga listos los vasopresores en bolo si el **índice de choque es mayor de 0.8**.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
        - Ajuste a la PA según la edad (los signos vitales también figuran en la [referencia pediátrica](topic:wvems-2026-144)).
