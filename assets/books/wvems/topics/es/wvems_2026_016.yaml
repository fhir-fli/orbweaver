  - page_number: 17
    blocks:
    - type: "prose"
      title: "Imperativos de la fiebre"
      highlight: true
      markdown: |
        - Use una **mascarilla** ante cualquier tos o enfermedad respiratoria (IVRS, gripe, etc.).
          - Considere un EPP reforzado para patógenos conocidos (COVID, ébola, etc.).
        - La fiebre es una respuesta a una infección. **La [hipertermia](topic:wvems-2026-068) es distinta**.
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Tylenol®](topic:wvems-2026-drug-reference#tylenol)** (paracetamol): evítelo en la hepatopatía terminal.
          - {E} solo puede darse VO — use tabletas, cápsulas, polvo o líquido de venta libre.
          - {A} puede darse VO o IV/IO — por IV/IO, adminístrelo despacio en 10 min.
        - **[Ibuprofeno](topic:wvems-2026-drug-reference#ibuprofen)** (Advil®, Motrin®): evítelo si hay sangrado GI activo.
        - La dosis diaria máxima de **[Tylenol](topic:wvems-2026-drug-reference#tylenol)** es **3,000 mg** y la de **ibuprofeno** es **2,400 mg**.
    - type: "prose"
      title: "Mala perfusión"
      highlight: true
      markdown: |
        Sospéchela si hay varios de estos:
        - Alteración del estado mental
        - Piel pálida, fría, sudorosa
        - Taquicardia, hipotensión
        - Disnea, taquipnea
    - type: "prose"
      title: "Notas"
      markdown: |
        - Los termómetros temporales son inexactos sobre piel sudorosa.
    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considere la [sepsis](topic:wvems-2026-094) si está indicado y está acreditado para CC.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Los niños menores de 5 años pueden tener una [convulsión](topic:wvems-2026-042) causada por la fiebre.
          - Suele ser autolimitada y no requiere intervención.
          - Considere intervenir si dura más de **5 min** o la [convulsión](topic:wvems-2026-042) se repite.
        - Partir las tabletas por la mitad es apropiado. **No abra las cápsulas**.
        - Considere quitar el exceso de ropa. **Vista a los niños con normalidad**.
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
