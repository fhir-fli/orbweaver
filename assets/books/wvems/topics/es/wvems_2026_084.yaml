  - page_number: 85
    blocks:
    - type: "prose"
      title: "Requisitos previos obligatorios de sangre"
      highlight: true
      markdown: |
        - En los últimos 12 meses: aprobar una formación interna de cuidados críticos.
        - Asegure que la sangre se **almacena y conserva** según las instrucciones del proveedor.
    - type: "prose"
      title: "Imperativos"
      markdown: |
        - **SSN frente a sangre** es una decisión clínica. No hay una respuesta perfecta.
          - El **bolo de SSN** puede servir en el sangrado externo fácil de controlar.
          - Pase rápido a sangre si la perfusión no responde con rapidez.
          - Los proveedores **pueden empezar con sangre** en el sangrado críticamente inestable.
          - Úsela en la exanguinación masiva franca (**traumatismo**, GI, posparto).
        - **PAS objetivo de 90 mmHg**, sea SSN o sangre.
          - Use una reanimación **equilibrada** en el choque hemorrágico.
          - Busque un objetivo más alto si hay lesión de **cabeza / columna** o **embarazo**.
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Bolo de SSN](topic:wvems-2026-drug-reference#ns-bolus)** (salino al 0.9%): puede omitir el **SSN** en pacientes in extremis.
        - **Sangre** (LTOWB): **verifique** la etiqueta de control ambiental.
          - Use un equipo especial y un **calentador**. Vigile las **reacciones transfusionales**.
          - Pare de inmediato si hay [fiebre](topic:wvems-2026-016), [disnea](topic:wvems-2026-030) o [reacción alérgica](topic:wvems-2026-032).
          - **Informe a urgencias** de cualquier sangre administrada y de cualquier reacción.
    - type: "prose"
      title: "Notas"
      markdown: |
        - Si es posible, pregunte por **objeciones religiosas** antes de la transfusión.
          - **Si está alterado**: puede buscar joyas de alerta médica o en la cartera del paciente.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Administre la **sangre** en alícuotas de **10 mL/kg**. Puede repetir según necesidad.
        - Ajuste al extremo inferior de la PAS según la edad (en la [referencia pediátrica](topic:wvems-2026-144)).
