  - page_number: 19
    blocks:
    - type: "prose"
      title: "Imperativos de la hiperpotasemia"
      highlight: true
      markdown: |
        - Sea enérgico con el tratamiento y el traslado si hay cualquier **cambio en el ECG**.
        - Considere la hiperpotasemia en cualquier [lesión de extremidad](topic:wvems-2026-066) por **aplastamiento**.
    - type: "prose"
      title: "Cambios del ECG por K+"
      markdown: |
        De menor a potencialmente mortal:
        - Ondas T picudas
        - PRI largo / pérdida de la onda P
        - QRS ancho (más de 120 ms)
        - RIV lento (luego **onda sinusoidal**)
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Salbutamol](topic:wvems-2026-drug-reference#albuterol)** (Ventolin®): apropiado aunque no haya ECG.
          - Administre **cuatro** (4x) nebulizaciones estándar seguidas.
        - **[Bolo de SSN](topic:wvems-2026-drug-reference#ns-bolus)** (salino al 0.9%): los líquidos abundantes ayudan a diluir el potasio.
          - Considere líquidos abundantes aun sin [hipotensión](topic:wvems-2026-008).
          - Evite los líquidos abundantes/profilácticos en pacientes en **diálisis**.
        - **[Calcio](topic:wvems-2026-drug-reference#calcium)** (cloruro): **evítelo** con **[Rocephin®](topic:wvems-2026-drug-reference#rocephin)** o Digoxin® (mortal).
        - Considere el **[bicarbonato](topic:wvems-2026-drug-reference#bicarb)** si hay acidosis y/o QRS ancho (>120 ms) en el ECG.
          - {I} **[Bicarbonato](topic:wvems-2026-drug-reference#bicarb)** (bicarbonato sódico): administre 50 mEq IV/IO x1
    - type: "prose"
      title: "Notas"
      markdown: |
        - Considere la hiperpotasemia en cualquier paciente en **diálisis** o con insuficiencia renal.
          - Si le llaman a un centro de diálisis, pregunte por el último nivel de K+.
          - Evite la PANI o las vías IV en la misma extremidad que el acceso de diálisis.
          - Considere el traslado a un hospital **con diálisis**.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
