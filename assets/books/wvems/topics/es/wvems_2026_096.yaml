  - type: "prose"
    title: "Procedimientos"
    highlight: true
    markdown: |
      Habilidades paso a paso del juego de tarjetas de WVEMS (pp.96-108). La insignia de cada tarjeta
      marca el **nivel mínimo de proveedor** habilitado para esa habilidad —
      {E} {A} {I} {P} (de menor a mayor); sin insignia = todos los niveles.
      Las franjas rosas señalan diferencias por **edad/pediatría**; las franjas lavanda señalan
      opciones de **cuidados críticos**; los recuadros discontinuos están **limitados por nivel**.
