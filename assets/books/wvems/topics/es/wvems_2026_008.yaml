  - page_number: 9
    blocks:
    - type: "row"
      blocks:
      - type: "prose"
        title: "Imperativos del choque"
        highlight: true
        markdown: |
          - Considere las causas subyacentes:
            - [Bradicardia](topic:wvems-2026-012), [Taquicardia](topic:wvems-2026-014)
            - [Cardíaco](topic:wvems-2026-028), [Anafilaxia](topic:wvems-2026-032)
            - [Diabético](topic:wvems-2026-038), [Sobredosis / tóxicos](topic:wvems-2026-040)
            - [Traumatismo grave](topic:wvems-2026-056), [Exposición](topic:wvems-2026-068)
      - type: "prose"
        title: "Mala perfusión"
        callout: true
        markdown: |
          Sospéchela si hay **varios** de estos:
          - **Alteración del estado mental**
          - Piel pálida, fría, sudorosa
          - Taquicardia, hipotensión
          - Disnea, taquipnea
    - type: "prose"
      title: "Medicación"
      markdown: |
        - **[Bolo de SSN](topic:wvems-2026-drug-reference#ns-bolus)** (salino al 0.9%): indicado en la **mala perfusión**.
          - Vigile edema y estertores antes y después de administrar líquidos.
        - **[Goteo de epinefrina](topic:wvems-2026-drug-reference#epi-drip-epi-push)** (epinefrina): prepare una bolsa de **1 mcg/mL** y úsela así:
          - Añada 1 mg de **epinefrina** a una bolsa de 1,000 mL **-o-** 0.5 mg a una bolsa de 500 mL de **SSN**
          - Adultos (14+ años): use un equipo de macrogoteo (10 o 15 gtt/mL).
          - Pediátricos (0–13 años): use un equipo de microgoteo (60 gtt/mL).
          - Empiece a 1 gota por segundo y **ajuste según necesidad**.
          - Evite la **epinefrina** si hay dolor torácico activo y [IAMCEST](topic:wvems-2026-088) confirmado.
        - **[Dopamina](topic:wvems-2026-drug-reference#dopamine)** (Intropin®): para causas médicas refractarias a la **epinefrina**.
          - **Use un equipo de microgoteo** (60 gtt/mL). Puede ajustar **hasta 4x** si es necesario.
          - En el adulto medio, empiece hacia **1 gota cada 5 seg** (con equipo de microgoteo).
    - type: "prose"
      title: "Notas"
      markdown: |
        - Use una reanimación **equilibrada** en el [traumatismo](topic:wvems-2026-056). Los vasopresores son el último recurso.
    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - La presión arterial media (**PAM**) es un mejor indicador cuando se dispone de ella.
          - Considere [vasopresores](topic:wvems-2026-082) o [sangre](topic:wvems-2026-084) si están indicados y está acreditado para CC.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - La mayoría de las descompensaciones pediátricas se deben a la vía aérea.
        - Los líquidos son importantes en la hipotensión. Los vasopresores son el último recurso.
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
