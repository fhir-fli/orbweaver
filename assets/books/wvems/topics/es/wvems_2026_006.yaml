  - page_number: 7
    blocks:
    - type: "prose"
      critical_care_link:
        text: "[Ventilador](topic:wvems-2026-080)"
      title: "Imperativos de la respiración"
      highlight: true
      markdown: |
        - **La disnea con traumatismo penetrante** es un problema grave.
          - Aplique un **sello torácico** sobre cualquier lesión penetrante del cuello o el [tronco](topic:wvems-2026-064).
          - Retire el sello torácico si usa presión positiva (p. ej., BVM, NIPPV).
        - El **PTX** espontáneo o traumático puede ser un problema grave.
          - **[Descompresión pleural](topic:wvems-2026-096#pleural-decompress)** ante [hipotensión](topic:wvems-2026-008) o hipoxia persistente.
        - **[BVM](topic:wvems-2026-096#bvm)**: use dos proveedores y técnica a dos manos si puede.
          - Use **EtCO₂** con objetivo de **35–45 mmHg**. Evite la hiperventilación.
          - Durante la RCP: alterne **30 : 2** hasta colocar el BIAD (o el TET).
        - **[NIPPV](topic:wvems-2026-096#nippv)**: contraindicada con agitación, vómitos o hipotensión.
          - Puede usarse si está alterado o sin respuesta, pero vigile de cerca.
          - Puede colocar la cánula de EtCO₂ bajo la mascarilla de NIPPV para obtener la onda.
    - type: "prose"
      title: "Frecuencia con BVM"
      highlight: true
      markdown: |
        - **Adulto**: cada 6 seg (10 /min)
        - **Pediátrico**: cada 2 seg (20–30 /min)
    - type: "prose"
      title: "Notas"
      markdown: |
        - Administre O₂ a dosis apropiadas. Puede reducirlo si la SpO₂ supera el 98%.
          - **Cánula nasal (NC)**: 1–6 L/min; **mascarilla sin reinhalación (NRB)**: 10–15 L/min.
          - La **hiperoxia** puede empeorar algunas afecciones, sobre todo la EPOC.
          - SpO₂ objetivo de **88–92%** en adultos con EPOC aislada.
        - Si no hay SpO₂ o el aparato falla: use un buen criterio clínico.
        - El **ahogamiento** (o el buceo con escafandra) puede causar hipoxia — el tratamiento es el mismo.
    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considere el [ventilador](topic:wvems-2026-080) si está indicado y está acreditado para cuidados críticos.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Remítase a [neonato](topic:wvems-2026-050) para cualquier paciente pediátrico de menos de 1 mes (≤ 30 días).
          - Considere un **reanimador con pieza en T** (en lugar de BVM) en [neonatos](topic:wvems-2026-050).
        - Tenga precaución y use una BVM del tamaño adecuado para evitar el **barotrauma**.
