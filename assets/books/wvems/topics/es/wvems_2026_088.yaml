  - page_number: 89
    blocks:
    - type: "prose"
      title: "Requisitos previos obligatorios de IAMCEST"
      highlight: true
      markdown: |
        - En los últimos 12 meses: aprobar una formación interna de cuidados críticos.
    - type: "prose"
      title: "Imperativos"
      markdown: |
        - No olvide [lo básico](topic:wvems-2026-028): **O₂**, **AAS** y **nitroglicerina**. Coloque la **vía IV en la mano izquierda**.
        - Haga un **ECG de 15 derivaciones** si: IAMCEST inferior o descensos del ST septales.
          - La elevación del ST en V4R indica IAM derecho — la **nitroglicerina** puede causar [choque](topic:wvems-2026-008).
          - Las elevaciones del ST en V8 y V9 indican un **IAMCEST posterior**.
        - Si hay marcapasos ventricular o BRI: cualquiera de los criterios de **Sgarbossa** sugiere un IAMCEST.
    - type: "row"
      blocks:
      - type: "prose"
        flex: 6
        title: "Alerta IAMCEST"
        callout: true
        dashed: true
        call_er: true
        markdown: |
          - Si hay **marcapasos ventricular** o **BRI**
          - con cualquier criterio de **Sgarbossa**
          - Active una alerta de **IAMCEST**
      - type: "prose"
        flex: 5
        title: "Sgarbossa (modificado)"
        callout: true
        markdown: |
          - **+ST** > 25% del tamaño del QRS (cualquier derivación)
          - **+ST** con **+QRS** (concordante)
          - **−ST** con **−QRS** en V1, V2 o V3
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Heparina](topic:wvems-2026-drug-reference#heparin)** (sódica): verifique la dosis/concentración, adminístrela en bolo IV lento.
          - Evítela si hay cualquier sospecha de sangrado potencialmente mortal (HDA, HIC, etc.).
    - type: "prose"
      title: "Notas"
      markdown: |
        - Avise a urgencias **cuanto antes**. Prepárese para **ir directo a la sala de hemodinámica** si hay tiempo.
          - **Rasure** desde el cinturón hasta las rodillas, coloque los **parches de desfibrilación**, cambie a una bata.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Puede haber repolarización precoz en el ECG que imita elevaciones del ST.
          - Pero la repolarización precoz **no requiere** intervención del SEM.
        - Un IAMCEST verdadero es muy improbable en pediatría — busque otras causas.
    - type: "prose"
      title: "Referencias"
      text_scale: 0.8
