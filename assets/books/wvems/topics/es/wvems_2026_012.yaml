  - page_number: 13
    blocks:
    - type: "prose"
      title: "Imperativos de la bradicardia"
      highlight: true
      markdown: |
        - Investigue y considere tratar las causas subyacentes, como la [hipotermia](topic:wvems-2026-068).
          - Considere [sobredosis](topic:wvems-2026-040) si procede (muchos fármacos causan bradicardia).
          - Una bradicardia lenta de complejo ancho puede deberse a [hiperpotasemia](topic:wvems-2026-018).
        - {I} Puede probar con el **imán del marcapasos** para mejorar la frecuencia. **No** lo use sobre un DAI.
    - type: "prose"
      title: "Mala perfusión"
      callout: true
      markdown: |
        Sospéchela si hay **varios** de estos:
        - **Alteración del estado mental**
        - Piel pálida, fría, sudorosa
        - Hipotensión, ortostatismo
        - Disnea, taquipnea
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Atropina](topic:wvems-2026-drug-reference#atropine)**: menos eficaz en: trasplante cardíaco, bloqueo cardíaco de 3.er grado
    - type: "band_callout"
      band: "peds"
      title: ""
      markdown: |
        - **[Epinefrina](topic:wvems-2026-drug-reference#epi-epi-neb)** (epinefrina): preferida sobre la **[atropina](topic:wvems-2026-drug-reference#atropine)** en pediatría.
    - type: "prose"
      title: "Notas"
      markdown: |
        - Considere colocar **parches** de marcapasos (desfibrilación) en cualquier paciente inestable.
        - **[Marcapasos](topic:wvems-2026-096#pacing)**: puede empezar a **80 lpm / 80 mA**. Aumente los mA según necesidad.
          - Trate el [dolor](topic:wvems-2026-020) y/o la [ansiedad](topic:wvems-2026-046) por el marcapasos en cuanto proceda.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Remítase a [neonato](topic:wvems-2026-050) para cualquier paciente pediátrico de **menos de 1 mes** (≤ 30 días).
        - A menudo es un problema de [respiración](topic:wvems-2026-006): **no olvide el O₂ y la BVM**.
        - Incluso **una sola pastilla** de algunos fármacos puede causar bradicardia grave.
          - Considere [sobredosis](topic:wvems-2026-040) de opiáceos, Ca²⁺ o ß-bloqueantes.
        - Considere los efectos de la medicación materna en la leche materna.
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
