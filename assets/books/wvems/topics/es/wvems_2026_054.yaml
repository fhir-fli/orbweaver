  - page_number: 55
    blocks:
    - type: "prose"
      title: "Imperativos del RCE traumático"
      highlight: true
      markdown: |
        - Lo más importante es priorizar el traslado urgente.
          - **Lleve al paciente al hospital.**
        - Reevalúe y repita la **[descompresión pleural](topic:wvems-2026-096#pleural-decompress)** según necesidad.
          - Repítala de inmediato si se descompensa tras el éxito inicial.
        - Reevalúe y aplique **[torniquetes](topic:wvems-2026-096#tourniquet)** adicionales según necesidad.
          - Aplique presión y **[taponee las heridas](topic:wvems-2026-096#wound-packing)** en la hemorragia de unión.
        - Considere una causa médica concomitante previa al traumatismo.
    - type: "row"
      blocks:
      - type: "prose"
        flex: 6
        title: "Alerta de TRAUMA"
        callout: true
        dashed: true
        call_er: true
        markdown: |
          - Si hay cualquier RCP por trauma
          - O signos vitales inestables
          - Active una alerta de **TRAUMA**
      - type: "prose"
        flex: 5
        title: "Mala perfusión"
        callout: true
        markdown: |
          Sospéchela si hay **varios** de estos:
          - **Alteración del estado mental**
          - Piel pálida, fría, sudorosa
          - Taquicardia, hipotensión
          - Disnea, taquipnea
    - type: "prose"
      title: "Medicamentos"
      markdown: |
        - **[Ketamina](topic:wvems-2026-drug-reference#ketamine)** (Ketalar®): diluya en SSN y **adminístrela despacio en 10 min**.
          - Use la [dosificación pediátrica por peso](topic:wvems-2026-144) en adultos de menos de 110 lbs (50 kg).
    - type: "prose"
      title: "Notas"
      markdown: |
        - Mantenga la **normotermia** (la hipotermia causa coagulopatía y sangrado).
    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Considere la [intubación](topic:wvems-2026-078) y/o el [ventilador](topic:wvems-2026-080) si están indicados y está acreditado para CC.
    - type: "band_callout"
      band: "peds"
      title: "Pediatría"
      markdown: |
        - Use la [referencia pediátrica](topic:wvems-2026-144) u otra fuente aprobada para las dosis pediátricas.
