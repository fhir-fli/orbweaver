topic:

  id: "wvems-2026-006"
  version: "v260101"
  title: "Breathing"
  list_subtitle: "2026-006 · 3-branch severity"
  last_reviewed: "Dec 2025"
  tags: ["breathing", "hypoxia", "oxygen", "bvm", "nippv", "ptx", "pneumothorax", "dyspnea"]
  aliases:
    - "Hypoxia"
    - "Oxygen"
    - "Pneumothorax"
