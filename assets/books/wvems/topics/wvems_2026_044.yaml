  - page_number: 45
    blocks:

    - type: "prose"
      title: "Stroke Imperatives"
      highlight: true
      markdown: |
        - Treatment is time sensitive. Do not delay transport for procedures.
        - **Time Last Normal** is not necessarily when symptoms started.
          - If noticed upon waking up: last normal is when they went to bed.
          - If altered LOC: last normal is when someone saw them normal.
        - **Stroke Survey**: start with the **Cincinnati Stroke** FAST exam.
          - Consider additional screening if able (Stroke VAN or NIHSS).
        - **Elevate** head of bed approximately 30° (helps prevent aspiration).
        - Attempt a **[Saline Lock](topic:wvems-2026-096#saline-lock)** only once. Leave other sites for ED staff.

    - type: "row"
      blocks:
        - type: "prose"
          title: "Cincinnati Stroke"
          callout: true
          markdown: |
            - **F**acial Droop?
            - **A**rm Drift?
            - **S**lurred Speech?
            - **T**ime Last Normal?
        - type: "prose"
          title: "Stroke VAN"
          callout: true
          markdown: |
            Must have **Arm Drift**.
            - **V**ision: Partial / Total Loss?
            - **A**phasia: Trouble Speaking?
            - **N**eglect: Ignoring One Side?

    - type: "prose"
      title: "STROKE Alert"
      callout: true
      dashed: true
      call_er: true
      markdown: |
        - If you suspect a CVA
        - & Last Normal **< 6 h**
        - Call a **STROKE** Alert

    - type: "prose"
      title: "Notes"
      markdown: |
        - Systemic thrombolysis (**tPA**, **TNK**) must occur within **3–6 hours**.
          - Vascular neuro-intervention may be possible out to 24 hours.
        - Encourage family or guardian to accompany patient.
          - There are important decisions to be made quickly at the ED.
          - Record phone number for family or guardian if possible.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Stroke is unlikely in peds. Consider other causes of [Altered LOC](topic:wvems-2026-036).

