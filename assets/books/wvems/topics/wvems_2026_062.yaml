  - page_number: 63
    blocks:

    - type: "prose"

      critical_care_link:
        text: "[Elevated ICP](topic:wvems-2026-086)"
      title: "Head Injury Imperatives"
      highlight: true
      markdown: |
        - Transport emergently if sudden changes in LOC.
        - **Hypoxia** and **Hypotension** are associated with poor outcomes.
          - Investigate and treat for [Hypoxia](topic:wvems-2026-006) and [Hypotension](topic:wvems-2026-008) aggressively.
        - [Anticoagulation](topic:wvems-2026-076) meds (**blood thinners**) increase risk of ICH.
        - **Lacerations** benefit from repair within the first few hours.
        - **Mechanism** predicts severity.

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Consider [Elevated ICP](topic:wvems-2026-086) if indicated & credentialed for Crit Care.

    - type: "prose"
      title: "TRAUMA Alert"
      callout: true
      dashed: true
      call_er: true
      markdown: |
        - If Major Intervention
        - Or Major Mechanism
        - Call a **TRAUMA** Alert

    - type: "prose"
      title: "Notes"
      markdown: |
        - **Skull Fx**: May cause bruising behind ears or around both eyes.
        - **Scalp**: Direct pressure for brisk bleeding (unless skull crepitus/fx).
        - **Neck**: All penetrations should have a chest seal.
        - **Eye**: Use copious saline or water to flush out any contamination.
          - {E} **[Tetracaine](topic:wvems-2026-drug-reference#tetracaine)** (0.5% Ophthalmic): 1–2 gtt prior to flushing.
          - Do not flush penetrating injury. Place **eye shield** over both eyes.
        - **Mouth**: May remove **impaled objects** that compromise [Airway](topic:wvems-2026-004).
        - **Ear**: Check any discharge for CSF by dropping on white paper.
          - A yellow / clear halo suggests CSF leak from skull fracture.
        - **Nose**: Do not attempt to reduce. Treat for [Epistaxis](topic:wvems-2026-076).
        - **Teeth**: Transport avulsed teeth in Hank’s solution or NS.
          - Attempt replantation only in uncomplicated & isolated injury.
        - **Concussion**: Usually does not require EMS intervention.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Do not attempt replantation for primary (baby) teeth.
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.

