  - page_number: 57
    blocks:

    - type: "prose"
      title: "Major Trauma Imperatives"
      highlight: true
      markdown: |
        - Rapid transport is **critical** for massive life-threatening injury.
          - **Get the patient to the hospital**. Definitive care is **in the OR**.
          - Delay transport only to address major threats to life.
          - Secondary survey and treatment can occur during transport.
        - It is appropriate to start with rapid **manual immobilization** only.
          - You may defer placing a [c-collar](topic:wvems-2026-060) to the secondary survey.
          - You should defer extremity splinting to the secondary survey.

    - type: "row"
      blocks:
        - type: "prose"
          flex: 6
          title: "TRAUMA Alert"
          callout: true
          dashed: true
          call_er: true
          markdown: |
            - If Major Intervention
            - Or Major Mechanism
            - Call a **TRAUMA** Alert
        - type: "prose"
          flex: 5
          title: "Poor Perfusion"
          callout: true
          markdown: |
            Suspect if **several** of these:
            - **Altered Mental Status**
            - Skin Pale, Cool, Diaphoretic
            - Tachycardia, Hypotension
            - Dyspnea, Tachypnea

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[NS Bolus](topic:wvems-2026-drug-reference#ns-bolus)** (0.9% Saline): **Target SBP of 90 mmHg**.
          - Use **balanced** resuscitation in hemorrhagic shock (target higher
            if any **head / spine** injury or **pregnancy**).
        - **[Ancef®](topic:wvems-2026-drug-reference#ancef)** (Cefazolin): Provide for any major **open wound**.
          - Monitor closely if PCN allergy; avoid if cephalosporin allergy.
          - Reconstitute powder with normal saline and **shake well** to mix.

    - type: "prose"
      title: "Notes"
      markdown: |
        - Consider IV **fluid warmers** and/or **rapid infusers** if available.
        - Splint **impaled objects** as found (cut wreckage to free patient).
          - May remove only if interfering with airway or resuscitation.

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Consider [Blood](topic:wvems-2026-084) if indicated and credentialed for Critical Care.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.

