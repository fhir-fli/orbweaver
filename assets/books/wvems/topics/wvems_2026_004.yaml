    - type: "prose"
      title: "Airway Imperatives"
      markdown: |
        - Maintain the simplest effective airway. **Escalate only if needed.**
          - Consider **elevating the head** of cot to reduce aspiration risk.
        - If **[BIAD](topic:wvems-2026-096#biad)** fails, **try again with a different size.**
          - Most common failure of a **[BIAD](topic:wvems-2026-096#biad)** is inappropriate size.
        - Use several techniques to confirm airway:
          - Physical Exam: lung sounds, skin color, chest rise, etc.
          - Vitals: rising SpO₂, EtCO₂, waveform capnography (gold standard)
        - Be prepared to escalate airway if signs of **Poor Perfusion**.

    - type: "prose"
      title: "Poor Perfusion"
      callout: true
      markdown: |
        Suspect if **several** of these:
        - **Altered Mental Status**
        - Skin Pale, Cool, Diaphoretic
        - Tachycardia, Hypotension
        - Dyspnea, Tachypnea

    - type: "prose"
      title: "Notes"
      markdown: |
        - Encourage coughing. Use **[Back Blows & Abd. Thrusts](topic:wvems-2026-096#back-blows-thrusts)** for choking.
          - Use **Chest Thrusts** if pregnant or unable to encircle abdomen.
        - Reposition airway with **Jaw Thrust** if any concern for spine injury.
          - Use **Head Tilt / Chin Lift** if medical cause (or if Jaw Thrust fails).
        - Use caution with **[NPA](topic:wvems-2026-096#npa-opa)** if any signs of skull fx. or facial trauma.
        - Secure **[BIAD](topic:wvems-2026-096#biad)** well. Use tape or manufactured holding device.
          - May place c-collar (even without trauma) to help stabilize BIAD.
          - {A} Consider placing an **[OG-Tube](topic:wvems-2026-096#og-tube)** if BIAD will accommodate it.

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Consider [Intubation](topic:wvems-2026-078) if indicated and credentialed for Critical Care.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Be suspicious for an airway obstruction, especially with **stridor**.
        - Use **Chest Thrusts** (instead of Abd. Thrusts) for infants (< 1 y/o).

