    - type: "prose"
      title: "Pregnancy / Delivery Imperatives"
      markdown: |
        - This protocol applies to **late pregnancy** (20 weeks & over).
          - There are no specific EMS interventions for early pregnancy.
          - Uterus palpable above the umbilicus suggests late pregnancy.
        - Any SBP reading **above 160 mmHg** may be **preeclampsia**.
          - Prioritize transport. Call **Medical Control** for any refusal.
        - Aggressively treat any [Seizure](topic:wvems-2026-042) as **eclampsia**.
        - Any maternal trauma after 20 weeks should be transported.
          - Fetus may have injury that is not immediately obvious.
          - Even minor trauma (simple falls, etc.) can cause fetal harm.
        - **Prioritize transport** if any complications (to facility w/ OB/GYN).
        - **Reduce cord** over the head if found around the neck.
        - **[Manage OB Complications](topic:wvems-2026-096#manage-ob-complication)** during transport:
          - **Failed Delivery / Shoulder Dystocia**: transport knees to chest.
          - **Prolapse**: don’t handle cord; relieve pressure with fingers in vagina.
          - **Breech**: do not pull; elevate presenting part if pressing on cord.

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Consider [Preeclampsia](topic:wvems-2026-092) if indicated and credentialed for CC.

    - type: "prose"
      title: "Notes"
      markdown: |
        - Consider **destination triage** to a facility with **OB/GYN** services.
        - Call **Medical Control** with questions regarding medication safety.
        - **Postpartum bleeding** can be severe; **fundal massage** can help.
          - {A} If poor perfusion: **[TXA](topic:wvems-2026-drug-reference#txa)** (Tranex. Acid): **2 g** IV/IO over 10 min.
        - May attempt **home delivery** if uncomplicated and imminent.
          - Crowning and urge to push suggest delivery is imminent.
        - Attempt to have a **chaperone** present for any genital evaluation.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Refer to [Neonate](topic:wvems-2026-050) for management of the newborn baby.

