  - page_number: 81
    blocks:

    - type: "prose"
      title: "Sedation / Vent Mandatory Prerequisites"
      markdown: |
        - In the last 12 months: pass a critical care in-service training.

    - type: "prose"
      title: "Imperatives"
      highlight: true
      markdown: |
        - Monitor patients **closely**. Sedation & **[vents](topic:wvems-2026-096#ventilator)** are a delicate balance.
          - Use clinical sense and vital signs **including SpO₂ and EtCO₂**.
          - Be ready to **titrate settings** and assist with **[Suction](topic:wvems-2026-096#suction)** and [Airway](topic:wvems-2026-004).
        - Use lung protective volumes w/ **[ventilator](topic:wvems-2026-096#ventilator)**. Start at 4-8 mL/kg IBW.
        - Elevate **head of bed to 30°** to help ventilation & limit aspiration.
        - May **increase I:E ratio** (1:5) for obstructive disease (COPD, Asthma).

    - type: "prose"
      title: "Typical Adult Vent Settings"
      markdown: |
        - Mode: **AC (V)** · Vt: **350 mL** (or 450 mL if over 6' tall)
        - BPM: **12-16** /min · FiO₂: **100%** (may titrate down 40-60%)
        - PEEP: **5 mmHg** · PIP Limit: **35 mmHg** · I:E **1:3**

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Fentanyl](topic:wvems-2026-drug-reference#fentanyl)** (Sublimaze®), **[Versed](topic:wvems-2026-drug-reference#versed)** (Midazolam®): Use together.
          - One without the other is unlikely to produce adequate sedation.
        - **[Ketamine](topic:wvems-2026-drug-reference#ketamine)** (Ketalar®): Useful for peds and asthmatics.
          - Double dose for IM (watch concentration: max 3 mL per IM inj.)
        - **[Propofol](topic:wvems-2026-drug-reference#propofol)** (Diprivan®): Start gtt near 150 mcg/kg/min.
          - **Use only with an IV pump** and an accurate patient weight.
          - Titrate to effect, aim for 30-50% **reduction** in the first 30 min.
          - For elderly or debilitated: start lower (100 mcg/kg/min).
          - For peds: start higher (200 mcg/kg/min).

