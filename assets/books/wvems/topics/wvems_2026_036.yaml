  - page_number: 37
    blocks:

    - type: "prose"
      title: "Altered LOC Imperatives"
      highlight: true
      markdown: |
        - Altered LOC and syncope are **complex** problems.
          - Most important step is to consider and **search for the cause**.
          - Investigate the case and take a **careful history**.
        - Unstable patients should be treated aggressively.
          - Be prepared for a [Medical CODE](topic:wvems-2026-024).
        - Alcohol and drugs can mask other causes of altered LOC.
          - **Don’t assume [Intoxication](topic:wvems-2026-040)** is the only problem.
        - Syncope may be caused by or result in **trauma**.
          - Maintain a high index of suspicion.

    - type: "prose"
      title: "Notes"
      markdown: |
        - Consider an atypical [Cardiac](topic:wvems-2026-028) cause in diabetics and the elderly.
        - Check for **medical jewelry**.

    # Print p.37 sets the GCS scoring bullets to the LEFT of the GCS table
    # rather than above it. Both halves are narrow (longest bullet 22 chars,
    # and the same table already lives in a row on p.87), so the pairing
    # survives a 181 px slot.

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Consider [Sepsis](topic:wvems-2026-094) if indicated and credentialed for Critical Care.
    - type: "row"
      blocks:
        - type: "prose"
          flex: 4
          markdown: |
            May investigate pt’s GCS:
            - Check each response
            - Repeat **as needed**
            - Record the **best effort**
            - Add the three numbers
            - Normal score is **15**
            - Worst score is **3**
        - type: "table"
          # 6:4 against the prose beside it — at 1:1 the four columns are too
          # narrow and "confused" / "withdraw" / "localizes" break mid-word.
          flex: 6
          title: "Glasgow Coma Scale"
          columns: ["Eyes", "Verbal", "Motor", ""]
          column_flex: [3, 3, 3, 1]
          rows:
            - cells: ["none", "none", "none", "1"]
            - cells: ["pain", "moaning", "extensor", "2"]
            - cells: ["verbal", "words", "flexor", "3"]
            - cells: ["normal", "confused", "withdraw", "4"]
            - cells: ["", "normal", "localizes", "5"]
            - cells: ["", "", "normal", "6"]

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Many causes of transient syncope are benign, but:
          - Prolonged altered LOC indicates potentially serious pathology.
          - Syncope **during exertion** can be a true cardiac emergency.

