topic:

  id: "wvems-2026-024"
  version: "v260101"
  title: "Medical CODE"
  list_subtitle: "2026-024 · Compressions / AED / Epi / Amio"
  last_reviewed: "Dec 2025"
  tags:
    - "medical code"
    - "cardiac arrest"
    - "cpr"
    - "vt/vf"
    - "pea"
    - "asystole"
    - "epinephrine"
    - "amiodarone"
  aliases:
    - "Cardiac Arrest"
    - "CPR"
    - "VT/VF"
    - "PEA"
    - "Asystole"
  category: "medical"

  # Sticky: flowchart page + prose page each snap to a full screen.
  layout: "paged"

  pages:

  - page_number: 24
    blocks:

    # ────────────────────────────────────────────────
    # Flowchart block (severity variant — 3 prioritized jobs)
    #   entry → Assign Jobs → Compressions / AED / Support
    # ────────────────────────────────────────────────
    - type: "flowchart"
      variant: "severity"

      entry:
        text: "No Pulse\nNo Obvious Death\nNo DNR/POST"
        shape: "stadium"

      decision:
        text: "Assign Jobs"
        shape: "diamond"

      branches:

        - id: "first"
          label: "1. Compressions"
          criteria:
            - "Most important"
            - "Start Immediately"
            - "Minimize Breaks"
          actions:
            - text: "Chest Compression"
              kind: "procedure"

        - id: "second"
          label: "2. AED"
          criteria:
            - "Cut Clothes"
            - "Work around CPR"
            - "Analyze Q 2 min"
          actions:
            - text: "Defib"
              kind: "procedure"
              condition: "If Advised"

        - id: "third"
          label: "3. Support"
          criteria:
            - "Establish [Airway](topic:wvems-2026-004)"
            - "Provide [Breathing](topic:wvems-2026-006)"
            - "Use IV or IO access"
          actions:
            - provider_level: "I"
              text: "Epi"
              kind: "medication_administration"
            - provider_level: "I"
              text: "Amio"
              kind: "medication_administration"
              condition: "If VT/VF"

      convergence:
        text: "Disposition"
        shape: "stadium"
        bullets:
          - text: "{E} BLS: Get ALS ASAP"
          - text: "{I} ALS: [Try 30 min](topic:wvems-2026-109#termination-of-resuscitation)"

      dose_table:
        - drug: "[Epi](topic:wvems-2026-drug-reference#epi-epi-neb)"
          dose: "1 mg"
          route: "IV/IO"
          frequency: "Q 5 min"
          population: "adult"
        - drug: "[Amiodarone](topic:wvems-2026-drug-reference#amiodarone)"
          dose: "300 → 150 mg"
          route: "IV/IO"
          frequency: "Q 5 min x2"
          population: "adult"
        - drug: "[Epi](topic:wvems-2026-drug-reference#epi-epi-neb)"
          dose: "0.01 mg/kg"
          route: "IV/IO"
          frequency: "Q 5 min"
          population: "peds"
        - drug: "[Amiodarone](topic:wvems-2026-drug-reference#amiodarone)"
          dose: "5 mg/kg"
          route: "IV/IO"
          frequency: "Q 5 min x3"
          population: "peds"

  - page_number: 25
    blocks:

    - type: "prose"
      title: "CODE Imperatives"
      highlight: true
      markdown: |
        - Start compressions in place.
          - Transport ASAP if **ROSC**, or **peds**, or **pregnant**, or any [Special Case](topic:wvems-2026-109#termination-of-resuscitation).
        - {E} **BLS**: Get ALS ASAP. [Transport](topic:wvems-2026-109#termination-of-resuscitation) if witnessed by EMS or any shock.
        - {I} **ALS**: Try for **30 min**. If no ROSC: [Call for Termination](topic:wvems-2026-109#termination-of-resuscitation).

    # Print p.25 floats Compressions into the right margin beside the
    # Imperatives, and Obvious Death beside the Medications. Neither of those
    # pairings survives 181 px (halving a 60-95 char bullet list costs more
    # height than the small box saves), so the two narrow boxes are paired
    # with each other instead — same band, same space saving.
    - type: "row"
      blocks:
        - type: "prose"
          title: "Compressions"
          markdown: |
            - Adult/Peds: **120 /min**
            - OPA/NPA: **30:2** w/ BVM
            - BIAD/ETT: **Continuous**
        - type: "prose"
          title: "Obvious Death"
          markdown: |
            - Pooling Lividity
            - Rigor Mortis
            - Body Decomposition

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Amiodarone](topic:wvems-2026-drug-reference#amiodarone)** (Pacerone®):
          - For adults, give twice (x2) Q 5 min
            - (1) 300 mg → (2) 150 mg
          - For peds, give 5 mg/kg three times (x3) Q 5 min
        - Consider adjunct meds for pulseless polymorphic VT arrest:
          - {I} **[Magnesium](topic:wvems-2026-drug-reference#magnesium)** (Sulfate): 2 grams IV/IO x1 for Torsades

    - type: "prose"
      title: "Notes"
      markdown: |
        - Use caution with **[compressions](topic:wvems-2026-096#chest-compression)** and **[defib](topic:wvems-2026-096#defib)** in a moving vehicle.
        - **EtCo2** can help identify ROSC and guide termination decision.
        - A well run CODE should operate like a **pit crew**. Focus on your job.
        - Consider causes: [Shock](topic:wvems-2026-008), [OD/Tox](topic:wvems-2026-040), [Hypoglycemia](topic:wvems-2026-038), [Hyperkalemia](topic:wvems-2026-018), etc.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Use 15:2 compression ratio for dual rescuer BLS resuscitation.
        - Refer to [Neonate](topic:wvems-2026-050) for any peds **under 1 month** (≤ 30 days) old.
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.

    - type: "prose"
      title: "References"
      text_scale: 0.8
      markdown: |
        - ACLS — https://www.ahajournals.org/doi/10.1161/CIR.0000000000001376 [Ver: 2025]
        - PALS — https://www.ahajournals.org/doi/full/10.1161/CIR.0000000000001368 [Ver: 2025]
        - Medscape CPR — https://emedicine.medscape.com/article/1344081 [Ver: 8/21]
        - Limmer D, O’Keefe MF. **Emergency Care** 15th ed. Chapter 20, 21
