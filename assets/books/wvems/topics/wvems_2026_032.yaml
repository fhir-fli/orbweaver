  - page_number: 33
    blocks:

    - type: "prose"
      title: "Allergic Reaction Imperatives"
      highlight: true
      markdown: |
        - Airway symptoms and facial swelling indicate a **major reaction**.
          - Lip and tongue swelling can be an immediate life threat.
        - {A} **Use IM** meds (or IV/IO if available) for any patient in extremis.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Epi](topic:wvems-2026-drug-reference#epi-epi-neb)** (Epinephrine): **Use IM**. Treat major reactions **aggressively**.
          - Use for any major [Airway](topic:wvems-2026-004), [Breathing](topic:wvems-2026-006) or [Circulation](topic:wvems-2026-008) problems.
          - **Be cautious** in patients over 50 y/o or with CAD or chest pain.

    - type: "band_callout"
      band: "peds"
      title: ""
      markdown: |
        - **EpiPen Jr.®**: Use for 3–8 y/o.  **EpiPen®**: Use for 9+ y/o.

    - type: "prose"
      title: ""
      markdown: |
        - {E} May only use auto-injector or color coded admin system.
        - {I} Consider an **[Epi Drip](topic:wvems-2026-drug-reference#epi-drip-epi-push)** for persistent [dyspnea](topic:wvems-2026-030) or [shock](topic:wvems-2026-008).
        - **[Albuterol](topic:wvems-2026-drug-reference#albuterol)** (Ventolin®): Use for any dyspnea or wheezing.
          - Unlikely to help with rash or itching. May cause palpitations.
        - **[Decadron®](topic:wvems-2026-drug-reference#decadron)** (Dexamethasone): Alternate dose: 8 mg IV/IO, IM x1
        - **[Benadryl®](topic:wvems-2026-drug-reference#benadryl)** (Diphenhydramine): May give adults **50 mg PO x1**.
          - {E} May only give PO (may use OTC formulation and dosing).

    - type: "prose"
      title: "Poor Perfusion"
      callout: true
      markdown: |
        Suspect if **several** of these:
        - **Altered Mental Status**
        - Skin Pale, Cool, Diaphoretic
        - Tachycardia, Hypotension
        - Dyspnea, Tachypnea

    - type: "prose"
      title: "Notes"
      markdown: |
        - Rapid onset of symptoms indicates a more severe reaction.
        - Severe food allergies may also induce N/V and abdominal pain.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.

