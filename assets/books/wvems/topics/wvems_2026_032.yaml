  - page_number: 33
    blocks:

    - type: "prose"
      title: "Allergic Reaction Imperatives"
      highlight: true
      markdown: |
        - Airway symptoms and **facial swelling** indicate a major reaction.
          - Lip and tongue swelling can be an immediate life threat.
        - **A** Use IM meds (or IV/IO if available) for any patient in extremis.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Epi](topic:wvems-2026-drug-reference#epi-epi-neb)** (Epinephrine): use **IM**. Treat major reactions aggressively.
          - Use for any major **[Airway](topic:wvems-2026-004), [Breathing](topic:wvems-2026-006) or [Circulation](topic:wvems-2026-008)** problems.
          - Be cautious in patients **over 50 y/o** or with CAD or chest pain.
          - **EpiPen Jr.®**: use for 3–8 y/o. **EpiPen®**: use for 9+ y/o.
        - **[Albuterol](topic:wvems-2026-drug-reference#albuterol)** (Proventil®, Ventolin®): nebulised for bronchospasm.
        - **Atrovent** (Ipratropium): nebulised — give once with first Albuterol.
        - **[Benadryl](topic:wvems-2026-drug-reference#benadryl)** (Diphenhydramine): blunts the histamine response.
          - Sedating — use caution if monitoring mental status.
        - **[Decadron](topic:wvems-2026-drug-reference#decadron)** (Dexamethasone): single steroid dose to delay rebound.

    - type: "prose"
      title: "Notes"
      markdown: |
        - Be ready to repeat **Epi** if symptoms persist or rebound.
        - Patients on **beta-blockers** may be refractory to Epi —
          consider **Glucagon** if available.
        - **Biphasic** reactions can recur 4–12 h after the initial response.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Use **EpiPen Jr.®** for 3–8 y/o; **EpiPen®** for 9+ y/o.
        - Use [Peds Reference](topic:wvems-2026-144) for all other weight-based dosing.

