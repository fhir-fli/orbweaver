  - page_number: 85
    blocks:

    - type: "prose"
      title: "Blood Mandatory Prerequisites"
      highlight: true
      markdown: |
        - In the last 12 months: pass a critical-care in-service training.
        - Ensure blood is **stored and maintained** per supplier’s instruction.

    - type: "prose"
      title: "Imperatives"
      markdown: |
        - **NS vs. Blood** is a clinical decision. There is no perfect answer.
          - **NS Bolus** may be good for easily controlled external bleeding.
          - Switch to blood quickly if perfusion does not respond rapidly.
          - Providers **may start with blood** for critically unstable bleeding.
          - Use for overt massive exsanguination (**trauma**, GI, post-partum).
        - **Target SBP of 90 mmHg** regardless of NS vs. Blood.
          - Use **balanced** resuscitation in hemorrhagic shock.
          - Target higher if any **head / spine** injury or **pregnancy**.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[NS Bolus](topic:wvems-2026-drug-reference#ns-bolus)** (0.9% Saline): May skip **NS** for patients in extremis.
        - **Blood** (LTOWB): **Verify** the environmental control tag.
          - Use special tubing & **heater**. Watch for **transfusion reactions**.
          - Stop immediately if any [fever](topic:wvems-2026-016), [dyspnea](topic:wvems-2026-030) or [allergic reaction](topic:wvems-2026-032).
          - **Tell the ED** about any blood administered, and any reactions.

    - type: "prose"
      title: "Notes"
      markdown: |
        - If possible, ask about any **religious objections** before transfusion.
          - **If altered**: may check for medical jewelry or in patient’s wallet.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Provide **Blood** in aliquots of **10 mL/kg**. May repeat PRN.
        - Titrate to low end of age-adjusted SBP (listed in [Peds Reference](topic:wvems-2026-144)).

