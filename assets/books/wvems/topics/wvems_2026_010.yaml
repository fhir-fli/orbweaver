    # Flowchart block (severity variant — 2 branches, no meds)
    # ────────────────────────────────────────────────
    - type: "flowchart"
      variant: "severity"

      entry:
        text: "Systolic Over\nAdult (14+): 240 mmHg\nChild (1–13): 220 mmHg\nInfant (<1): 200 mmHg"
