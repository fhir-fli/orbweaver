  - page_number: 10
    blocks:

    # ────────────────────────────────────────────────
    # Flowchart block (severity variant — 2 branches, no meds)
    # ────────────────────────────────────────────────
    - type: "flowchart"
      variant: "severity"

      entry:
        text: "Systolic Over"
        shape: "stadium"
        bands:
          - label: "Adult (14+)"
            value: "240 mmHg"
          - label: "Child (1–13)"
            value: "220 mmHg"
          - label: "Infant (< 1)"
            value: "200 mmHg"


      decision:
        text: "Severity?"
        shape: "diamond"

      branches:

        - id: "minor"
          label: "Minor"
          criteria:
            - "No Distress"
            - "No Pain"
          actions:
            - text: "Position of Comfort"
              kind: "procedure"

        - id: "major"
          label: "Major"
          criteria:
            - "Chest Pain, SOB"
            - "Headache"
          actions:
            - provider_level: "E"
              text: "12-Lead"
              kind: "diagnostic"
            - provider_level: "A"
              text: "Saline Lock"
              kind: "procedure"

      convergence:
        text: "Consider"
        shape: "stadium"
        bullets:
          - text: "[Pain](topic:wvems-2026-020), [Pregnancy](topic:wvems-2026-048), [Seizure](topic:wvems-2026-042)"
          - text: "[Cardiac](topic:wvems-2026-028), [SOB](topic:wvems-2026-030), [Stroke](topic:wvems-2026-044)"
          - text: "[Malignant HTN](topic:wvems-2026-092)"

  - page_number: 11
    blocks:

    - type: "prose"
      title: "Hypertension Imperatives"
      highlight: true
      markdown: |
        - Confirm elevated systolic BP with two reliable blood pressures.
        - HTN is a frequent reaction to [Pain](topic:wvems-2026-020) and acute physiologic insult.
          - Investigate and **treat pain** & **underlying causes** first.
        - Even mild HTN (SBP > 160 mmHg) in late [Pregnancy](topic:wvems-2026-048) may be pathologic.
          - It may progress to **eclampsia**. Be ready to treat for [Seizures](topic:wvems-2026-042).

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Consider [Preeclampsia](topic:wvems-2026-092) if indicated and credentialed for CC.

    - type: "prose"
      title: ""
      markdown: |
        - Inappropriate use of antihypertensives can **cause harm**.
          - Lowering BP during a stroke can **cause harm**.

    - type: "prose"
      title: "Notes"
      markdown: |
        - Many other **underlying causes** can result in significant HTN.
          - Consider [Cardiac](topic:wvems-2026-028) pathology if any chest pain.
          - Consider [Dyspnea](topic:wvems-2026-030) and CHF if any rales or pedal edema.
          - Consider [OD/Tox](topic:wvems-2026-040) if any recent stimulant or illicit drug use.
          - Consider [Stroke](topic:wvems-2026-044) if any acute focal neurologic deficits.
          - Consider [Behavioral](topic:wvems-2026-046) if anxiety from recent emotional triggers.
          - Consider [Head Injury](topic:wvems-2026-062) if any history of trauma or signs of injury.
        - Ask about new or recent changes to cardiac or **BP medications**.

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Consider [Malignant HTN](topic:wvems-2026-092) if indicated and credentialed for CC.
        - Consider [Pulmonary Edema](topic:wvems-2026-090) if indicated and credentialed for CC.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Pathologic HTN is unlikely in peds. Treat underlying causes.

