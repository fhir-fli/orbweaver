  - page_number: 11
    blocks:

    # ────────────────────────────────────────────────
    # Prose blocks (notes page)
    # ────────────────────────────────────────────────

    - type: "prose"
      title: "Hypertension Imperatives"
      highlight: true
      markdown: |
        - Confirm elevated systolic BP with **two reliable** blood pressures.
        - HTN is a frequent reaction to [Pain](topic:wvems-2026-020) and acute physiologic insult.
          - Investigate and treat **pain & underlying causes first**.
        - Even mild HTN (SBP > 160 mmHg) in late [Pregnancy](topic:wvems-2026-048) may be pathologic.
          - It may progress to **eclampsia**. Be ready to treat for [Seizures](topic:wvems-2026-042).
        - Inappropriate use of antihypertensives can cause harm.
          - **Lowering BP during a stroke can cause harm.**

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Consider [Preeclampsia](topic:wvems-2026-092) if indicated and credentialed for CC.

    - type: "prose"
      title: "Notes"
      markdown: |
        - Beta-blocker use prior to **Cocaine** can result in unopposed alpha
          stimulation — significantly worsens HTN and may cause cardiac ischemia.
        - Hypertensive emergencies require careful titrated therapy in the ED.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Hypertension is unusual in peds — investigate the underlying cause.
        - Use **Peds Reference** or other approved source for peds dosing.

    - type: "prose"
      title: "References"
      markdown: |
        - Medscape HTN Emergency — https://emedicine.medscape.com/article/1952052 [Ver: 8/24]
        - Limmer D, O’Keefe MF. Emergency Care 15th ed. Chapter 17.

