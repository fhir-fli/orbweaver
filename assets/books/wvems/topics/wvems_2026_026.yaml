    - type: "prose"
      title: "Medical ROSC Imperatives"
      highlight: true
      markdown: |
        - Ensure adequate resuscitation **before** attempting transport.
          - Move expeditiously but with caution. **Don’t sacrifice stability.**
        - Monitor closely for [Hypotension](topic:wvems-2026-008). Be ready with fluids & pressors.
        - Avoid hyperventilation. It can cause [Hypotension](topic:wvems-2026-008) & repeat arrest.
        - Monitor body temp and treat any [Fever](topic:wvems-2026-016) aggressively with meds.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **[Ketamine](topic:wvems-2026-drug-reference#ketamine)** (Ketalar®): Dilute in NS and **give slowly over 10 min**.
          - Use [weight-based peds dosing](topic:wvems-2026-144) for adults under 110 lbs (50 kg).
        - Consider maintenance drip if **prior VT/VF** & **transport > 30 min**:
          - {I} **[Amiodarone](topic:wvems-2026-drug-reference#amiodarone)** (Pacerone®): 1 mg/min IV/IO, adult only.

    - type: "prose"
      title: "Notes"
      markdown: |
        - **EtCO₂** can help identify ROSC. Monitor during resuscitation.
        - Therapeutic hypothermia is **not included** in this protocol.
          - Also known as "targeted temperature management".

    - type: "band_callout"
      band: "critical_care"
      title: ""
      markdown: |
        - Consider [Intubation](topic:wvems-2026-078) and/or [Vent](topic:wvems-2026-080) if indicated and credentialed for CC.

    - type: "band_callout"
      band: "peds"
      title: "Pediatrics"
      markdown: |
        - Arrhythmias are common after ROSC, but are usually self-limited.
        - Use [Peds Reference](topic:wvems-2026-144) or other approved source for peds dosing.

