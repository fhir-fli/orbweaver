  privacy_url: https://fhir-fli.github.io/fhir_fli_documentation/orbweaver-privacy
  sources:
  - title: 'Quick Reference: Basic Protocols in Paediatrics and Internal Medicine for Resource Limited Settings'
    by: J. Grey Faulkenberry, MD MPH
    note: El ProtocolBook. Escrito por el autor de esta aplicación.
