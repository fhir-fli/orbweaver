# ============================================================
# ProtocolBook p.13 — Paediatric Advanced Life Support Algorithm
#
# Schema features exercised by this page:
#   - entry_chain: 3 sequential boxes before the branch fork
#     (Safe/Stimulate/Shout → Assess → Unresponsive-decision)
#   - branch severity tinting (emergency=red, priority=yellow)
#   - convergence.exits: labeled arrows out of "Re-assess ABC"
#     - "Improvement" → loopback annotation to yellow branch
#     - "No change"   → labeled forward arrow to post_convergence
#   - post_convergence: the 6-step "continue cycles" box below
# ============================================================

topic:
  id: "pb-pals-algorithm"
  title: "Paediatric Advanced Life Support"
  last_reviewed: "pocketbook v1.7"
  tags: ["pals", "pediatric", "resuscitation", "emergency"]
  category: "medical"
  page_number: 13

  blocks:

    - type: "flowchart"
      variant: "severity"

      entry_chain:
        - text: "Safe, Stimulate, Shout for Help — move child to emergency area (as long as can be safely moved)"
          shape: "rectangle"
        - text: "Assess breathing and pulse — look, listen, feel for 5–10 seconds"
          shape: "rectangle"
        - text: "Unresponsive, not breathing, or only occasional gasps"
          shape: "diamond"

      branches:
        - id: "slow"
          label: "< 60 bpm (or no pulse)"
          severity: "emergency"
          actions:
            - text: "15 chest compressions : 2 rescue breaths with bag-valve mask for 2 minutes (rotate rescuer every 2 minutes)"
              kind: "procedure"
            - text: "Establish IV/IO access"
              kind: "procedure"
            - text: "Epinephrine 0.1 ml/kg 1:10,000 (mix 1 ml of 1:1,000 in 9 ml normal saline)"
              kind: "medication_administration"
            - text: "Dextrose 10% 5 ml/kg (mix 8 ml normal saline with 2 ml D50%)"
              kind: "medication_administration"
        - id: "palpable"
          label: "> 60 bpm, pulse palpable"
          severity: "priority"
          actions:
            - text: "Open airway / reposition head"
              kind: "procedure"
            - text: "1 breath every 3–5 seconds (12–20 breaths/min) with oxygen"
              kind: "procedure"
            - text: "Establish IV/IO access"
              kind: "procedure"
            - text: "Dextrose 10% 5 ml/kg (mix 8 ml normal saline with 2 ml D50%)"
              kind: "medication_administration"
            - text: "Continue examination to establish cause and treat"
              kind: "assessment"

      convergence:
        text: "Re-assess ABC"
        shape: "rounded_rectangle"
        exits:
          - label: "Improvement"
            loopback: "palpable"
          - label: "No change"

      post_convergence:
        text: |
          Continue cycles: 15 compressions : 2 breaths for 2 minutes
          Place NGT
          Reassess ABC every 2–3 minutes
          If pale, consider transfusion
          Second epinephrine dose after 3–5 minutes
          If no improvement after 15 minutes, consider stopping
        shape: "rectangle"
