# ============================================================
# ProtocolBook p.14 — Adult Cardiac Arrest Algorithm
#
# Schema features exercised:
#   - TopicBranch.continuation on the No-Pulse branch
#     (asymmetric flow — right branch terminates, left continues)
#   - entry_arrow_label "Every 2 minutes" labels the arrow from the
#     branch's action list into its first continuation node
#   - H's and T's as a plain two-column table block
#   - High-Quality CPR as a highlighted prose callout
# ============================================================

topic:
  id: "pb-adult-cardiac-arrest"
  title: "Adult Cardiac Arrest"
  last_reviewed: "pocketbook v1.7"
  tags: ["acls", "adult", "cardiac_arrest", "cpr", "resuscitation", "emergency"]
  category: "critical_care"
  page_number: 14

  blocks:

    - type: "flowchart"
      variant: "severity"

      entry_chain:
        - text: "Safe, Stimulate, Shout for Help — move patient to emergency area (as long as can be safely moved)"
          shape: "rectangle"
        - text: "CHECK PULSE: DEFINITE pulse palpated within 10 seconds?"
          shape: "diamond"

      branches:
        - id: "no_pulse"
          label: "No Pulse"
          severity: "emergency"
          actions:
            - text: "Continuous compressions until bag-valve mask available"
              kind: "procedure"
            - text: "30 compressions : 2 breaths"
              kind: "procedure"
            - text: "Attach O2 to bag-valve mask"
              kind: "procedure"
            - text: "Epinephrine 1 mg IV in 10 ml normal saline, followed by 20 ml normal saline flush"
              kind: "medication_administration"
          continuation:
            entry_arrow_label: "Every 2 minutes"
            nodes:
              - text: "Change compressors · Check pulse ≤ 10 sec · Epinephrine 1 mg IV in 10 ml NS, 20 ml flush"
                shape: "rectangle"
              - text: "Identify and treat reversible causes"
                shape: "rectangle"

        - id: "definite_pulse"
          label: "Definite Pulse"
          severity: "priority"
          actions:
            - text: "Open, maintain airway"
              kind: "procedure"
            - text: "1 breath every 6 seconds"
              kind: "procedure"
            - text: "Recheck pulse every 2 min"
              kind: "assessment"
              timing: "every 2 min"
            - text: "→ Post Cardiac Arrest Algorithm"
              kind: "referral"

    - type: "table"
      columns: []
      rows:
        - cells:
            - "**H**ypoglycaemia"
            - "**T**ension Pneumothorax"
        - cells:
            - "**H**ypovolemia"
            - "**T**amponade, cardiac"
        - cells:
            - "**H**ypoxia"
            - "**T**oxins"
        - cells:
            - "**H**ydrogen ion (acidosis)"
            - "**T**hrombosis, pulmonary"
        - cells:
            - "**H**ypo- / Hyperkalaemia"
            - "**T**hrombosis, coronary"
        - cells:
            - "**H**ypothermia"
            - ""

    - type: "prose"
      title: "High-Quality CPR"
      highlight: true
      markdown: |
        - **Compression rate** at least 100/min
        - **Compression depth** at least 5 cm
        - **Allow complete chest recoil** after each compression
        - **Minimize interruptions** in chest compressions to < 10 seconds
        - **Avoid excessive ventilation** — give just enough volume to produce visible chest rise. Give 2 breaths every 30 compressions, or 1 breath every 6 seconds if intubated.
