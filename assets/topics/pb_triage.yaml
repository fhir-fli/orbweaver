# ============================================================
# Pocketbook p.12 — Paediatric Triage of Sick Children
# Three-tier triage: emergency / priority (3TPR-MOB) / non-urgent.
# Emergency has 4 sign-clusters (Airway, Circulation, Disability,
# Severe Diarrhoea) that all feed the same 9-step action list.
# ============================================================

topic:
  id: "pb-triage-sick-children"
  title: "Paediatric Triage of Sick Children"
  last_reviewed: "pocketbook v1.7"
  tags: ["triage", "pediatric", "emergency"]
  category: "medical"
  page_number: 12

  blocks:

    # ─────────────── Triage matrix ───────────────
    - type: "table"
      title: "Assess and treat"
      columns: ["Assess", "Treat"]
      rows:

        - severity: "emergency"
          cells:
            - |
              **Emergency signs** — any positive:

              **Airway & Breathing**
              - Obstructed breathing
              - Central cyanosis
              - Severe respiratory distress
              - Weak / absent breathing

              **Circulation** — cold hands with any of:
              - Cap refill > 3 sec
              - Weak + fast pulse
              - Slow (< 60 bpm) or absent pulse

              **Disability**
              - Coma
              - Convulsions
              - Confusion (AVPU: V, P, or U)

              **Severe diarrhoea** — with any of:
              - Lethargy / unconscious
              - Unable to drink / drinks poorly
              - Skin pinch goes back slowly
              - Sunken eyes
            - |
              1. Call for help
              2. Transfer to emergency bed
              3. Give oxygen via nasal cannula
              4. Start IV
              5. Check vitals (Weight, HR, RR, BP)
              6. Draw blood — Hb, malaria, type & cross if pale (red and purple tube)
              7. D10% 5 ml/kg IV
              8. If convulsions: **diazepam IV or PR**
              9. Keep patient warm

        - severity: "priority"
          cells:
            - |
              **Priority signs (3TPR-MOB)** — any positive:

              - **T**iny — sick infant < 2 months
              - **T**emperature — very high or very low
              - **T**rauma — major trauma
              - **P**ain — child in severe pain
              - **P**oisoning — mother reports poisoning
              - **P**allor — severe palmar pallor
              - **R**estless / irritable / floppy
              - **R**espiratory distress
              - **R**eferral — has an urgent referral letter
              - **M**alnutrition — visible severe wasting
              - **O**edema of both feet
              - **B**urns — severe burns
            - |
              **Front of the queue:**
              - Clinical review ASAP
              - Weigh
              - Baseline observations and vital signs

        - severity: "non_urgent"
          cells:
            - |
              **Non-urgent** — children with none of the above signs.
            - |
              Proceed with routine assessment and treatment according to the child's priority.
