  - page_number: 53
    blocks:

    - type: "prose"
      title: "CODE Imperatives"
      highlight: true
      markdown: |
        - Place **Tourniquets** if needed.
          - Limiting blood loss is critical.
        - Try bilateral **Pleural Decompression**.
          - Hidden tension pneumothorax may cause traumatic arrest.
        - This protocol applies to cardiac arrest caused by **severe trauma**.
          - Refer to **Medical CODE** for arrest with only incidental injuries.
        - Definitive treatment for traumatic arrest is the operating room.
          - Prioritize compression, tourniquets and **transport ASAP**.

    - type: "prose"
      title: "Compressions"
      markdown: |
        - Adult/Peds: **120 /min**
        - OPA/NPA: **30:2** w/ BVM
        - BIAD/ETT: **Continuous**

    - type: "prose"
      title: "TRAUMA Alert"
      callout: true
      markdown: |
        - If Any Trauma CPR
        - Or Unstable Vitals
        - Call a **TRAUMA** Alert

    - type: "prose"
      title: "Mortal Injuries"
      markdown: |
        - Decapitation or Exposed Brain
        - Destruction of Trunk or Organs
        - Burned Beyond Recognition
        - Massive Blunt Force, Explosion
        - Over 30 min Since Arrest

    - type: "prose"
      title: "Medications"
      markdown: |
        - **NS Bolus** (0.9% Saline): **Target SBP of 90** mmHg
          - Use **balanced** resuscitation in hemorrhagic shock
          - Target higher if any **head/spine** injury or **pregnancy**.
        - **Amiodarone**: Adults give twice (x2) Q 5 min, 300 → 150 mg
          - For peds, give 5 mg/kg three times (x3) Q 5 min

    - type: "prose"
      title: "Notes"
      markdown: |
        - Use caution with **compressions** and **defib** in a moving vehicle.
        - **EtCo2** can help identify ROSC and guide termination decision.
        - A well run CODE should operate like a **pit crew**. Focus on your job.

    - type: "prose"
      title: "Pediatrics"
      highlight: true
      markdown: |
        - Use **Peds Reference** or other approved source for peds dosing.

    - type: "prose"
      title: "References"
      markdown: |
        - ATLS® — https://www.facs.org/quality-programs/trauma/education/advanced-trauma-life-support/ [Ver: 11th]
        - NAEMSP Mortal Injuries — https://doi.org/10.3109/10903127.2012.755586 [Ver: 1/13]
        - Limmer D, O'Keefe MF. **Emergency Care** 15th ed. Chapter 29, 34
