    # ────────────────────────────────────────────────
    # Flowchart block (severity variant — 3 prioritized jobs)
    #   entry → Assign Jobs → Compressions / Trauma Care / Medical Care
    # ────────────────────────────────────────────────
    - type: "flowchart"
      variant: "severity"

      entry:
        text: "No Pulse\nNo Mortal Injury\nNo DNR/POST"
        shape: "stadium"

      decision:
        text: "Assign Jobs"
        shape: "diamond"

      branches:

        - id: "first"
          label: "1. Compressions"
          criteria:
            - "Most important"
            - "Start Immediately"
            - "Minimize Breaks"
          actions:
            - text: "Chest Compression"
              kind: "procedure"

        - id: "second"
          label: "2. Trauma Care"
          criteria:
            - "Control Bleeding"
            - "Treat Circulation"
            - "Airway / Breathing"
          actions:
            - text: "Tourniquet"
              kind: "procedure"
            - provider_level: "I"
              text: "Pleural Decompress"
              kind: "procedure"
            - provider_level: "A"
              text: "NS Bolus"
              kind: "medication_administration"

        - id: "third"
          label: "3. Medical Care"
          criteria:
            - "Try Medical CODE"
            - "Analyze Q 2 min"
            - "Use IV or IO access"
          actions:
            - text: "Defib"
              kind: "procedure"
              condition: "If Advised"
            - provider_level: "I"
              text: "Epi"
              kind: "medication_administration"
            - provider_level: "I"
              text: "Amio"
              kind: "medication_administration"
              condition: "If VT/VF"

      convergence:
        text: "Disposition"
        shape: "stadium"
        bullets:
          - text: "Transport ASAP"

      dose_table:
        - drug: "NS Bolus"
          dose: "500 mL"
          route: "IV/IO"
          frequency: "x4"
          population: "adult"
        - drug: "Epi"
          dose: "1 mg"
          route: "IV/IO"
          frequency: "Q 5 min"
