  - page_number: 71
    blocks:

    - type: "prose"
      title: "Burn Imperatives"
      highlight: true
      markdown: |
        - Use **ABLS fluid rate** (may use **NS** or **LR**). Watch for **Hypothermia**.
        - Monitor **Airway** closely with any facial, nasal or oral burns.
        - Some chemical burns (e.g. **HF acid**) may benefit from an **Antidote**.
        - Monitor **EKG** for electrical burns > **1,000 v**.
        - Remove adjacent and distal jewelry if able.

    - type: "row"
      blocks:
        - type: "prose"
          title: "ABLS rate"
          callout: true
          markdown: |
            - 14+ y/o: **500 mL/hr**
            - 6–13 y/o: **250 mL/hr**
            - 0–5 y/o: **125 mL/hr**
        - type: "prose"
          title: "Rule of 9's (Adult)"
          callout: true
          markdown: |
            - Head: **9%**
            - Each arm: **9%**
            - Front torso: **18%**
            - Back torso: **18%**
            - Each leg: **18%**
            - Perineum: **1%**

    - type: "prose"
      title: "TRAUMA Alert"
      callout: true
      markdown: |
        - If Major Intervention
        - Or Major Mechanism
        - Call a **TRAUMA** Alert

    - type: "prose"
      title: "Notes"
      markdown: |
        - **Rule of 9's** can estimate BSA in adults.
          - Patient's palm (**with fingers**) is about 1% BSA.
          - Consider only partial and full thickness when calculating BSA.
        - This protocol includes **chemical burns** and skin exposures.
          - For **gasses** and smoke inhalation, refer to **Inhalation**.
          - For **poisoning** and toxic ingestions, refer to **OD / Tox**.
        - If chemical is known, consider calling **CHEMTREC**: 800-424-9300.
        - This does **not** include **radiation** exposure (call **Medical Control**).
        - Consider aeromedical **Destination Triage** if major burn > 20% BSA.
          - There are no ABA-verified burn centers near the WVEMS region.

    - type: "prose"
      title: "Pediatrics"
      highlight: true
      markdown: |
        - Use **Peds Reference** or other approved source for peds dosing.

    - type: "prose"
      title: "References"
      markdown: |
