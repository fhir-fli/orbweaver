  - page_number: 55
    blocks:

    - type: "prose"
      title: "Trauma ROSC Imperatives"
      highlight: true
      markdown: |
        - Most important aspect is to prioritize emergent transport.
          - **Get the patient to the hospital.**
        - Reassess and repeat **Pleural Decompression** as needed.
          - Repeat immediately if decompression after initial success.
        - Reassess and apply additional **Tourniquets** as needed.
          - Apply pressure and **pack wounds** for junctional bleeding.
        - Consider a concurrent medical cause preceding the trauma.

    - type: "row"
      blocks:
        - type: "prose"
          title: "TRAUMA Alert"
          callout: true
          markdown: |
            - If Any Trauma CPR
            - Or Unstable Vitals
            - Call a **TRAUMA** Alert
        - type: "prose"
          title: "Poor Perfusion"
          callout: true
          markdown: |
            Suspect if **several** of these:
            - **Altered Mental Status**
            - Skin Pale, Cool, Diaphoretic
            - Tachycardia, Hypotension
            - Dyspnea, Tachypnea

    - type: "prose"
      title: "Medications"
      markdown: |
        - **Ketamine** (Ketalar®): Dilute in NS and **give slowly over 10 min**.
          - Use **weight-based peds dosing** for adults under 110 lbs (50 kg).

    - type: "prose"
      title: "Notes"
      markdown: |
        - Keep **normothermic** (hypothermia causes coagulopathy & bleeding).
        - Consider **Intubation** and/or **Vent** if indicated and credentialed for CC.

    - type: "prose"
      title: "Pediatrics"
      highlight: true
      markdown: |
        - Use **Peds Reference** or other approved source for peds dosing.

    - type: "prose"
      title: "References"
