  - page_number: 37
    blocks:

    - type: "prose"
      title: "Altered LOC Imperatives"
      highlight: true
      markdown: |
        - Altered LOC and syncope are **complex** problems.
          - Most important step is to consider and **search for the cause**.
          - Investigate the case and take a **careful history**.
        - Unstable patients should be treated aggressively.
          - Be prepared for a **Medical CODE**.
        - Alcohol and drugs can mask other causes of altered LOC.
          - **Don't assume Intoxication** is the only problem.
        - Syncope may be caused by or result in **trauma**.
          - Maintain a high index of suspicion.

    - type: "prose"
      title: "Notes"
      markdown: |
        - Consider an atypical **Cardiac** cause in diabetics and the elderly.
        - Consider **Sepsis** if indicated and credentialed for Critical Care.
        - Check for **medical jewelry**.
        - May investigate pt's GCS:
          - Check each response
          - Repeat **as needed**
          - Record the **best effort**
          - Add the three numbers
          - Normal score is **15**
          - Worst score is **3**

    - type: "table"
      title: "Glasgow Coma Scale"
      columns: ["Eyes", "Verbal", "Motor", ""]
      column_flex: [3, 3, 3, 1]
      rows:
        - cells: ["none", "none", "none", "1"]
        - cells: ["pain", "moaning", "extensor", "2"]
        - cells: ["verbal", "words", "flexor", "3"]
        - cells: ["normal", "confused", "withdraw", "4"]
        - cells: ["", "normal", "localizes", "5"]
        - cells: ["", "", "normal", "6"]

    - type: "prose"
      title: "Pediatrics"
      highlight: true
      markdown: |
        - Many causes of transient syncope are benign, but:
          - Prolonged altered LOC indicates potentially serious pathology.
          - Syncope **during exertion** can be a true cardiac emergency.

