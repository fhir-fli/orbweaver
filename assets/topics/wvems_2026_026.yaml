  - page_number: 27
    blocks:

    - type: "prose"
      title: "Medical ROSC Imperatives"
      highlight: true
      markdown: |
        - Ensure adequate resuscitation **before** attempting transport.
          - Move expeditiously but with caution. **Don't sacrifice stability.**
        - Monitor closely for **Hypotension**. Be ready with fluids & pressors.
        - Avoid hyperventilation. It can cause **Hypotension** & repeat arrest.
        - Monitor body temp and treat any **Fever** aggressively with meds.

    - type: "prose"
      title: "Medications"
      markdown: |
        - **Ketamine** (Ketalar®): Dilute in NS and **give slowly over 10 min**.
          - Use **weight-based peds dosing** for adults under 110 lbs (50 kg).
        - Consider maintenance drip if **prior VT/VF** & **transport > 30 min**:
          - (I) **Amiodarone** (Pacerone®): 1 mg/min IV/IO, adult only.

    - type: "prose"
      title: "Notes"
      markdown: |
        - **EtCO2** can help identify ROSC. Monitor during resuscitation.
        - Consider **Intubation** and/or **Vent** if indicated and credentialed for CC.
        - Therapeutic hypothermia is **not included** in this protocol.
          - Also known as "targeted temperature management".

    - type: "prose"
      title: "Pediatrics"
      highlight: true
      markdown: |
        - Arrhythmias are common after ROSC, but are usually self-limited.
        - Use **Peds Reference** or other approved source for peds dosing.

