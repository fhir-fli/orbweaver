# ============================================================
# ProtocolBook p.23–24 — Malaria Medications
#
# Stitches the bottom of p.23 (severe / parenteral regimens —
# Artesunate, Artemether, Quinine) together with the whole of p.24
# (uncomplicated / PO regimens — Coartem, Artesunate-Amodiaquine,
# DHA-Piperaquine).
# ============================================================

topic:
  id: "pb-malaria-meds"
  title: "Malaria — Medications"
  last_reviewed: "pocketbook v1.7"
  tags: ["malaria", "artesunate", "artemether", "quinine", "coartem", "pediatric"]
  category: "medical"
  page_number: 23

  blocks:

    - type: "prose"
      title: "Severe / parenteral regimens"
      highlight: true
      markdown: |-
        **All parenteral regimens should be followed by 3 days of oral therapy once tolerating PO.**

    - type: "prose"
      markdown: |-
        a) **1st line — Artesunate**
          i) **3 mg/kg** < 20 kg · **2.4 mg/kg** ≥ 20 kg IV/IM at **0, 12, 24 h**
          ii) Parenteral Rx ≥ 24 h, then daily until tolerating PO → switch to oral
        b) **2nd line — Artemether**
          i) **3.2 mg/kg IM** on admission
          ii) **1.6 mg/kg IM** daily until able to take oral medication → switch to PO
        c) **3rd line — Quinine**
          i) Loading dose **20 mg/kg** — **DANGER:** rapid administration is dangerous. Mix with **10 mL/kg of 5 % dextrose** & run over **2–4 h**. **DO NOT exceed 5 mg/kg/hr.**  Followed by:
          ii) **10 mg/kg** (run over 2 h) every **8 h**
          iii) If no improvement in **48 h** → decrease to **10 mg/kg every 12 h**

    - type: "prose"
      title: "Uncomplicated malaria"
      markdown: |-
        **Investigation**
        a) Blood slide (BS) for malaria parasites
        b) ± Haemoglobin estimation

        **Treatment** (outpatient)
        - Same regimen that complicated malaria should end with
        - Treat infants weighing **< 5 kg** as children weighing **5 kg**

    - type: "table"
      title: "1st line — Artemether / Lumefantrine (Coartem®)"
      columns: ["Weight (kg)", "Regimen for 3 days*", "Colour"]
      rows:
        - cells:
            - text: "5–14"
            - text: "1 tab twice a day"
            - text: "Yellow"
        - cells:
            - text: "15–24"
            - text: "2 tabs twice a day"
            - text: "Blue"
        - cells:
            - text: "25–34"
            - text: "3 tabs twice a day"
            - text: "Brown"
        - cells:
            - text: "> 35"
            - text: "4 tabs twice a day"
            - text: "Green"

    - type: "prose"
      markdown: |-
        \* First two doses should ideally be given **8 hours apart**.

    - type: "table"
      title: "Alt — Artesunate / Amodiaquine"
      columns: ["Weight (kg)", "Dose (3 days)", "Colour"]
      rows:
        - cells:
            - text: "4.5 – < 9"
            - text: "25/67.5 mg · 1 tab daily (3-tab blister)"
            - text: "Yellow"
        - cells:
            - text: "9 – < 18"
            - text: "50/135 mg · 1 tab daily (3-tab blister)"
            - text: "Blue"
        - cells:
            - text: "18 – < 36"
            - text: "100/270 mg · 1 tab daily (3-tab blister)"
            - text: "Brown"
        - cells:
            - text: "> 36"
            - text: "100/270 mg · 2 tabs daily (6-tab blister)"
            - text: "Green"

    - type: "table"
      title: "Alt — Dihydroartemisinin / Piperaquine"
      columns: ["Weight (kg)", "DHA / Piperaquine dose (mg) daily × 3 days"]
      rows:
        - cells: [ { text: "5 – <8" }, { text: "20 / 160" } ]
        - cells: [ { text: "8 – <11" }, { text: "30 / 240" } ]
        - cells: [ { text: "11 – <17" }, { text: "40 / 320" } ]
        - cells: [ { text: "17 – <25" }, { text: "60 / 480" } ]
        - cells: [ { text: "25 – <36" }, { text: "80 / 640" } ]
        - cells: [ { text: "36 – <60" }, { text: "120 / 960" } ]

    - type: "prose"
      markdown: |-
        **High-fat meals should be avoided with dihydroartemisinin / piperaquine.**
