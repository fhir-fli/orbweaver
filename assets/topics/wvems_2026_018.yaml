    - type: "flowchart"
      variant: "severity"

      entry:
        text: "Suspected or Confirmed K+\nOver 5.5 mEq/L"
        shape: "stadium"

      pre_decision_actions:
        - provider_level: "E"
          text: "12-Lead"
          kind: "diagnostic"
        - provider_level: "E"
          text: "Albuterol"
          kind: "medication_administration"

      decision:
        text: "Severity?"
        shape: "diamond"

      branches:

        - id: "minor"
          label: "Minor"
          criteria:
            - "Few EKG Changes"
            - "6.4 mEq/L or Less"
          actions:
            - provider_level: "A"
              text: "Saline Lock"
              kind: "procedure"

        - id: "major"
          label: "Major"
          criteria:
            - "Over EKG Changes"
            - "6.5 mEq/L and Over"
          actions:
            - provider_level: "A"
              text: "NS Bolus"
              kind: "medication_administration"
            - provider_level: "I"
              text: "Calcium"
              kind: "medication_administration"

      convergence:
        text: "Consider"
        shape: "stadium"
        warnings:
          - type: "caution"
            text: "Consider Destination Triage"
        bullets:
          - text: "Bradycardia"
            link_id: "wvems-2026-012"
          - text: "Medical CODE"
            link_id: "wvems-2026-024"

      dose_table:
        - drug: "Albuterol"
          dose: "10 mg"
          route: "NEB"
          frequency: "x1 (4 nebs)"
          population: "adult"
        - drug: "NS Bolus"
          dose: "500 mL"
          route: "IV/IO"
          frequency: "x4"
          population: "adult"
        - drug: "Calcium"
          dose: "1 gram"
          route: "IV/IO"
          frequency: "over 10 min"
          population: "adult"

  - page_number: 19
    blocks:

    - type: "prose"
      title: "Hyperkalemia Imperatives"
      highlight: true
      markdown: |
        - Be aggressive with treatment and transport if any **EKG changes**.
        - Consider hyperkalemia during any **crushing** type **extremity injury**.

    - type: "prose"
      title: "K+ EKG Changes"
      markdown: |
        From minor to life threat:
        - Peaked T-waves
        - Long PRI / Loss of P-wave
        - Wide QRS (over 120 ms)
        - Slow IVR (then **sine wave**)

    - type: "prose"
      title: "Medications"
      markdown: |
        - **Albuterol** (Ventolin®): Appropriate even if EKG unavailable.
          - Give **four** (4x) standard nebulizer treatments back-to-back.
        - **NS Bolus** (0.9% Saline): Aggressive fluids help dilute potassium.
          - Consider aggressive fluids even without **Hypotension**.
          - Avoid aggressive/prophylactic fluids for **dialysis** patients.
        - **Calcium** (Chloride): **Avoid** with **Rocephin®** or Digoxin® (fatal).
        - Consider **Bicarb** if acidotic and/or wide QRS (>120 ms) on EKG.
          - (I) **Bicarb** (Sodium Bicarbonate): give 50 mEq IV/IO x1

    - type: "prose"
      title: "Notes"
      markdown: |
        - Consider hyperkalemia in any **dialysis** or renal failure patient.
          - If called to a dialysis center, inquire about the last K+ level.
          - Avoid NIBP or IVs in the same extremity as dialysis access.
          - Consider transport to a hospital with **dialysis capability**.

    - type: "prose"
      title: "Pediatrics"
      highlight: true
      markdown: |
        - Use **Peds Reference** or other approved source for peds dosing.

    - type: "prose"
      title: "References"
