  - page_number: 59
    blocks:

    - type: "prose"
      title: "Bleeding Imperatives"
      highlight: true
      markdown: |
        - Advance to a **Tourniquet rapidly** for any major arm / leg bleeding.
          - Write the time of **Tourniquet** application on the patient.
        - **Packing** may also help (especially junctional bleeds). **Do not** pack:
          - Unstable, depressed or open skull fractures; chest wounds.
          - Bleeding from body orifices: vagina, rectum, ear, mouth, etc.

    - type: "row"
      blocks:
        - type: "prose"
          title: "TRAUMA Alert"
          callout: true
          markdown: |
            - If Major Intervention
            - Or Major Mechanism
            - Call a **TRAUMA** Alert
        - type: "prose"
          title: "Poor Perfusion"
          callout: true
          markdown: |
            Suspect if **several** of these:
            - **Altered Mental Status**
            - Skin Pale, Cool, Diaphoretic
            - Tachycardia, Hypotension
            - Dyspnea, Tachypnea

    - type: "prose"
      title: "Medications"
      markdown: |
        - **TXA** (Tranexamic Acid): Avoid if injury 3+ hours old or known PE.
          - Use for any major **external traumatic bleeding**.
          - Use for suspected **intra-abd / thorax bleed** w/ poor perfusion.
          - May also use for severe **postpartum** (non-traumatic) bleeding.
          - Avoid for other forms of suspected internal or medical bleeding.

    - type: "prose"
      title: "Notes"
      markdown: |
        - **Anticoagulation** meds (**blood thinners**) increase bleeding risk.
        - Consider removing bystander dressings to investigate severity.
        - **Bandage wounds** after bleeding is controlled.
        - Consider **Blood** if indicated and credentialed for Critical Care.

    - type: "prose"
      title: "Pediatrics"
      highlight: true
      markdown: |
        - Hypotension is a late sign of hemorrhagic **Shock** in peds.
        - Use **Peds Reference** or other approved source for peds dosing.

