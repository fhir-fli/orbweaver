# Single source for the in-app credits screen.
# Generated from the image table once, then maintained HERE. The old
# assets/books/wvems/images/CREDITS.md was a second copy nothing displayed;
# CC BY and CC BY-SA require attribution reach the people who see the work,
# so this file is rendered by lib/screens/credits_screen.dart.
credits:
  intro: Orbweaver bundles material from several sources. This page lists them, and the licence each is
    used under.
  privacy_label: Privacy — this app collects nothing
  privacy_url: https://fhir-fli.github.io/fhir_fli_documentation/orbweaver-privacy
  sources:
  - title: 'Quick Reference: Basic Protocols in Paediatrics and Internal Medicine for Resource Limited
      Settings'
    by: J. Grey Faulkenberry, MD MPH
    note: The ProtocolBook. Written by this app's author.
  - title: Pocket Book of Hospital Care for Children, 2nd edition (2013)
    by: World Health Organization
    note: '**This app was not developed or published by the World Health Organization and should not
      be credited to it.** Responsibility for this adaptation rests solely with the publisher of this app,
      and the World Health Organization is not responsible for any changes made to the original content.
      Reproduced under a non-exclusive licence granted 2026-09-03, request ID 202610340. Bibliographic
      reference: Pocket book of hospital care for children: guidelines for the management of common
      childhood illnesses, 2nd ed. Geneva: World Health Organization; 2013. ISBN 978 92 4 154837 3.
      Copyright in the original material remains with the World Health Organization.'
  - title: WVEMS Prehospital Protocols, 2026 edition
    by: West Virginia Emergency Medical Services
    note: Reproduced as printed. WVEMS is the authority for crews operating under these protocols; where
      its figures differ from the other references here, the WVEMS figure stands.
